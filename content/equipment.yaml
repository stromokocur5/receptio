# Kuchynské vybavenie. Recept dostane zoznam automaticky podľa slov v postupe a v poznámkach surovín
# (match = regulárne výrazy na text bez diakritiky a malými písmenami, napr. "rozmixuj" → "rozmixuj").
# weak = slabšie stopy, ktoré platia, len ak recept nepoužíva nič z `unless`
# ("opeč cibuľu" v hrnci neznamená, že treba aj panvicu).
# V recepte sa dá doplniť `equipment: [id]` alebo vyhodiť `no_equipment: [id]`.
#
# level: zaklad (má mať každá kuchyňa) | uzitocne (oplatí sa) | specialne (na pár receptov)
# alternatives: čo spraviť, keď to doma nemáš
# icon: názov ikony zo src/lib/components/Icon.svelte

- id: noz-doska
  name: Ostrý nôž a doska
  level: zaklad
  icon: knife
  about: Jeden poriadny kuchársky nôž (20 cm) urobí viac ako sada tupých. Tupý nôž je nebezpečnejší – kĺže.
  uses:
    - 'Krájanie zeleniny, bylín, tofu a chleba – 90 % prípravy'
    - 'Plochá strana noža rozpučí cesnak'
  kinds:
    - 'Kuchársky nôž (20 cm) – na všetko'
    - 'Malý nôž na lúpanie – ovocie, detaily'
    - 'Nôž s vlnkou – chlieb a paradajky'
    - 'Drevená doska – šetrí nôž'
    - 'Plastová doska – do umývačky'
  choose: 'Nôž, ktorý ti sedí v ruke, s pevnou čepeľou. Lacný nôž z nehrdzavejúcej ocele a brúska (15 €) stačí.'
  care: 'Umývaj ručne a hneď osuš. Brús raz za mesiac. Pod dosku daj vlhkú utierku – nebude sa šmýkať.'
  alternatives:
    - Na mäkkú zeleninu stačí aj menší nôž, len krájaj pomalšie.
    - Nôž nabrúsiš aj o neglazovaný spodok keramického hrnčeka.
  match: []

- id: panvica
  name: Panvica
  level: zaklad
  icon: pan
  about: Ideálne jedna väčšia (28 cm) s nepriľnavým povrchom a jedna liatinová alebo nerezová na opekanie dozlatista.
  uses:
    - 'Opekanie cibule, tofu a zeleniny dozlatista'
    - 'Placky, palacinky, praženica'
    - 'Rýchle omáčky a wok jedlá'
  kinds:
    - 'Nepriľnavá (teflón, keramika) – palacinky, tofu, placky'
    - 'Liatinová – najlepšie opekanie, ide aj do rúry, vydrží celý život'
    - 'Nerezová – opekanie a omáčky, nič sa neodlupuje'
    - 'Wok – vysoké okraje, prehadzovanie'
  choose: '28 cm s pokrievkou pokryje väčšinu jedál. Ťažké dno drží teplo rovnomerne.'
  care: 'Nepriľnavú nerozpaľuj prázdnu a nepoužívaj kovové náradie. Liatinu neumývaj v umývačke, po umytí osuš a potri olejom.'
  alternatives:
    - Hrniec so širším dnom – opekaj po menších dávkach, nech sa zelenina neduší.
    - Wok funguje na všetko, čo sa robí na panvici.
  match:
    - panvic
    - \bwok
  weak:
    - \bopec
    - \bopraz
    - \borestuj
    - \bosmaz
    - \bspen(?!at)
    - \bopekaj
    - \bvyprazaj
  unless: [hrniec]

- id: hrniec
  name: Hrniec
  level: zaklad
  icon: pot
  about: Stredný (3 l) na prílohy a omáčky, veľký (5 l) na polievky, cestoviny a strukoviny.
  uses:
    - 'Polievky, strukoviny, ryža, cestoviny'
    - 'Kari, dal a guláše'
    - 'Vyprážanie v hlbokom oleji'
  kinds:
    - 'Stredný (3 l) – ryža, omáčky, prílohy'
    - 'Veľký (5–6 l) – polievky, cestoviny, vývar'
    - 'Hrniec s hrubým dnom – nepripáli sa'
    - 'Tlakový – strukoviny za tretinu času'
  choose: 'Nerezový s hrubým dnom a pokrievkou. Rúčky, ktoré sa nezohrievajú.'
  care: 'Pripálené dno namoč s vodou a sódou bikarbónou a povar 10 minút.'
  alternatives:
    - Hlboká panvica s pokrievkou zvládne omáčky, kari aj ryžu.
    - Rýchlovarná kanvica + miska na zaliatie kuskusu, bulguru či ryžových rezancov.
  match:
    - hrn(ec|ci|ca|com|iec)\b
    - \b(u|po|do|pre|roz|z)?var(i|ia|te|ime|om|u)?\b
    - vriac
    - do varu
    - \bdus
    - \bzovri

- id: pokrievka
  name: Pokrievka
  level: zaklad
  icon: lid
  about: Ryža, strukoviny a dusená zelenina potrebujú prikryť, inak sa voda vyparí skôr, ako zmäknú.
  uses:
    - 'Varenie ryže a strukovín'
    - 'Dusenie zeleniny'
    - 'Rýchlejší var vody (úspora energie)'
  kinds:
    - 'Sklenená – vidíš do hrnca'
    - 'Univerzálna – pasuje na viac veľkostí'
  choose: 'Sklenená s otvorom na paru.'
  care: 'Nechaj vychladnúť pred umytím studenou vodou – sklo praskne.'
  alternatives:
    - Väčší plochý tanier, plech alebo kúsok alobalu.
  match:
    # prikryté cesto na kysnutie alebo "prikry utierkou/fóliou" nie je pokrievka
    - (?<!kysn[^.]*)\bprikr(?![^.]*(utierk|foli|kysn))
    - pokriev

- id: sitko
  name: Sitko alebo cedník
  level: zaklad
  icon: sieve
  about: Na scedenie cestovín a strukovín aj na preplachovanie ryže a quinoy.
  uses:
    - 'Scedenie cestovín, zemiakov a strukovín'
    - 'Preplachovanie ryže a quinoy'
    - 'Pretlačenie polievky alebo omáčky'
  kinds:
    - 'Cedník s dierkami – cestoviny a zelenina'
    - 'Jemné sitko – ryža, quinoa, múka'
    - 'Sitko s utierkou – rastlinné mlieko a jogurt'
  choose: 'Nerezové jemné sitko s rúčkou zvládne aj ryžu, aj cestoviny.'
  care: 'Zaschnutý škrob z cestovín namoč, potom vykartáčuj.'
  alternatives:
    - Cestoviny sceď cez pokrievku nakrivo priloženú na hrniec.
    - Na ryžu a quinou stačí preplachovať v miske a vodu opatrne zliať.
  match:
    - \b(s|pre|od|vy)?ced(i|t|en|ovan)?
    - sitk
    - cednik

