title: Kakigōri s jahodovým sirupom
description: Japonský letný dezert – kopa ľadu nastrúhaného na sneh, poliata domácim jahodovým sirupom a sladkým kokosovým mliekom.
cuisine: japonska
meals: [dezert, snack]
categories: [dezerty/mrazene]
time: 25
active: 25
servings: 3
difficulty: 1
tags: [deti, party, lacne]
spicy: 0
ahead: Potrebuješ plné tvorítko ľadu. Sirup aj kokosové mlieko musia pred poliatím vychladnúť.
keeps: { fridge: 0, freezer: 0 }
related: [citronova-granita, melonova-drt]
ingredients:
  - voda: 600 ml | zamrazená na kocky ľadu
  - jahody: 2 hrnček | aj mrazené
  - cukor: 6 pl | 4 do sirupu, 2 do kokosového mlieka
  - citron: 1 pl | šťava
  - kokosove-mlieko: 1/2 ks
steps:
  - Jahody so štyrmi lyžicami cukru a citrónovou šťavou priveď do varu a var na miernom ohni 8 minút, kým nepustia šťavu a nezmäknú. Roztlač ich vidličkou a nechaj vychladnúť.
  - Kokosové mlieko so zvyšným cukrom var na miernom ohni 5 minút, kým mierne nezhustne. Nechaj vychladnúť.
  - Misky daj na 10 minút do mrazničky, aby sa ľad hneď neroztopil.
  - Kocky ľadu rozmixuj v silnom mixéri krátkymi pulzmi na jemný sneh. Bez mixéra ich zabaľ do čistej utierky a roztlč valčekom – drť bude hrubšia.
  - Ľad navŕš do misiek do kopca, nestláčaj ho. Polej jahodovým sirupom a kokosovým mliekom a jedz hneď.
tips:
  - Na ďalšie príchute stačí ľad poliať silným matcha čajom so sirupom alebo rozmixovaným mangom.
  - Slabší mixér môže ľad poškodiť – daj doň naraz len hrsť kociek, alebo použi utierku a valček.
