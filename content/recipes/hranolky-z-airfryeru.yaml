title: Hranolky z air fryeru, ktoré naozaj chrumkajú
description: Krátko predvarené v osolenej vode s octom, vysušené a upečené v air fryeri s lyžicou oleja. Zvonku sklo, vnútri pyré. Na konci ich hodíš do cesnaku s petržlenovou vňaťou a údenou soľou – už žiadne bledé hranolky na tanieri.
cuisine: slovenska
meals: [obed, vecera, snack]
categories: [comfort/vyprazane, prilohy/prilohy, snacky/slane]
time: 50
active: 20
servings: 2
difficulty: 1
tags: [zlatica, lacne]
keeps: { fridge: 2 }
leftovers: 'Prehrej 4 minúty v air fryeri na 200 °C, nikdy nie v mikrovlnke.'
ingredients:
  - zemiaky: 4 ks | múčnaté (typ C), asi 600 g
  - sol: ~1 pl | do vody
  - ocot: ~1 pl | do vody
  - olej: 1 pl
  - kukuricny-skrob: 1 čl
  - sol: 1/2 čl | na hotové hranolky
  - udena-paprika: 1/2 čl
  - cesnak: 1 ks
  - petrzlenova-vnat: 2 pl | nasekaná nadrobno
  - olivovy-olej: 1 čl
steps:
  - Zemiaky ošúp a nakrájaj na hranolky hrubé asi 1 cm. Daj ich do hrnca so studenou vodou, pridaj 1 PL soli a 1 PL octu a priveď do varu. Var 3–4 minúty od zovretia, kým nie sú mäkké na povrchu, ale vnútri ešte tvrdé. Soľ ich ochutí až dovnútra, ocot drží tvar, aby sa nerozpadli.
  - Opatrne ich sceď a rozlož na čistú utierku v jednej vrstve. Nechaj ich 5 minút vyparovať – musia byť na povrchu suché a matné. Mokrý zemiak sa v air fryeri dusí a ostane mäkký.
  - V miske ich jemne premiešaj s olejom a potom posyp škrobom a premiešaj, kým nie je každý kúsok tenko obalený. Škrob na povrchu vytvorí tú sklovitú chrumkavú škrupinku.
  - Air fryer predhrej na 200 °C. Hranolky do koša nasyp najviac v dvoch vrstvách (ak treba, rob dve dávky) a peč 18–22 minút, každých 6 minút košom pretras. Hotové sú, keď sú tmavozlaté a pri poklepaní cinkajú. V rúre peč na plechu s papierom 30 minút na 230 °C, v polovici otoč.
  - Medzitým v miske, v ktorej ich budeš podávať, zmiešaj prelisovaný cesnak, vňať, olivový olej, 1/2 ČL soli a údenú papriku.
  - Horúce hranolky vysyp priamo do misky na cesnak s vňaťou a premiešaj. Teplo cesnak trochu „uvarí“, takže nepáli, len vonia. Jedz hneď.
tips:
  - Preplnený kôš je najčastejší dôvod mäkkých hranoliek. Vzduch musí prúdiť okolo každého kúsku.
  - Soľ, ktorá ide na koniec, sa na suché hranolky nechytí. Preto ich miešaš s cesnakom a kvapkou oleja – soľ sa prilepí na ne.
