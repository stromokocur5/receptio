title: Hummusové kolieska z tortilly
description: Tortilla natretá hummusom, plnená zeleninou, zrolovaná a nakrájaná na kolieska. Party jednohubky aj desiata, ktorá sa nerozpadne.
cuisine: moderna
meals: [snack, obed]
categories: [snacky/party, snacky/na-cesty]
time: 20
active: 20
servings: 4
difficulty: 1
tags: [bez-varenia, party, do-krabicky, deti]
keeps: { fridge: 2, freezer: 0 }
ingredients:
  - kukuricne-tortilly: 4 ks | veľké
  - cicer-sterilizovany: 1 ks | alebo 1 dávka domáceho hummusu
  - tahini: 2 pl
  - citron: 1/2 ks
  - cesnak: 1/2 ks
  - sol: 1/2 čl
  - spenat: 2 hrnček | mladé listy
  - mrkva: 1 ks | nastrúhaná
  - paprika-cervena: 1 ks | na tenké prúžky
steps:
  - Cícer rozmixuj s tahini, citrónovou šťavou, cesnakom, soľou a 3–4 lyžicami vody z plechovky na hustý hummus. Ak máš hotový, zober asi 1,5 hrnčeka.
  - Tortilly krátko zohrej na suchej panvici, aby sa pri rolovaní nelámali.
  - Každú natri hummusom až po okraj, na spodnú tretinu daj špenát, mrkvu a papriku.
  - Pevne zroluj, zabaľ do fólie alebo papiera a nechaj 15 minút v chladničke odpočinúť.
  - Ostrým nožom nakrájaj na kolieska hrubé 2–3 cm, konce zjedz hneď.
tips:
  - Hummus funguje ako lepidlo – natieraj až po okraj, inak sa kolieska rozbalia.
  - Pšeničné tortilly sa rolujú ľahšie, kukuričné treba zohriať.
