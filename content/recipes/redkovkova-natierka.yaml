title: Reďkovková nátierka s pažítkou
description: Chrumkavá jarná nátierka z tofu, jogurtu a nastrúhaných reďkoviek. Na čerstvý chlieb, keď sú v záhradke prvé reďkovky.
cuisine: slovenska
meals: [ranajky, snack]
categories: [omacky/dipy, ranajky/slane]
time: 10
active: 10
servings: 4
difficulty: 1
tags: [bez-varenia, rychle, ranajky]
no_equipment: [sitko, mixer]
keeps: { fridge: 3 }
ingredients:
  - tofu-natural: 200 g | scedené
  - sojovy-jogurt: 4 pl
  - horcica: 1 čl
  - redkovka: 10 ks | nastrúhané nahrubo
  - pazitka: 3 pl | nasekaná
  - sol: 3/4 čl
  - cierne-korenie: podľa chuti
steps:
  - Tofu roztlač vidličkou v miske nadrobno, alebo ho krátko rozmixuj s jogurtom, ak chceš jemnejšiu nátierku.
  - Primiešaj jogurt, horčicu, soľ a korenie.
  - Nastrúhané reďkovky jemne vytlač v dlani, nech nátierka nie je vodnatá, a vmiešaj ich s pažítkou.
  - Natri na chlieb a ozdob kolieskami reďkoviek.
tips:
  - Najlepšia na čerstvom kváskovom chlebe, pri bezlepkovej strave na bezlepkovom.
  - Reďkovky pridávaj tesne pred jedlom – postupne púšťajú vodu.
  - Reďkovkové listy nevyhadzuj, nasekané chutia ako rukola.
