title: Rezancová polievka s cícerom a zeleninou
description: Zlatistá polievka s mrkvou, petržlenom, rezancami a cícerom, ktorá chutí ako tá nedeľná. Opečená zelenina a výživné droždie jej dajú plnú chuť vývaru bez kocky.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/zeleninove]
time: 35
active: 15
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, deti, polievka, klasika]
keeps: { fridge: 3 }
ingredients:
  - olej: 2 pl
  - cibula: 1 ks
  - mrkva: 4 ks
  - petrzlen-koren: 2 ks
  - cesnak: 2 ks
  - kurkuma: 1/2 čl
  - voda: 2,5 l
  - sol: 2 čl
  - sojova-omacka: 2 pl
  - vyzivne-drozdie: 2 pl
  - cicer-sterilizovany: 2 ks | scedený
  - cestoviny: 200 g | tenké polievkové rezance
  - cierne-korenie: 1/4 čl
  - petrzlenova-vnat: 3 pl | nasekaná
steps:
  - Cibuľu nakrájaj nadrobno, mrkvu a petržlen ošúp a nakrájaj na kolieska.
  - V hrnci zohrej olej na strednom ohni. Cibuľu, mrkvu a petržlen opekaj 6 minút za občasného miešania, kým zelenina na okrajoch nezačne zlatnúť. Práve to opečenie dá polievke chuť vývaru.
  - Pridaj prelisovaný cesnak a kurkumu a miešaj 30 sekúnd.
  - Prilej vodu, pridaj soľ, sójovú omáčku a droždie. Priveď do varu a var na miernom ohni 15 minút.
  - Pridaj cícer a rezance a var podľa obalu rezancov, zvyčajne 5–7 minút. Okoreň a posyp petržlenovou vňaťou.
tips:
  - Ak chceš polievku na viac dní, rezance var zvlášť a pridávaj ich až do taniera, inak sa v hrnci rozmočia.
