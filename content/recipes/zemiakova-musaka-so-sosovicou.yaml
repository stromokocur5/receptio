title: Zemiaková musaka so šošovicou a bielou omáčkou
description: Vrstvy zemiakov, šošovicového ragú so škoricou a krémovej bielej omáčky, zapečené dozlatista. Pekáč stačí na celú rodinu a zvyšky sú na druhý deň ešte lepšie.
cuisine: grecka
meals: [obed, vecera]
categories: [hlavne/rura]
time: 75
active: 30
servings: 7
difficulty: 2
tags: [nasarodinka, lacne, meal-prep, vela-bielkovin]
keeps: { fridge: 4, freezer: 3 }
ingredients:
  - zemiaky: 1,4 kg
  - sol: ~1 pl | do vody na zemiaky
  - olej: 6 pl
  - cibula: 2 ks
  - cesnak: 3 ks
  - paradajkovy-pretlak: 2 pl
  - sladka-paprika: 2 čl
  - skorica: 1/2 čl
  - sosovica-cervena: 250 g
  - paradajky-sterilizovane: 2 ks
  - voda: 500 ml
  - oregano: 1 čl
  - sol: 2,5 čl
  - hladka-muka: 5 pl
  - sojove-mlieko: 1 l | nesladené
  - vyzivne-drozdie: 3 pl
  - muskatovy-orech: 1/4 čl
steps:
  - Rúru predhrej na 200 °C. Zemiaky ošúp a nakrájaj na plátky hrubé 5 mm.
  - Plátky daj do vriacej osolenej vody a var 8 minút, kým nie sú takmer mäkké, ale ešte sa nerozpadajú. Sceď.
  - Medzitým v širokom hrnci zohrej 3 lyžice oleja na strednom ohni. Cibuľu nakrájanú nadrobno opekaj 5 minút. Pridaj prelisovaný cesnak, pretlak, papriku a škoricu a miešaj 30 sekúnd.
  - Pridaj prepláchnutú šošovicu, paradajky, vodu, oregano a 1,5 lyžičky soli. Var na miernom ohni 15 minút za občasného miešania, kým nevznikne husté ragú.
  - Bielu omáčku urob v inom hrnci. Zohrej zvyšné 3 lyžice oleja na strednom ohni, pridaj múku a miešaj minútu. Postupne prilievaj mlieko za stáleho šľahania a var 5 minút, kým nezhustne. Vmiešaj droždie, muškátový oriešok a zvyšnú soľ.
  - Do zapekacej misy (asi 25 × 35 cm) rozlož polovicu zemiakov, na ne ragú a potom zvyšok zemiakov. Zalej bielou omáčkou.
  - Peč 30 minút dozlatista. Pred krájaním nechaj 10 minút postáť, vrstvy sa spoja.
tips:
  - Dá sa pripraviť deň vopred. Studenú zo chladničky peč o 15 minút dlhšie.
