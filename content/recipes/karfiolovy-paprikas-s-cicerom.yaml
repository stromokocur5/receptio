title: Karfiolový paprikáš s cícerom a ryžou
description: Poctivý paprikáš na kope cibule a sladkej paprike, len namiesto kuracieho opečený karfiol a cícer. Krémový je vďaka rozmixovanej časti omáčky, bez smotany a bez múky.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/kari, hlavne/strukoviny]
time: 45
active: 25
servings: 4
difficulty: 1
tags: [zlatica, meal-prep]
keeps: { fridge: 3, freezer: 2 }
leftovers: 'Zohrej s trochou vody. Ryžu skladuj zvlášť.'
ingredients:
  - karfiol: 1 ks
  - olej: 3 pl | 1 na karfiol, 2 na cibuľu
  - sol: 2 čl
  - cibula: 2 ks
  - cesnak: 3 ks
  - paprika-cervena: 1 ks
  - paradajkovy-pretlak: 2 pl
  - sladka-paprika: 2 pl
  - udena-paprika: 1/2 čl
  - voda: 900 ml | 400 do paprikáša, 500 na ryžu
  - cicer-sterilizovany: 1 ks | plechovka
  - ocot: 1 čl
  - ryza-basmati: 250 g
  - petrzlenova-vnat: 2 pl
steps:
  - Karfiol rozober na ružičky. Na veľkej panvici alebo v širokom hrnci rozohrej 1 PL oleja na vyššom strednom ohni a ružičky opekaj 6–7 minút, kým nemajú hnedé miesta. Daj ich bokom do misky. Opečený karfiol drží tvar a chutí, varený by sa v omáčke rozpadol na kašu.
  - Do toho istého hrnca daj 2 PL oleja, nadrobno nakrájanú cibuľu a štipku soli a restuj na strednom ohni 10 minút, kým nie je mäkká a zlatá. Veľa cibule pomaly do zlata je základ každého paprikáša – je z nej sladkosť aj hustota.
  - Pridaj prelisovaný cesnak, nakrájanú papriku a pretlak a miešaj 2 minúty, kým pretlak nestmavne.
  - Odstav hrniec z ohňa, vmiešaj sladkú a údenú papriku a hneď zalej 400 ml vody. Mletá paprika na horúcom tuku zhorkne za pár sekúnd, preto ide mimo ohňa.
  - Pridaj zvyšok soli a var 10 minút pod pokrievkou. Medzitým ryžu prepláchni, zalej 500 ml vody so štipkou soli, priveď do varu a pod pokrievkou var na miernom ohni 12 minút. Nechaj ju prikrytú dôjsť.
  - Tretinu omáčky odober a rozmixuj dohladka tyčovým mixérom (alebo rozmixuj priamo v hrnci len pár ponorení). Vlej späť – omáčka zhustne a bude krémová ako so smotanou.
  - Pridaj karfiol a scedený prepláchnutý cícer a var ešte 5 minút. Vmiešaj ocot, ochutnaj a dosoľ. Podávaj s ryžou posypané vňaťou.
tips:
  - Ocot na konci nevynechaj – vyváži sladkú papriku a cibuľu.
