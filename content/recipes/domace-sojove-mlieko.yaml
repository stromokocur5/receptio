title: Domáce sójové mlieko
description: Sójové mlieko z troch surovín za zlomok ceny kupovaného. Ako bonus zostane okara na placky.
cuisine: moderna
meals: [domace, ranajky]
time: 40
active: 25
servings: 6
difficulty: 2
tags: [urob-si-sam]
nutrition: false
yields: cca 1,5 l mlieka a 300 g okary
ahead: Sójové zrná namoč na 12 hodín (cez noc) do trojnásobku vody.
related: [domace-tofu, domaci-sojovy-jogurt, okarove-placky]
keeps: { fridge: 4 }
ingredients:
  - sojove-zrna: 150 g | namočené cez noc
  - voda: 1,5 l
  - sol: 1 štipka
  - javorovy-sirup: 1 pl | voliteľne
steps:
  - Namočené zrná sceď a prepláchni. Ak chceš jemnejšiu chuť, pošúchaj ich medzi dlaňami vo vode a šupky, ktoré vyplávajú, zlej.
  - Zrná rozmixuj s 1 litrom vody 2 minúty na hladkú bielu kašu.
  - Kašu prelej cez jemnú utierku alebo sáčok na orechové mlieko do veľkého hrnca a dobre vytlač. Zvyšok v utierke je okara, odlož si ju.
  - Pridaj zvyšnú vodu a mlieko priveď do varu. Pozor, veľmi pení a rýchlo vykypí – drž nízky oheň a miešaj.
  - Var 15–20 minút. Surové sójové mlieko je nestráviteľné a má fazuľovú chuť, varením oboje zmizne.
  - Dochuť soľou (a sirupom), nechaj vychladnúť a prelej do fľaše.
tips:
  - V chladničke vydrží 4 dni, pred použitím pretras.
  - Domáce mlieko nemá pridaný vápnik ani B12 ako obohatené kupované – na to pamätaj.
  - Z okary sprav okarové placky alebo ju pridaj do chleba či granoly.
