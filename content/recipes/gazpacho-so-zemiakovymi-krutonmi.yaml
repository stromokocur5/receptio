title: Gazpacho so zemiakovými krutónmi
description: Studená polievka z najzrelších paradajok, uhorky a cesnaku, rozmixovaná s olivovým olejom a octom do hustej ružovej emulzie. Navrch chrumkavé zemiakové kocky z panvice namiesto chleba. Na horúce dni, keď je paradajok veľa.
cuisine: moderna
meals: [obed, vecera]
categories: [polievky/zeleninove]
time: 40
active: 25
servings: 3
difficulty: 1
tags: [zlatica, rychle]
keeps: { fridge: 2 }
ingredients:
  - paradajky: 8 ks | čo najzrelšie, asi 1 kg
  - uhorka: 1 ks
  - cesnak: 1 ks
  - cibula-cervena: 1/4 ks
  - sol: 1 čl
  - ocot: 2 pl
  - olivovy-olej: 5 pl | 4 do polievky, 1 na zemiaky
  - voda: 100 ml | studená
  - zemiaky: 2 ks
  - udena-paprika: 1/2 čl
  - cierne-korenie: 1 štipka
  - pazitka: 2 pl
steps:
  - Paradajky nakrájaj nahrubo, z uhorky odkroj kúsok 5 cm na ozdobu a zvyšok nakrájaj. Daj ich do misy s cesnakom, cibuľou a 1 ČL soli, premiešaj a nechaj 10 minút. Soľ vytiahne zo zeleniny šťavu a polievka bude chutiť výraznejšie.
  - Medzitým zemiaky ošúp, nakrájaj na malé kocky 1 cm a opekaj na panvici s 1 PL oleja na strednom ohni pod pokrievkou 5 minút, potom bez pokrievky 8 minút, kým nie sú chrumkavé. Posyp údenou paprikou a štipkou soli.
  - Zeleninu aj so šťavou rozmixuj s octom a vodou úplne dohladka. Kým mixér beží, pomaly prilievaj 4 PL olivového oleja – polievka zružovie a zhustne, olej sa v nej rozptýli na emulziu ako v majonéze.
  - Ochutnaj. Má byť slaná, kyslá a sviežo cesnaková. Ak treba, pridaj soľ alebo ocot. Daj vychladiť aspoň na 20 minút, alebo ju zmixuj s pár kockami ľadu.
  - Podávaj s odloženou uhorkou nakrájanou na kocky, zemiakovými krutónmi, pažítkou a kvapkou oleja navrch.
tips:
  - Ak chceš úplne hladkú, prelej ju cez sitko.
  - Ak sú paradajky kyslé a nevýrazné, pridaj štipku cukru.
