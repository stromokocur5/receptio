title: Karamelizované orechy so škoricou
description: Mandle a vlašské orechy v tenkej chrumkavej glazúre zo sirupu a škorice. Ako z vianočných trhov, ale z panvice za desať minút.
cuisine: moderna
meals: [snack]
categories: [snacky/sladke, snacky/party]
time: 15
active: 15
servings: 8
difficulty: 1
tags: [rychle, party]
keeps: { fridge: 21, freezer: 0 }
ingredients:
  - mandle: 1 hrnček
  - vlasske-orechy: 1 hrnček
  - javorovy-sirup: 4 pl
  - cukor: 2 pl
  - skorica: 1 čl
  - sol: 1 štipka
steps:
  - Orechy opraž na suchej panvici na strednom ohni 4–5 minút, kým nezavoňajú.
  - Pridaj sirup, cukor, škoricu a soľ a neustále miešaj na miernom ohni 3–4 minúty, kým sa tekutina neodparí a orechy nie sú lepkavé a lesklé.
  - Hneď ich vysyp na papier na pečenie a vidličkou rozdeľ. Nechaj vychladnúť – až potom stvrdnú.
tips:
  - Karamel sa pripáli za pár sekúnd – nechoď od panvice.
  - V uzavretej dóze vydržia tri týždne, ak ich skôr nezješ.
