title: Krémová tekvicová polievka s kokosom
description: Zamatová hokkaido polievka so zázvorom, kari a kokosovým mliekom. Tekvicu netreba ani lúpať.
cuisine: moderna
meals: [obed, vecera]
categories: [polievky/kremove]
time: 35
active: 15
servings: 4
difficulty: 1
tags: [polievka, one-pot]
spicy: 1
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Zahusti a použi ako omáčku na cestoviny.'
ingredients:
  - olej: 1 pl
  - cibula: 1 ks
  - cesnak: 2 ks
  - zazvor: 1 pl
  - kari-korenie: 1 čl
  - tekvica-hokkaido: 800 g | bez semienok, so šupkou, na kocky
  - zeleninovy-vyvar: 3 hrnček
  - kokosove-mlieko: 1/2 ks
  - sol: 1 čl
  - limetka: 1/2 ks
  - tekvicove-semienka: 3 pl | opražené
steps:
  - Na oleji na strednom ohni speň cibuľu, pridaj cesnak, zázvor a kari a minútu praž.
  - Pridaj tekvicu a vývar a var na miernom ohni 20 minút do mäkka.
  - Pridaj kokosové mlieko a rozmixuj dohladka. Dochuť soľou a limetkou.
  - Podávaj s opraženými semienkami a kvapkou kokosového mlieka.
variants:
  - name: Bez cibule a cesnaku
    description: 'Pre citlivé trávenie (low FODMAP). Chuť doženie zelená časť jarnej cibuľky a o štipku viac korenia.'
    remove: [cibula, cesnak]
    add:
      - jarna-cibulka: 2 ks | len zelená časť
  - name: Viac bielkovín
    description: 'Var s tekvicou aj červenú šošovicu, polievka zhustne a zasýti.'
    add:
      - sosovica-cervena: 100 g | prepláchnutá
      - voda: 1 hrnček
