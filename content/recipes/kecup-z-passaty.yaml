title: Domáci kečup z passaty
description: Hustý sladkokyslý kečup z pol fľaše passaty, octu a korenia za 30 minút. Má o polovicu menej cukru ako kúpený a nič zbytočné navyše.
cuisine: americka
meals: [domace]
categories: [omacky/omacky, omacky/dipy]
time: 35
active: 10
servings: 10
difficulty: 1
tags: [zvysky, deti, lacne, urob-si-sam]
yields: cca 250 ml
keeps: { fridge: 14, freezer: 6 }
related: [pizzova-omacka, hranolky-z-rury, bbq-omacka]
ingredients:
  - passata: 2 hrnček
  - ocot: 3 pl | alebo jablkový
  - cukor: 2 pl
  - sol: 1/2 čl
  - sladka-paprika: 1 čl
  - udena-paprika: 1/4 čl | nepovinné
  - skorica: 1 štipka
  - nove-korenie: 1 štipka | mleté
steps:
  - Všetko daj do malého hrnca so širokým dnom a priveď do varu.
  - Var odokryté na miernom ohni 25–30 minút a každých pár minút premiešaj aj pri dne. Ku koncu viac, kečup začne prskať a pripaľovať sa.
  - Hotový je, keď lyžica nechá na dne hrnca cestičku, ktorá sa hneď nezaleje. Za studena ešte zhustne.
  - Ochutnaj – podľa chuti pridaj kvapku octu alebo štipku cukru. Prelej do čistého pohára a nechaj vychladnúť.
tips:
  - Úplne hladký bude, ak ho na konci prešľaháš ponorným mixérom.
  - Do pikantného kečupu pridaj štipku čili alebo lyžičku srirachy.
  - Malé dávky zamraz v tvorítku na ľad – kocka je na jednu porciu hranoliek.
