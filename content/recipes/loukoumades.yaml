title: Loukoumades
description: Grécke vyprážané kysnuté guľôčky polievané sirupom so škoricou a posypané orechmi. Najstarší dezert Olympie.
cuisine: grecka
meals: [dezert]
categories: [dezerty/smazene]
time: 90
active: 30
servings: 6
difficulty: 2
tags: [dezert, party]
spicy: 0
keeps: { fridge: 0 }
gf_swap: false
ingredients:
  - hladka-muka: 250 g
  - kukuricny-skrob: 30 g
  - drozdie: 2 čl | sušené
  - cukor: 100 g | 1 PL do cesta, zvyšok do sirupu
  - sol: 1 štipka
  - voda: 280 ml | vlažná
  - olej: ~500 ml | na vyprážanie, zostane v hrnci
  - citron: 1/2 ks
  - skorica: 1 čl
  - vlasske-orechy: 40 g | nasekané
steps:
  - Múku, škrob, droždie, 1 PL cukru, soľ a 220 ml vody vymiešaj na riedke lepkavé cesto. Nechaj hodinu kysnúť.
  - Zvyšný cukor s 60 ml vody a citrónovou šťavou povar 5 minút na sirup.
  - Cesto stláčaj v päsťi a lyžičkou namočenou v oleji odoberaj guľky do oleja zohriateho na 175 °C. Vyprážaj 3 minúty dozlatista.
  - Polej sirupom, posyp škoricou a orechmi a jedz horúce.
