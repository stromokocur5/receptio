title: Teriyaki tofu s brokolicou
description: Lesklé sladko-slané tofu, rýchla domáca teriyaki omáčka a ryža. Obľúbené aj medzi nevegánmi.
cuisine: japonska
meals: [obed, vecera]
categories: [hlavne/tofu]
time: 30
active: 25
servings: 4
difficulty: 2
tags: [meal-prep]
keeps: { fridge: 3 }
leftovers: 'Nakrájaj do letných závitkov alebo sendviča.'
ingredients:
  - ryza-jazminova: 300 g
  - tofu-natural: 400 g | na kocky, osušené
  - kukuricny-skrob: 2 pl
  - olej: 2 pl
  - brokolica: 1 ks | na ružičky
  - sojova-omacka: 4 pl
  - javorovy-sirup: 2 pl
  - ocot: 1 pl
  - voda: 4 pl
  - zazvor: 1 pl | nastrúhaný
  - cesnak: 2 ks
  - sezam: 1 pl
  - jarna-cibulka: 2 ks
steps:
  - Uvar ryžu.
  - Tofu obaľ v 1,5 PL škrobu a opeč na oleji na strednom ohni dochrumkava.
  - Brokolicu 3 minúty spar alebo uvar v pare.
  - Omáčka. Zmiešaj sójovú omáčku, sirup, ocot, vodu, zázvor, cesnak a zvyšný škrob a vlej na panvicu k tofu. Za stáleho miešania 1 minútu var, kým nezhustne a neleskne sa.
  - Podávaj s ryžou a brokolicou, posyp sezamom a jarnou cibuľkou.
tips:
  - Bezlepková verzia. Namiesto sójovej omáčky použi tamari.
