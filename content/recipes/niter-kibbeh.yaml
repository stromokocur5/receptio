title: Vegánske niter kibbeh
description: Etiópske korenisté prepustené maslo – tuk, ktorý dáva wotom ich hlbokú vôňu. Vegánska verzia z rastlinného masla a oleja.
cuisine: etiopska
meals: [domace]
categories: [domace/zaklady]
time: 30
active: 10
servings: 16
difficulty: 1
tags: [urob-si-sam]
yields: cca 250 ml
keeps: { fridge: 30 }
ingredients:
  - rastlinne-maslo: 200 g
  - kokosovy-olej: 3 pl | rafinovaný
  - cibula: 1/2 ks | nadrobno
  - cesnak: 3 ks | rozdrvené
  - zazvor: 1 pl | nastrúhaný
  - kardamom: 1 čl
  - kurkuma: 1/2 čl
  - skorica: 1/4 čl
  - klincek: 2 ks
  - cierne-korenie: 1/2 čl
steps:
  - Maslo s olejom rozpusti v malom hrnci na miernom ohni.
  - Pridaj všetko ostatné a na najmenšom ohni lúhuj 20 minút. Nesmie sa smažiť ani zhnednúť.
  - Preceď cez sitko s utierkou do pohára a nechaj stuhnúť v chladničke.
tips:
  - Lyžicu pridaj na začiatku do každého wotu namiesto oleja.
