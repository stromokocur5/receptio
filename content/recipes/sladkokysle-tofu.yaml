title: Sladkokyslé tofu
description: Chrumkavé tofu s ananásom, paprikou a cibuľou v červenej sladkokyslej omáčke. Obľúbené aj u detí.
cuisine: cinska
meals: [obed, vecera]
categories: [hlavne/tofu]
time: 30
active: 25
servings: 3
difficulty: 1
tags: [deti, vela-bielkovin]
spicy: 0
keeps: { fridge: 3 }
ingredients:
  - tofu-natural: 400 g | vylisované, na kocky
  - kukuricny-skrob: 3 pl
  - olej: 3 pl
  - paprika-cervena: 1 ks
  - cibula: 1 ks | na kusy
  - ananas: 200 g | čerstvý alebo z plechovky, na kocky
  - pomaranc: 1 ks | šťava
  - paradajkovy-pretlak: 2 pl
  - ryzovy-ocot: 3 pl
  - cukor: 2 pl
  - sojova-omacka: 1 pl
  - voda: 100 ml
  - ryza-jazminova: 250 g
steps:
  - Tofu obaľ v 2 PL škrobu a na oleji na strednom ohni opeč dochrumkava. Vyber.
  - Na tom istom oleji na strednom ohni opeč papriku, cibuľu a ananás 3 minúty.
  - Zmiešaj šťavu, pretlak, ocot, cukor, sójovú omáčku, vodu a zvyšný škrob a vlej do panvice. Var minútu, kým nezhustne.
  - Pridaj tofu, obaľ v omáčke a hneď podávaj s ryžou, kým je chrumkavé.
