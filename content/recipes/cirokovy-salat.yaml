title: Cirokový šalát s pečenou tekvicou
description: Žuvacie zrná ciroku s pečenou tekvicou, kelom, hrozienkami a tahini zálievkou. Sýty šalát do krabičky na celý týždeň.
cuisine: moderna
meals: [obed, vecera]
categories: [salaty/syte]
time: 85
active: 20
servings: 4
difficulty: 1
tags: [meal-prep, do-krabicky]
spicy: 0
ahead: Cirok namoč cez noc.
keeps: { fridge: 4 }
ingredients:
  - cirok: 200 g | namočený
  - tekvica-hokkaido: 500 g | na kocky
  - olivovy-olej: 3 pl
  - sol: 1 čl
  - kel: 100 g | nakrájaný
  - cibula-cervena: 1/2 ks
  - hrozienka: 3 pl
  - tekvicove-semienka: 3 pl
  - tahini: 3 pl
  - citron: 1 ks
  - javorovy-sirup: 1 čl
  - cesnak: 1 ks
steps:
  - Cirok var v osolenej vode 50 minút, kým nie je mäkký, ale žuvací. Sceď.
  - Tekvicu premiešaj s 2 PL oleja a štipkou soli a peč na 210 °C 25 minút.
  - Kel premasíruj rukami so zvyšným olejom a štipkou soli, kým nezmäkne.
  - Tahini rozmiešaj s citrónom, sirupom, cesnakom, soľou a vodou na riedku zálievku a všetko premiešaj.
