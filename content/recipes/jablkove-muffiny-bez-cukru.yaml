title: Jablkovo-mrkvové muffiny bez cukru
description: Mäkké muffiny osladené len banánom, jablkom a datľami. Do školy, na výlet aj na raňajky v behu.
cuisine: moderna
meals: [snack, ranajky]
categories: [snacky/na-cesty, dezerty/susienky]
time: 40
active: 15
servings: 12
difficulty: 1
tags: [deti, do-krabicky, meal-prep, pecenie]
keeps: { fridge: 4, freezer: 3 }
related: [cucoriedkove-muffiny]
ingredients:
  - ovsene-vlocky: 2 hrnček | rozmixované na múku
  - hladka-muka: 1/2 hrnček
  - kypriaci-prasok: 2 čl
  - skorica: 1 čl
  - sol: 1 štipka
  - banan: 2 ks | zrelé
  - datle: 6 ks | namočené
  - sojove-mlieko: 200 ml
  - olej: 3 pl
  - lanove-semienko: 1 pl | mleté, s 3 pl vody
  - jablko: 1 ks | nastrúhané
  - mrkva: 1 ks | nastrúhaná
  - vlasske-orechy: 3 pl | nasekané
steps:
  - Rúru predhrej na 180 °C a formu na muffiny vystel papierovými košíčkami. Ľanové semienko zmiešaj s vodou a nechaj 5 minút zhustnúť.
  - Banány, datle, mlieko a olej rozmixuj dohladka a primiešaj ľanové „vajce“.
  - V miske zmiešaj ovsenú a hladkú múku, prášok do pečiva, škoricu a soľ. Vlej mokrú zmes a len krátko premiešaj, kým nezmizne suchá múka.
  - Vmiešaj jablko, mrkvu a orechy a rozdeľ do 12 košíčkov.
  - Peč 22–25 minút, kým špajdľa zapichnutá do stredu nevyjde suchá.
tips:
  - Veľmi zrelé banány s hnedými škvrnami sladia najviac.
  - Pri celiakii bezlepkové vločky a namiesto hladkej múky ryžová.
