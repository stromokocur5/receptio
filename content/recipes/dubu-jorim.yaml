title: Dubu jorim – glazované tofu
description: Kórejské tofu dusené v pikantnej sójovo-cesnakovej glazúre. Päť surovín, dvadsať minút, nekonečne dobré s ryžou.
cuisine: korejska
meals: [obed, vecera]
time: 25
active: 20
servings: 3
difficulty: 1
tags: [rychle]
spicy: 2
keeps: { fridge: 3 }
leftovers: 'Nakrájaj na kocky a daj do smaženej ryže.'
ingredients:
  - ryza-jazminova: 250 g
  - tofu-natural: 400 g | na plátky 1 cm, osušené
  - olej: 2 pl
  - tamari: 3 pl
  - voda: 4 pl
  - javorovy-sirup: 1 pl
  - cili: 1 čl | ideálne gochugaru
  - cesnak: 3 ks | prelisovaný
  - sezamovy-olej: 1 pl
  - jarna-cibulka: 3 ks
  - sezam: 1 pl
steps:
  - Uvar ryžu.
  - Tofu opeč na oleji na strednom ohni z oboch strán dozlatista, 3–4 minúty z každej strany.
  - Zmiešaj tamari, vodu, sirup, čili, cesnak, sezamový olej a polovicu cibuľky.
  - Omáčku vlej na tofu a na miernom ohni 5 minút duste, kým sa nezredukuje na lepkavú glazúru. Plátky raz otoč.
  - Posyp zvyšnou cibuľkou a sezamom.
