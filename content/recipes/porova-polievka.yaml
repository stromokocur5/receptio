title: Pórová polievka so zemiakmi
description: Jednoduchá krémová polievka z póru a zemiakov – francúzska vichyssoise po domácky, teplá alebo studená.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/kremove]
time: 35
active: 10
servings: 4
difficulty: 1
tags: [polievka, lacne, one-pot]
spicy: 0
keeps: { fridge: 3, freezer: 3 }
ingredients:
  - rastlinne-maslo: 30 g
  - por: 3 ks | na kolieska, dobre umytý
  - zemiaky: 4 ks
  - zeleninovy-vyvar: 1 l
  - bobkovy-list: 1 ks
  - sojove-mlieko: 200 ml
  - sol: 1/2 čl
  - cierne-korenie: 1/4 čl
  - pazitka: 2 pl
steps:
  - Na masle na miernom ohni pomaly dus pór 10 minút, nesmie zhnednúť.
  - Pridaj zemiaky, vývar a bobkový list a var na miernom ohni 15 minút.
  - Vyber list, rozmixuj s mliekom, osoľ a okoreň. Posyp pažítkou.
