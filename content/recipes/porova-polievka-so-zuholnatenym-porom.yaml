title: Pórovo-zemiaková polievka so zuhoľnateným pórom
description: Hustá zemiaková polievka, napoly rozmixovaná a napoly s kúskami, varená na pomaly zmäknutom póre. Navrch pór spálený na suchej panvici do čierna – sladký, dymový a trochu chrumkavý.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/zeleninove]
time: 45
active: 25
servings: 4
difficulty: 1
tags: [zlatica, lacne]
keeps: { fridge: 3 }
ingredients:
  - por: 2 ks
  - olivovy-olej: 3 pl | 2 do hrnca, 1 na zuhoľnatený pór
  - sol: 1,5 čl
  - cesnak: 2 ks
  - zemiaky: 5 ks
  - voda: 1 l
  - bobkovy-list: 1 ks
  - majoranka: 1 čl
  - ocot: 1 čl | alebo citrónová šťava
  - kopor: 1 pl | alebo petržlenová vňať
  - cierne-korenie: 1 štipka
steps:
  - Z bieleho konca jedného póru odkroj kus dlhý asi 10 cm a odlož ho. Zvyšok oboch pórov (bielu a svetlozelenú časť) nakrájaj na kolieska a umy ich v miske s vodou – medzi vrstvami býva piesok. Vylov ich rukou, piesok ostane na dne. Zemiaky ošúp a nakrájaj na kocky.
  - V hrnci zohrej 2 PL oleja na miernom ohni, pridaj pór a štipku soli a za občasného miešania ho dus 8–10 minút, kým nie je úplne mäkký a nezačne zlatnúť. Pomaly zmäknutý pór je sladký – keby si ho rovno zalial vodou, polievka by chutila ostro a plocho.
  - Pridaj prelisovaný cesnak, minútu miešaj, pridaj zemiaky, vodu, zvyšok soli, bobkový list a majoránku (rozdrv ju v dlaniach, uvoľní vôňu). Priveď do varu a pod pokrievkou mierne var 20 minút, kým sa zemiaky nezačnú rozpadávať.
  - Medzitým odložený pór prekroj pozdĺžne na polovice a polož ho rezom dole na suchú panvicu rozpálenú na vysokom ohni. Nehýb ním 5–6 minút, kým nie je rez čierny. Otoč, opeč ešte 3 minúty, potom nakrájaj na kúsky, zmiešaj s 1 PL oleja a štipkou soli. Spálený povrch chutí dymovo, vnútro je sladké a mäkké.
  - Z polievky vyber bobkový list. Tyčovým mixérom rozmixuj asi polovicu priamo v hrnci, nech je polievka krémová, ale s kúskami zemiakov.
  - Vmiešaj ocot, ochutnaj a podľa potreby dosoľ. Podávaj so zuhoľnateným pórom, kôprom a čiernym korením navrch.
tips:
  - Bez mixéra roztlač časť zemiakov v hrnci štuchadlom na zemiaky.
  - Zelené vrchné listy póru nevyhadzuj, zamraz ich na vývar.
