title: Fazuľové chilli s ryžou a čerstvou salsou
description: Husté chilli z dvoch druhov fazule s opečenou paprikou, údenou paprikou a rascou, dusené tak dlho, kým nie je hutné. K tomu ryža a čerstvá salsa z odkvapkaných paradajok a cibule.
cuisine: mexicka
meals: [obed, vecera]
categories: [hlavne/strukoviny]
time: 40
active: 25
servings: 4
difficulty: 1
tags: [zlatica, meal-prep, one-pot]
spicy: 1
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Chilli je na druhý deň ešte lepšie. Ryžu a salsu sprav čerstvú.'
ingredients:
  - olej: 2 pl
  - cibula: 2 ks | 1 do chilli, 1 na salsu (červená je lepšia)
  - paprika-cervena: 2 ks
  - cesnak: 4 ks
  - paradajkovy-pretlak: 2 pl
  - udena-paprika: 2 čl
  - kmin: 1 čl
  - cili: 1/2 čl | podľa chuti
  - paradajky-sterilizovane: 1 ks | plechovka krájaných
  - fazula-cervena: 1 ks | plechovka
  - fazula-cierna: 1 ks | plechovka, alebo ďalšia červená
  - voda: 650 ml | 200 do chilli, 450 na ryžu
  - sol: 1,5 čl
  - cukor: 1/2 čl
  - ryza-basmati: 250 g
  - paradajky: 2 ks | na salsu
  - citron: 1 ks | šťava
  - petrzlenova-vnat: 3 pl
steps:
  - Jednu cibuľu nakrájaj nadrobno, papriku na kocky. V hrnci rozohrej olej na vyššom strednom ohni a opekaj cibuľu s paprikou 8 minút, kým nemajú hnedé okraje.
  - Pridaj prelisovaný cesnak a pretlak a miešaj 2 minúty, kým pretlak nestmavne. Stíš oheň, pridaj údenú papriku, kmín a čili a miešaj 20 sekúnd.
  - Pridaj paradajky z plechovky, scedenú prepláchnutú fazuľu, 200 ml vody, 1 ČL soli a cukor. Priveď do varu a var na miernom ohni bez pokrievky 20 minút, občas premiešaj. Varechou roztlač o stenu hrnca pár lyžíc fazule – chilli zhustne a bude krémové.
  - Medzitým ryžu prepláchni, zalej 450 ml vody so štipkou soli a pod pokrievkou var na miernom ohni 12 minút. Odstav prikrytú.
  - Salsa – čerstvé paradajky nakrájaj na malé kocky, posoľ štipkou a nechaj 5 minút v sitku odkvapkať. Zmiešaj s nadrobno nakrájanou druhou cibuľou, polovicou citrónovej šťavy a vňaťou.
  - Do chilli vmiešaj zvyšok citrónovej šťavy, ochutnaj a dosoľ. Podávaj na ryži so salsou navrch.
tips:
  - Ak nemáš kmín, chilli bude dobré aj bez neho, len menej „mexické“.
