title: Paradajkový šalát s chrumkavými rožkami a fazuľou
description: Taliansky chlebový šalát z toho, čo ostalo – opečené kocky starých rožkov nasiaknuté šťavou z osolených paradajok, s uhorkou, cibuľou a bielou fazuľou. Najlepší v lete, keď sú paradajky lacné.
cuisine: talianska
meals: [obed, vecera]
categories: [salaty/syte]
time: 25
active: 20
servings: 7
difficulty: 1
tags: [nasarodinka, zvysky, lacne, vela-bielkovin]
ingredients:
  - rozok: 8 ks | starý
  - olivovy-olej: 5 pl
  - paradajky: 8 ks
  - sol: 1,5 čl
  - cibula-cervena: 1 ks
  - ocot: 3 pl
  - uhorka: 1 ks
  - fazula-biela: 2 ks | scedená
  - cesnak: 1 ks
  - oregano: 1 čl
  - cierne-korenie: 1/4 čl
  - petrzlenova-vnat: 2 pl | nasekaná
steps:
  - Rúru predhrej na 200 °C. Rožky nakrájaj na kocky asi 2 cm, premiešaj s 2 lyžicami oleja a rozlož na plech. Peč 10 minút, kým nie sú chrumkavé.
  - Paradajky nakrájaj na kúsky, daj do veľkej misy a posoľ polovicou soli. Nechaj 10 minút postáť – pustia šťavu, ktorá je základom dresingu.
  - Cibuľu nakrájaj na tenké polkolieska a zalej octom. Za 5 minút zjemnie a nebude štípať.
  - K paradajkám pridaj cibuľu aj s octom, uhorku nakrájanú na kocky, prepláchnutú fazuľu, prelisovaný cesnak, zvyšný olej, oregano, zvyšnú soľ a korenie. Premiešaj.
  - Tesne pred jedlom vmiešaj kocky rožkov a vňať a nechaj 5 minút postáť, nech nasajú šťavu, ale ešte trochu chrumkajú.
tips:
  - Rožky pridávaj až na konci. Šalát s rožkami nevydrží do druhého dňa, bez nich áno.
