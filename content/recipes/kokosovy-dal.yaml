title: Kokosový dal so špenátom
description: Krémová juhoindická šošovica v kokosovom mlieku, hotová za pol hodinu z vecí zo špajze.
cuisine: indicka-juh
meals: [obed, vecera]
time: 30
active: 10
servings: 4
difficulty: 1
tags: [meal-prep, one-pot]
ingredients:
  - olej: 2 pl
  - horcicne-semienko: 1 čl
  - kmin: 1 čl
  - cibula: 1 ks | nadrobno
  - cesnak: 3 ks
  - zazvor: 1 pl | nastrúhaný
  - kurkuma: 1 čl
  - sosovica-cervena: 250 g | prepláchnutá
  - paradajky-sterilizovane: 1/2 ks
  - kokosove-mlieko: 1 ks
  - voda: 3 hrnček
  - sol: 1 čl
  - spenat: 150 g
  - limetka: 1 ks
  - ryza-basmati: 300 g | na prílohu
steps:
  - Na oleji opraž horčičné semienko, kým nezačne praskať, potom pridaj kmín.
  - Pridaj cibuľu a 5 minút restuj, potom cesnak, zázvor a kurkumu na 1 minútu.
  - Pridaj šošovicu, paradajky, kokosové mlieko, vodu a soľ. Var 20 minút za občasného miešania, kým sa šošovica nerozpadne.
  - Medzitým uvar ryžu.
  - Vmiešaj špenát, nechaj ho zvädnúť a dochuť limetkou.
tips:
  - Červená šošovica sa nemusí namáčať a rozvarí sa sama, preto je ideálna na rýchle večere.
