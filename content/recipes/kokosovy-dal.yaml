title: Kokosový dal so špenátom
description: Krémová juhoindická šošovica v kokosovom mlieku, hotová za pol hodinu z vecí zo špajze.
cuisine: indicka-juh
meals: [obed, vecera]
time: 30
active: 10
servings: 4
difficulty: 1
tags: [meal-prep, one-pot]
spicy: 1
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Rozrieď vývarom na polievku alebo pridaj ku ryži s pečenou zeleninou.'
ingredients:
  - olej: 2 pl
  - horcicne-semienko: 1 čl
  - kmin: 1 čl
  - cibula: 1 ks | nadrobno
  - cesnak: 3 ks
  - zazvor: 1 pl | nastrúhaný
  - kurkuma: 1 čl
  - sosovica-cervena: 250 g | prepláchnutá
  - paradajky-sterilizovane: 1/2 ks
  - kokosove-mlieko: 1 ks
  - voda: 3 hrnček
  - sol: 1 čl
  - spenat: 150 g
  - limetka: 1 ks
  - ryza-basmati: 300 g | na prílohu
steps:
  - Na oleji na strednom ohni opraž horčičné semienko, kým nezačne praskať, potom pridaj kmín.
  - Pridaj cibuľu a 5 minút restuj, potom cesnak, zázvor a kurkumu na 1 minútu.
  - Pridaj šošovicu, paradajky, kokosové mlieko, vodu a soľ. Var na miernom ohni 20 minút za občasného miešania, kým sa šošovica nerozpadne.
  - Medzitým uvar ryžu.
  - Vmiešaj špenát, nechaj ho zvädnúť a dochuť limetkou.
tips:
  - Červená šošovica sa nemusí namáčať a rozvarí sa sama, preto je ideálna na rýchle večere.
variants:
  - name: Bez cibule a cesnaku
    description: 'Pre citlivé trávenie (low FODMAP). Chuť doženie zelená časť jarnej cibuľky a o štipku viac korenia.'
    remove: [cibula, cesnak]
    add:
      - jarna-cibulka: 2 ks | len zelená časť
  - name: Viac bielkovín
    description: 'Na konci vmiešaj opečené tofu.'
    add:
      - tofu-natural: 200 g | na kocky, opečené
