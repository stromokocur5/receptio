title: Zapekané zemiaky s karfiolovou „syrovou“ omáčkou
description: Vrstvy zemiakov zaliate krémovou omáčkou z karfiolu, opražených semienok, horčice a cesnaku, ktorá na vrchu zapečie do zlatej kôrky. Pocit ako zapekané so syrom, ale ľahšie a s bielkovinami zo semienok.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/rura]
time: 65
active: 25
servings: 4
difficulty: 2
tags: [zlatica, meal-prep]
keeps: { fridge: 3 }
leftovers: 'Prehrej v rúre na 200 °C 15 minút, kôrka zas chrumne.'
ingredients:
  - zemiaky: 8 ks | asi 1,2 kg, pevné (typ A)
  - sol: 2 čl | 1 do omáčky, 1 medzi vrstvy
  - karfiol: 1/2 ks
  - voda: 500 ml | na karfiol, z nej 200 ml do omáčky
  - slnecnicove-semienka: 80 g
  - olivovy-olej: 3 pl
  - cesnak: 3 ks
  - horcica: 1 pl
  - citron: 1 pl
  - udena-paprika: 1 čl
  - cibula: 1 ks
  - majoranka: 1 čl
  - cierne-korenie: 1/2 čl
  - pazitka: 2 pl
steps:
  - Rúru predhrej na 200 °C. Karfiol rozober na malé ružičky a var v 500 ml osolenej vody 10 minút do mäkka.
  - Medzitým opraž 60 g semienok na suchej panvici na strednom ohni 4 minúty, kým nevoňajú a nehnednú. Zvyšných 20 g odlož na posyp. Opražené semienka dajú omáčke orieškovú plnosť, akú inak dáva syr.
  - Karfiol sceď, odober si 200 ml vody z varenia. Rozmixuj ho s opraženými semienkami, 2 PL oleja, cesnakom, horčicou, citrónom, údenou paprikou, 1 ČL soli a vodou z varenia, kým nie je úplne hladký, aspoň 2 minúty. Ochutnaj – omáčka má byť výrazne slaná a kyslá, zemiaky z nej veľa chuti zoberú.
  - Zemiaky ošúp a nakrájaj na tenké plátky 3 mm, cibuľu na tenké pásiky. Neumývaj ich, škrob na plátkoch pomôže omáčke zhustnúť.
  - Zapekaciu misu vytri 1 PL oleja. Ukladaj vrstvy zemiakov a cibule, každú posyp štipkou soli, majoránkou a korením a zalej trochou omáčky. Na vrch daj zvyšok omáčky a odložené surové semienka.
  - Prikry alobalom a peč 30 minút. Alobal zlož a peč ďalších 20–25 minút, kým nie je vrch zlatohnedý a nôž prejde zemiakmi bez odporu. Nechaj 5 minút odpočinúť, posyp pažítkou. Podávaj s uhorkovým alebo kapustovým šalátom.
tips:
  - Tenké plátky sú dôležité. Hrubé sa neupečú skôr, než omáčka vyschne.
  - Zemiaky typu A sa nerozpadajú, plátky ostanú pekné.
