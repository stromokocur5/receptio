title: Žemľovka zo starých rožkov s jablkami
description: Vrstvy starých rožkov a škoricových jabĺk zaliate vanilkovým mliekom a upečené do chrumkava. Najlepší spôsob, ako zachrániť vrecko rožkov, ktoré nikto nezjedol – a deti ju milujú.
cuisine: slovenska
meals: [obed, dezert, ranajky]
categories: [dezerty/pecene]
time: 65
active: 20
servings: 7
difficulty: 1
tags: [nasarodinka, zvysky, lacne, deti, klasika, pecenie]
keeps: { fridge: 3 }
ingredients:
  - rozok: 12 ks | starý, 1–3 dni
  - sojove-mlieko: 800 ml
  - cukor: 4 pl
  - kukuricny-skrob: 2 pl
  - vanilka: 1 čl
  - sol: 1 štipka
  - jablko: 6 ks
  - skorica: 2 čl
  - citron: 1 pl | šťava
  - hrozienka: 4 pl
  - olej: 2 pl
steps:
  - Rúru predhrej na 180 °C a zapekaciu misu (asi 25 × 30 cm) vymasti trochou oleja.
  - Rožky nakrájaj na kolieska hrubé asi 1 cm.
  - Mlieko rozšľahaj s cukrom, škrobom, vanilkou a soľou. Škrob pri pečení zhustne a drží vrstvy pokope ako vajíčko.
  - Jablká nastrúhaj nahrubo aj so šupkou a premiešaj so škoricou, citrónovou šťavou a hrozienkami.
  - Do misy rozlož tretinu rožkov a polej ich tretinou mlieka. Navrch polovica jabĺk, potom znova rožky, mlieko, zvyšok jabĺk a nakoniec posledné rožky a zvyšok mlieka. Vrch rukou pritlač.
  - Nechaj 10 minút postáť, aby rožky nasiakli. Vrchné kolieska pokvapkaj zvyšným olejom.
  - Peč 40 minút, kým nie je vrch zlatý a chrumkavý. Pred krájaním nechaj 10 minút postáť.
tips:
  - Úplne tvrdé rožky namoč do mlieka na dlhšie, aj na 20 minút. Ak by ostali v strede suché, prilej trochu mlieka navyše.
