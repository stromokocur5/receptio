title: Jogurtový parfait do pohárov
description: Vrstvy sójového jogurtu, ovocia a chrumkavých vločiek s orechmi v pohároch na štyri dni. Ráno vezmeš pohár z chladničky a máš raňajky s 15 g bielkovín.
cuisine: moderna
meals: [ranajky, snack]
categories: [ranajky/kase, dezerty/kremy]
time: 15
active: 15
servings: 4
difficulty: 1
tags: [meal-prep, do-krabicky, ranajky, vela-bielkovin, jogurt]
keeps: { fridge: 4 }
related: [granola, overnight-oats, chia-puding]
ingredients:
  - sojovy-jogurt: 3 hrnček
  - javorovy-sirup: 2 pl | nepovinné
  - vanilka: 1 čl
  - ovsene-vlocky: 1 hrnček
  - vlasske-orechy: 1/2 hrnček
  - skorica: 1 čl
  - jahody: 300 g | čerstvé alebo mrazené
  - banan: 2 ks
  - chia: 4 čl
steps:
  - Vločky a nasekané orechy opraž na suchej panvici na strednom ohni 5 minút do zlatista, kým nezavoňajú. Posyp škoricou a nechaj vychladnúť.
  - Jogurt zmiešaj so sirupom a vanilkou.
  - Jahody nakrájaj, mrazené len nechaj trochu povoliť. Banán nakrájaj na kolieska.
  - Do štyroch pohárov s viečkom vrstvi jogurt, ovocie a chia. Navrch daj ešte jogurt.
  - Pražené vločky s orechmi daj do malých vrecúšok alebo krabičiek a nasyp ich až ráno – v jogurte by zmäkli.
tips:
  - Banán po dvoch dňoch zhnedne. Na celý týždeň daj radšej jablko, hrušku alebo bobule.
  - Hustejšie a sýtejšie s gréckym (odkvapkaným) jogurtom.
howto: [jogurty, meal-prep]
