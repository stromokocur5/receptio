title: Revithia
description: Cícerová polievka z ostrova Sifnos, pomaly dusená s cibuľou, rozmarínom a citrónom. Krémová bez smotany.
cuisine: grecka
meals: [obed, vecera]
categories: [polievky/strukovinove]
time: 60
active: 10
servings: 4
difficulty: 1
tags: [polievka, one-pot, lacne]
spicy: 0
keeps: { fridge: 4, freezer: 3 }
ingredients:
  - olivovy-olej: 4 pl
  - cibula: 2 ks | nadrobno
  - cesnak: 2 ks
  - cicer-sterilizovany: 3 ks
  - zeleninovy-vyvar: 1 l
  - rozmarin: 1 ks
  - bobkovy-list: 1 ks
  - citron: 1 ks
  - sol: podľa chuti | cícer a vývar sú už slané
  - cierne-korenie: 1/2 čl
steps:
  - Na oleji na miernom ohni pomaly speň cibuľu s cesnakom 10 minút.
  - Pridaj cícer, vývar, rozmarín a bobkový list a var pod pokrievkou na miernom ohni 40 minút.
  - Vyber bylinky, tretinu polievky rozmixuj a vráť. Dochuť citrónom, soľou a korením a pokvapkaj olejom.
