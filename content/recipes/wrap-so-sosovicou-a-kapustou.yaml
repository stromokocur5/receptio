title: Wrap so šošovicou, kapustou a tahini do krabičky
description: Chrumkavý šalát z hnedej šošovice, kapusty a mrkvy v citrónovo-tahini dresingu, zabalený v tortille. Šalát vydrží v chladničke štyri dni, takže wrap si ráno zabalíš za minútu.
cuisine: libanonska
meals: [ranajky, obed]
categories: [hlavne/plnene, salaty/syte]
time: 35
active: 20
servings: 4
difficulty: 1
tags: [meal-prep, do-krabicky, vela-bielkovin, lacne, tortilla-na-tyzden]
keeps: { fridge: 4 }
related: [ranajkove-burrito-do-mraznicky, cicerovy-wrap-s-vajeckovou-natierkou]
ingredients:
  - sosovica-hneda: 1 hrnček
  - voda: 3 hrnček
  - biela-kapusta: 2 hrnček | nadrobno nakrájaná
  - mrkva: 2 ks
  - sol: 1 čl
  - tahini: 3 pl
  - citron: 2 ks
  - cesnak: 1 ks
  - kmin: 1/2 čl
  - petrzlenova-vnat: 4 pl | nasekaná
  - psenicne-tortilly: 4 ks
steps:
  - Šošovicu prepláchni a var v 3 hrnčekoch vody na miernom ohni 20 minút, kým nie je mäkká, ale drží tvar. Sceď a nechaj vychladnúť. Soľ pridaj až na konci, inak by tvrdla.
  - Medzitým kapustu nakrájaj nadrobno, posoľ ½ ČL soli a prstami ju 1 minútu premasíruj, kým nezmäkne. Mrkvu nastrúhaj nahrubo.
  - Dresing. Tahini vyšľahaj s citrónovou šťavou, prelisovaným cesnakom, kmínom, zvyšnou soľou a 2–3 PL vody, kým nie je krémový ako jogurt.
  - Zmiešaj šošovicu, kapustu, mrkvu a petržlenovú vňať s dresingom. Ochutnaj a dosoľ. Takto vydrží v krabičke v chladničke 4 dni.
  - Ráno daj na tortillu 3–4 lyžice šalátu, preklop boky a pevne zroluj. Zabaľ do papiera alebo alobalu.
tips:
  - Šalát daj do wrapu až ráno – tortilla by cez noc zmäkla.
  - Ak nemáš tahini, dresing urob z 3 PL sójového jogurtu, citróna a cesnaku.
  - Hnedú šošovicu môžeš uvariť naraz na celý týždeň a časť zamraziť.
