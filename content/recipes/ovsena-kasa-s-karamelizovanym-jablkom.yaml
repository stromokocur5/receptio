title: Ovsená kaša s karamelizovaným jablkom a opraženými semienkami
description: Krémová kaša so štipkou soli (vďaka nej chutí sladko, nie ploché), jablko opečené na panvici dozlata so škoricou a chrumkavé semienka. Raňajky za desať minút.
cuisine: slovenska
meals: [ranajky]
categories: [ranajky/kase]
time: 15
active: 15
servings: 1
difficulty: 1
tags: [zlatica, rychle]
ingredients:
  - ovsene-vlocky-bezlepkove: 50 g
  - voda: 200 ml
  - sojove-mlieko: 100 ml
  - sol: 1 štipka
  - jablko: 1 ks
  - olej: 1 čl
  - skorica: 1/2 čl
  - cukor: 1 čl
  - slnecnicove-semienka: 1 pl
  - tekvicove-semienka: 1 pl
steps:
  - Vločky daj do hrnčeka s vodou, mliekom a štipkou soli. Priveď do varu a na miernom ohni var 4–5 minút za občasného miešania, kým nie je kaša krémová. Soľ v sladkej kaši nie je chyba – zvýrazní sladkosť a kaša nechutí ako mokrý papier.
  - Medzitým jablko nakrájaj na tenké mesiačiky. Na panvici zohrej olej na strednom ohni, pridaj jablko a opekaj 3 minúty, kým nezačne hnednúť. Posyp cukrom a škoricou a opekaj ešte minútu, kým sa cukor nerozpustí na karamel.
  - Jablko vyber a na tú istú panvicu daj semienka, 2 minúty ich opraž.
  - Kašu nalej do misky, navrch jablká aj so šťavou z panvice a semienka.
tips:
  - Pri celiakii niekedy nesedia ani certifikované bezlepkové vločky. Najprv vyskúšaj malú porciu.
