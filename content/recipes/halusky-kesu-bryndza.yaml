title: Halušky s kešu „bryndzou“ a údenou slaninkou
description: Mäkké zemiakové halušky, krémová kyslastá kešu bryndza a chrumkavé kocky údeného tofu. Slovenské národné jedlo rastlinne.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/cesto]
time: 50
active: 40
servings: 4
difficulty: 2
tags: [klasika]
gf_swap: false
keeps: { fridge: 2 }
leftovers: 'Prehrej na panvici s lyžicou vody, bryndza sa znova rozpustí.'
related: [kesu-syr, strapacky-s-kapustou]
ingredients:
  - kesu: 1 hrnček | namočené aspoň 2 h
  - sojovy-jogurt: 1/2 hrnček | nesladený
  - citron: 2 pl
  - miso: 1 čl | svetlé
  - vyzivne-drozdie: 1 pl
  - sol: 1,5 čl
  - voda: 4 pl
  - zemiaky: 4 ks | múčnaté, surové
  - hladka-muka: 250 g
  - tofu-udene: 180 g
  - olej: 2 pl
  - pazitka: 3 pl
steps:
  - Bryndza. Namočené kešu sceď a rozmixuj s jogurtom, citrónom, misom, droždím, 1/2 ČL soli a vodou na hustý, trochu zrnitý krém. Má byť kyslastý a slaný.
  - Údené tofu nakrájaj na drobné kocky a opekaj na oleji na strednom ohni 8 minút dochrumkava.
  - Vo veľkom hrnci priveď do varu osolenú vodu.
  - Zemiaky ošúp a nastrúhaj najjemnejšie. Premiešaj s múkou a zvyšnou soľou na husté lepivé cesto. Ak je riedke, pridaj múku po lyžici.
  - Cesto pretláčaj cez haluškár (alebo krájaj nožom z doštičky) rovno do vriacej vody. Keď halušky vyplávajú, var ich ešte 2 minúty a vyber dierovanou lyžicou.
  - Horúce halušky premiešaj s bryndzou, posyp slaninkou a pažítkou. Podávaj s kyslým mliekom alebo ayranom.
tips:
  - Bryndzu nemixuj úplne dohladka – drobná zrnitosť pripomína pravú.
