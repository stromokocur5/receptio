title: Marinovaná opečená cuketa s cesnakom a octom
description: Plátky cukety opečené do hneda a naložené v teplom octe s cesnakom, olivovým olejom a bylinkami. Taliansky spôsob, ako z cukety spraviť niečo, čo sa nedá prestať jesť. K zemiakom, ryži alebo na šalát.
cuisine: talianska
meals: [obed, vecera, snack]
categories: [salaty/prilohove, prilohy/prilohy]
time: 30
active: 25
servings: 3
difficulty: 1
tags: [zlatica, rychle]
keeps: { fridge: 5 }
leftovers: 'V chladničke je každým dňom lepšia. Pred jedlom ju nechaj ohriať na izbovú teplotu.'
ingredients:
  - cuketa: 2 ks
  - sol: 1 čl
  - olej: 3 pl | na opekanie
  - cesnak: 3 ks
  - ocot: 3 pl
  - cukor: 1/2 čl
  - olivovy-olej: 2 pl
  - bylinky-mata: 2 pl | alebo bazalka či petržlenová vňať
  - cierne-korenie: 1 štipka
steps:
  - Cuketu nakrájaj na kolieska hrubé 1 cm, posyp 1/2 ČL soli a nechaj 10 minút na utierke. Potom ju dôkladne osuš. Bez toho by sa na panvici dusila namiesto opekania.
  - Na veľkej panvici rozohrej olej na vysokom ohni. Kolieska ukladaj v jednej vrstve a opekaj 3 minúty bez hýbania, kým nie sú tmavozlaté, otoč a opeč ďalšie 2–3 minúty. Rob v dávkach a hotové ukladaj do plytkej misy.
  - Do prázdnej panvice (stíš oheň) daj nakrájaný cesnak, minútu ho len zohrievaj, kým nezačne voňať. Vlej ocot, pridaj cukor a zvyšnú soľ, nechaj 30 sekúnd prebublať. Teplý ocot nasiakne do cukety lepšie ako studený.
  - Zalej cuketu octom s cesnakom, pokvapkaj olivovým olejom, posyp nasekanou mätou a korením. Nechaj aspoň 15 minút nasiaknuť, najlepšie hodinu.
tips:
  - Chutí najlepšie vlažná alebo pri izbovej teplote. Na teplých zemiakoch je výborná.
