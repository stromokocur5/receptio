title: Toast s čokoládovo-lieskovým krémom a banánom
description: Opečený chlieb (alebo ryžové chlebíčky) natretý čokoládovo-lieskovým krémom z troch surovín a obložený banánom. Rýchla desiata, ktorá pripomína nutellu.
cuisine: moderna
meals: [snack, ranajky]
categories: [snacky/sladke, snacky/na-cesty]
time: 10
active: 10
servings: 2
difficulty: 1
tags: [rychle, deti, bez-varenia]
ingredients:
  - chlieb: 2 ks | celozrnný, alebo 4 ryžové chlebíčky
  - lieskove-orechy: 3 pl | pražené
  - kakao: 1 pl
  - javorovy-sirup: 2 pl
  - sojove-mlieko: 2 pl
  - banan: 1 ks
steps:
  - Orechy rozmixuj na maslo (v malom mixéri 3–4 minúty, zoškrabuj boky), potom primiešaj kakao, sirup a mlieko. Ak nemáš mixér, zober 3 lyžice lieskového alebo arašidového masla.
  - Chlieb opeč v hriankovači, krém natri a oblož kolieskami banánu.
tips:
  - Do školy natri krém doma a banán pribaľ celý – chlieb inak zmäkne.
