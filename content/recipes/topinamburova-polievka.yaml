title: Topinamburová polievka
description: Zamatová krémová polievka z topinamburu a zemiakov s orieškovou chuťou a chrumkavými opečenými plátkami navrchu.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/kremove]
time: 40
active: 15
servings: 4
difficulty: 1
tags: [polievka, lacne, one-pot]
spicy: 0
keeps: { fridge: 3, freezer: 3 }
ingredients:
  - olej: 3 pl
  - cibula: 1 ks
  - cesnak: 2 ks
  - topinambur: 600 g | umytý, na plátky
  - zemiaky: 2 ks | ošúpané, na kocky
  - zeleninovy-vyvar: 1 l
  - tymian: 1/2 čl
  - sojove-mlieko: 150 ml
  - citron: 1/2 ks
  - sol: 1/2 čl
  - tekvicove-semienka: 2 pl
steps:
  - Pár plátkov topinamburu odlož a opeč na 1 PL oleja na strednom ohni dochrumkava.
  - Na zvyšnom oleji na strednom ohni speň cibuľu s cesnakom, pridaj topinambur, zemiaky, tymian a vývar a var na miernom ohni 20 minút.
  - Rozmixuj s mliekom dohladka, dochuť citrónom a soľou.
  - Podávaj s chrumkavými plátkami a semienkami.
tips:
  - Topinambur nemusíš šúpať – stačí ho vydrhnúť kefkou.
