title: Gado-gado s tempehom
description: Indonézsky teplý šalát zo zemiakov, fazuliek, kapusty, tempehu a tofu, zaliaty hustou arašidovou omáčkou.
cuisine: indonezska
meals: [obed, vecera]
categories: [salaty/syte, hlavne/tofu]
time: 40
active: 25
servings: 4
difficulty: 2
tags: []
spicy: 1
keeps: { fridge: 2 }
leftovers: 'Arašidovú omáčku rozrieď a použi ako dresing na rezance.'
ingredients:
  - zemiaky: 4 ks | malé, v šupke
  - zelene-fazulky: 200 g
  - biela-kapusta: 2 hrnček | na tenké prúžky
  - klicky: 1 hrnček
  - tempeh: 200 g | na plátky
  - tofu-natural: 200 g | na kocky
  - olej: 3 pl
  - uhorka: 1 ks
  - paradajky: 2 ks
  - arasidove-maslo: 5 pl
  - kokosove-mlieko: 1/2 ks
  - tamari: 2 pl
  - javorovy-sirup: 1 pl
  - cesnak: 1 ks
  - cili: 1/2 čl
  - voda: 4 pl
  - limetka: 1 ks
steps:
  - Zemiaky uvar v osolenej vode do mäkka (15–20 minút) a nakrájaj.
  - Fazuľky spar 3 minúty, kapustu 1 minútu a klíčky 30 sekúnd. Všetko prelej studenou vodou.
  - Tempeh a tofu opeč na oleji na strednom ohni dochrumkava.
  - Omáčka. V hrnčeku zohrej arašidové maslo, kokosové mlieko, tamari, sirup, prelisovaný cesnak, čili a vodu a na miernom ohni 3 minúty var za stáleho miešania. Dochuť limetkou.
  - Na tanier ulož zeleninu, zemiaky, uhorku, paradajky, tempeh a tofu a zalej omáčkou.
tips:
  - Arašidová omáčka je výborná aj na rezance či ako dip, sprav jej hneď dvojnásobok.
