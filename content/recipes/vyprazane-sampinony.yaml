title: Vyprážané šampiňóny s tatárkou a zemiakmi
description: Celé klobúčiky v chrumkavom trojobale, vnútri šťavnaté. K tomu varené zemiaky s petržlenovou vňaťou a tatárska omáčka – jedáleňská klasika.
cuisine: slovenska
meals: [obed, vecera]
categories: [comfort/vyprazane, hlavne/zelenina]
time: 45
active: 35
servings: 3
difficulty: 1
tags: [klasika, lacne, deti]
spicy: 0
keeps: { fridge: 2 }
leftovers: 'Prehrej v rúre na 200 °C 8 minút, v mikrovlnke obal zmäkne.'
related: [tatarska-omacka, vyprazany-syr-tofu]
howto: [vyprazanie]
ingredients:
  - sampinony: 500 g | stredne veľké, celé
  - sol: 1 čl | 1/2 na huby, 1/2 do trojobalu
  - cierne-korenie: 1/4 čl
  - hladka-muka: 6 pl | 4 na obaľovanie, 2 do cesta
  - voda: 1/2 hrnček | studená, alebo rastlinné mlieko
  - kukuricny-skrob: 2 pl
  - horcica: 1 čl
  - struhanka: 1 hrnček
  - olej: 8 pl | na vyprážanie
  - zemiaky: 800 g
  - petrzlenova-vnat: 2 pl | nasekaná
  - veganska-majoneza: 5 pl
  - kysle-uhorky: 2 ks | nadrobno
steps:
  - Zemiaky očisti, nakrájaj na štvrtiny, zalej studenou osolenou vodou a var 20 minút do mäkka.
  - Medzitým huby očisti suchou utierkou a stopky zrež tesne pri klobúčiku. Posyp ich 1/2 ČL soli a korením a premiešaj – obal by inak chutil po soli, ale huby nie.
  - Priprav trojobal do troch misiek – 4 PL múky; riedke cesto zo studenej vody vyšľahanej so zvyšnými 2 PL múky, škrobom, horčicou a zvyšnou soľou, husté ako na palacinky – drží strúhanku namiesto vajca; strúhanka.
  - Huby obaľ v múke, v ceste a v strúhanke, ešte raz v ceste a strúhanke, aby obal počas vyprážania nepraskol.
  - Na panvici rozohrej olej na strednom ohni, nech ho je asi 1 cm. Huby vyprážaj po dávkach 5–6 minút, priebežne ich otáčaj, kým nie sú zo všetkých strán zlatisté. Vyber ich na papierovú utierku.
  - Medzitým zmiešaj majonézu s uhorkami, to je tatárka. Uvarené zemiaky sceď a premiešaj s petržlenovou vňaťou.
  - Podávaj hneď, kým je obal chrumkavý.
tips:
  - Menšie huby sa vyprážajú rýchlejšie, veľké nakrájaj na polovice.
variants:
  - name: Ľahšia verzia
    description: Obalené huby polož na plech vystlaný papierom na pečenie, pokvapkaj olejom a peč 20 minút na 220 °C, v polovici otoč. Tatárku sprav z polovice majonézy a polovice sójového jogurtu.
    replace:
      - { from: olej, to: olej, amount: 2 pl }
      - { from: veganska-majoneza, to: veganska-majoneza, amount: 3 pl }
    add:
      - sojovy-jogurt: 3 pl
  - name: S opekanými zemiakmi
    description: Namiesto varených zemiakov chrumkavé opekané s rascou. Zemiaky sa najprv krátko predvaria, potom opečú na druhej panvici, kým sa huby vyprážajú – všetko je hotové naraz.
    replace:
      - { from: olej, to: olej, amount: '10 pl | 8 na vyprážanie, 2 na zemiaky' }
    remove: [petrzlenova-vnat]
    add:
      - rasca: 1/2 čl
    time: 50
    active: 40
    steps:
      - Zemiaky očisti, nakrájaj na kocky 2–3 cm, zalej studenou osolenou vodou a var 12 minút, kým nie sú skoro mäkké. Sceď ich a nechaj v cedidle odpariť – suché sa opečú do chrumkava, mokré sa dusia.
      - Medzitým huby očisti suchou utierkou a stopky zrež tesne pri klobúčiku. Posyp ich 1/2 ČL soli a korením a premiešaj – obal by inak chutil po soli, ale huby nie.
      - Priprav trojobal do troch misiek – 4 PL múky; riedke cesto zo studenej vody vyšľahanej so zvyšnými 2 PL múky, škrobom, horčicou a zvyšnou soľou, husté ako na palacinky – drží strúhanku namiesto vajca; strúhanka.
      - Huby obaľ v múke, v ceste a v strúhanke, ešte raz v ceste a strúhanke, aby obal počas vyprážania nepraskol.
      - Na jednej panvici rozohrej 2 PL oleja na veľkom ohni a zemiaky opekaj 10 minút, prvé 3 minúty bez miešania, potom ich obracaj, kým nie sú zlatisté. Na konci ich posyp rascou a osoľ.
      - Počas opekania zemiakov rozohrej na druhej panvici zvyšný olej na strednom ohni, nech ho je asi 1 cm. Huby vyprážaj po dávkach 5–6 minút, priebežne ich otáčaj, kým nie sú zo všetkých strán zlatisté. Vyber ich na papierovú utierku.
      - Zmiešaj majonézu s uhorkami, to je tatárka, a podávaj hneď, kým sú huby aj zemiaky chrumkavé.
