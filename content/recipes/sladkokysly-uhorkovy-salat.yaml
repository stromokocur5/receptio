title: Sladkokyslý uhorkový šalát ako od babky
description: Tenučké plátky uhorky, najprv osolené a vyžmýkané, aby neplávali, potom zaliate sladkokyslou zálievkou s cesnakom a kôprom. Hodí sa ku každým zemiakom a k všetkému z rúry.
cuisine: slovenska
meals: [obed, vecera]
categories: [salaty/prilohove]
time: 20
active: 10
servings: 3
difficulty: 1
tags: [zlatica, rychle, bez-varenia, lacne]
keeps: { fridge: 2 }
ingredients:
  - uhorka: 1 ks | veľká
  - sol: 1/2 čl
  - voda: 4 pl | studená
  - ocot: 2 pl
  - cukor: 2 čl
  - cesnak: 1 ks
  - kopor: 2 pl
  - olivovy-olej: 1 pl
  - sladka-paprika: 1 štipka | navrch
  - cierne-korenie: 1 štipka
steps:
  - Uhorku nakrájaj alebo nastrúhaj na škrabke na čo najtenšie plátky. Posyp ju soľou, premiešaj a nechaj 10 minút. Potom ju v hrstiach vyžmýkaj – pustí veľa vody a zálievka sa nezriedi.
  - V miske rozmiešaj vodu, ocot a cukor, kým sa cukor nerozpustí. Pridaj prelisovaný cesnak a olej a vidličkou rozšľahaj.
  - Uhorku zalej zálievkou, vmiešaj kôpor a korenie. Ochutnaj – má byť sladká aj kyslá naraz. Nechaj aspoň 5 minút postáť a posyp štipkou papriky.
tips:
  - Kyslejší šalát – lyžica octu navyše. Sladší – štipka cukru.
