title: Krupicová kaša s kakaom a banánom
description: Kakaová krupicová kaša ako z detstva, len s menej cukrom – sladkosť dodá roztlačený banán. Hotová za štvrť hodinu a pre sedem ľudí stojí pár eur.
cuisine: slovenska
meals: [ranajky, dezert]
categories: [ranajky/kase]
time: 15
active: 15
servings: 7
difficulty: 1
tags: [nasarodinka, deti, lacne, rychle, klasika]
keeps: { fridge: 2 }
ingredients:
  - sojove-mlieko: 1,6 l
  - psenicna-krupica: 200 g
  - kakao: 3 pl
  - cukor: 2 pl
  - sol: 1 štipka
  - banan: 4 ks
steps:
  - Kakao a cukor rozšľahaj v hrnci v studenom mlieku, kým sa nerozpustia hrudky kakaa. Pridaj soľ.
  - Mlieko zohrej na strednom ohni za občasného miešania, kým sa pri okraji neobjavia bublinky. Stráž ho, rýchlo vykypí.
  - Za stáleho šľahania metličkou sypaj krupicu tenkým prúdom, aby neurobila hrudky.
  - Stíš na mierny oheň a var 4–5 minút za stáleho miešania aj dna, kým kaša nezhustne. Odstav, v tanieri ešte zhustne.
  - Dva banány roztlač vidličkou a vmiešaj do kaše. Zvyšné nakrájaj na kolieska a rozlož navrch na taniere.
tips:
  - Kaša, ktorá postojí, stuhne. Rozmiešaj ju s trochou horúceho mlieka.
