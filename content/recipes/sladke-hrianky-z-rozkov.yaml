title: Sladké škoricové hrianky zo starých rožkov
description: Rožky prekrojené napoly, namočené vo vanilkovom mlieku so škoricou a opečené dozlatista. Rýchle sladké raňajky, na ktoré sa hodí aj rožok, ktorý by inak skončil v koši.
cuisine: slovenska
meals: [ranajky, dezert]
categories: [ranajky/palacinky]
time: 30
active: 30
servings: 7
difficulty: 1
tags: [nasarodinka, zvysky, lacne, deti]
ingredients:
  - rozok: 12 ks | starý
  - sojove-mlieko: 500 ml
  - hladka-muka: 4 pl
  - cukor: 2 pl
  - skorica: 2 čl
  - vanilka: 1 čl
  - sol: 1 štipka
  - olej: 4 pl
  - sojovy-jogurt: 400 g | na podávanie
  - banan: 3 ks | na podávanie
steps:
  - Rožky prekroj pozdĺžne na polovice.
  - V plytkej miske rozšľahaj mlieko s múkou, cukrom, škoricou, vanilkou a soľou dohladka.
  - Veľkú panvicu zohrej na strednom ohni s lyžicou oleja.
  - Polovicu rožka namoč na 3–5 sekúnd z každej strany – starý rožok nasáva pomalšie, nesmie sa však rozmočiť. Ulož ju na panvicu reznou stranou dole.
  - Peč 2–3 minúty z každej strany dozlatista. Pred každou dávkou prilej trochu oleja.
  - Podávaj s jogurtom a nakrájaným banánom.
tips:
  - Hotové hrianky drž teplé v rúre na 80 °C, kým opečieš všetky.
