title: Cuketový prívarok s kôprom a opečenými zemiakmi
description: Babkin cuketový prívarok bez smotany a bez múky – zahustí ho rozmixovaný zemiak. Cuketa nastrúhaná a vyžmýkaná, aby neplávala, veľa kôpru, cesnak a kvapka octu. K tomu zemiaky opečené do zlata.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/zelenina]
time: 40
active: 25
servings: 3
difficulty: 1
tags: [zlatica, klasika, lacne]
keeps: { fridge: 3 }
ingredients:
  - cuketa: 3 ks | stredné, asi 750 g
  - sol: 1,5 čl | 1/2 na cuketu
  - zemiaky: 7 ks | 1 do prívarku, 6 na opečenie
  - olej: 4 pl | 1 do prívarku, 3 na zemiaky
  - cibula: 1 ks
  - cesnak: 2 ks
  - voda: 300 ml
  - sladka-paprika: 1/2 čl
  - ocot: 1 pl
  - cukor: 1/2 čl
  - kopor: 4 pl | nasekaný, nešetri
  - cierne-korenie: 1/2 čl
steps:
  - Cuketu nastrúhaj na hrubom strúhadle, premiešaj s 1/2 ČL soli a nechaj 10 minút v sitku. Potom ju vyžmýkaj v hrstiach – pustí kopu vody. Bez toho by prívarok bol riedka zelená voda.
  - Medzitým 6 zemiakov ošúp a nakrájaj na kocky 2 cm. Na veľkej panvici rozohrej 3 PL oleja, pridaj zemiaky, štipku soli a 4 PL vody, prikry a nechaj 8 minút. Potom zlož pokrievku a opekaj na strednom ohni 10 minút, kým nemajú zlatú kôrku.
  - Siedmy zemiak ošúp, nakrájaj na malé kocky a var v 300 ml vody 10 minút do mäkka. Nescedzuj ho, rozmixuj aj s vodou dohladka – to bude namiesto smotany a múky.
  - V hrnci rozohrej 1 PL oleja a nadrobno nakrájanú cibuľu restuj na strednom ohni 5 minút do sklovita. Pridaj prelisovaný cesnak a vyžmýkanú cuketu a za častého miešania dus 5 minút, kým cuketa nezmäkne.
  - Odstav, vmiešaj sladkú papriku a zalej rozmixovaným zemiakom. Pridaj zvyšok soli, cukor a korenie a var 3 minúty, kým nezhustne.
  - Vmiešaj ocot a kôpor, ochutnaj – musí byť jemne kyslý aj slaný. Ak je mdlý, pridaj kvapku octu a soľ. Podávaj s opečenými zemiakmi.
tips:
  - Kôpru daj veľa. V prívarku je hlavná chuť, nie ozdoba.
