title: Cícerová frittata na plechu so zemiakmi a paprikou
description: Slaná „vajíčková“ placka z cícerovej múky so zemiakmi, paprikou a cibuľou, upečená naraz pre celú rodinu. Sýta, s bielkovinami, a studená sa hodí aj na desiatu.
cuisine: moderna
meals: [ranajky, obed, vecera]
categories: [ranajky/slane]
time: 60
active: 25
servings: 7
difficulty: 2
tags: [nasarodinka, lacne, vela-bielkovin, do-krabicky]
keeps: { fridge: 3 }
ingredients:
  - cicerova-muka: 250 g
  - voda: 600 ml
  - sol: 1,5 čl
  - kurkuma: 1/2 čl
  - sladka-paprika: 1 čl
  - cierne-korenie: 1/4 čl
  - zemiaky: 400 g
  - cibula: 1 ks
  - paprika-cervena: 2 ks
  - olej: 3 pl
  - kypriaci-prasok: 1 čl
steps:
  - Cícerovú múku rozšľahaj s vodou, soľou, kurkumou, paprikou a korením na hladké cestíčko. Nechaj ho 10 minút odstáť – múka natiahne vodu a frittata bude jemná, nie múčnatá.
  - Rúru predhrej na 200 °C. Zemiaky ošúp a nakrájaj na kocky asi 1 cm, cibuľu na pásiky, papriku na kúsky.
  - Na veľkej panvici zohrej 2 lyžice oleja na strednom ohni. Zemiaky opekaj prikryté 8 minút, občas premiešaj. Pridaj cibuľu a papriku a opekaj odokryté ešte 4 minúty.
  - Zapekaciu misu alebo plech (asi 25 × 35 cm) vystel papierom na pečenie a potri zvyšným olejom. Rozlož na ňu zeleninu.
  - Do cestíčka vmiešaj prášok do pečiva a vylej ho na zeleninu.
  - Peč 20–25 minút, kým nie je stred pevný na dotyk a povrch zlatý. Nechaj 5 minút postáť, potom krájaj.
tips:
  - K tomu kečup, kyslé uhorky alebo krajec chleba.
  - Pri celiakii použi cícerovú múku s certifikátom bez lepku.
