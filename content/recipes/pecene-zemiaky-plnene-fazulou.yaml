title: Pečené zemiaky plnené fazuľou na údeno s cesnakovým dipom
description: Celé zemiaky upečené tak, že majú chrumkavú slanú šupku a vnútri sú ako pyré. Rozpučia sa a naplnia fazuľou v hustej paradajkovej omáčke s údenou paprikou. Navrch cesnakový fazuľový dip a pažítka.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/rura, hlavne/strukoviny]
time: 75
active: 20
servings: 4
difficulty: 1
tags: [lacne]
keeps: { fridge: 3 }
ingredients:
  - zemiaky: 4 ks | veľké, múčnaté, asi 300 g každý
  - olej: 3 pl | 1 na zemiaky, 2 na omáčku
  - sol: 1,5 čl
  - cibula: 1 ks
  - cesnak: 4 ks | 3 do omáčky, 1 do dipu
  - paradajkovy-pretlak: 2 pl
  - udena-paprika: 2 čl
  - paradajky-sterilizovane: 1 ks | plechovka krájaných
  - fazula-cervena: 1 ks | plechovka
  - fazula-biela: 1 ks | plechovka, 1/3 do dipu
  - cukor: 1 čl
  - ocot: 1 pl
  - citron: 1 pl
  - olivovy-olej: 1 pl
  - voda: 2 pl
  - pazitka: 3 pl
steps:
  - Rúru predhrej na 220 °C. Zemiaky umy, osuš a vidličkou ich niekoľkokrát prepichni (para unikne a nepraskne). Potri ich 1 PL oleja a posyp 1/2 ČL soli. Peč priamo na mriežke s plechom pod ňou 55–60 minút, kým šupka nie je tvrdá a chrumkavá a nôž prejde stredom bez odporu.
  - Kým sa zemiaky pečú, sprav fazuľu. Cibuľu nakrájaj nadrobno a restuj na 2 PL oleja na strednom ohni 7 minút dozlata. Pridaj 3 prelisované strúčiky cesnaku a pretlak a miešaj 2 minúty.
  - Odstav, vmiešaj údenú papriku, pridaj paradajky, červenú fazuľu a dve tretiny bielej (obe scedené a prepláchnuté), cukor a 1/2 ČL soli. Var na miernom ohni bez pokrievky 15 minút, kým omáčka nezhustne. Vmiešaj ocot.
  - Dip – zvyšnú tretinu bielej fazule roztlač alebo rozmixuj so strúčikom cesnaku, citrónom, olivovým olejom, vodou a štipkou soli dohladka.
  - Upečené zemiaky prekroj navrch krížom, stlač ich zo strán, aby sa otvorili, a vidličkou trochu nadýchaj vnútro so štipkou soli. Naplň ich fazuľou, navrch daj lyžicu dipu a pažítku.
tips:
  - Zemiaky nebaľ do alobalu – v ňom sa dusia a šupka ostane mäkká.
