title: Citrónové rizoto s opečenou cuketou
description: Krémové rizoto, ktoré sa zahustí samo miešaním, a cuketa opečená zvlášť do hneda, aby sa v ňom nerozvarila. Citrón, cesnak a horčica nakoniec. Žiadna smotana, žiadny syr, a predsa krémové.
cuisine: talianska
meals: [obed, vecera]
categories: [hlavne/ryza, hlavne/zelenina]
time: 35
active: 30
servings: 2
difficulty: 1
tags: [zlatica]
keeps: { fridge: 2 }
leftovers: 'Rizoto v chladničke stuhne. Zohrej ho s pár lyžicami vody a miešaj, kým nie je znova krémové.'
ingredients:
  - ryza-arborio: 160 g
  - cibula: 1 ks
  - olivovy-olej: 4 pl | 2 do hrnca, 2 na cuketu
  - cesnak: 3 ks
  - voda: 750 ml | horúca
  - sol: 1 čl | 1/2 na cuketu
  - cuketa: 1 ks
  - horcica: 1 čl
  - citron: 1/2 ks | šťava
  - petrzlenova-vnat: 3 pl
  - cierne-korenie: 1 štipka
  - tekvicove-semienka: 2 pl
steps:
  - Cuketu nakrájaj na kocky 1,5 cm, posyp 1/2 ČL soli a nechaj ju v sitku púšťať vodu, kým varíš ryžu. Vodu si zohrej v rýchlovarnej kanvici.
  - V hrnci rozohrej 2 PL oleja na strednom ohni a nadrobno nakrájanú cibuľu restuj 5 minút. Pridaj 2 prelisované strúčiky cesnaku a ryžu (neumývaj ju, škrob na povrchu spraví rizoto krémovým) a miešaj 2 minúty, kým zrnká nie sú na okrajoch priesvitné.
  - Zalej asi 200 ml horúcej vody, pridaj 1/2 ČL soli a miešaj, kým ju ryža nenasaje. Potom prilievaj vodu po naberačkách a stále miešaj, vždy keď sa vsiakne, ďalšiu. Asi 18 minút. Miešanie uvoľní z ryže škrob – ten je tá krémovosť, ktorú by inak dala smotana.
  - Medzitým cuketu stlač v sitku a osuš v utierke. Na panvici rozohrej 2 PL oleja na vysokom ohni a cuketu opekaj v jednej vrstve 6–7 minút, otoč ju až keď je spodok hnedý. Na poslednú minútu pridaj zvyšný strúčik cesnaku a semienka.
  - Ryža má byť mäkká s malým jadierkom v strede a rizoto tečúce ako hustá kaša. Odstav, vmiešaj horčicu, citrónovú šťavu a vňať, prikry a nechaj 2 minúty. Ochutnaj a dosoľ. Navrch daj opečenú cuketu so semienkami a korenie.
tips:
  - Cuketu nikdy nevar priamo v rizote, pustí vodu a rozvarí sa.
  - Bez ryže na rizoto to pôjde aj s obyčajnou guľatozrnnou, len bude menej krémové.
