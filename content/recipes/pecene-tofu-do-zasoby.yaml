title: Pečené tofu do zásoby
description: Chrumkavé kocky tofu z rúry bez vyprážania. Upeč celý plech v nedeľu a cez týždeň ich hádž do ryže, šalátov, wrapov a rezancov.
cuisine: moderna
meals: [obed, vecera, snack]
categories: [hlavne/tofu, domace/bielkoviny]
time: 50
active: 10
servings: 4
difficulty: 1
tags: [meal-prep, vela-bielkovin, urob-si-sam]
keeps: { fridge: 5, freezer: 3 }
leftovers: 'Studené kocky do šalátu alebo wrapu. Chrumkavosť im vráti 5 minút na suchej panvici.'
related: [paradajkova-ryza-s-fazulou, buddha-bowl]
howto: [tofu]
ingredients:
  - tofu-natural: 400 g | pevné
  - sojova-omacka: 2 pl
  - olej: 1 pl
  - udena-paprika: 1 čl
  - kukuricny-skrob: 1 pl
steps:
  - Tofu zabaľ do čistej utierky, zaťaž doskou a hrncom a nechaj 15 minút odtiecť. Čím menej vody, tým chrumkavejšie bude.
  - Rúru rozohrej na 200 °C a plech vylož papierom na pečenie.
  - Tofu nakrájaj na 2 cm kocky. V mise ich opatrne premiešaj so sójovou omáčkou, olejom a údenou paprikou, potom posyp škrobom a premiešaj ešte raz, kým sa neobalia.
  - Rozlož na plech tak, aby sa kocky nedotýkali. Peč 25–30 minút, v polovici ich obráť. Hotové sú zlaté, na hranách tmavšie a na dotyk pevné.
  - Nechaj úplne vychladnúť na plechu a až potom zavri do dózy – teplé by sa zaparili a zmäkli.
tips:
  - Dva plechy naraz sa pečú rovnako dlho, len ich v polovici vymeň.
  - Chuť zmeň korením – kari, čili s limetkou alebo cesnak s oreganom namiesto údenej papriky.
