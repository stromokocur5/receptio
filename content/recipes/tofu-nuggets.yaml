title: Chrumkavé tofu nuggets s hranolkami z rúry
description: Nuggety, ktoré zjedia aj deti a nevegáni. Obalené v korenenej strúhanke a upečené dochrumkava bez fritézy.
cuisine: americka
meals: [obed, vecera, snack]
categories: [hlavne/tofu, snacky/party, comfort/vyprazane]
time: 40
active: 20
servings: 3
difficulty: 1
tags: [deti]
keeps: { fridge: 3, freezer: 2 }
leftovers: 'Prehrej v rúre, nie v mikrovlnke – ostanú chrumkavé.'
ingredients:
  - zemiaky: 4 ks | na hranolky
  - olej: 3 pl
  - sol: 1 čl
  - tofu-natural: 400 g | vylisované, na kúsky
  - kukuricny-skrob: 3 pl
  - sojove-mlieko: 1/2 hrnček
  - horcica: 1 čl
  - cesnak: 1 ks | prelisovaný
  - struhanka: 1 hrnček
  - udena-paprika: 1 čl
  - vyzivne-drozdie: 2 pl
steps:
  - Rúru predhrej na 210 °C. Zemiaky nakrájaj na hranolky, premiešaj s 1 PL oleja a soľou a rozlož na plech.
  - Tofu obaľ v škrobe, potom v mlieku rozšľahanom s horčicou a cesnakom a nakoniec v strúhanke zmiešanej s paprikou, droždím a štipkou soli.
  - Ulož na druhý plech, pokvapkaj zvyšným olejom.
  - Peč oba plechy 25 minút, v polovici otoč.
tips:
  - Najlepšie s kečupom alebo srirachou zmiešanou s vegánskou majonézou.
