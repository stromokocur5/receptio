title: Larb s tofu
description: Laoský a thajský teplý šalát z drobeného tofu s limetkou, mätou, šalotkou a praženou ryžovou múčkou. Zabalený v listoch šalátu.
cuisine: thajska
meals: [obed, vecera, snack]
categories: [hlavne/tofu, salaty/syte]
time: 25
active: 20
servings: 3
difficulty: 1
tags: [rychle, vela-bielkovin]
spicy: 2
keeps: { fridge: 1 }
ingredients:
  - ryza-jazminova: 2 pl | surová
  - olej: 1 pl
  - tofu-natural: 400 g | rozdrobené
  - sojova-omacka: 2 pl
  - limetka: 2 ks
  - cukor: 1 čl
  - cili: 1/2 čl
  - cibula-cervena: 1 ks | na tenké mesiačiky
  - jarna-cibulka: 3 ks
  - bylinky-mata: 2 pl
  - bylinky-koriander: 2 pl
  - salat: 1 ks | listy
steps:
  - Surovú ryžu opraž na suchej panvici na strednom ohni dozlatista a pomeli na hrubý prášok.
  - Na oleji na strednom ohni opeč tofu 8 minút, kým nie je suchšie a zlatisté.
  - Stiahni z ohňa, pridaj sójovú omáčku, limetku, cukor, čili, cibule a bylinky a premiešaj s ryžovou múčkou.
  - Podávaj teplé alebo izbovej teploty v listoch šalátu.
