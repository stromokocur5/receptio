title: Púpavový „med“
description: Zlatý hustý sirup z kvetov púpavy, citróna a cukru. Chutí a vyzerá ako med – na palacinky, do čaju a kaše.
cuisine: slovenska
meals: [domace]
categories: [domace/zavarane, domace/zaklady]
time: 180
active: 40
servings: 40
difficulty: 2
tags: [urob-si-sam, lacne]
ahead: Kvety sa lúhujú cez noc.
yields: cca 3 poháre po 0,3 l
keeps: { fridge: 30 }
howto: [dive-rastliny, sirupy-a-stavy]
ingredients:
  - pupava-kvety: 4 hrnček | len žlté korunky, bez zelených listeňov
  - voda: ~1 l
  - citron: 2 ks | na plátky
  - cukor: 1 kg
steps:
  - Kvety zbieraj za slnka a ďaleko od ciest. Nechaj ich hodinu na papieri, aby vyliezol hmyz.
  - Zelené časti odtrhni (horknú), žlté korunky zalej vodou, pridaj citróny a priveď do varu. Stiahni, prikry a nechaj do rána lúhovať.
  - Preceď cez utierku a dobre vyžmýkaj.
  - Tekutinu s cukrom var na miernom ohni 1,5–2 hodiny, kým nezhustne ako tekutý med. Kvapka na studenom tanieri má tiecť pomaly.
  - Horúci nalej do vyparených pohárov a zavri.
tips:
  - Pri chladnutí ešte zhustne – nevar ho do tuha, inak skryštalizuje.
  - Namiesto medu aj do pečenia a dresingov.
