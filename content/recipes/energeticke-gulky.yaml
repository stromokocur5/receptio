title: Datľovo-kakaové energetické guľky
description: Sladkosť do krabičky bez pečenia a bez cukru. Datle, ovsené vločky, arašidové maslo a kakao.
cuisine: moderna
meals: [snack, dezert]
categories: [snacky/na-cesty, snacky/sladke, dezerty/nepecene]
time: 15
active: 15
servings: 12
difficulty: 1
tags: [bez-varenia, do-krabicky, deti]
keeps: { fridge: 10, freezer: 3 }
ingredients:
  - datle: 15 ks | vykôstkované
  - ovsene-vlocky: 1 hrnček
  - arasidove-maslo: 3 pl
  - kakao: 2 pl
  - voda: 2 pl
  - sol: 1 štipka
steps:
  - Ak sú datle tvrdé, namoč ich na 10 minút do horúcej vody a sceď.
  - V sekáčiku rozomel vločky nahrubo, pridaj datle, arašidové maslo, kakao a soľ a mixuj, kým sa zmes nezačne lepiť.
  - Ak je suchá, pridaj vodu po lyžici. Mokrými rukami tvaruj 12 guliek a obaľ ich v kakau alebo kokose.
tips:
  - Bez orechov – arašidové maslo nahraď tahini alebo slnečnicovým maslom.
