title: Sabich – pita s pečeným baklažánom
description: Raňajkový sendvič z Tel Avivu po vegánsky – pečený baklažán, zemiak, cícer, tahini omáčka, kyslé uhorky a šalát z paradajok a uhorky v teplej pite.
cuisine: libanonska
meals: [obed, vecera]
categories: [hlavne/plnene, hlavne/zelenina]
time: 60
active: 30
servings: 4
difficulty: 1
tags: [vela-vlakniny]
keeps: { fridge: 3 }
leftovers: 'Baklažán, cícer a omáčku ulož zvlášť a pitu plň až pred jedlom. Zvyšok zmiešaj s kuskusom ako šalát.'
related: [pita-chlieb, hummus, baba-ganoush]
ingredients:
  - baklazan: 1 ks | veľký, na 1 cm plátky
  - zemiaky: 2 ks
  - olivovy-olej: 3 pl
  - cicer-sterilizovany: 1 ks | scedený
  - kmin: 1/2 čl
  - sol: 1 čl
  - tahini: 3 pl
  - citron: 2 pl | šťava
  - cesnak: 1 ks
  - voda: 4 pl
  - paradajky: 2 ks
  - uhorka: 1/2 ks
  - petrzlenova-vnat: 2 pl
  - kysle-uhorky: 2 ks | na plátky
  - pita: 4 ks
steps:
  - Rúru rozohrej na 220 °C. Zemiaky v šupke daj variť do osolenej vody na 20–25 minút, kým nimi ľahko prejde nôž.
  - Plátky baklažánu rozlož na plech s papierom, potri 2 PL oleja z oboch strán a posoľ 1/2 čl soli. Peč 25 minút, v polovici otoč – majú byť mäkké a zlatohnedé.
  - Cícer zmiešaj s 1 PL oleja a rímskou rascou a posledných 10 minút ho pridaj na plech k baklažánu.
  - Omáčka. Tahini rozmiešaj s citrónovou šťavou, prelisovaným cesnakom, vodou a štipkou soli. Najprv zhustne, potom zriedne na hladký krém.
  - Paradajky a uhorku nakrájaj na drobné kocky, zmiešaj s petržlenom a zvyšnou soľou. Zemiaky ošúp a nakrájaj na plátky.
  - Pity zohrej minútu na suchej panvici, prekroj a otvor vrecko. Vrstvi plátky zemiaka, baklažán, cícer, šalát a kyslé uhorky a všetko polej tahini omáčkou.
tips:
  - Originál má aj mangovú omáčku amba – nahradí ju lyžička mangového chutney alebo pár kvapiek citróna navyše.
  - Štipka kala namak na zemiaky pripomenie vajíčko, ktoré do sabichu patrí.
