title: Jablkové kolieska s arašidovým maslom
description: Hrubé plátky jablka ako „keksy“ – natrieť, posypať a hotovo. Snack za päť minút, ktorý deti zjedia skôr, ako ho dopíšeš do plánu.
cuisine: moderna
meals: [snack, ranajky]
categories: [snacky/sladke]
time: 5
active: 5
servings: 2
difficulty: 1
tags: [rychle, bez-varenia, deti, lacne]
ingredients:
  - jablko: 2 ks | pevné a kyslejšie
  - arasidove-maslo: 3 pl
  - ovsene-vlocky: 2 pl | alebo granola
  - hrozienka: 1 pl
  - skorica: 1 štipka
  - citron: 1/4 ks | pár kvapiek
steps:
  - Jablká umy, jadrovník vykroj nožom alebo vykrajovačom a nakrájaj ich priečne na kolieska hrubé asi 1 cm.
  - Kolieska pokvapkaj citrónom, aby nezhnedli, a osuš papierovou utierkou – na suchom jablku maslo drží.
  - Natri arašidovým maslom, posyp vločkami, hrozienkami a škoricou.
tips:
  - Do krabičky ich ulož po dvoch natretou stranou k sebe ako sendvič.
  - Namiesto arašidového masla tahini s kvapkou sirupu.
