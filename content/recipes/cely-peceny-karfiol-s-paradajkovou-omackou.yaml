title: Celý pečený karfiol v cesnakovej paradajkovej omáčke
description: Celá hlávka karfiolu najprv krátko predvarená, potom potretá olejom s údenou paprikou a pečená, kým nie je zvonku tmavohnedá a vnútri mäkká ako maslo. Podáva sa na hustej paradajkovej omáčke s cesnakom a s ryžou. Vyzerá ako sviatočné jedlo, robí sa samo.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/rura, hlavne/zelenina]
time: 70
active: 20
servings: 3
difficulty: 1
tags: [zlatica]
keeps: { fridge: 3 }
ingredients:
  - karfiol: 1 ks | celý
  - sol: ~1 pl | do vody na predvarenie
  - olivovy-olej: 5 pl | 3 na karfiol, 2 do omáčky
  - udena-paprika: 2 čl
  - sladka-paprika: 1 čl
  - sol: 1,5 čl | 1/2 na karfiol, zvyšok do omáčky a ryže
  - cesnak: 5 ks
  - cibula: 1 ks
  - paradajky: 7 ks | zrelé
  - paradajkovy-pretlak: 1 pl
  - cukor: 1/2 čl
  - ocot: 1 čl
  - ryza-basmati: 200 g
  - voda: 400 ml | na ryžu
  - petrzlenova-vnat: 3 pl
  - citron: 1/2 ks | na mesiačiky
steps:
  - Rúru predhrej na 220 °C. Karfiolu odstráň vonkajšie listy a košťaľ zrež tak, aby hlávka stála rovno. Vo veľkom hrnci priveď do varu vodu s 1 PL soli, karfiol do nej ponor hlavou dole a var 6 minút. Predvarený sa v rúre upečie aj v strede, kým zvonku nezhorí.
  - Karfiol vyber a nechaj 5 minút vyparovať hlavou dole. Zmiešaj 3 PL oleja, obe papriky, 1/2 ČL soli a 1 prelisovaný strúčik cesnaku a potri ním celý karfiol, aj medzi ružičky.
  - Postav ho do zapekacej misy a peč 40–45 minút, kým nie je tmavohnedý, miestami skoro čierny, a nôž prejde do stredu bez odporu.
  - Medzitým omáčka – cibuľu nakrájaj nadrobno a v hrnci ju restuj na 2 PL oleja 5 minút. Pridaj 4 prelisované strúčiky cesnaku a pretlak a miešaj 2 minúty. Paradajky nastrúhaj na hrubom strúhadle (šupky vyhoď), pridaj s cukrom a 1/2 ČL soli a var bez pokrievky 20 minút, kým omáčka nie je hustá. Vmiešaj ocot.
  - Ryžu prepláchni, zalej 400 ml vody so štipkou soli, priveď do varu a pod pokrievkou var na miernom ohni 12 minút. Odstav prikrytú.
  - Omáčku rozotri na tanier, na ňu postav karfiol, posyp vňaťou a pri stole ho krájaj ako koláč. Podávaj s ryžou a citrónom.
tips:
  - Ak karfiol tmavne príliš rýchlo, prikry ho voľne alobalom.
