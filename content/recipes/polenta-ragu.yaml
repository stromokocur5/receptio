title: Krémová polenta so šošovicovým ragú
description: Talianska útecha v miske. Hodvábna polenta a husté paradajkové ragú zo šošovice.
cuisine: talianska
meals: [obed, vecera]
time: 45
active: 20
servings: 4
difficulty: 2
tags: [meal-prep]
keeps: { fridge: 3, freezer: 3 }
leftovers: 'Stuhnutú polentu nakrájaj na hranolky a opeč alebo zapeč.'
ingredients:
  - olivovy-olej: 2 pl
  - cibula: 1 ks
  - mrkva: 1 ks | nadrobno
  - cesnak: 2 ks
  - sosovica-hneda: 150 g
  - paradajky-sterilizovane: 1 ks
  - paradajkovy-pretlak: 1 pl
  - oregano: 1 čl
  - voda: 6 hrnček
  - kukuricna-krupica: 200 g
  - vyzivne-drozdie: 2 pl
  - sol: 1,5 čl
steps:
  - Na oleji na strednom ohni speň cibuľu, mrkvu a cesnak, pridaj šošovicu, paradajky, pretlak, oregano, 2 hrnčeky vody a polovicu soli. Var na miernom ohni 30 minút.
  - V inom hrnci priveď do varu 4 hrnčeky vody so zvyškom soli a za stáleho šľahania vsypávaj krupicu.
  - Polentu var na miernom ohni 10 až 15 minút za občasného miešania a nakoniec vmiešaj výživné droždie.
  - Polentu daj do misky a navrch ragú.
tips:
  - Zvyšná polenta stuhne. Nakrájaj ju na plátky a na druhý deň opeč na panvici.
