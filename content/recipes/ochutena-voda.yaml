title: Ochutená voda s ovocím
description: Džbán vody s citrusmi, uhorkou, mätou alebo bobuľami. Bez cukru, na celý deň – aby sa lepšie pilo.
cuisine: moderna
meals: [snack]
categories: [napoje/limonady]
time: 5
active: 5
servings: 6
difficulty: 1
tags: [rychle, bez-varenia, lacne, deti]
ahead: Najlepšia po 1–2 hodinách v chladničke.
nutrition: false
keeps: { fridge: 2 }
ingredients:
  - voda: 1,5 l
  - citron: 1/2 ks | na plátky
  - uhorka: 1/4 ks | na plátky
  - bylinky-mata: 1 pl
  - maliny: 1/2 hrnček | alebo iné bobule, jahody
steps:
  - Ovocie a uhorku nakrájaj, mätu pomnúc v dlaniach.
  - Daj do džbánu, zalej studenou vodou a nechaj aspoň hodinu v chladničke.
  - Dolievaj vodou počas dňa, ovocie vymeň o 12 hodín.
tips:
  - Kombinácie – pomaranč a rozmarín, jahody a bazalka, jablko a škorica, melón a limetka.
