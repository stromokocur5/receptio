title: Mrazené banánové sendviče v čokoláde
description: Dve kolieska banánu, medzi nimi arašidové maslo, to celé do polovice v čokoláde. Jednohubky z mrazničky, ktoré zmiznú skôr ako zmrzlina.
cuisine: moderna
meals: [snack, dezert]
categories: [dezerty/mrazene, snacky/sladke]
time: 110
active: 20
servings: 6
difficulty: 1
tags: [deti, party, bez-varenia]
spicy: 0
ahead: Mrznú dvakrát – hodinu pred namáčaním a pol hodiny po ňom.
keeps: { fridge: 0, freezer: 2 }
related: [banan-nanuky, datle-snickers]
ingredients:
  - banan: 3 ks | zrelé, ale pevné
  - arasidove-maslo: 4 pl
  - horka-cokolada: 100 g
  - kokosovy-olej: 1 pl
  - sol: 1 štipka | vločková, voliteľne
steps:
  - Banány nakrájaj na kolieska hrubé asi 1 cm. Na polovicu z nich daj po pol lyžičke arašidového masla a prikry druhým kolieskom.
  - Sendviče ulož na tácku s papierom na pečenie a daj na hodinu do mrazničky.
  - Čokoládu s kokosovým olejom rozpusť vo vodnom kúpeli alebo v mikrovlnke po 20 sekundách, zakaždým premiešaj.
  - Zmrznuté sendviče ponáraj do polovice do čokolády a vracaj na papier. Na studenom banáne stuhne za pár sekúnd. Posyp štipkou soli.
  - Daj ešte na 30 minút do mrazničky. Pred jedlom nechaj 2 minúty postáť.
tips:
  - Pri alergii na arašidy použi tahini s kvapkou sirupu alebo slnečnicové maslo.
