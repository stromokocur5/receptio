title: Arašidovo-banánový shake
description: Hustý shake ako z bistra – arašidové maslo, mrazený banán, vločky a kakao navrch. Po tréningu aj namiesto dezertu.
cuisine: americka
meals: [snack, ranajky]
categories: [napoje/smoothie]
time: 5
active: 5
servings: 1
difficulty: 1
tags: [rychle, bez-varenia, vela-bielkovin]
ingredients:
  - banan: 1 ks | zmrazený
  - arasidove-maslo: 2 pl
  - sojove-mlieko: 1 hrnček
  - ovsene-vlocky: 2 pl
  - datle: 1 ks
  - skorica: 1 štipka
steps:
  - Všetko rozmixuj dohladka. Posyp škoricou alebo kakaom.
tips:
  - Hrsť sójových granúl namočených v mlieku pridá ďalších 10 g bielkovín a nepoznať ich.
