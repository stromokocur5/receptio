title: Pad thai s tofu
description: Ploché ryžové rezance v kyslo-sladko-slanej tamarindovej omáčke s chrumkavým tofu, klíčkami a arašidmi.
cuisine: thajska
meals: [obed, vecera]
time: 30
active: 25
servings: 3
difficulty: 2
tags: []
ingredients:
  - ryzove-rezance: 200 g | ploché
  - tamarind: 2 pl
  - tamari: 3 pl
  - javorovy-sirup: 2 pl
  - limetka: 2 ks
  - cili: 1/2 čl
  - tofu-natural: 250 g | na kocky, vylisované
  - olej: 3 pl
  - cesnak: 3 ks
  - jarna-cibulka: 4 ks | na 3 cm kúsky
  - klicky: 1 hrnček
  - arasidy: 4 pl | nasekané
  - bylinky-koriander: 2 pl
steps:
  - Rezance namoč na 8–10 minút do horúcej (nie vriacej) vody, kým nie sú ohybné, ale ešte pevné. Sceď. Dovaria sa na panvici.
  - Omáčka. Zmiešaj tamarind, tamari, sirup, šťavu z jednej limetky a čili. Ochutnaj – má byť výrazne kyslá, sladká aj slaná naraz.
  - Na 2 PL oleja opeč tofu dozlatista a daj bokom.
  - Na zvyšnom oleji 30 sekúnd opraž cesnak a biele časti cibuľky, pridaj rezance a omáčku a 2–3 minúty prehadzuj, kým rezance omáčku nenasajú.
  - Pridaj tofu, klíčky a zelenú cibuľku a ešte 30 sekúnd premiešaj.
  - Podávaj s arašidmi, koriandrom a mesiačikmi limetky.
tips:
  - Rezance sa na panvici lepia – ak treba, podlej 2 PL vody.
  - Tamarindovú pastu zoženieš v ázijských potravinách, vydrží v chladničke mesiace.
