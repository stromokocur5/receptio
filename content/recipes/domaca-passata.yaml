title: Domáca passata z čerstvých paradajok
description: Hladký paradajkový pretlak bez šupiek a semienok z letných paradajok. Základ na omáčky, polievky a pizzu – do pohárov alebo do mrazničky.
cuisine: talianska
meals: [domace]
categories: [domace/zavarane, omacky/omacky]
time: 130
active: 50
servings: 10
difficulty: 2
tags: [urob-si-sam, meal-prep]
yields: cca 1,2 l (2–3 poháre po 0,5 l)
keeps: { fridge: 5, freezer: 8 }
leftovers: 'Šupky a semienka zo sitka usuš v rúre pri 80 °C a pomeľ na paradajkový prášok do polievok.'
related: [marinara-omacka, arrabbiata, susene-paradajky-v-oleji]
howto: [zavaranie]
ingredients:
  - paradajky: 2 kg | zrelé, mäsité (rímske, San Marzano)
  - sol: 1 čl
  - citron: 3 pl | šťava, 1 PL do každého 0,5 l pohára
steps:
  - Paradajky umy, vykroj stopku a nakrájaj na štvrtiny. Nahnité a plesnivé kusy vyhoď celé, nie len vykrojené.
  - Daj ich do veľkého hrnca a var na strednom ohni 15 minút, kým sa nerozpadnú a nepustia šťavu. Občas premiešaj.
  - Prepasíruj cez pasírovač alebo husté sitko, naberačkou pretláčaj dužinu. Ostanú v ňom šupky a semienka.
  - Pretlak vráť do hrnca a var odokryté na miernom ohni 20–30 minút, kým nezhustne tak, že lyžica nechá na dne stopu. Osoľ.
  - Do mrazničky – nechaj vychladnúť a nalej do dóz alebo vreciek po 250–500 ml, hore nechaj 2 cm miesto.
  - Do pohárov – do každého čistého 0,5 l pohára daj 1 PL citrónovej šťavy, nalej vriacu passatu 1 cm pod okraj, utri hrdlo a zavri. Poháre postav do hrnca na utierku, zalej horúcou vodou 3 cm nad viečka a var 35 minút od chvíle, keď voda vrie. Nad 300 m n. m. pridaj 5 minút.
  - Poháre vyber, nechaj 24 hodín stáť a skontroluj viečka – musia byť prehnuté dnu a nesmú pružiť. Čo nezatiahlo, daj do chladničky a spotrebuj do 5 dní.
tips:
  - Citrónová šťava nie je na chuť – paradajky majú kyslosť na hrane a bez nej zaváranie vo vodnom kúpeli nie je bezpečné. Spoľahlivejšia je kupovaná šťava vo fľaštičke, má stálu kyslosť.
  - Zavárané poháre vydržia v tme a chlade rok. Po otvorení patria do chladničky.
  - Na 1 kg passaty treba asi 1,6 kg paradajok. Oplatí sa to v auguste a septembri, keď sú najlacnejšie.
