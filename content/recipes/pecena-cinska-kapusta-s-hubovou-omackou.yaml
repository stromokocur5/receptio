title: Pečená čínska kapusta s hubovou omáčkou
description: Štvrtiny čínskej kapusty pečené, kým okraje nezhnednú a stred nezmäkne, s krémovou omáčkou zo šampiňónov a kokosového mlieka. S ryžou ako plnohodnotná večera.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/zelenina, hlavne/rura]
time: 50
active: 20
servings: 4
difficulty: 1
tags: [lacne]
spicy: 0
keeps: { fridge: 2 }
leftovers: 'Kapustu prehrej v rúre, omáčku zvlášť na panvici.'
ingredients:
  - cinska-kapusta: 1 ks | asi 1 kg
  - olej: 3 pl
  - sojova-omacka: 3 pl | 2 na kapustu, 1 do omáčky
  - sampinony: 400 g | na plátky
  - cibula: 1 ks | nadrobno
  - cesnak: 3 ks | nasekaný
  - miso: 1 pl | svetlé
  - kokosove-mlieko: 1 ks
  - cierne-korenie: 1/4 čl
  - jarna-cibulka: 2 ks | na kolieska
  - ryza-jazminova: 300 g
  - sol: 1/2 čl | do ryže
steps:
  - Rozohrej rúru na 220 °C a plech vystel papierom na pečenie. Kapustu rozštvrť pozdĺžne cez koreň, aby listy držali spolu.
  - Zmiešaj 2 PL oleja s 2 PL sójovej omáčky, potri kapustu aj medzi listami a polož ju na plech reznou stranou nahor. Peč 30 minút, kým okraje nezhnednú a stred nezmäkne.
  - Medzitým uvar ryžu – prepláchni ju v site, zalej 450 ml vody, osoľ a priveď do varu. Prikry a na najmenšom ohni var 12 minút, potom odstav a nechaj 10 minút dôjsť pod pokrievkou.
  - Počas pečenia rozohrej na panvici zvyšný olej na veľkom ohni a huby opekaj 6 minút dohneda. Stiahni oheň, pridaj cibuľu a opekaj 4 minúty, potom cesnak na minútu.
  - Miso rozmiešaj v kokosovom mlieku, vlej k hubám, pridaj zvyšnú sójovú omáčku a korenie a var 5 minút, kým omáčka nezhustne.
  - Na každý tanier daj štvrtinu kapusty, prelej omáčkou, posyp jarnou cibuľkou a podávaj s ryžou.
tips:
  - Bezlepková verzia – tamari namiesto sójovej omáčky a miso bez jačmeňa.
