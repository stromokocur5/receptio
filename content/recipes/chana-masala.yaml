title: Chana masala
description: Pikantné cícerové kari zo severnej Indie. Lacné, sýte a ešte lepšie na druhý deň.
cuisine: indicka-sever
meals: [obed, vecera]
categories: [hlavne/strukoviny, hlavne/kari]
time: 45
active: 15
servings: 4
difficulty: 1
tags: [meal-prep, one-pot]
spicy: 1
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Na druhý deň je lepšia. Zvyšok daj do tortilly alebo na hrianku.'
ingredients:
  - olej: 2 pl
  - cibula: 2 ks | nadrobno
  - cesnak: 4 ks | prelisovaný
  - zazvor: 1 pl | nastrúhaný
  - kmin: 1 čl
  - koriander-mlety: 2 čl
  - kurkuma: 1 čl
  - cili: 1/2 čl
  - paradajky-sterilizovane: 1 ks
  - cicer-sterilizovany: 2 ks
  - voda: 1/2 hrnček
  - garam-masala: 2 čl
  - sol: 1 čl
  - citron: 1/2 ks
  - bylinky-koriander: 2 pl | na posypanie
  - ryza-basmati: 300 g | na prílohu
steps:
  - Ryžu prepláchni, zalej 550 ml vody, pridaj štipku soli, priveď do varu, prikry a var na miernom ohni 12 minút. Nechaj prikrytú dôjsť, kým dokončíš zvyšok.
  - Na oleji na strednom ohni opeč cibuľu dozlatista, trvá to asi 8 minút a je to základ chuti, neponáhľaj sa.
  - Pridaj cesnak, zázvor, kmín, koriander, kurkumu a čili a 1 minútu miešaj, kým korenie nezavonia.
  - Vlej paradajky, pridaj cícer, vodu a soľ. Prikry a var na miernom ohni 15 minút, kým omáčka nezhustne.
  - Primiešaj garam masalu a citrónovú šťavu, dochuť soľou.
  - Podávaj s ryžou a posyp čerstvým koriandrom.
tips:
  - Časť cícera roztlač vareškou o stenu hrnca, omáčka bude krémovejšia.
variants:
  - name: Bez cibule a cesnaku
    description: 'Pre citlivé trávenie (low FODMAP). Chuť doženie zelená časť jarnej cibuľky a o štipku viac korenia.'
    remove: [cibula, cesnak]
    add:
      - jarna-cibulka: 3 ks | len zelená časť
  - name: Viac bielkovín
    description: 'Pridaj opečené tofu na kocky, porcia bude mať o ~10 g bielkovín viac.'
    add:
      - tofu-natural: 200 g | na kocky, opečené
