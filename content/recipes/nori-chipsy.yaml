title: Nori chipsy so sezamom
description: Pláty nori slepené sezamovým olejom, posypané sezamom a krátko zapečené. Tenké, slané, morské – kórejský snack za pár centov.
cuisine: korejska
meals: [snack]
categories: [snacky/slane]
time: 20
active: 10
servings: 3
difficulty: 1
tags: [rychle, lacne]
keeps: { fridge: 7, freezer: 0 }
ingredients:
  - nori: 6 ks
  - sezamovy-olej: 1 pl
  - sezam: 1 pl
  - sol: 1 štipka
  - gochugaru: 1 štipka | voliteľne
steps:
  - Rúru predhrej na 150 °C.
  - Jeden plát nori potri tenko sezamovým olejom, polož naň druhý a pritlač. Vrch opäť potri olejom a posyp sezamom, soľou a gochugaru. Rovnako sprav ďalšie dva páry.
  - Nožnicami nastrihaj na štvorce 4 × 4 cm a rozlož na plech s papierom.
  - Peč 8–10 minút, kým nori nie je suché a chrumkavé, ale ešte zelené – hnedé horkne.
tips:
  - Skladuj v dóze so sáčkom ryže alebo so silikagélom z balenia – vlhkosť z nich hneď urobí gumu.
