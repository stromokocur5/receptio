title: Edamame s cesnakom a čili
description: Mladé sójové struky za päť minút. Vyciciavajú sa priamo zo struku, návykové ako chipsy, ale plné bielkovín.
cuisine: japonska
meals: [snack]
time: 10
active: 10
servings: 3
difficulty: 1
tags: [rychle, vela-bielkovin]
ingredients:
  - edamame: 400 g | mrazené v strukoch
  - sezamovy-olej: 1 čl
  - cesnak: 2 ks | nadrobno
  - cili: 1/2 čl
  - sol: 1 čl | hrubá
  - limetka: 1/2 ks
steps:
  - Edamame var 4–5 minút v osolenej vode a sceď.
  - Na sezamovom oleji 30 sekúnd opraž cesnak s čili.
  - Prehoď v ňom edamame, posyp hrubou soľou a pokvapkaj limetkou.
  - Jedz tak, že struk vložíš do úst a zubami z neho vytlačíš zrná. Struky sa nejedia.
