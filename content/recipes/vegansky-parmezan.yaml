title: Vegánsky parmezán
description: Štyri suroviny, mixér, pol minúty. Na cestoviny, rizoto, šaláty aj pizzu – syrová chuť bez syra.
cuisine: talianska
meals: [domace]
time: 5
active: 5
servings: 12
difficulty: 1
tags: [urob-si-sam, rychle]
yields: cca 150 g
keeps: { fridge: 30 }
ingredients:
  - kesu: 100 g
  - vyzivne-drozdie: 3 pl
  - sol: 1/2 čl
  - cesnak: 1/2 ks
steps:
  - Všetko pulzuj v mixéri na jemnú drvinu. Prestaň skôr, ako sa z kešu stane maslo.
tips:
  - Lacnejšia verzia je zo slnečnicových alebo tekvicových semienok.
