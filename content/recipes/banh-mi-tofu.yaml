title: Bánh mì s marinovaným tofu
description: Vietnamská bageta s karamelizovaným tofu, rýchlo nakladanou zeleninou, sriracha majonézou a koriandrom.
cuisine: vietnamska
meals: [obed, vecera]
time: 40
active: 30
servings: 2
difficulty: 2
tags: []
ingredients:
  - mrkva: 1 ks | na tenké prúžky
  - redkovka: 4 ks | na tenké plátky
  - ocot: 3 pl
  - cukor: 1 čl
  - sol: 1 štipka
  - tofu-natural: 200 g | na plátky 1 cm
  - tamari: 1 pl
  - javorovy-sirup: 1 pl
  - cesnak: 1 ks
  - olej: 1 pl
  - veganska-majoneza: 2 pl
  - sriracha: 1 čl
  - bageta: 1 ks
  - uhorka: 1/2 ks | na dlhé plátky
  - bylinky-koriander: 3 pl
steps:
  - Mrkvu a reďkovky zalej octom s cukrom, soľou a 3 PL vody. Nechaj 15 minút naložiť.
  - Tofu marinuj 10 minút v tamari, sirupe a prelisovanom cesnaku.
  - Tofu opeč na oleji z oboch strán, na konci vlej marinádu a nechaj ju zredukovať, kým tofu nie je lesklé.
  - Majonézu zmiešaj so srirachou. Bagetu rozrež na dve časti, pozdĺžne nakroj a 3 minúty zapeč v rúre, nech je chrumkavá.
  - Natri majonézou a plň tofu, scedenou nakladanou zeleninou, uhorkou a koriandrom.
