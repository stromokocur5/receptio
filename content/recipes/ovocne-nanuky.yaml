title: Trojfarebné ovocné nanuky
description: Tri vrstvy rozmixovaného ovocia – jahody, mango a kiwi. Nanuky ako semafor, len z ovocia a lyžice sirupu.
cuisine: moderna
meals: [dezert, snack]
categories: [dezerty/mrazene, snacky/sladke]
time: 300
active: 20
servings: 6
difficulty: 1
tags: [deti, party, bez-varenia]
spicy: 0
ahead: Každá vrstva mrzne 30 minút, hotové nanuky ešte 3 hodiny.
keeps: { fridge: 0, freezer: 2 }
yields: 6 nanukov
related: [jogurtove-nanuky, cokoladove-nanuky]
ingredients:
  - jahody: 1,5 hrnček
  - mango: 1,5 hrnček | čerstvé alebo rozmrazené
  - kiwi: 3 ks | olúpané
  - javorovy-sirup: 3 pl
  - voda: 6 pl
steps:
  - Každé ovocie rozmixuj zvlášť s lyžicou sirupu a dvoma lyžicami vody na hladké pyré. Mixér medzi tým stačí vypláchnuť.
  - Do formičiek na nanuky nalej do tretiny jahodové pyré a daj na 30 minút do mrazničky.
  - Dolej mangovú vrstvu, zapichni paličky – už budú držať rovno – a mraz ďalších 30 minút.
  - Dolej kiwi až po okraj a nechaj mraziť aspoň 3 hodiny.
  - Formičku podrž 10 sekúnd pod teplou vodou a nanuk vytiahni.
tips:
  - Bez formičiek použi malé poháre alebo tégliky od jogurtu a ako paličku lyžičku.
  - Ak nechceš čakať na vrstvy, nalej všetko naraz a špajdľou raz zamiešaj – budú mramorové.
