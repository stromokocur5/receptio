title: Pečený ružičkový kel s balzamikom
description: Rozpolené kapustičky upečené dochrumkava s cesnakom, sladkým balzamikom a opraženými orechmi. Nie horké, ale sladké.
cuisine: moderna
meals: [obed, vecera, snack]
time: 35
active: 10
servings: 3
difficulty: 1
tags: [rychle]
spicy: 0
keeps: { fridge: 3 }
ingredients:
  - ruzickovy-kel: 4 hrnček | rozpolený
  - olivovy-olej: 3 pl
  - sol: 3/4 čl
  - cesnak: 2 ks
  - ocot: 1 pl | balzamikový
  - javorovy-sirup: 1 pl
  - vlasske-orechy: 3 pl
steps:
  - Kel premiešaj s olejom a soľou a ulož reznou stranou na plech.
  - Peč na 220 °C 20 minút, kým spodky nie sú tmavozlaté.
  - Ocot so sirupom a cesnakom zmiešaj, prelej kel, pridaj orechy a peč ešte 5 minút.
