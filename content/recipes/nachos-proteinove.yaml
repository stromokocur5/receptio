title: Proteínové nachos s fazuľou a údeným tofu
description: Nachos na celú večeru – cícerové chipsy, čierna fazuľa s údeným tofu, „syrová“ omáčka z bielej fazule a čerstvá salsa s avokádom. Vyše 40 g bielkovín a 25 g vlákniny na porciu.
cuisine: mexicka
meals: [vecera, snack]
categories: [snacky/party, snacky/slane]
time: 60
active: 35
servings: 3
difficulty: 2
tags: [party, vela-bielkovin]
spicy: 1
keeps: { fridge: 1 }
related: [cicerove-chipsy, nachos-plech, nacho-syrova-omacka, pico-de-gallo]
equipment: [rura, plech, panvica, mixer, miska, valcek]
ingredients:
  - cicerova-muka: 150 g | na chipsy
  - lanove-semienko: 2 pl | mleté
  - voda: 1/2 hrnček | do cesta
  - olej: 3 pl
  - sol: 1/4 čl | údené tofu aj fazuľa sú už slané
  - udena-paprika: 2 čl
  - kmin: 1 čl
  - tofu-udene: 200 g
  - fazula-cierna: 1 ks | plechovka, scedená
  - fazula-biela: 1 ks | plechovka, scedená a prepláchnutá
  - vyzivne-drozdie: 3 pl
  - citron: 1 pl
  - horcica: 1 čl
  - cesnak: 2 ks
  - paradajky: 2 ks
  - cibula-cervena: 1/2 ks
  - limetka: 1 ks
  - bylinky-koriander: 2 pl | alebo petržlenová vňať
  - avokado: 1 ks
  - cili-papricka: 1 ks | alebo nakladané jalapeño
steps:
  - Rúru predhrej na 180 °C. V mise zmiešaj múku, mletý ľan, 1 čl papriky, štipku soli, vodu a 2 lyžice oleja na hladké cesto a nechaj ho 10 minút odpočívať.
  - Cesto rozvaľkaj medzi dvoma papiermi na pečenie na 1–2 mm, nakrájaj na trojuholníky a na spodnom papieri peč na plechu 12–15 minút dozlatista. Potom nechaj chipsy 5 minút dosušiť vo vypnutej rúre.
  - Kým sa chipsy pečú, tofu rozdrob prstami na malé kúsky. Na panvici rozohrej lyžicu oleja a tofu opekaj na strednom ohni asi 6 minút, kým nie je chrumkavé.
  - Pridaj nadrobno nasekaný jeden strúčik cesnaku, kmín a zvyšok papriky, 30 sekúnd miešaj. Prisyp čiernu fazuľu, 3 lyžice vody a 3 minúty hrej, pričom asi tretinu fazule roztlač vidličkou.
  - Bielu fazuľu rozmixuj s droždím, citrónom, horčicou, druhým strúčikom cesnaku, štipkou soli a 4–5 lyžicami vody na hladkú, hustú omáčku.
  - Paradajky, cibuľu, koriander a čili nakrájaj nadrobno a premiešaj so šťavou z polovice limetky. Avokádo nakrájaj na kocky a pokvapkaj zvyškom limetky.
  - Chipsy rozlož na plech, posyp fazuľou s tofu a polej omáčkou. Zapekaj pri 200 °C 4–5 minút, len aby sa všetko prehrialo.
  - Navrch daj salsu a avokádo a jedz hneď, kým sú chipsy chrumkavé.
tips:
  - Rýchlejšia verzia – kúpené kukuričné chipsy alebo tortilly z rúry. Bielkovín bude asi o 10 g na porciu menej.
  - Fazuľa s tofu a omáčka vydržia v chladničke 3 dni zvlášť, chipsy v dóze. Nachos skladaj až tesne pred jedlom.
