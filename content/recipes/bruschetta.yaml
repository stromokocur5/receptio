title: Bruschetta s paradajkami a bazalkou
description: Opečený chlieb potretý cesnakom a navrch šťavnaté paradajky s bazalkou. Taliansky predjedlový klasik, ktorý je vegánsky odjakživa.
cuisine: talianska
meals: [snack, vecera]
categories: [snacky/party, snacky/slane]
time: 20
active: 20
servings: 4
difficulty: 1
tags: [rychle, party, klasika, lacne]
ingredients:
  - bageta: 1 ks
  - paradajky: 4 ks | zrelé
  - cesnak: 1 ks
  - bazalka: 1 hrnček | lístky
  - olivovy-olej: 4 pl
  - ocot: 1 čl | najlepšie balzamikový
  - sol: 1/2 čl
  - cierne-korenie: 1 štipka
steps:
  - Paradajky nakrájaj na malé kocky, osoľ a nechaj 10 minút v sitku odkvapkať – chlieb potom nezmokne.
  - Premiešaj ich s natrhanou bazalkou, 2 lyžicami oleja, octom a korením.
  - Bagetu nakrájaj šikmo na plátky hrubé 1,5 cm, pokvapkaj zvyšným olejom a opeč na panvici na strednom ohni alebo pod grilom v rúre z oboch strán do zlata.
  - Teplé plátky potri rozpolenou strúčikou cesnaku a hneď navrch naložené paradajky.
tips:
  - Najlepšia je v lete s paradajkami zo záhrady, v zime radšej z cherry paradajok.
  - Bezlepková verzia – bezlepkové pečivo, ideálne trochu zaschnuté.
