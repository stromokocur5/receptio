title: Nepečený citrónový cheesecake z kešu
description: Krémový citrónový „cheesecake“ z kešu na orechovo-datľovom korpuse, s malinami navrchu. Bez pečenia.
cuisine: moderna
meals: [dezert]
time: 30
active: 30
servings: 10
difficulty: 3
tags: [dezert, party]
ahead: Kešu namoč na 4 hodiny (alebo 15 minút vo vriacej vode) a hotový koláč nechaj stuhnúť v mrazničke 4 hodiny.
keeps: { fridge: 5, freezer: 3 }
ingredients:
  - vlasske-orechy: 1 hrnček
  - datle: 12 ks
  - ovsene-vlocky: 1/2 hrnček
  - sol: 1 štipka
  - kesu: 300 g | namočené a scedené
  - kokosove-mlieko: 1/2 ks | len tuhá časť
  - kokosovy-olej: 6 pl | rozpustený
  - citron: 2 ks | šťava a kôra z jedného
  - javorovy-sirup: 6 pl
  - maliny: 1 hrnček
steps:
  - Korpus. Orechy, datle, vločky a soľ rozmixuj na lepkavú drvinu a natlač na dno formy s papierom (20 cm).
  - Náplň. Kešu, kokosové mlieko, olej, citrónovú šťavu a kôru a sirup mixuj 3–4 minúty úplne dohladka.
  - Nalej na korpus, uhlaď a daj do mrazničky na 4 hodiny.
  - 30 minút pred podávaním presuň do chladničky, aby zmäkol. Ozdob malinami.
tips:
  - Silný mixér je tu kľúčový – slabší nechaj pracovať dlhšie a s prestávkami.
