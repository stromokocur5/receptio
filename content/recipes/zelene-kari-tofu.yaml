title: Thajské zelené kari s tofu
description: Voňavé kokosové kari s chrumkavým tofu a brokolicou. Rýchlejšie ako donáška.
cuisine: thajska
meals: [obed, vecera]
time: 30
active: 20
servings: 4
difficulty: 2
tags: []
spicy: 2
keeps: { fridge: 3, freezer: 2 }
leftovers: 'Kari omáčku zamraz bez ryže, ryžu uvar čerstvú.'
ingredients:
  - ryza-jazminova: 300 g
  - tofu-natural: 400 g | na kocky, osušené
  - olej: 1 pl
  - zelena-kari-pasta: 3 pl
  - kokosove-mlieko: 1 ks
  - voda: 1/2 hrnček
  - brokolica: 1 ks | na ružičky
  - paprika-cervena: 1 ks | na prúžky
  - tamari: 1 pl
  - javorovy-sirup: 1 čl
  - limetka: 1 ks
  - bylinky-koriander: 2 pl
steps:
  - Uvar ryžu.
  - Tofu opeč na oleji dozlatista zo všetkých strán a daj bokom.
  - Na tú istú panvicu daj kari pastu a 1 minútu ju restuj, potom vlej kokosové mlieko a vodu.
  - Pridaj brokolicu a papriku a var 5 minút, zelenina má ostať chrumkavá.
  - Vráť tofu a dochuť tamari, sirupom a limetkou – rovnováha slaného, sladkého a kyslého je celé tajomstvo.
  - Podávaj s ryžou a koriandrom.
tips:
  - Tofu pred krájaním 15 minút zaťaž niečím ťažkým, vytlačíš vodu a bude chrumkavejšie.
variants:
  - name: S cícerom namiesto tofu
    description: 'Cícer netreba opekať, pridaj ho rovno do omáčky s brokolicou.'
    replace:
      - { from: tofu-natural, to: cicer-sterilizovany, amount: 2 ks }
