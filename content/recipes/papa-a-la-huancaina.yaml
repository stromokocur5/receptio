title: Papa a la huancaína
description: Peruánske zemiaky v krémovej žltej omáčke z kešu, papriky a čili. Vegánska verzia omáčky, ktorá je inak zo syra.
cuisine: peruanska
meals: [obed, vecera]
time: 35
active: 15
servings: 4
difficulty: 2
tags: []
ingredients:
  - zemiaky: 8 ks | menšie
  - kesu: 80 g | namočené 15 min vo vriacej vode
  - olej: 1 pl
  - paprika-cervena: 1 ks | ideálne žltá, nakrájaná
  - cibula: 1/2 ks
  - cesnak: 1 ks
  - cili: 1/2 čl | ideálne ají amarillo pasta
  - kurkuma: 1/2 čl | pre žltú farbu
  - sojove-mlieko: 1/2 hrnček
  - vyzivne-drozdie: 2 pl
  - limetka: 1 ks
  - sol: 1 čl
  - salat: 1/2 ks
steps:
  - Zemiaky uvar v šupke v osolenej vode do mäkka, ošúp a nakrájaj na hrubé plátky.
  - Na oleji 5 minút speň papriku, cibuľu, cesnak a čili.
  - Rozmixuj ich so scedenými kešu, kurkumou, mliekom, droždím, limetkou a soľou dohladka. Omáčka má byť hustá ako majonéza.
  - Na tanier daj listy šalátu, na ne zemiaky a štedro ich polej omáčkou.
tips:
  - Omáčka je výborná aj ako dip k zelenine alebo na cestoviny.
