title: Teriyaki šampiňóny s ryžou
description: Šampiňóny opečené dohneda a obalené v lesklej sladko-slanej teriyaki omáčke so zázvorom a cesnakom. S ryžou a sezamom za 25 minút.
cuisine: japonska
meals: [obed, vecera]
categories: [hlavne/ryza, hlavne/zelenina]
time: 25
active: 20
servings: 3
difficulty: 1
tags: [rychle, lacne, do-krabicky]
spicy: 0
keeps: { fridge: 3 }
leftovers: 'Prehrej s lyžicou vody, omáčka zhustne.'
ingredients:
  - ryza-jazminova: 250 g
  - sol: 1/2 čl | do ryže
  - olej: 2 pl
  - sampinony: 500 g | veľké na polovice, malé celé
  - cesnak: 2 ks | nasekaný
  - zazvor: 1 pl | nastrúhaný
  - sojova-omacka: 4 pl
  - javorovy-sirup: 2 pl
  - ryzovy-ocot: 1 pl
  - kukuricny-skrob: 1 čl
  - voda: 4 pl
  - sezam: 1 pl
  - jarna-cibulka: 2 ks | na kolieska
steps:
  - Uvar ryžu – prepláchni ju v site, zalej 375 ml vody, osoľ a priveď do varu. Prikry a na najmenšom ohni var 12 minút, potom odstav a nechaj 10 minút dôjsť pod pokrievkou.
  - Medzitým v miske zmiešaj sójovú omáčku, sirup, ocot, škrob a vodu.
  - Vo veľkej panvici rozohrej olej na veľkom ohni. Huby rozlož reznou stranou nadol a 4 minúty nemiešaj, potom ich opekaj ešte 4 minúty, kým nie sú zo všetkých strán hnedé.
  - Stiahni oheň, pridaj cesnak a zázvor a minútu miešaj.
  - Omáčku v miske premiešaj (škrob klesne ku dnu), vlej k hubám a 1–2 minúty prehadzuj, kým nezhustne a huby sa neleskú.
  - Podávaj na ryži posypané sezamom a jarnou cibuľkou.
tips:
  - Bezlepková verzia – tamari namiesto sójovej omáčky.
  - Hodí sa k tomu Šalát z čínskej kapusty so sezamovým dresingom.
