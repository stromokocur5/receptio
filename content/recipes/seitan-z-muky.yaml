title: Seitan z obyčajnej múky
description: Seitan bez kupovaného lepku – škrob z múky vyperieš vodou a ostane čistý lepok. Lacné, len to chce trpezlivosť.
cuisine: cinska
meals: [obed, vecera, domace]
categories: [domace/bielkoviny, hlavne/tofu]
time: 180
active: 45
servings: 4
difficulty: 3
nutrition: false
gf_swap: false
tags: [meal-prep, vela-bielkovin, lacne]
keeps: { fridge: 5, freezer: 3 }
related: [seitan]
ahead: 'Cesto musí hodinu odpočívať pod vodou, až potom sa perie.'
howto: [zvysky-z-domacej-vyroby]
ingredients:
  - hladka-muka: ~1 kg | najlepšie chlebová, má viac lepku
  - voda: 600 ml | do cesta
  - tamari: 3 pl
  - cesnak: 2 ks | prelisovaný
  - udena-paprika: 1 čl
  - zeleninovy-vyvar: ~6 hrnček | na dusenie
steps:
  - Múku zmiešaj s vodou a mies 5 minút na hladké tuhé cesto.
  - Cesto vlož do misy, zalej studenou vodou, aby bolo celé pod hladinou, a nechaj hodinu stáť. Lepok sa za ten čas spojí a pri praní sa nerozpadne.
  - V tej vode cesto stláčaj a miesi rukami. Voda zbelie od škrobu – vylej ju (alebo odlož, viď tip) a nalej novú.
  - Opakuj 8–10-krát, asi 20 minút, kým voda neostane takmer číra. Z cesta ostane pružná, šľachovitá hrudka okolo 300 g.
  - Hrudku vyžmýkaj, roztiahni a zamies do nej tamari, cesnak a papriku. Vytvaruj valček.
  - Vývar priveď do varu, stíš na minimum a seitan v ňom 45 minút jemne dus. Nesmie vrieť, inak bude hubovitý.
  - Nechaj vychladnúť vo vývare, potom nakrájaj a opeč na oleji dozlatista.
tips:
  - Prvú, najbielejšiu vodu nechaj odstáť – škrob si sadne na dno. Vodu zlej a škrob použi na zahustenie omáčky. Neskoršie vody s otrubami sa hodia do cesta na chlieb.
  - Zo 1 kg múky vyjde približne toľko bielkovín ako zo 100 g kupovaného lepku. Výživové hodnoty sa tu nepočítajú, lebo väčšina múky odíde s vodou – rátaj s podobnými ako pri seitane z lepku.
  - Je to čistý lepok – pri celiakii nie.
