title: Raňajkové burrito do mrazničky
description: Osem burrít s tofu praženicou, pečenými zemiakmi, čiernou fazuľou a špenátom. V nedeľu ich zabalíš, cez týždeň stačí jedno ráno vybrať z mrazničky – do školy či do roboty zasýti do obeda.
cuisine: mexicka
meals: [ranajky, obed]
categories: [ranajky/slane, hlavne/plnene]
time: 60
active: 40
servings: 8
difficulty: 2
tags: [meal-prep, do-krabicky, vela-bielkovin, ranajky, tortilla-na-tyzden]
spicy: 1
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Z mrazničky: rozbaľ z alobalu, nechaj v papieri a daj do mikrovlnky na 2 minúty, otoč a ešte 1–2 minúty. Alebo večer prelož do chladničky a ráno opeč na suchej panvici 3 minúty z každej strany. V alobale ide aj do rúry na 200 °C na 25 minút.'
related: [domace-psenicne-tortilly, tofu-prazenica-v-tortille, burrito-do-mraznicky]
ingredients:
  - zemiaky: 600 g
  - olej: 4 pl
  - udena-paprika: 2 čl
  - sol: 1,5 čl
  - cibula: 1 ks
  - paprika-cervena: 2 ks
  - tofu-natural: 400 g
  - kurkuma: 1/2 čl
  - kala-namak: 1 čl | alebo bežná soľ
  - sojove-mlieko: 3 pl
  - fazula-cierna: 1 ks
  - kmin: 1 čl
  - spenat: 100 g | čerstvý
  - psenicne-tortilly: 8 ks | veľké, alebo domáce
  - sriracha: 2 pl | nepovinné
steps:
  - Rúru rozpáľ na 220 °C, plech vystel papierom na pečenie. Zemiaky umy a nakrájaj na kocky 1 cm, šúpať ich netreba. Premiešaj s 2 PL oleja, 1 ČL údenej papriky a ½ ČL soli a peč 25 minút, v polovici premiešaj, kým nie sú zlaté.
  - Medzitým na 1 PL oleja na strednom ohni opeč nakrájanú cibuľu a papriku 5 minút.
  - Pridaj tofu rozdrobené rukami, kurkumu, kala namak, zvyšnú údenú papriku a mlieko a opekaj 5 minút, kým sa neodparí voda. Vmiešaj špenát a nechaj ho zvädnúť.
  - Fazuľu roztlač vidličkou s kmínom, zvyšným olejom a štipkou soli – drží plnku pokope a burrito sa nerozpadá.
  - Nechaj všetko vychladnúť aspoň 10 minút. Horúca plnka by v burrite zarosila a cez týždeň premočila tortillu.
  - Tortillu zohrej 10 sekúnd na suchej panvici, aby bola ohybná. Do stredu natri fazuľu, navrch daj zemiaky a tofu, pokvapkaj srirachou. Preklop spodok, zaviň boky a pevne zroluj.
  - Každé burrito zabaľ do papiera na pečenie a potom do alobalu alebo vrecka, napíš dátum a zamraz. Dve si nechaj v chladničke na najbližšie dni.
tips:
  - Kala namak je čierna soľ so sírovou vôňou – tofu chutí ako vajíčková praženica. Kúpiš ju v ázijských obchodoch a e-shopoch.
  - Do krabičky ho daj zohriate ráno zabalené v alobale – do obeda ostane vlažné. V škole či práci s mikrovlnkou ho môžeš vziať zamrazené.
  - Nedávaj dovnútra šalát, paradajky ani avokádo – pri mrazení zmäknú na kašu. Daj ich bokom do krabičky.
