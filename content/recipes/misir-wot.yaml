title: Misir wot
description: Etiópsky prívarok z červenej šošovice s berbere, pomaly dusenou cibuľou a hlbokou chuťou.
cuisine: etiopska
meals: [obed, vecera]
time: 45
active: 15
servings: 4
difficulty: 1
tags: [meal-prep, one-pot]
spicy: 3
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Rozrieď na polievku, alebo ho natri na hrianku s cibuľou.'
ingredients:
  - cibula: 3 ks | veľmi nadrobno
  - olej: 3 pl
  - cesnak: 4 ks
  - zazvor: 1 pl | nastrúhaný
  - berbere: 2 pl
  - paradajkovy-pretlak: 2 pl
  - sosovica-cervena: 250 g | prepláchnutá
  - voda: 4 hrnček
  - sol: 1 čl
  - ryza-basmati: 300 g | alebo injera zo 100 % teffu
steps:
  - Cibuľu praž v suchom hrnci na strednom ohni 5 minút za stáleho miešania – tak sa robí etiópsky základ. Potom pridaj olej a opekaj ďalších 10 minút do hneda.
  - Pridaj cesnak, zázvor, berbere a pretlak a 2 minúty restuj.
  - Pridaj šošovicu, vodu a soľ a var na miernom ohni 25 minút, kým nie je hustá a krémová. Podlievaj podľa potreby.
  - Podávaj s ryžou alebo injerou.
tips:
  - Berbere zoženieš v ázijských potravinách alebo online. Náhrada je sladká paprika, čili, škorica, zázvor a štipka klinčekov.
