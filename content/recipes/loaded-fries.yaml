title: Loaded fries s nacho omáčkou a fazuľou
description: Plech hranoliek zaliaty syrovou omáčkou z kešu a zemiakov, s pikantnou fazuľou, jalapeňom a jarnou cibuľkou. Na film alebo zápas.
cuisine: americka
meals: [vecera, snack]
categories: [comfort/vyprazane, snacky/party, prilohy/prilohy]
time: 55
active: 20
servings: 4
difficulty: 1
tags: [party]
spicy: 2
keeps: { fridge: 1 }
related: [hranolky-z-rury, nacho-syrova-omacka]
ingredients:
  - zemiaky: 6 ks
  - olej: 3 pl
  - sol: 1 čl
  - kesu: 1/2 hrnček | namočené 15 min v horúcej vode
  - vyzivne-drozdie: 3 pl
  - sladka-paprika: 1 čl
  - kurkuma: 1/4 čl
  - cesnak: 1 ks
  - citron: 1 pl
  - voda: 3/4 hrnček
  - fazula-cierna: 1 ks | plechovka, scedená
  - kmin: 1/2 čl
  - udena-paprika: 1/2 čl
  - cili-papricka: 1 ks | alebo nakladané jalapeño
  - jarna-cibulka: 3 ks
  - paradajky: 1 ks
steps:
  - Rúru predhrej na 230 °C. Zemiaky nakrájaj na hranolky hrubé 1 cm, namoč na 20 minút do studenej vody a dôkladne osuš. Premiešaj ich s 2 PL oleja a polovicou soli a peč na plechu s papierom v jednej vrstve 30–35 minút, v polovici otoč.
  - Omáčka. Scedené kešu rozmixuj s droždím, paprikou, kurkumou, cesnakom, citrónom, vodou a štipkou soli dohladka. Zohrej v hrnci na miernom ohni, kým nezhustne.
  - Fazuľu opeč na zvyšnom oleji s kmínom a údenou paprikou 4 minúty, trochu ju roztlač.
  - Hranolky nechaj na plechu, polej omáčkou, posyp fazuľou, nakrájanou papričkou, paradajkou a cibuľkou.
  - Jedz hneď, priamo z plechu.
