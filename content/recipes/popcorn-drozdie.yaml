title: Popcorn s výživným droždím
description: Domáci popcorn z hrnca, posypaný droždím so „syrovou“ chuťou. Na film, lacnejší ako z mikrovlnky.
cuisine: americka
meals: [snack]
categories: [snacky/slane, snacky/party]
time: 10
active: 10
servings: 3
difficulty: 1
tags: [rychle, lacne, deti, party]
ingredients:
  - olej: 2 pl
  - popcorn: 1/2 hrnček
  - vyzivne-drozdie: 2 pl
  - sol: 1/2 čl | jemná
  - udena-paprika: 1/2 čl | voliteľne
steps:
  - Vo veľkom hrnci rozohrej olej s 3 zrnami. Keď prasknú, pridaj zvyšok zŕn, prikry a stiahni na 30 sekúnd z ohňa – zrná sa rovnomerne zohrejú.
  - Vráť na stredný oheň a občas hrncom zatras. Keď pukanie spomalí na 2–3 sekundy medzi puknutiami, stiahni z ohňa.
  - Hneď premiešaj s droždím, soľou a paprikou, aby sa prichytili na teplý popcorn.
tips:
  - Najjemnejšia soľ (rozdrvená v mažiari) drží lepšie ako hrubá.
  - Sladká verzia – škorica a pár lyžičiek práškového cukru.
