title: Obložené chlebíčky
description: Veka natretá vlašským šalátom, navrch plátky klobásy alebo údeného tofu, tofu „vajíčko“, kyslá uhorka, paprika a petržlen. Na oslavy ako za starých čias.
cuisine: slovenska
meals: [ranajky, vecera, snack]
categories: [snacky/party, ranajky/slane]
time: 30
active: 30
servings: 6
difficulty: 1
tags: [party, klasika, bez-varenia]
ahead: Vlašský šalát a klobásu priprav deň vopred.
keeps: { fridge: 1 }
related: [vlassky-salat, pikantna-klobasa, vajickova-natierka-tofu]
ingredients:
  - bageta: 2 ks | veka, nakrájaná šikmo na 18 plátkov
  - veganska-majoneza: 2 pl | na zlepenie
  - zemiaky: 2 ks | na vlašský šalát
  - kysle-uhorky: 4 ks
  - hrasok: 1/2 hrnček
  - tofu-udene: 180 g | alebo plátky pikantnej klobásy
  - tofu-natural: 150 g
  - kurkuma: 1/4 čl
  - kala-namak: 1/2 čl | voňa po vajíčku
  - paprika-cervena: 1 ks
  - paradajky: 2 ks | cherry alebo malé
  - petrzlenova-vnat: 3 pl
  - pazitka: 2 pl
steps:
  - Sprav vlašský šalát podľa receptu (zemiaky, hrášok, uhorky a majonéza).
  - Tofu „vajíčko“. Prírodné tofu nakrájaj na hrubé plátky, lyžičkou v každom vyhĺb plytkú jamku a potri ju kurkumou rozmiešanou s kvapkou vody. Žltý stred vyzerá ako vajce natvrdo. Posyp kala namak – tá dá vajíčkovú vôňu.
  - Plátky veky natri hrubou vrstvou vlašského šalátu.
  - Navrch polož zvlnený plátok údeného tofu alebo klobásy, tofu vajíčko, kolieska uhorky, pásik papriky a kúsok paradajky.
  - Ozdob petržlenom a pažítkou. Nechaj 30 minút v chladničke prikryté fóliou, veka zmäkne a chute sa spoja.
