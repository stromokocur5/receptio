title: Obložené chlebíčky
description: Veka natretá vlašským šalátom, navrch plátky klobásy alebo údeného tofu, tofu „vajíčko“, kyslá uhorka, paprika a petržlen. Na oslavy ako za starých čias.
cuisine: slovenska
meals: [ranajky, vecera, snack]
categories: [comfort/bufet, snacky/party, ranajky/slane]
time: 100
active: 40
servings: 6
difficulty: 1
tags: [party, klasika]
ahead: Vlašský šalát sprav deň vopred – do rána sa chute spoja.
keeps: { fridge: 1 }
related: [vlassky-salat, pikantna-klobasa, vajickova-natierka-tofu]
ingredients:
  - bageta: 2 ks | veka, nakrájaná šikmo na 18 plátkov
  - zemiaky: 2 ks
  - mrkva: 1 ks
  - hrasok: 1/2 hrnček | mrazený
  - kysle-uhorky: 4 ks
  - veganska-majoneza: 6 pl
  - horcica: 1 čl
  - citron: 1 čl
  - sol: 1/2 čl
  - cierne-korenie: 1 štipka
  - tofu-udene: 180 g | alebo plátky pikantnej klobásy
  - tofu-natural: 150 g
  - kurkuma: 1/4 čl
  - kala-namak: 1/2 čl | vôňa po vajíčku
  - paprika-cervena: 1 ks
  - paradajky: 100 g | cherry alebo malé
  - petrzlenova-vnat: 3 pl
  - pazitka: 2 pl
steps:
  - Zemiaky v šupke a ošúpanú mrkvu daj variť do osolenej vody. Mrkvu vyber po 15 minútach, zemiaky po 20–25. Hrášok povar 2 minúty a sceď. Všetko nechaj vychladnúť.
  - Vlašský šalát. Zemiaky ošúp a spolu s mrkvou a 2 uhorkami nakrájaj na drobné kocky. Pridaj hrášok.
  - Majonézu zmiešaj s horčicou, citrónom, soľou a korením, premiešaj so zeleninou a daj aspoň na hodinu do chladničky.
  - Tofu „vajíčko“. Prírodné tofu nakrájaj na hrubé plátky, lyžičkou v každom vyhĺb plytkú jamku a potri ju kurkumou rozmiešanou s kvapkou vody. Posyp kala namak – tá dá vajíčkovú vôňu.
  - Údené tofu nakrájaj na tenké plátky, zvyšné uhorky na kolieska a papriku na pásiky.
  - Plátky veky natri hrubou vrstvou vlašského šalátu.
  - Navrch polož zvlnený plátok údeného tofu, tofu vajíčko, kolieska uhorky, pásik papriky a kúsok paradajky.
  - Ozdob petržlenom a pažítkou. Nechaj 30 minút v chladničke prikryté fóliou, veka zmäkne a chute sa spoja.
