title: Hranolky, cuketa so syrovou omáčkou a šalát – poriadne
description: Klasický tanier – hranolky, opečená cuketa so syrom, paradajky a šalát – urobený tak, aby nič nebolo bledé ani mdlé. Hranolky chrumkajú a voňajú cesnakom, cuketa je do hneda, omáčka sa ťahá a šalát má dresing. Plus fazuľa, nech to aj zasýti.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/zelenina, comfort/vyprazane]
time: 45
active: 35
servings: 2
difficulty: 2
tags: [zlatica]
ingredients:
  - zemiaky: 4 ks | 3 na hranolky (múčnaté), 1 do omáčky
  - sol: ~1 pl | do vody na hranolky
  - ocot: ~1 pl | do vody na hranolky
  - olej: 2 pl | 1 na hranolky, 1 na cuketu
  - kukuricny-skrob: 1 čl
  - cuketa: 1 ks
  - mrkva: 1 ks
  - voda: 500 ml | na zemiak a mrkvu do omáčky
  - olivovy-olej: 3 pl | 2 do omáčky, 1 do dresingu a na fazuľu
  - cesnak: 3 ks
  - horcica: 1,5 čl | 1 do omáčky, 1/2 do dresingu
  - citron: 1 ks | šťava
  - udena-paprika: 1 čl
  - sol: 1 čl | na cuketu, do omáčky, na hranolky a paradajky
  - fazula-biela: 1 ks | plechovka
  - paradajky: 2 ks
  - salat: 150 g | ľadový
  - petrzlenova-vnat: 2 pl
  - cierne-korenie: 1 štipka
steps:
  - Cuketu nakrájaj na kolieska hrubé 1,5 cm, rozlož na utierku a posyp štipkou soli. Paradajky nakrájaj, daj do sitka nad misku a tiež posoľ. Obe nechaj púšťať vodu, kým robíš ostatné – vodnatá zelenina je dôvod, prečo býva tanier bledý a mokrý.
  - Tri zemiaky na hranolky ošúp, nakrájaj na hranolky hrubé 1 cm, daj do studenej vody s 1 PL soli a 1 PL octu, priveď do varu a var 3–4 minúty. Sceď a rozlož na utierku vyparovať. Do toho istého hrnca daj 500 ml vody, štvrtý zemiak a mrkvu nakrájané na malé kocky a var 10–12 minút do mäkka.
  - Air fryer predhrej na 200 °C. Suché hranolky premiešaj s 1 PL oleja a so škrobom a peč 18–22 minút, každých 6 minút pretras. (V rúre 30 minút na 230 °C.)
  - Fazuľu sceď, prepláchni a zmiešaj s polovicou citrónovej šťavy, 1 ČL olivového oleja, 1 prelisovaným strúčikom cesnaku a štipkou soli. Nechaj nasiaknuť.
  - Cuketu osuš z oboch strán. Na panvici rozohrej 1 PL oleja na vysokom ohni a kolieska opekaj v jednej vrstve 3–4 minúty bez hýbania, otoč a opeč ďalšie 3 minúty, kým nie sú tmavozlaté.
  - Omáčka – zemiak s mrkvou sceď, odlož si 100 ml vody z varenia. Rozmixuj ich s 2 PL olivového oleja, 1 strúčikom cesnaku, 1 ČL horčice, 1 PL citrónovej šťavy, 1/4 ČL soli, polovicou údenej papriky a vodou z varenia dohladka.
  - Dresing – v miske zmiešaj 1 PL šťavy z paradajok, zvyšok citrónu a 1/2 ČL horčice a zašľahaj zvyšný olivový olej. Šalát natrhaj, osuš a premiešaj s dresingom, pridaj paradajky.
  - Horúce hranolky vysyp do misky s posledným prelisovaným strúčikom cesnaku, vňaťou, zvyškom údenej papriky a štipkou soli a premiešaj. Na tanier daj hranolky, cuketu polej syrovou omáčkou, vedľa šalát s paradajkami a fazuľou.
tips:
  - Poradie je dôležité – všetko, čo púšťa vodu, nasoľ hneď na začiatku. Kým sa hranolky pečú, zelenina je pripravená.
  - Ak nemáš air fryer, upeč hranolky v rúre a cuketu rob, kým sú v rúre posledných 10 minút.
