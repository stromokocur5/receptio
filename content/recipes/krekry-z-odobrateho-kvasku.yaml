title: Krekry z odobratého kvásku
description: Tenké chrumkavé krekry z kvásku, ktorý pri kŕmení ide preč, s rozmarínom a hrubou soľou. Plech za týždeň nazbieraného kvásku, ktoré vydržia dva týždne.
cuisine: moderna
meals: [snack]
categories: [snacky/slane]
time: 50
active: 15
servings: 6
difficulty: 1
tags: [zvysky, lacne, do-krabicky]
spicy: 0
gf_swap: false
keeps: { fridge: 14 }
related: [semienkove-krekry]
ingredients:
  - kvasok-odobraty: 200 g
  - hladka-muka: 100 g
  - olivovy-olej: 3 pl
  - sol: 1 čl | časť hrubá navrch
  - rozmarin: 1 ks | ihličie nasekané
  - sezam: 2 pl
steps:
  - Rúru predhrej na 170 °C. Kvások zmiešaj s múkou, 2 PL oleja, 1/2 ČL soli a rozmarínom na tuhé cesto, ktoré sa nelepí. Ak lepí, pridaj múku po lyžici.
  - Cesto rozvaľkaj priamo na papieri na pečenie čo najtenšie, asi na 2 mm. Čím tenšie, tým chrumkavejšie.
  - Potri zvyšným olejom, posyp sezamom a hrubou soľou a zľahka pritlač valčekom. Nožom alebo radielkom nakrájaj na štvorce, nemusíš ich rozdeľovať.
  - Peč 25–30 minút, kým nie sú zlatohnedé aj v strede. Krajné hnednú skôr – ak sú hotové, vyber ich a zvyšok dopeč.
  - Nechaj vychladnúť na plechu, až potom chrumkajú. Polám pozdĺž rezov.
tips:
  - Mäkké v strede? Vráť ich na 5–10 minút do rúry vypnutej po pečení.
  - Skús aj s rascou, údenou paprikou alebo nasekanými olivami.
