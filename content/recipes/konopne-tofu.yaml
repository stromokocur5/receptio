title: Konopné tofu
description: Tofu bez sóje z lúpaných konopných semienok, zrazené ako to sójové. Je drobivejšie, zelenkavé a orieškové – skôr ako paneer či ricotta. Pre tých, čo sóju nejedia, a pre zvedavých.
cuisine: moderna
meals: [domace]
categories: [domace/bielkoviny]
time: 60
active: 30
servings: 3
difficulty: 3
tags: [urob-si-sam]
nutrition: false
yields: cca 200–250 g tofu (podľa semienok)
related: [domace-tofu, sanske-tofu, hrachove-tofu]
keeps: { fridge: 4, freezer: 3 }
ingredients:
  - konopne-semienka: 200 g | lúpané
  - voda: 1,1 l
  - nigari: 1,5 čl | rozpustené v 100 ml teplej vody
steps:
  - Semienka rozmixuj s 1 litrom vody 2 minúty na hladké mlieko.
  - Prelej ho cez jemnú utierku do hrnca a dobre vytlač. Z lúpaných semienok zostane len trocha dužiny.
  - Mlieko zohrievaj na strednom ohni a miešaj dno, kým sa pri okraji neobjavia prvé bublinky (asi 90 °C). Nenechaj ho prudko vrieť, pení a vykypí.
  - Odstav a počkaj 2 minúty. Polovicu roztoku nigari vlej za pomalého miešania do tvaru osmičky, potom prestaň miešať. Zvyšok nalej po povrchu a prikry.
  - Po 10 minútach by sa mali oddeliť hrudky od nazelenalej srvátky. Ak je srvátka ešte mliečna, postav hrniec na 2–3 minúty na najmenší oheň bez miešania.
  - Hrudky opatrne naber do cedidla vystlaného utierkou, prelož utierku a zaťaž hrncom s vodou (asi 1 kilogram).
  - Lisuj 20–30 minút. Potom ho vlož na 10 minút do studenej vody, nech stuhne.
tips:
  - Ak sa mlieko nezráža ani po zohriatí, pridaj 1–2 lyžice citrónovej šťavy. Tofu bude jemne kyslé.
  - Na opekanie je krehkejšie ako sójové – krájaj hrubšie kocky a obracaj ich opatrne. Najlepšie je rozdrobené do praženice, plnky alebo nátierky.
  - Konopné semienka sú drahšie ako sója a výťažok je menší. Ide o tofu pre tých, čo sóju nemôžu, nie o úsporu.
  - Skladuj ponorené vo vode v chladničke, vodu vymieňaj denne.
