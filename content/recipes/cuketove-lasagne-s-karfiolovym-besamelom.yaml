title: Cuketové lasagne s karfiolovým bešamelom
description: Lasagne bez cestovín – namiesto plátov opečené plátky cukety, medzi nimi hustá paradajková omáčka z čerstvých paradajok a krémový karfiolový bešamel s horčicou a cesnakom. Navrch zapečená kôrka. Bezlepkové z toho, čo je doma.
cuisine: talianska
meals: [obed, vecera]
categories: [hlavne/rura, hlavne/zelenina]
time: 75
active: 40
servings: 4
difficulty: 2
tags: [zlatica, meal-prep]
keeps: { fridge: 3 }
leftovers: 'Na druhý deň sa krája ešte lepšie. Prehrej v rúre na 180 °C 15 minút.'
ingredients:
  - cuketa: 3 ks | veľké, rovné
  - sol: 2 čl | 1/2 na cuketu
  - olivovy-olej: 5 pl | 2 na cuketu, 2 do omáčky, 1 do bešamelu
  - cibula: 1 ks
  - cesnak: 5 ks
  - paradajky: 8 ks | zrelé, asi 1 kg
  - paradajkovy-pretlak: 2 pl
  - oregano: 1 čl
  - cukor: 1 čl
  - karfiol: 1/2 ks
  - zemiaky: 1 ks | stredný
  - voda: 600 ml | na karfiol, z nej 150 ml do bešamelu
  - horcica: 1 pl
  - citron: 1 pl
  - kurkuma: 1 štipka
  - bazalka: 2 pl | alebo petržlenová vňať
  - cierne-korenie: 1/2 čl
steps:
  - Cukety nakrájaj pozdĺžne na plátky hrubé 5 mm. Rozlož ich na utierky, posyp 1/2 ČL soli a nechaj 15 minút. Medzitým predhrej rúru na 220 °C.
  - Omáčka – cibuľu nakrájaj nadrobno a v hrnci ju restuj na 2 PL oleja na strednom ohni 5 minút. Pridaj 3 prelisované strúčiky cesnaku a pretlak a miešaj 2 minúty. Paradajky nakrájaj na kocky, pridaj s oreganom, cukrom a 1/2 ČL soli a var bez pokrievky 25 minút, kým nie je omáčka hustá ako kečup. Riedka omáčka by z lasagní urobila polievku.
  - Bešamel – karfiol a zemiak nakrájaj nadrobno a var v 600 ml vody s 1/2 ČL soli 12 minút do mäkka. Sceď, odlož 150 ml vody. Rozmixuj s 1 PL oleja, 2 strúčikmi cesnaku, horčicou, citrónom, kurkumou a vodou z varenia, kým nie je hladký a hustý ako jogurt. Ochutnaj, má byť výrazný.
  - Cuketové plátky osuš z oboch strán, ulož na plech s papierom, potri 2 PL oleja a peč 12 minút, kým nezmäknú a nezačnú hnednúť. Upečené pustia vodu na plech, nie do lasagní.
  - Do zapekacej misy (asi 20 × 30 cm) daj tenkú vrstvu omáčky, na ňu vrstvu cukety, omáčku a trochu bešamelu. Opakuj, kým nemíňaš všetko. Navrch daj zvyšok bešamelu a korenie.
  - Stíš rúru na 200 °C a peč 25 minút, kým vrch nemá zlaté škvrny a okraje bublajú. Nechaj aspoň 10 minút odpočinúť, inak sa rozpadnú. Posyp bazalkou.
tips:
  - Ku každej porcii sa hodí veľký ľadový šalát s horčicovým dresingom.
