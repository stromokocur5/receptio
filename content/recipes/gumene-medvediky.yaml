title: Gumení medvedíci z ovocnej šťavy
description: Domáce želé cukríky z muštu a agaru namiesto želatíny. Tuhnú za štvrť hodinu a farbu aj chuť im dáš akou šťavou chceš.
cuisine: moderna
meals: [snack, dezert]
categories: [snacky/sladke, dezerty/nepecene]
time: 30
active: 15
servings: 4
difficulty: 1
tags: [deti, party, lacne]
spicy: 0
keeps: { fridge: 5, freezer: 0 }
yields: asi 60 malých medvedíkov
related: [mrazene-hrozno, chia-dzem]
ingredients:
  - jablkovy-must: 200 ml | alebo iná 100 % šťava
  - agar: 2 čl | prášok, nie vločky
  - javorovy-sirup: 2 pl
  - citron: 1 pl | šťava
steps:
  - Silikónové formičky polož na tácku alebo dosku, aby sa dali preniesť. Priprav si kvapkadlo alebo malú lyžičku.
  - V malom hrnci rozšľahaj za studena mušt, sirup, citrónovú šťavu a agar, aby neostali hrudky.
  - Priveď do varu a za stáleho miešania var na miernom ohni 2 minúty. Agar musí naozaj vrieť, inak nestuhne.
  - Hneď plň formičky – agar tuhne už pri 40 °C. Ak ti v hrnci začne tuhnúť, krátko ho zohrej.
  - Daj na 15–20 minút do chladničky a medvedíkov vyklop.
tips:
  - Agarové cukríky sú pevné a krehké, pri zahryznutí sa zlomia. Žuvacie ako z obchodu nebudú – to robí želatína. Žuvacejšie sú, keď ich necháš deň odkryté schnúť na mriežke.
  - Farby – malinová alebo višňová šťava na červené, pomarančová na oranžové, mušt s lyžičkou matche na zelené.
  - Kyslí medvedíci – tesne pred jedlom ich obaľ v cukre s nastrúhanou citrónovou kôrou. Vopred nie, cukor z nich vytiahne vodu.
  - Bez formičiek nalej hmotu na tanier do výšky 1 cm a po stuhnutí nakrájaj na kocky.
