title: Cuketové hranolky v kukuričnej kruste s cesnakovým dipom
description: Cuketa nasolená a osušená, obalená v kukuričnej krupici s údenou paprikou a upečená do chrumkava. K tomu krémový dip z bielej fazule s cesnakom a citrónom.
cuisine: moderna
meals: [snack, vecera]
categories: [snacky/slane, prilohy/prilohy]
time: 40
active: 20
servings: 2
difficulty: 1
tags: [zlatica, party]
ingredients:
  - cuketa: 2 ks
  - sol: 1 čl | 1/2 na cuketu, 1/2 do obalu a dipu
  - kukuricny-skrob: 2 pl
  - voda: 5 pl | 3 do škrobu, 2 do dipu
  - kukuricna-krupica: 80 g | jemná
  - udena-paprika: 1 čl
  - cierne-korenie: 1/2 čl
  - olej: 2 pl
  - fazula-biela: 1/2 ks | pol plechovky
  - cesnak: 1 ks
  - citron: 1 pl
  - olivovy-olej: 1 pl
  - kopor: 1 pl
steps:
  - Rúru predhrej na 220 °C (air fryer na 200 °C). Cuketu nakrájaj na hranolky hrubé 1,5 cm, posyp 1/2 ČL soli a nechaj 10 minút na utierke. Potom ich dôkladne osuš. Cuketa je z 95 % voda – bez soli a sušenia by krusta odpadla a cuketa vnútri zvodnatela.
  - V jednej miske rozmiešaj škrob s 3 PL vody na riedke „lepidlo“. V druhej zmiešaj krupicu, údenú papriku, korenie a 1/4 ČL soli.
  - Každý hranolček namoč v škrobe, nechaj odkvapkať a obaľ v krupici. Ukladaj na plech s papierom s medzerami, pokvapkaj olejom.
  - Peč 20–22 minút, v polovici otoč, kým nie sú zlaté a chrumkavé. V air fryeri 12–14 minút, v dvoch dávkach.
  - Medzitým rozmixuj alebo roztlač fazuľu s cesnakom, citrónom, olivovým olejom, 2 PL vody a štipkou soli dohladka. Vmiešaj kôpor.
  - Hranolky podávaj hneď, kým chrumkajú, s dipom.
tips:
  - Škrobový obal drží lepšie ako vajce a je bezlepkový.
