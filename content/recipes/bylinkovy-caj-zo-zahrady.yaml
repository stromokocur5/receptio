title: Bylinkový čaj zo záhradky
description: Čerstvá mäta, medovka a tymián z balkóna zaliate horúcou vodou. Letný aj zimný čaj zadarmo.
cuisine: slovenska
meals: [snack]
categories: [napoje/teple]
time: 10
active: 3
servings: 4
difficulty: 1
tags: [rychle, lacne]
nutrition: false
ingredients:
  - bylinky-mata: 4 pl | lístky a vrcholčeky
  - tymian: 1 čl | alebo 2 vetvičky čerstvého
  - citron: 1/2 ks | plátky
  - voda: 1 l
  - javorovy-sirup: 1 pl | voliteľne
steps:
  - Bylinky opláchni a v dlaniach jemne pomnúc, aby pustili vôňu.
  - Zalej vodou tesne po zovretí (90 °C), prikry a nechaj 5–7 minút lúhovať.
  - Preceď, pridaj citrón a podľa chuti sirup.
tips:
  - Medovka, šalvia, lipový kvet, materina dúška aj levanduľa – skombinuj, čo rastie.
  - V lete vychladený s ľadom je z neho bylinkový ice tea.
  - Bylinky na zimu usuš vo zväzkoch – návod v článku Sušenie.
