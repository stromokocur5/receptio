title: Paradajky plnené ryžou so zemiakmi z rúry
description: Veľké paradajky vydlabané a plnené ryžou, ktorá sa varí v ich vlastnej šťave s cesnakom, cibuľou a vňaťou. Pečú sa v jednom pekáči so zemiakmi, ktoré nasajú šťavu a navrchu zhnednú.
cuisine: grecka
meals: [obed, vecera]
categories: [hlavne/rura, hlavne/plnene]
time: 80
active: 25
servings: 3
difficulty: 2
tags: [zlatica, meal-prep]
keeps: { fridge: 3 }
leftovers: 'Studené aj vlažné sú výborné, na druhý deň ešte lepšie.'
ingredients:
  - paradajky: 8 ks | veľké, pevné
  - sol: 1,5 čl
  - cukor: 1/2 čl
  - olivovy-olej: 5 pl
  - cibula: 1 ks
  - cesnak: 3 ks
  - ryza-basmati: 150 g
  - cuketa: 1/2 ks | nastrúhaná
  - petrzlenova-vnat: 4 pl
  - bylinky-mata: 1 pl | nepovinné
  - cierne-korenie: 1/2 čl
  - zemiaky: 4 ks
steps:
  - Rúru predhrej na 190 °C. Paradajkám odrež vrchný „klobúčik“ a odlož ho. Lyžičkou vydlabaj dužinu do misky, steny nechaj hrubé asi 1 cm. Vnútro paradajok posyp štipkou soli a cukru a obráť ich dnom hore na odkvapkanie.
  - Vydlabanú dužinu rozmixuj alebo nasekaj nadrobno. Nastrúhanú cuketu stlač v hrsti, nech pustí vodu.
  - Na panvici rozohrej 2 PL oleja a nadrobno nakrájanú cibuľu restuj 5 minút na strednom ohni, pridaj prelisovaný cesnak a cuketu a 2 minúty miešaj. Pridaj prepláchnutú ryžu a polovicu paradajkovej dužiny, 1 ČL soli a korenie a var 5 minút, kým ryža nenasaje časť šťavy. Odstav, vmiešaj vňať a mätu. Ryža je ešte tvrdá – dovarí sa v rúre v paradajke.
  - Paradajky ulož do pekáča, naplň ich do troch štvrtín (ryža napučí) a prikry klobúčikmi. Zemiaky ošúp, nakrájaj na mesiačiky a ulož medzi paradajky. Zemiaky posoľ zvyškom soli.
  - Zvyšok dužiny vlej medzi zemiaky a všetko polej 3 PL oleja.
  - Peč 50–60 minút. Ak by vrch tmavol príliš skoro, prikry alobalom. Hotové je, keď je ryža mäkká, zemiaky prepichneš a navrchu majú hnedé okraje. Nechaj 10 minút postáť. Podávaj s uhorkovým šalátom.
tips:
  - Šťava na dne pekáča je najlepšia časť – podávaj ju lyžicou na zemiaky.
