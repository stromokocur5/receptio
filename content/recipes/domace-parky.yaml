title: Domáce párky
description: Jemné rastlinné párky zo seitanu a bielej fazule, dusené v alobale. Do rožka, do fazuľovej polievky aj na hot dog.
cuisine: slovenska
meals: [obed, vecera, domace]
categories: [domace/bielkoviny, hlavne/tofu]
time: 60
active: 20
servings: 5
difficulty: 2
tags: [vela-bielkovin, meal-prep, urob-si-sam, deti]
yields: 10 párkov
keeps: { fridge: 5, freezer: 3 }
leftovers: 'Zamraz po jednom, rozmraz v horúcej vode.'
related: [parky-v-rozku, hot-dog-mrkva, grilovacie-klobasky]
ingredients:
  - fazula-biela: 1 ks | plechovka, scedená
  - lepok-vital: 150 g
  - vyzivne-drozdie: 2 pl
  - sladka-paprika: 2 čl
  - udena-paprika: 1 čl
  - cesnak: 2 ks | prelisovaný
  - cibula: 1/4 ks | nastrúhaná
  - muskatovy-orech: 1/4 čl
  - koriander-mlety: 1/2 čl
  - cierne-korenie: 1/2 čl
  - tekuty-dym: 1/2 čl
  - sol: 1 čl
  - sojova-omacka: 1 pl
  - olej: 2 pl
  - voda: 100 ml
steps:
  - Fazuľu rozmixuj dohladka s vodou, olejom, sójovou omáčkou, cesnakom, cibuľou a dymom.
  - Lepok zmiešaj s droždím, koreninami a soľou. Vlej fazuľovú zmes a mies 2 minúty na hladké cesto.
  - Rozdeľ na 10 kúskov a každý vyvaľkaj na tenký valček dlhý ako párok.
  - Každý pevne zabaľ do kúska alobalu a konce zatoč ako cukrík. Párok sa pri varení roztiahne, nebaľ ho úplne natesno.
  - Duste na pare nad vriacou vodou 35 minút.
  - Nechaj vychladnúť v alobale, potom rozbaľ. Pred jedlom ohrej 5 minút v horúcej (nie vriacej) vode alebo opeč.
tips:
  - Po vychladnutí v chladničke stuhnú a budú pevnejšie – najlepšie sú na druhý deň.
  - Obsahujú lepok.
