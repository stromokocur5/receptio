title: Krúpové rizoto so šampiňónmi a hráškom
description: Krémové „rizoto“ z lacných krúp namiesto drahej ryže. Netreba ho stále miešať, krúpy sa varia samé a dobre opečené šampiňóny mu dajú hlbokú chuť.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/ryza]
time: 60
active: 20
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, meal-prep]
keeps: { fridge: 3 }
ingredients:
  - krupy: 450 g
  - olej: 3 pl
  - sampinony: 500 g
  - cibula: 2 ks
  - mrkva: 2 ks
  - cesnak: 3 ks
  - zeleninovy-vyvar: 1,8 l
  - tymian: 1 čl
  - hrasok: 300 g | mrazený
  - vyzivne-drozdie: 3 pl
  - citron: 1 pl | šťava
  - sol: podľa chuti
  - cierne-korenie: 1/4 čl
  - petrzlenova-vnat: 3 pl | nasekaná
steps:
  - Krúpy prepláchni v sitku, kým voda nie je číra. Šampiňóny nakrájaj na plátky, cibuľu nadrobno, mrkvu na malé kocky.
  - V širokom hrnci zohrej lyžicu oleja na silnom ohni. Šampiňóny opekaj 6–7 minút, kým nepustia vodu a nezhnednú. Vyber ich na tanier.
  - Stíš na stredný oheň a do toho istého hrnca daj zvyšný olej, cibuľu a mrkvu. Opekaj 5 minút. Pridaj prelisovaný cesnak a krúpy a miešaj 2 minúty.
  - Zalej vývarom, pridaj tymian a priveď do varu. Stíš na mierny oheň a var prikryté 40 minút. Každých 10 minút premiešaj aj pri dne.
  - Keď sú krúpy mäkké a rizoto krémové, vráť šampiňóny a pridaj hrášok. Var ešte 5 minút.
  - Vmiešaj droždie, citrónovú šťavu a korenie, ochutnaj soľ (vývar už je slaný) a posyp vňaťou.
tips:
  - Ak sa tekutina vyvarí skôr, ako sú krúpy mäkké, prilej pohár horúcej vody.
