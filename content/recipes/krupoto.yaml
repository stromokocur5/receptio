title: Krupoto s hubami
description: Krémové „rizoto“ z jačmenných krúp so šampiňónmi, tymianom a hlivou. Najlacnejšie domáce obilie v hlavnej úlohe.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/ryza]
time: 50
active: 25
servings: 4
difficulty: 1
tags: [lacne, one-pot, meal-prep]
spicy: 0
keeps: { fridge: 4, freezer: 2 }
ingredients:
  - olej: 3 pl
  - cibula: 1 ks
  - cesnak: 2 ks
  - sampinony: 3 hrnček | na plátky
  - hliva: 200 g
  - tymian: 1 čl
  - krupy: 250 g
  - zeleninovy-vyvar: 1,2 l | horúci
  - vyzivne-drozdie: 3 pl
  - rastlinne-maslo: 20 g
  - petrzlenova-vnat: 3 pl
  - sol: 1/2 čl
  - cierne-korenie: 1/4 čl
steps:
  - Na oleji na strednom ohni opeč huby dozlatista, polovicu odlož.
  - Pridaj cibuľu, cesnak a tymian a 4 minúty speň, potom krúpy a minútu praž.
  - Postupne prilievaj vývar po naberačkách a na miernom ohni miešaj, kým krúpy nezmäknú a nie sú krémové (35–40 minút).
  - Vmiešaj droždie, maslo, odložené huby a petržlen, osoľ a okoreň.
