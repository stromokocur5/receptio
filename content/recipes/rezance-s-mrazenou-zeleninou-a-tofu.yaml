title: Ryžové rezance s mrazenou zeleninou a tofu
description: Wok z vrecka mrazenej zeleniny, chrumkavé tofu a sladko-slaná omáčka. Celé za pol hodiny, zo zásob v mrazničke a špajzi.
cuisine: cinska
meals: [obed, vecera]
categories: [hlavne/cestoviny, hlavne/tofu]
time: 30
active: 20
servings: 4
difficulty: 1
tags: [rychle, vela-bielkovin, do-krabicky]
spicy: 0
keeps: { fridge: 3 }
leftovers: 'Studené ako rezancový šalát, alebo prehrej na panvici s lyžicou vody.'
ingredients:
  - tofu-natural: 400 g | pevné
  - sojova-omacka: 4 pl
  - kukuricny-skrob: 1 pl
  - ryzove-rezance: 250 g
  - olej: 3 pl
  - zeleninova-zmes: 500 g | ázijská (wok), rovno z mrazničky
  - cesnak: 3 ks | prelisovaný
  - zazvor: 1 pl | nastrúhaný
  - javorovy-sirup: 1 pl
  - ocot: 1 pl
  - sezam: 1 pl
steps:
  - Tofu osuš utierkou, nakrájaj na kocky 2 cm, premiešaj s 1 PL sójovej omáčky a nechaj 10 minút postáť, aby nasiaklo. Potom ho obaľ v škrobe.
  - Medzitým rezance zalej vriacou vodou a nechaj stáť podľa obalu, zvyčajne 5–8 minút. Sceď a prepláchni studenou vodou, aby sa nezlepili.
  - Na veľkej panvici rozohrej 2 PL oleja na strednom až veľkom ohni a tofu opekaj 8 minút, kým nie je zo všetkých strán chrumkavé. Vyber ho na tanier.
  - Na zvyšnom oleji opekaj zeleninu rovno z mrazničky na veľkom ohni 5–6 minút za častého miešania – voda z nej sa musí odpariť, nie dusiť. Pridaj cesnak a zázvor a minútu praž.
  - Zmiešaj zvyšné 3 PL sójovej omáčky so sirupom a octom, vlej na panvicu s rezancami a tofu a 1–2 minúty spolu prehadzuj, kým sa omáčka nevpije. Posyp sezamom.
tips:
  - Bezlepková verzia – namiesto sójovej omáčky tamari.
