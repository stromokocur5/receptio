title: Labneh a grécky jogurt zo sójového jogurtu
description: Sójový jogurt necháš odkvapkať cez utierku – za pár hodín je z neho hustý „grécky“ jogurt, cez noc natierateľný labneh ako krémový syr. Guľky v olivovom oleji so za'atarom vydržia týždne.
cuisine: libanonska
meals: [domace, ranajky, snack]
categories: [domace/syry, omacky/dipy]
time: 15
active: 15
servings: 6
difficulty: 1
tags: [urob-si-sam, vela-bielkovin, party, jogurt]
ahead: Jogurt nechaj odkvapkať v chladničke – 3 hodiny na grécky jogurt, 12–24 hodín na labneh.
yields: z 1 kg jogurtu asi 450 g labneh
keeps: { fridge: 7 }
related: [domaci-sojovy-jogurt, tzatziki, hummus]
ingredients:
  - sojovy-jogurt: 1 kg | nesladený, bez škrobu a zahusťovadiel
  - sol: 1 čl
  - olivovy-olej: 4 pl
  - sumak: 1 čl | alebo údená paprika
  - tymian: 1 čl | alebo za'atar
  - bylinky-mata: 2 pl | čerstvá, nepovinné
steps:
  - Jogurt premiešaj so soľou. Sitko polož na misku a vystel ho čistou utierkou alebo dvoma vrstvami gázy.
  - Jogurt vlej do utierky, okraje voľne prelož navrch a daj do chladničky. Po 3 hodinách je z neho hustý grécky jogurt, po 12–24 hodinách labneh, ktorý drží tvar.
  - Labneh preber do misky a vyhladni lyžicou. Pokvapkaj olejom, posyp sumakom, tymianom a mätou a podávaj s chlebom alebo zeleninou.
tips:
  - Guľky do zásoby – labneh odkvapkaný 24 hodín vytvaruj mokrými rukami na guľky veľkosti orecha, obaľ v tymiane a ulož do pohára zaliate olivovým olejom. V chladničke vydržia dva týždne.
  - Srvátku, ktorá odkvapká, použi do chleba, palaciniek alebo smoothie – je kyslastá a má trochu bielkovín.
  - Jogurt so škrobom alebo pektínom (pozri zloženie) cez utierku neprepúšťa vodu a neodkvapká.
