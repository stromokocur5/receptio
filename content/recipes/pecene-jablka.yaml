title: Pečené jablká s ovsenou posýpkou
description: Jesenný dezert aj raňajky. Jablká plnené orechmi a škoricou, upečené domäkka s chrumkavou ovsenou posýpkou.
cuisine: slovenska
meals: [dezert, ranajky]
categories: [dezerty/pecene]
time: 40
active: 10
servings: 4
difficulty: 1
tags: [dezert, deti]
keeps: { fridge: 3 }
ingredients:
  - jablko: 4 ks | kyslé
  - vlasske-orechy: 1/3 hrnček | nasekané
  - skorica: 1 čl
  - javorovy-sirup: 3 pl
  - ovsene-vlocky: 1/2 hrnček
  - rastlinne-maslo: 30 g
  - sojovy-jogurt: 4 pl | na podávanie
steps:
  - Rúru predhrej na 190 °C. Jablkám vyrež jadrovník, spodok nechaj, nech plnka nevytečie.
  - Zmiešaj orechy, polovicu škorice a 2 PL sirupu a naplň jablká.
  - Vločky pomrv s maslom, zvyšnou škoricou a sirupom a posyp jablká.
  - Ulož ich do zapekacej misy, na dno nalej 3–4 PL vody, aby sa vytekajúca šťava nepripálila, a peč 30 minút, kým jablká nezmäknú. Podávaj teplé s jogurtom.
tips:
  - Najlepšie sú kyslé odrody ako Boskoop, Idared alebo Granny Smith, ostanú celé.
