title: Domáca harissa
description: Tuniská pálivá pasta zo sušených čili, pečenej papriky, cesnaku a kmínu. Lyžička premení polievku, kuskus aj hummus.
cuisine: severoafricka
meals: [domace]
time: 30
active: 20
servings: 12
difficulty: 1
tags: [urob-si-sam]
spicy: 3
yields: cca 250 ml
keeps: { fridge: 30 }
ingredients:
  - paprika-cervena: 1 ks | pečená a olúpaná
  - cili: 2 pl | alebo 10 sušených papričiek namočených v horúcej vode
  - cesnak: 4 ks
  - kmin: 1 čl
  - koriander-mlety: 1 čl
  - rasca: 1 čl | mletá
  - udena-paprika: 1 čl
  - paradajkovy-pretlak: 1 pl
  - citron: 1/2 ks
  - sol: 1 čl
  - olivovy-olej: 5 pl | + na zaliatie
steps:
  - Kmín, koriander a rascu nasucho opraž na panvici na strednom ohni 1 minútu, kým nezavoňajú.
  - Všetko rozmixuj v sekáčiku na hustú pastu. Ak je príliš hustá, pridaj lyžicu oleja.
  - Natlač do čistého pohára a zalej tenkou vrstvou oleja – zabráni plesni.
tips:
  - Po každom nabratí vrstvu oleja obnov a naberaj čistou lyžičkou, vydrží tak mesiac.
