title: Aloo gobi
description: Suché kari zo zemiakov a karfiolu s kurkumou a kmínom. Domáca klasika z Pandžábu.
cuisine: indicka-sever
meals: [obed, vecera]
categories: [hlavne/kari, hlavne/zelenina]
time: 40
active: 20
servings: 4
difficulty: 1
tags: [one-pot]
spicy: 1
keeps: { fridge: 3 }
leftovers: 'Zvyšok zabaľ do tortilly s hummusom alebo ho rozmixuj s vývarom na krémovú polievku.'
ingredients:
  - olej: 3 pl
  - kmin: 1 čl
  - cibula: 1 ks
  - cesnak: 3 ks
  - zazvor: 1 pl | nastrúhaný
  - kurkuma: 1 čl
  - koriander-mlety: 2 čl
  - cili: 1/2 čl
  - zemiaky: 4 ks | na kocky 2 cm
  - karfiol: 1 ks | na ružičky
  - paradajky: 2 ks | nakrájané
  - sol: 1,5 čl
  - voda: 4 pl
  - garam-masala: 1 čl
  - citron: 1/2 ks
  - bylinky-koriander: 3 pl
steps:
  - V širokej panvici rozohrej olej, pridaj kmín a nechaj ho 20 sekúnd zavoňať.
  - Pridaj cibuľu a 5 minút restuj, potom cesnak, zázvor, kurkumu, koriander a čili.
  - Pridaj zemiaky a karfiol a premiešaj, aby sa obalili v korení. Pridaj paradajky, soľ a vodu.
  - Prikry a dus na miernom ohni 20 minút, občas opatrne premiešaj. Zelenina má byť mäkká, ale nie rozvarená.
  - Odkry, pridaj garam masalu a 3 minúty opekaj na vyššom ohni. Dochuť citrónom a koriandrom.
tips:
  - Pre viac bielkovín pridaj plechovku cíceru spolu so zemiakmi a podávaj s dalom.
