title: Fazuľa v paradajkovej omáčke na hrianke
description: Domáca verzia britskej fazule z plechovky – biela fazuľa v sladkokyslej passate s údenou paprikou. Raňajky, rýchla večera aj príloha.
cuisine: americka
meals: [ranajky, obed, vecera]
categories: [ranajky/slane, hlavne/strukoviny]
time: 25
active: 10
servings: 4
difficulty: 1
tags: [meal-prep, lacne, zo-spajze, vela-vlakniny]
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Fazuľu bez chleba zamraz po porciách. Hodí sa aj na pečený zemiak alebo do tortilly s ryžou.'
related: [marinara-omacka, tofu-prazenica]
ingredients:
  - olej: 1 pl
  - cibula: 1 ks | nadrobno
  - cesnak: 2 ks
  - udena-paprika: 1 čl
  - passata: 2 hrnček
  - fazula-biela: 3 ks | scedená
  - javorovy-sirup: 1 pl
  - sojova-omacka: 1 pl
  - horcica: 1 čl
  - ocot: 1 pl
  - sol: 1/2 čl
  - cierne-korenie: 1/4 čl
  - chlieb: 4 ks | hrianky
steps:
  - Na oleji na strednom ohni speň cibuľu 5 minút. Pridaj prelisovaný cesnak a údenú papriku a pol minúty miešaj.
  - Prilej passatu, pridaj javorový sirup, sójovú omáčku, horčicu, ocot, soľ a korenie a priveď do varu.
  - Vsyp fazuľu a var na miernom ohni 12–15 minút, kým omáčka nezhustne a neobalí fazuľu. Ak hustne priskoro, prilej 2–3 lyžice vody.
  - Chlieb opeč v hriankovači alebo na suchej panvici a fazuľu naber naň.
tips:
  - Zo suchej fazule – 250 g namoč cez noc a var 60–90 minút do mäkka, soľ až na konci. Vyjde to o polovicu lacnejšie.
