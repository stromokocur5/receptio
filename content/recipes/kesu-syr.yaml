title: Kešu smotanový syr s pažítkou
description: Krémová nátierka ako Lučina, len z kešu. Na chlieb, do wrapu aj k zelenine.
cuisine: moderna
meals: [domace, snack, ranajky]
categories: [domace/syry, omacky/dipy]
time: 15
active: 10
servings: 8
difficulty: 1
tags: [urob-si-sam]
ahead: Kešu namoč na 4 hodiny, alebo na 15 minút do vriacej vody.
keeps: { fridge: 5 }
ingredients:
  - kesu: 200 g | namočené, scedené
  - citron: 1 ks
  - vyzivne-drozdie: 2 pl
  - miso: 1 čl | pre syrovú hĺbku
  - cesnak: 1 ks
  - sol: 1/2 čl
  - voda: 4 pl
  - pazitka: 2 pl | nadrobno
steps:
  - Kešu, citrónovú šťavu, droždie, miso, cesnak a soľ mixuj, kým nie je úplne hladké. Vodu pridávaj po lyžiciach, len aby sa mixér točil.
  - Vmiešaj pažítku a nechaj hodinu stuhnúť v chladničke.
tips:
  - Kyslejší „fermentovaný“ syr dostaneš, keď primiešaš obsah jednej probiotickej kapsuly a necháš ho 12–24 hodín prikrytý pri izbovej teplote.
