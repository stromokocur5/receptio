title: Tzatziki
description: Osviežujúci cesnakovo-uhorkový dip zo sójového jogurtu s kôprom. K falafelu, pečeným zemiakom aj grilovanej zelenine.
cuisine: grecka
meals: [snack]
categories: [omacky/dipy]
time: 15
active: 15
servings: 4
difficulty: 1
tags: [bez-varenia]
keeps: { fridge: 3 }
ingredients:
  - sojovy-jogurt: 2 hrnček | čo najhustejší
  - uhorka: 1/2 ks | nastrúhaná
  - sol: 1/2 čl
  - cesnak: 2 ks
  - kopor: 2 pl
  - citron: 1/2 ks
  - olivovy-olej: 1 pl
steps:
  - Uhorku nastrúhaj, osoľ a po 5 minútach ju rukami poriadne vytlač – inak bude tzatziki vodové.
  - Ak je jogurt riedky, nechaj ho 30 minút odkvapkať v sitku vystlanom utierkou.
  - Zmiešaj jogurt, uhorku, prelisovaný cesnak, kôpor a citrón. Polej olejom.
tips:
  - Najlepšie je po hodine v chladničke, keď sa chute prepoja.
