title: Tyčinky z pukaného amarantu
description: Chrumkavé tyčinky z pukaného amarantu, arašidového masla a datlí. Snack bez pečenia, ktorý si napukáš sám na panvici.
cuisine: moderna
meals: [snack]
categories: [snacky/na-cesty, snacky/sladke]
time: 25
active: 25
servings: 10
ahead: 'V chladničke stuhnú za hodinu.'
difficulty: 1
tags: [snack, bez-varenia, deti]
spicy: 0
keeps: { fridge: 14 }
ingredients:
  - amarant: 80 g
  - ovsene-vlocky: 60 g
  - arasidove-maslo: 4 pl
  - datle: 8 ks | namočené
  - javorovy-sirup: 2 pl
  - slnecnicove-semienka: 3 pl
  - kakao: 1 pl
  - sol: 1 štipka
steps:
  - Suchý hrniec s pokrievkou rozpáľ na vysokom ohni. Nasyp lyžicu amarantu, prikry a trepaj – o pár sekúnd popraská na biely popcorn. Hneď vysyp a opakuj.
  - Datle rozmixuj s arašidovým maslom, sirupom, kakaom a soľou na pastu.
  - Zmiešaj s pukaným amarantom, vločkami a semienkami.
  - Natlač do formy vystlanej papierom a daj na hodinu do chladničky. Nakrájaj na tyčinky.
tips:
  - Ak sa amarant pripáli, hrniec je príliš horúci. Ak nepuká, je studený.
