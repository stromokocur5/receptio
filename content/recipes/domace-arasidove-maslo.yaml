title: Domáce arašidové maslo
description: Jedna surovina a trochu trpezlivosti. Za polovičnú cenu kupovaného a bez palmového oleja či cukru.
cuisine: americka
meals: [domace]
time: 20
active: 15
servings: 16
difficulty: 1
tags: [urob-si-sam, lacne]
yields: cca 400 g
keeps: { fridge: 30 }
ingredients:
  - arasidy: 400 g | pražené nesolené
  - sol: 1/2 čl
steps:
  - Arašidy zohrej 5 minút v rúre na 150 °C – teplé sa mixujú oveľa ľahšie.
  - Mixuj v sekáčiku 8–12 minút s prestávkami (nech sa motor neprehreje) a stieraj steny. Najprv vznikne drvina, potom guľa a nakoniec krémové maslo.
  - Pridaj soľ. Na chrumkavé maslo primiešaj hrsť nasekaných arašidov.
tips:
  - Rovnako sa robí mandľové, kešu alebo lieskovcové maslo.
