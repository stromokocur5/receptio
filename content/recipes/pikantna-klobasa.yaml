title: Pikantná klobása ako čabajka
description: Pevná, poriadne paprikovaná a údená klobása na tenké plátky. Na chlieb, do lečá, fazuľovice aj na pizzu.
cuisine: slovenska
meals: [domace, snack]
categories: [domace/bielkoviny]
time: 90
active: 20
servings: 6
difficulty: 2
tags: [vela-bielkovin, urob-si-sam, meal-prep, do-krabicky]
spicy: 2
yields: 2 klobásy
keeps: { fridge: 7, freezer: 3 }
related: [grilovacie-klobasky, leco, fazulova-polievka]
ingredients:
  - lepok-vital: 180 g
  - cicerova-muka: 3 pl
  - vyzivne-drozdie: 2 pl
  - sladka-paprika: 2 pl
  - udena-paprika: 2 čl
  - cili: 1 čl
  - rasca: 1 čl | celá
  - cesnak: 5 ks | prelisovaný
  - cierne-korenie: 1 čl
  - sol: 1 čl
  - paradajkovy-pretlak: 2 pl
  - sojova-omacka: 2 pl
  - tekuty-dym: 1 čl
  - olej: 4 pl
  - voda: 140 ml
steps:
  - Rúru predhrej na 160 °C.
  - Zmiešaj lepok, cícerovú múku, droždie, koreniny, rascu a soľ.
  - Zvlášť zmiešaj cesnak, pretlak, sójovú omáčku, dym, olej a vodu. Spoj so suchou zmesou a mies 3 minúty, kým nie je cesto pevné a pružné.
  - Rozdeľ na 2 časti, vyvaľkaj pevné valčeky hrubé 4 cm a každý tesne zabaľ do alobalu, konce zatoč.
  - Peč 75 minút, v polovici otoč. Pečením bude pevnejšia a suchšia ako dusená, presne ako čabajka.
  - Nechaj úplne vychladnúť v alobale, najlepšie cez noc v chladničke. Potom krájaj na tenké plátky.
tips:
  - Čím dlhšie v chladničke, tým pevnejšia sa dá krájať na tenko.
