title: Zemiakové placky z rúry s brokolicou
description: Zemiakové placky s cesnakom a majoránkou ako z panvice, len upečené na plechu – bez prskania a s tretinou oleja. Brokolicu v nich deti skoro nepostrehnú.
cuisine: slovenska
meals: [obed, vecera, snack]
categories: [hlavne/zelenina]
time: 55
active: 25
servings: 7
difficulty: 2
tags: [nasarodinka, lacne, deti, klasika]
keeps: { fridge: 2 }
ingredients:
  - zemiaky: 1,5 kg
  - sol: 2 čl
  - brokolica: 1 ks
  - cibula: 1 ks
  - cesnak: 4 ks
  - cicerova-muka: 100 g
  - majoranka: 2 čl
  - cierne-korenie: 1/4 čl
  - olej: 5 pl
  - sojovy-jogurt: 400 g | nesladený, na podávanie
  - kopor: 2 pl | nasekaný
steps:
  - Rúru predhrej na 220 °C. Dva plechy vystel papierom na pečenie a každý potri lyžicou oleja.
  - Zemiaky ošúp a nastrúhaj nahrubo. Premiešaj s 1 lyžičkou soli, nechaj 5 minút postáť a potom ich po hrstiach vytlač v utierke čo najsuchšie. Bez vody budú placky chrumkavé.
  - Brokolicu nasekaj nadrobno aj so stonkou, cibuľu nastrúhaj najemno.
  - Zemiaky zmiešaj s brokolicou, cibuľou, prelisovaným cesnakom, cícerovou múkou, majoránkou, zvyšnou soľou a korením.
  - Lyžicou rozlož na plechy 28 kôpok a roztlač ich na placky hrubé asi 1 cm. Potri ich zvyšným olejom.
  - Peč 15 minút, otoč a peč ešte 10–12 minút, kým nie sú z oboch strán zlatohnedé.
  - Jogurt zmiešaj s koprom a štipkou soli a podávaj k plackám.
tips:
  - Placky z rúry najlepšie chutia hneď. Zvyšky prihrej na suchej panvici, v mikrovlnke zmäknú.
