title: Ovsené latte doma
description: Kaviarenské latte bez kávovaru – silná káva a mlieko spenené v pohári alebo francúzskom lise.
cuisine: moderna
meals: [ranajky, snack]
categories: [napoje/teple]
time: 7
active: 7
servings: 1
difficulty: 1
tags: [rychle]
ingredients:
  - kava: ~2 pl | jemne mletá
  - voda: 1/2 hrnček
  - sojove-mlieko: 1 hrnček | alebo ovsené „barista“
  - javorovy-sirup: 1 čl | voliteľne
steps:
  - Uvar silnú kávu – v džezve, moka kanvičke alebo zalej kávu 94 °C vodou a nechaj 4 minúty lúhovať, potom preceď.
  - Mlieko zohrej, kým sa nezačne pariť (60–65 °C, nie viac).
  - Speň ho – vo francúzskom lise 15× pumpuj piestom, v uzavretom pohári poriadne pretras, alebo ručným šľahačom.
  - Nalej kávu do hrnčeka a pridaj mlieko s penou.
tips:
  - Sójové a „barista“ ovsené mlieka sa penia najlepšie. Mandľové a ryžové skoro vôbec.
  - Studená verzia – káva, ľad a studené mlieko.
