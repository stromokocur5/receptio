title: Šampiňóny na cesnaku na hrianke
description: Huby opečené dohneda s cesnakom a petržlenovou vňaťou na chrumkavom chlebe. Raňajky alebo rýchla večera za 15 minút.
cuisine: moderna
meals: [ranajky, vecera]
categories: [ranajky/slane]
time: 15
active: 15
servings: 2
difficulty: 1
tags: [rychle, lacne]
spicy: 0
keeps: { fridge: 1 }
ingredients:
  - olivovy-olej: 2 pl
  - sampinony: 400 g | na plátky
  - sol: 1/2 čl
  - cierne-korenie: 1/4 čl
  - cesnak: 3 ks | nasekaný
  - citron: 1 čl | šťava
  - petrzlenova-vnat: 2 pl | nasekaná
  - chlieb: 4 ks | krajce
steps:
  - Vo veľkej panvici rozohrej olej na veľkom ohni. Huby rozlož v jednej vrstve a 3 minúty ich nemiešaj, nech zospodu zhnednú. Potom ich opekaj ešte 4 minúty za občasného miešania.
  - Stiahni oheň, osoľ, okoreň, pridaj cesnak a miešaj minútu, kým nezavonia – nesmie zhnednúť.
  - Medzitým opeč chlieb v hriankovači alebo na suchej panvici.
  - Huby dochuť citrónovou šťavou, vmiešaj vňať a navrš na hrianky.
tips:
  - Soľ pridávaj až keď huby zhnednú – osolené hneď pustia vodu a dusia sa.
