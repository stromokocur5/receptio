title: Teplý zemiakový šalát s horčicou, kyslou uhorkou a pórom
description: Zemiaky zaliate dresingom, kým sú ešte horúce, takže ho nasajú do stredu. Horčicová emulzia s nálevom z uhoriek, jemný pór a reďkovky pre chrumkavosť. Žiadna majonéza, aj tak krémový.
cuisine: slovenska
meals: [obed, vecera]
categories: [salaty/syte, salaty/prilohove]
time: 35
active: 15
servings: 3
difficulty: 1
tags: [zlatica, lacne]
keeps: { fridge: 3 }
leftovers: 'Pred jedlom ho nechaj 20 minút postáť pri izbovej teplote, studený chutí menej.'
ingredients:
  - zemiaky: 8 ks | pevné (typ A), asi 1 kg
  - sol: ~1 pl | do vody
  - por: 1/2 ks | biela časť
  - olej: 4 pl
  - kysle-uhorky: 4 ks
  - horcica: 1 pl
  - ocot: 1 pl
  - cukor: 1/2 čl
  - sol: 1/2 čl | do dresingu
  - cierne-korenie: 1/2 čl
  - redkovka: 8 ks
  - pazitka: 3 pl
  - fazula-biela: 1 ks | plechovka, nepovinné – sýtejší šalát
steps:
  - Zemiaky ošúp, nakrájaj na kocky 2 cm a daj do studenej vody s 1 PL soli. Priveď do varu a var 10–12 minút, kým nôž prejde ľahko, ale kocky sa nerozpadávajú. Vo vode od začiatku sa uvaria rovnomerne a soľ ich ochutí až do stredu.
  - Medzitým pór nakrájaj na tenké kolieska a umy. Na panvici zohrej 1 PL oleja a pór dus na miernom ohni 5 minút, kým nezmäkne.
  - Dresing – v miske zmiešaj 4 PL nálevu z kyslých uhoriek, ocot, horčicu, cukor, soľ a korenie. Za šľahania vidličkou vlej 3 PL oleja, kým nezhustne. Uhorky nakrájaj na kocky.
  - Zemiaky sceď a nechaj minútu vyparovať. Horúce ich daj do misy, pridaj pór aj s olejom a polej celým dresingom. Jemne premiešaj, nechaj 10 minút. Horúce zemiaky nasajú dresing dovnútra, studené by ho mali len na povrchu.
  - Vmiešaj uhorky, na plátky nakrájané reďkovky, pažítku a scedenú prepláchnutú fazuľu. Ochutnaj, dosoľ alebo pridaj kvapku nálevu.
tips:
  - Šalát je najlepší vlažný. Ak zhustne, pridaj lyžicu nálevu.
