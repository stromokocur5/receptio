title: Proteínová ovsená kaša
description: Raňajky na 5 minút s vyše 20 g bielkovín, omega-3 z ľanu a ovocím.
cuisine: moderna
meals: [ranajky]
categories: [ranajky/kase]
time: 10
active: 5
servings: 1
difficulty: 1
tags: [ranajky]
keeps: { fridge: 2 }
ingredients:
  - ovsene-vlocky: 60 g
  - sojove-mlieko: 1 hrnček
  - lanove-semienko: 1 pl
  - skorica: 1 štipka
  - banan: 1 ks
  - arasidove-maslo: 1 pl
  - maliny: 1/2 hrnček
steps:
  - Vločky var v sójovom mlieku na miernom ohni 3 až 4 minúty za stáleho miešania.
  - Odstav a vmiešaj ľanové semienko a škoricu.
  - Navrch daj nakrájaný banán, maliny a arašidové maslo.
tips:
  - Sójové mlieko má z rastlinných mliek najviac bielkovín. Ovsené či mandľové ich má len zlomok.
  - Ľan pridaj až na konci – ostane orieškový a kaša nebude lepkavá.
