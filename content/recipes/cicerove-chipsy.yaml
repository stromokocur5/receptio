title: Proteínové chipsy z cícerovej múky
description: Tenké chrumkavé trojuholníky z cícerovej múky a ľanu, upečené v rúre. Majú asi dvakrát viac bielkovín a vlákniny ako kukuričné chipsy – na dipy, nachos aj len tak.
cuisine: mexicka
meals: [snack]
categories: [snacky/slane, snacky/party]
time: 45
active: 15
servings: 3
difficulty: 2
tags: [party, meal-prep]
keeps: { fridge: 0 }
related: [nachos-proteinove, guacamole, pico-de-gallo, tortilla-chipsy]
equipment: [rura, plech, miska, valcek]
ingredients:
  - cicerova-muka: 150 g
  - lanove-semienko: 2 pl | mleté
  - udena-paprika: 1 čl
  - kmin: 1/2 čl
  - sol: 1/2 čl
  - voda: 1/2 hrnček | + 1–2 lyžice podľa potreby
  - olej: 2 pl
steps:
  - Rúru predhrej na 180 °C (horúci vzduch 170 °C).
  - V mise zmiešaj múku, mletý ľan, papriku, kmín a soľ. Prilej vodu a olej a vymies hladké, nelepivé cesto. Ak sa drobí, pridaj lyžicu vody.
  - Nechaj ho 10 minút odpočívať, ľan ho spojí a pôjde lepšie vaľkať.
  - Cesto rozvaľkaj medzi dvoma papiermi na pečenie čo najtenšie, asi na 1–2 mm. Horný papier stiahni a nožom alebo kolieskom na pizzu ho nakrájaj na trojuholníky. Nemusíš ich oddeľovať.
  - Spodný papier s cestom prenes na plech a peč 12–15 minút, kým okraje nezozlatnú. Tenšie kúsky na krajoch vyber skôr, ak tmavnú.
  - Rúru vypni a chipsy nechaj v nej ešte 5 minút dosušiť. Chrumkavé sú až po vychladnutí, potom ich rozlám po čiarach.
tips:
  - Čím tenšie cesto, tým chrumkavejšie chipsy. Hrubé kúsky ostanú ako krekry.
  - V uzavretej dóze vydržia chrumkavé 3–4 dni; zmäknuté stačí 3 minúty prepiecť.
  - Namiesto papriky skús cesnakový prášok a sušené oregano alebo čili a limetkovú kôru.
