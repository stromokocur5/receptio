title: Čokoládový proteínový shake
description: Po cvičení alebo namiesto dezertu. Tofu a arašidové maslo mu dajú bielkoviny, kakao chuť.
cuisine: moderna
meals: [ranajky, snack]
categories: [napoje/smoothie]
time: 5
active: 5
servings: 1
difficulty: 1
tags: [rychle, bez-varenia, vela-bielkovin]
ingredients:
  - tofu-hodvabne: 150 g
  - banan: 1 ks | zmrazený
  - sojove-mlieko: 1 hrnček
  - kakao: 1 pl
  - arasidove-maslo: 1 pl
  - datle: 2 ks
steps:
  - Všetko rozmixuj dohladka, aspoň minútu, aby tofu nebolo cítiť.
tips:
  - Hodvábne tofu je v shaku neutrálne – nikto nespozná, že tam je.
