title: Sušené paradajky v oleji
description: Koncentrované letné paradajky sušené v rúre a naložené v olivovom oleji s oreganom. Do cestovín, na pizzu, do šalátov.
cuisine: talianska
meals: [domace, snack]
categories: [domace/zavarane, omacky/omacky]
time: 540
active: 30
servings: 12
difficulty: 1
tags: [urob-si-sam]
yields: cca 2 poháre po 0,25 l
keeps: { fridge: 30 }
howto: [susenie]
ingredients:
  - paradajky: 2 kg | cherry alebo rímske
  - sol: 1 čl
  - oregano: 2 čl | sušené
  - ocot: 1 pl | vínny
  - olivovy-olej: 150 ml
steps:
  - Paradajky prekroj na polovice (rímske na štvrtiny) a ulož reznou stranou nahor na plechy s papierom. Posoľ.
  - Suš v rúre pri 70 °C s pootvorenými dvierkami 7–9 hodín, kým nie sú kožovité a bez šťavy vnútri. Menšie vyber skôr.
  - Nechaj vychladnúť, premiešaj s oreganom a octom a natlač do čistých pohárov.
  - Zalej olejom, aby boli celé ponorené, a skladuj v chladničke.
tips:
  - Do oleja dávaj len sušené bylinky a korenie – čerstvý cesnak a bylinky v oleji sú riziko botulizmu.
  - Olej z paradajok je hotový dresing na cestoviny aj šalát.
