title: Šanské tofu z cícerovej múky
description: Barmské „tofu“ bez sóje aj bez zrážadla – len cícerová múka, voda a štipka kurkumy uvarené na hustú kašu, ktorá v miske stuhne. Žlté, jemné a za 20 minút práce. Opečené na kocky chrumká ako hranolky.
cuisine: moderna
meals: [domace]
categories: [domace/bielkoviny]
time: 140
active: 20
servings: 4
difficulty: 2
tags: [urob-si-sam]
yields: cca 800 g tofu (forma 20 × 15 cm)
related: [hrachove-tofu, domace-tofu, konopne-tofu]
keeps: { fridge: 4 }
ingredients:
  - cicerova-muka: 150 g
  - voda: 900 ml
  - sol: 1 čl
  - kurkuma: 1/4 čl
  - olej: 1 čl | na vymastenie formy
steps:
  - Formu alebo zapekaciu misku (asi 20 × 15 cm) vymasti olejom.
  - Cícerovú múku rozšľahaj s 300 ml studenej vody na hladké cestíčko bez hrudiek.
  - Zvyšných 600 ml vody priveď v hrnci do varu so soľou a kurkumou.
  - Stíš na stredný oheň a za stáleho šľahania metličkou vlej cestíčko. Miešaj bez prestávky aj dno a rohy hrnca, inak sa prichytí.
  - Var na miernom ohni 6–8 minút. Kaša najprv zhustne ako puding, potom sa zaleskne a začne sa odlepovať od stien. Ochutnaj – nesmie byť cítiť surová múka.
  - Hneď ju vylej do formy a uhlaď stierkou. Nechaj 1 hodinu vychladnúť na linke a potom aspoň hodinu v chladničke, kým stuhne.
  - Vyklop a nakrájaj. Na opekanie kocky alebo hranolky osuš a opeč na 3 lyžiciach oleja na stredne silnom ohni z každej strany 3–4 minúty dozlatista.
tips:
  - Netreba ho lisovať ani marinovať. Chuť mu dá omáčka, do ktorej ho namáčaš – napríklad sójová omáčka s cesnakom, limetkou a čili.
  - Do dlho dusených omáčok ho nedávaj, rozvarí sa. Pridaj ho opečené až na tanier.
  - Mraziť sa nedá – po rozmrazení je zrnité a púšťa vodu.
  - V Barme sa teplá, ešte tekutá kaša podáva aj ako polievka s rezancami („tohu nway“).
  - Pri celiakii použi múku s certifikátom bez lepku.
