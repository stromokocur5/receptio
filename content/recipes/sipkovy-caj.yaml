title: Šípkový čaj zo sušených šípok
description: Kyslastý rubínový čaj zo šípok, ktoré si nazbieraš na jeseň po prvom mraze. Bez kofeínu, s trochou vitamínu C a zadarmo.
cuisine: slovenska
meals: [snack]
categories: [napoje/teple]
time: 20
active: 5
servings: 4
difficulty: 1
tags: [lacne]
nutrition: false
related: [bylinkovy-caj-zo-zahrady, rakytnikovy-caj, zazvorovy-caj]
ingredients:
  - sipky: 1/2 hrnček | sušené, rozdrvené
  - voda: 1 l
  - citron: 1/2 ks | plátky, nepovinné
  - javorovy-sirup: 1 pl | podľa chuti
steps:
  - Sušené šípky rozdrv v mažiari alebo vo vrecku valčekom na kúsky – celé pustia chuť pomaly.
  - Zalej ich studenou vodou, priveď do varu a var na miernom ohni pod pokrievkou 10 minút.
  - Odstav a nechaj ešte 5 minút lúhovať.
  - Preceď cez jemné sitko vystlané papierovou utierkou alebo gázou – chĺpky zo šípok dráždia hrdlo. Dochuť citrónom a sirupom.
tips:
  - Vitamín C sa varom čiastočne stratí. Viac ho ostane, keď šípky cez noc len zaleješ horúcou vodou v termoske.
  - Šípky zbieraj po prvom mraze ďaleko od ciest, rozpolené usuš pri 50 °C a chĺpky so semienkami vytras.
