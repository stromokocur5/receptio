title: Banánová nice cream
description: „Zmrzlina“ z jedného banánu – zamrazený banán sa v mixéri zmení na krém. Hotová za 5 minút.
cuisine: moderna
meals: [dezert, snack]
categories: [dezerty/mrazene, dezerty/nepecene]
time: 5
active: 5
servings: 2
difficulty: 1
tags: [rychle, bez-varenia, deti, zvysky]
ahead: Banány musia byť zamrazené aspoň 6 hodín.
ingredients:
  - banan: 3 ks | zrelé, nakrájané a zamrazené
  - sojove-mlieko: 3 pl
  - arasidove-maslo: 1 pl | voliteľne
  - kakao: 1 pl | voliteľne
steps:
  - Zamrazené banány nechaj 3 minúty povoliť.
  - Mixuj s mliekom (a arašidovým maslom s kakaom, ak chceš čokoládovú), kým z hrudiek nie je hladký krém ako mäkká zmrzlina. Priebežne zotieraj steny.
  - Podávaj hneď, alebo daj na 30 minút do mrazničky, aby sa dala nabrať kopčekom.
tips:
  - Jahodová – polovica banánu, polovica mrazených jahôd.
  - Najlepšia je zo zrelých banánov s hnedými bodkami, zelené chutia po škrobe.
