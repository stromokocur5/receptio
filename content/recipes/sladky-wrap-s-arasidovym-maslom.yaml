title: Sladký wrap s arašidovým maslom, banánom a ovsom
description: Raňajky do ruky za 5 minút – tortilla s arašidovým maslom, celým banánom, vločkami a škoricou, opečená do chrumkava. Dá sa nakrájať na kolieska a zobrať do školy.
cuisine: americka
meals: [ranajky, snack]
categories: [ranajky/palacinky, snacky/na-cesty]
time: 10
active: 10
servings: 4
difficulty: 1
tags: [rychle, deti, do-krabicky, ranajky, lacne, tortilla-na-tyzden]
keeps: { fridge: 1 }
related: [ranajkove-burrito-do-mraznicky, toast-s-cokoladovym-kremom]
ingredients:
  - psenicne-tortilly: 4 ks
  - arasidove-maslo: 4 pl
  - banan: 4 ks
  - ovsene-vlocky: 4 pl | jemné
  - skorica: 1 čl
  - chia: 4 čl | nepovinné
  - citron: 1 čl | aby banán nezhnedol
steps:
  - Na každú tortillu natri 1 PL arašidového masla až skoro po okraj.
  - Posyp vločkami, chia a škoricou. Banán ošúp, pokvapkaj citrónom a polož ho k spodnému okraju.
  - Pevne zroluj a polož švom dole na suchú panvicu. Opeč na strednom ohni 2 minúty, otoč a ešte 1–2 minúty, kým nie je chrumkavá.
  - Nakrájaj na kolieska hrubé 3 cm alebo prekroj napoly a zabaľ do papiera.
tips:
  - Bez arašidov (do škôl, kde ich nesmú) použi slnečnicové maslo alebo tahini s kvapkou sirupu.
  - Večer pripravený wrap vydrží do rána v chladničke. Neopečený ostane mäkší, opečený chrumká, keď ho ráno zohreješ 1 minútu na panvici.
  - Viac bielkovín – arašidové maslo zmiešaj s 2 PL sójového jogurtu.
