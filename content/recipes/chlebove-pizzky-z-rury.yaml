title: Chlebové pizzky z rúry
description: Krajce chleba s paradajkovou omáčkou, zeleninou a oreganom, zapečené dochrumkava. Najrýchlejšia „pizza“ z toho, čo je doma, a deti si ju radi poskladajú samy.
cuisine: talianska
meals: [snack, vecera]
categories: [snacky/slane]
time: 30
active: 15
servings: 7
difficulty: 1
tags: [nasarodinka, deti, lacne, zvysky]
ingredients:
  - chlieb: 14 ks
  - passata: 300 ml
  - paradajkovy-pretlak: 2 pl
  - cesnak: 2 ks
  - oregano: 2 čl
  - sol: 1/2 čl
  - paprika-cervena: 2 ks
  - kukurica: 1 ks | scedená
  - cibula: 1 ks
  - sampinony: 200 g
  - vyzivne-drozdie: 3 pl
  - olivovy-olej: 3 pl
steps:
  - Rúru predhrej na 220 °C a dva plechy vystel papierom na pečenie.
  - Passatu zmiešaj s pretlakom, prelisovaným cesnakom, oreganom a soľou. Hustá omáčka nepremočí chlieb.
  - Papriku nakrájaj na malé kocky, cibuľu na tenké polkolieska a šampiňóny na tenké plátky.
  - Krajce rozlož na plechy a natri omáčkou až po okraje, aby sa nespálili. Navrch daj zeleninu a kukuricu, posyp droždím a pokvapkaj olejom.
  - Peč 10–12 minút, kým nie sú okraje chleba chrumkavé a zelenina mäkká.
tips:
  - Kto má rastlinný syr, posype ním pizzky pred pečením.
