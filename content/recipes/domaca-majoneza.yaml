title: Domáca vegánska majonéza za 30 sekúnd
description: Hustá majonéza zo sójového mlieka a oleja, vyšľahaná ponorným mixérom. Lacnejšia a bez éčok.
cuisine: moderna
meals: [domace]
time: 5
active: 5
servings: 12
difficulty: 1
tags: [urob-si-sam, rychle]
yields: cca 300 ml
ingredients:
  - sojove-mlieko: 100 ml | studené, nesladené
  - olej: 200 ml | repkový, bez výraznej chuti
  - horcica: 1 čl
  - citron: 1 pl
  - sol: 1/2 čl
steps:
  - Do vysokej úzkej nádoby (ideálne tej od ponorného mixéra) daj mlieko, horčicu, citrón a soľ.
  - Mixér polož až na dno, zapni ho a pomaly prilievaj olej. Mixér pomaly ťahaj nahor – za 30 sekúnd je majonéza hustá.
  - Ak nezhustne, prilej ešte trochu oleja. Musí to byť sójové mlieko – ovsené a mandľové neemulgujú.
tips:
  - V chladničke vydrží týždeň.
  - Cesnaková verzia (aioli) – pridaj 2 prelisované strúčiky cesnaku.
