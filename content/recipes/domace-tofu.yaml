title: Domáce tofu
description: Čerstvé tofu z vlastného sójového mlieka. Jemnejšie a krémovejšie ako kupované, a keď to raz skúsiš, pochopíš, prečo ho v Ázii kupujú denne čerstvé.
cuisine: moderna
meals: [domace]
time: 60
active: 40
servings: 4
difficulty: 3
tags: [urob-si-sam]
nutrition: false
yields: cca 350–400 g tofu
ahead: Sójové zrná namoč na 12 hodín (cez noc).
related: [domace-sojove-mlieko, okarove-placky]
ingredients:
  - sojove-zrna: 300 g | namočené cez noc
  - voda: 2,5 l
  - nigari: 2 čl | rozpustené v 1/2 hrnčeku teplej vody
steps:
  - Zrná rozmixuj s 2 litrami vody a preceď cez utierku ako pri sójovom mlieku. Pridaj zvyšnú vodu a za stáleho miešania var 10 minút.
  - Nechaj mlieko vychladnúť na asi 80 °C (keď už nepára tak prudko, 3–4 minúty po odstavení).
  - Tretinu roztoku nigari vlej za pomalého miešania do tvaru osmičky, potom prestaň miešať. Zvyšok nalej po povrchu a prikry.
  - Po 10–15 minútach sa mlieko rozdelí na biele hrudky a nažltlú číru srvátku. Ak je srvátka ešte mliečna, pridaj trochu nigari a počkaj.
  - Do lisu na tofu alebo cedidla vystlaného utierkou opatrne naber hrudky naberačkou, prelož utierku a zaťaž 1–2 kg (hrniec s vodou).
  - Lisuj 15 minút na mäkké, 30–40 minút na pevné tofu. Potom ho vlož na 10 minút do studenej vody, nech stuhne.
tips:
  - Skladuj ponorené vo vode v chladničke, vodu vymieňaj denne. Vydrží 4–5 dní.
  - Nigari (chlorid horečnatý) dá klasické japonské tofu. Síran vápenatý (E516) dá mäkšie tofu s veľa vápnika. Núdzovo funguje 4 PL citrónovej šťavy, tofu bude jemne kyslé a menej výdatné.
  - Lis nemusíš kupovať – stačí cedidlo, utierka a hrniec s vodou ako závažie.
