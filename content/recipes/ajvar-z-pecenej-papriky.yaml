title: Ajvar z pečenej papriky
description: Papriky upečené, až kým šupka nezčernie, potom zlúpané a zredukované na hustú sladko-dymovú nátierku. K zemiakom, na ryžu, do fazule alebo len na lyžicu.
cuisine: slovenska
meals: [snack, obed, vecera]
categories: [omacky/dipy]
time: 55
active: 20
servings: 4
difficulty: 2
tags: [zlatica, party]
keeps: { fridge: 7, freezer: 3 }
ingredients:
  - paprika-cervena: 5 ks | mäsité
  - cesnak: 3 ks
  - olivovy-olej: 3 pl
  - ocot: 1 pl
  - cukor: 1/2 čl
  - sol: 1/2 čl
  - udena-paprika: 1/2 čl
  - cierne-korenie: 1 štipka
steps:
  - Rúru predhrej na 230 °C (alebo zapni gril). Celé papriky ulož na plech s papierom a peč 25–30 minút, každých 10 minút ich otoč. Šupka má na viacerých miestach zčernieť a odstávať. Tá spálená šupka dá ajvaru dymovú chuť a dá sa potom ľahko zlúpnuť.
  - Horúce papriky daj do misky a prikry ju tanierom na 10 minút. Para pod tanierom uvoľní šupku od mäsa.
  - Papriky zlúp prstami, odtrhni stopky a vyber semienka. Nevyplachuj ich pod vodou, spláchla by sa aj chuť. Mäso nasekaj nožom nadrobno alebo krátko rozmixuj, aby ostali kúsky.
  - Na panvici zohrej olej na strednom ohni, pridaj prelisovaný cesnak a miešaj 30 sekúnd. Pridaj papriku a za častého miešania ju var 10–12 minút, kým sa voda neodparí a vareška nenecháva na dne panvice stopu. Až vtedy je ajvar hustý a nie vodový.
  - Odstav, vmiešaj ocot, cukor, soľ, údenú papriku a korenie. Ochutnaj – má byť sladký, slaný aj trochu kyslý naraz. Nechaj vychladnúť, studený je hustejší a chutnejší.
tips:
  - Na plynovom sporáku môžeš papriky opáliť priamo na plameni, otáčaj ich kliešťami. Je to rýchlejšie a ešte dymovejšie.
  - V chladničke vydrží týždeň, ak ho zalieješ tenkou vrstvou oleja.
