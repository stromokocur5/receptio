title: Cestoviny s bazalkovým pestom a hráškom
description: Svieže pesto z bazalky, vlašských orechov a výživného droždia. Hotové skôr, ako sa uvaria cestoviny.
cuisine: talianska
meals: [obed, vecera]
categories: [hlavne/cestoviny]
time: 20
active: 15
servings: 4
difficulty: 1
tags: [rychle]
keeps: { fridge: 2 }
leftovers: 'Studené cestoviny s pestom sú dobrý šalát, pridaj paradajky a citrón.'
ingredients:
  - cestoviny: 400 g
  - hrasok: 1 hrnček
  - bazalka: 2 hrnček
  - vlasske-orechy: 1/2 hrnček
  - cesnak: 2 ks
  - vyzivne-drozdie: 3 pl
  - citron: 1/2 ks
  - olivovy-olej: 6 pl
  - sol: 1 čl
steps:
  - Uvar cestoviny v osolenej vode, 2 minúty pred koncom pridaj hrášok. Odlož hrnček vody z varenia.
  - Orechy krátko opraž na suchej panvici na strednom ohni, kým nezavoňajú.
  - Bazalku, orechy, cesnak, droždie, citrón, soľ a olej rozmixuj alebo roztlač v mažiari. Nemixuj príliš dlho, bazalka by stmavla.
  - Cestoviny zmiešaj s pestom a trochou vody z varenia, aby bolo krémové.
tips:
  - Pesto v pohári zalej tenkou vrstvou oleja, v chladničke vydrží týždeň.
variants:
  - name: Viac bielkovín
    description: 'K hrášku pridaj scedený cícer, prehrej ho s cestovinami.'
    add:
      - cicer-sterilizovany: 1 ks
  - name: Bez cesnaku
    description: 'Pesto bez cesnaku, pridaj viac citrónovej kôry.'
    remove: [cesnak]
