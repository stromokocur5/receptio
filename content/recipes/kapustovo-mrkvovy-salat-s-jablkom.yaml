title: Kapustovo-mrkvový šalát s jablkom
description: Chrumkavý šalát z bielej kapusty, mrkvy a jablka so sladkokyslým dresingom. K hocičomu z rúry alebo panvice, s veľa vitamínom C, za pár centov na porciu.
cuisine: slovenska
meals: [obed, vecera]
categories: [salaty/prilohove]
time: 15
active: 15
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, rychle, bez-varenia, deti]
keeps: { fridge: 3 }
ingredients:
  - biela-kapusta: 600 g
  - sol: 1 čl
  - mrkva: 3 ks
  - jablko: 2 ks
  - ocot: 3 pl
  - cukor: 1 čl
  - olej: 3 pl
  - rasca: 1/2 čl
steps:
  - Kapustu nakrájaj na tenké rezance alebo nastrúhaj. Posoľ ju a 2 minúty mies rukami, kým nepustí šťavu a nezmäkne.
  - Mrkvu a jablko nastrúhaj nahrubo, jablko aj so šupkou.
  - Pridaj ocot, cukor, olej a rascu a premiešaj.
  - Nechaj 10 minút postáť a ochutnaj – má byť sladký aj kyslý zároveň.
tips:
  - Na druhý deň je mäkší, ale stále dobrý.
