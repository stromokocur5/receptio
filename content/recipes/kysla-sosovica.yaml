title: Kyslá šošovica
description: Babkina klasika bez vajíčka a párku. Zápražka, bobkový list a ocot.
cuisine: slovenska
meals: [obed, vecera]
time: 50
active: 15
servings: 4
difficulty: 1
tags: [klasika]
keeps: { fridge: 4, freezer: 3 }
ingredients:
  - sosovica-hneda: 300 g | prepláchnutá
  - voda: 5 hrnček
  - bobkovy-list: 2 ks
  - nove-korenie: 3 ks
  - olej: 2 pl
  - cibula: 1 ks | nadrobno
  - hladka-muka: 2 pl
  - cesnak: 2 ks
  - ocot: 2 pl
  - sol: 1,5 čl
  - cierne-korenie: podľa chuti
  - zemiaky: 4 ks | varené, na prílohu
steps:
  - Šošovicu var vo vode s bobkovým listom a novým korením 30 minút do mäkka.
  - Na oleji speň cibuľu, prisyp múku a miešaj, kým nie je zápražka svetlohnedá.
  - Zápražku rozmiešaj s naberačkou vody zo šošovice a vlej do hrnca. Var 5 minút, kým nezhustne.
  - Pridaj prelisovaný cesnak, ocot, soľ a korenie. Kyslosť dolaď podľa seba.
  - Podávaj so zemiakmi alebo chlebom.
tips:
  - Bezlepková verzia. Zápražku sprav z ryžovej múky, funguje rovnako.
  - Na vajcovú chuť pridaj na tanier štipku kala namak.
