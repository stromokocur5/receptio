title: Cuketovo-pórová polievka so zemiakovými krutónmi
description: Svetlozelená krémová polievka z cukety a póru, kde sa pór najprv pomaly dusí do sladka. Bez smotany, krémová vďaka zemiaku. Navrch chrumkavé zemiakové kocky a cesnakový olej.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/kremove]
time: 35
active: 20
servings: 3
difficulty: 1
tags: [zlatica, lacne]
keeps: { fridge: 3, freezer: 2 }
ingredients:
  - por: 1 ks
  - olivovy-olej: 4 pl | 2 do polievky, 1 na krutóny, 1 na cesnakový olej
  - cuketa: 2 ks
  - zemiaky: 3 ks | 1 do polievky, 2 na krutóny
  - cesnak: 3 ks
  - voda: 800 ml
  - sol: 1,5 čl
  - bobkovy-list: 1 ks
  - citron: 1 pl
  - kopor: 2 pl
  - cierne-korenie: 1 štipka
steps:
  - Pór pozdĺžne rozrež, umy medzi vrstvami a nakrájaj na kolieska. Cuketu a jeden zemiak nakrájaj na kocky.
  - V hrnci rozohrej 2 PL oleja na miernom ohni, pridaj pór so štipkou soli a dus 8 minút, kým nie je úplne mäkký a sladký. Pridaj 2 prelisované strúčiky cesnaku, cuketu a zemiak a 2 minúty miešaj.
  - Zalej vodou, pridaj soľ a bobkový list a var 15 minút. Krátko – cuketa varená príliš dlho stratí farbu a zošedne.
  - Medzitým zvyšné dva zemiaky ošúp, nakrájaj na kocky 1 cm a na panvici s 1 PL oleja ich pod pokrievkou s 2 PL vody nechaj 5 minút, potom bez pokrievky opekaj 8 minút do chrumkava. Osoľ štipkou.
  - Posledný strúčik cesnaku prelisuj do 1 PL oleja so štipkou soli.
  - Z polievky vylov bobkový list a rozmixuj ju dohladka. Vmiešaj citrón a kôpor, ochutnaj a dosoľ. Do tanierov daj krutóny, pokvapkaj cesnakovým olejom a posyp korením.
tips:
  - Citrón nevynechaj – cuketa bez kyseliny chutí plocho.
