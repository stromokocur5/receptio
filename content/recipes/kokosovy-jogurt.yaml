title: Kokosový jogurt
description: Hustý kokosový jogurt z plechovkového mlieka zahustený štipkou tapioky. Sladkastý, smotanový, ideálny na granolu a do dezertov – bielkovín má ale minimum.
cuisine: moderna
meals: [domace, ranajky]
categories: [domace/mlieka]
time: 20
active: 15
servings: 6
difficulty: 2
tags: [urob-si-sam, fermentacia, jogurt]
ahead: Jogurt kvasí 18–24 hodín v teple a potom 6 hodín tuhne v chladničke.
yields: cca 750 g jogurtu
keeps: { fridge: 7 }
related: [kesu-jogurt, domaci-sojovy-jogurt, granola]
ingredients:
  - kokosove-mlieko: 2 ks | čo najhustejšie, bez guarovej gumy
  - tapiokovy-skrob: 1 pl | alebo 2 ČL kukuričného škrobu
  - cukor: 1 čl | potrava pre baktérie
  - sojovy-jogurt: 2 pl | s živými kultúrami, ako štartér
steps:
  - Kokosové mlieko dobre premiešaj, aby sa spojil tuk s vodou. Tapiokový škrob rozmiešaj v 3 PL studeného mlieka.
  - Zvyšok mlieka s cukrom zohrej na miernom ohni, vmiešaj škrob a za stáleho miešania var 2 minúty, kým trochu nezhustne.
  - Nechaj vychladnúť na 40–43 °C – prst v ňom vydržíš a je príjemne teplé. Vmiešaj štartér.
  - Prelej do čistých pohárov, prikry a nechaj 18–24 hodín v teple 40–43 °C. Kokosový jogurt kvasí pomalšie ako sójový.
  - Premiešaj a daj na 6 hodín do chladničky, tam stuhne. Ak sa oddelí voda, len ho premiešaj.
tips:
  - Bez sóje – štartér nahraď 2 kapsulami probiotík alebo kokosovým jogurtom z obchodu.
  - Jogurt v kovovej miske nekvas, kyselina reaguje s kovom. Sklo je najlepšie.
  - Do kokosového jogurtu je dobrý mango alebo ananás a posyp z pražených kokosových lupienkov.
