title: Paradajkový šalát, ktorý nepláva
description: Paradajky sa najprv posolia a ich šťava sa stane základom dresingu, takže šalát chutí naplno a na tanieri neostane voda. K tomu cibuľka a cesnak.
cuisine: slovenska
meals: [obed, vecera]
categories: [salaty/prilohove]
time: 15
active: 10
servings: 2
difficulty: 1
tags: [zlatica, rychle]
ingredients:
  - paradajky: 4 ks | zrelé
  - sol: 1/2 čl
  - cibula-cervena: 1/2 ks
  - cesnak: 1 ks
  - ocot: 1 čl
  - horcica: 1/2 čl
  - cukor: 1 štipka
  - olivovy-olej: 2 pl
  - petrzlenova-vnat: 2 pl | nasekaná
  - cierne-korenie: 1 štipka
steps:
  - Paradajky nakrájaj na mesiačiky, daj do sitka položeného nad miskou, posyp 1/2 ČL soli a nechaj 10 minút odkvapkať. Soľ vytiahne vodu, paradajky zhustnú v chuti – a šťava, ktorá steká do misky, je to najchutnejšie na celom šaláte.
  - Medzitým nakrájaj cibuľu na tenké pásiky.
  - Z paradajkovej šťavy v miske odober 2 PL, zvyšok vypi alebo daj do polievky. K šťave prelisuj cesnak, pridaj ocot, horčicu, cukor a korenie a za šľahania vidličkou vlej olej. Vznikne ružový hustý dresing.
  - Paradajky, cibuľu a petržlenovú vňať premiešaj s dresingom, ochutnaj a podávaj.
tips:
  - Najlepší je v lete, z paradajok, čo voňajú. Zimné paradajky z obchodu radšej upeč.
  - Paradajky nedávaj do chladničky, stratia vôňu a zmúčnatejú.
