title: Zemiaková kaša s pečenou paprikou a fazuľou na údeno
description: Hladká zemiaková kaša s cesnakom a horčicou a na nej fazuľa v hustej paradajkovej omáčke s opečenou paprikou a údenou paprikou. Sýte, lacné, v zime ako balzam.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/strukoviny, hlavne/zelenina]
time: 35
active: 25
servings: 3
difficulty: 1
tags: [zlatica, lacne]
keeps: { fridge: 3 }
leftovers: 'Fazuľu zohrej zvlášť. Zo zvyšnej kaše sprav na panvici placky a opeč ich do chrumkava.'
ingredients:
  - zemiaky: 8 ks | múčnaté (typ C), asi 1 kg
  - sol: 1/2 čl | do kaše a fazule
  - sol: ~1 pl | do vody
  - olivovy-olej: 4 pl | 2 do kaše, 2 na papriku
  - sojove-mlieko: 150 ml | teplé, alebo voda zo zemiakov
  - horcica: 1 čl
  - cesnak: 4 ks
  - paprika-cervena: 2 ks
  - cibula: 1 ks
  - paradajkovy-pretlak: 2 pl
  - udena-paprika: 1 čl
  - fazula-cervena: 1 ks | plechovka
  - fazula-biela: 1 ks | plechovka
  - voda: 300 ml
  - cukor: 1/2 čl
  - ocot: 1 čl
  - petrzlenova-vnat: 2 pl
steps:
  - Zemiaky ošúp, nakrájaj na rovnaké kusy a daj do studenej vody s 1 PL soli. Priveď do varu a var 15–20 minút, kým sa pri prepichnutí nožom nerozpadávajú.
  - Medzitým papriku nakrájaj na prúžky a cibuľu na pásiky. Na panvici rozohrej 2 PL oleja na vysokom ohni a papriku s cibuľou opekaj 7–8 minút, kým nemajú tmavé škvrny.
  - Stíš na stredný oheň, pridaj 2 prelisované strúčiky cesnaku a pretlak a minútu miešaj, kým pretlak nestmavne. Odstav, vmiešaj údenú papriku.
  - Pridaj scedenú prepláchnutú fazuľu, 300 ml vody, cukor a štipku soli. Var na miernom ohni 10 minút bez pokrievky, kým omáčka nezhustne a nepokrýva fazuľu. Vmiešaj ocot.
  - Zemiaky sceď a nechaj minútu vyparovať v hrnci. Roztlač ich štuchadlom s teplým mliekom, 2 PL oleja, horčicou, 2 prelisovanými strúčikmi cesnaku a 1/2 ČL soli. Mixérom nie – zemiaky by z neho boli gumové. Ochutnaj, kaša má byť výrazná, nie mdlá.
  - Kašu rozotri do tanierov, sprav v nej jamku a nalej do nej fazuľu s paprikou. Posyp vňaťou.
tips:
  - Studené mlieko kašu ochladí a spraví lepkavou, preto ho zohrej.
