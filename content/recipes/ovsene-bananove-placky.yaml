title: Ovsené placky z banánu z mixéra
description: Malé hrubé placky z vločiek, banánu a mlieka – všetko hodíš do mixéra, múku ani cukor netreba. Deti ich jedia ako lievance, s jogurtom a jablkom sú to poriadne raňajky.
cuisine: moderna
meals: [ranajky, snack]
categories: [ranajky/palacinky]
time: 35
active: 30
servings: 7
difficulty: 1
tags: [nasarodinka, deti, lacne]
keeps: { fridge: 3, freezer: 2 }
ingredients:
  - ovsene-vlocky: 300 g
  - banan: 4 ks | zrelé
  - sojove-mlieko: 600 ml
  - kypriaci-prasok: 2 čl
  - skorica: 1 čl
  - sol: 1 štipka
  - olej: 2 pl | na panvicu
  - sojovy-jogurt: 400 g | na podávanie
  - jablko: 2 ks | na podávanie
steps:
  - Vločky, banány, mlieko, prášok do pečiva, škoricu a soľ rozmixuj na hladké cesto. Nechaj 5 minút postáť, vločky ho zahustia.
  - Rúru zapni na 80 °C, budeš v nej držať hotové placky teplé.
  - Veľkú panvicu zohrej na strednom ohni a potri ju tenko olejom. Na každú placku nalej 2 lyžice cesta a rozotri na kruh asi 8 cm. Naraz sa ich zmestia štyri.
  - Peč 2–3 minúty, kým sa na povrchu neurobia bublinky a okraje nezmatnejú, potom otoč a peč ešte 1–2 minúty. Hotové ukladaj na tanier do rúry. Pred každou dávkou panvicu znova tenko potri olejom.
  - Jablká nakrájaj na tenké mesiačiky a podávaj s plackami a jogurtom.
tips:
  - Z tohto množstva je asi 28 placiek. Ak sa ti trhajú pri otáčaní, panvica je málo horúca alebo ich otáčaš priskoro.
  - Vychladnuté placky sa dajú zamraziť a ráno ohriať v hriankovači.
