title: Opekané klobásky s cibuľou a zemiakmi
description: Klobásky opečené s kopou karamelizovanej cibule a zemiakmi na plechu. S horčicou a chlebom – jednoduchá večera, ktorá zasýti.
cuisine: slovenska
meals: [obed, vecera]
categories: [comfort/bufet, hlavne/rura, hlavne/tofu]
time: 50
active: 15
servings: 4
difficulty: 1
tags: [klasika, vela-bielkovin]
keeps: { fridge: 3 }
related: [grilovacie-klobasky, domace-parky]
ingredients:
  - lepok-vital: 160 g | na 8 klobások, alebo daj 8 kúpených
  - vyzivne-drozdie: 1 pl
  - udena-paprika: 2 čl
  - majoranka: 1 čl
  - sojova-omacka: 2 pl
  - voda: 160 ml
  - zemiaky: 6 ks
  - cibula: 3 ks
  - olej: 3 pl
  - rasca: 1 čl
  - sol: 1 čl
  - horcica: 4 čl
steps:
  - Ak nemáš hotové klobásky, sprav ich podľa receptu Grilovacie klobásky (alebo zjednodušene – lepok, droždie, paprika, majoránka, sójová omáčka a voda, valčeky v alobale 40 minút na pare).
  - Rúru predhrej na 210 °C.
  - Zemiaky nakrájaj na mesiačiky, premiešaj s 2 PL oleja, rascou a soľou a peč na plechu 20 minút.
  - Cibuľu nakrájaj na hrubé mesiačiky. Klobásky nareži šikmo.
  - Pridaj na plech cibuľu a klobásky, pokvapkaj zvyšným olejom a peč ďalších 20 minút, kým cibuľa nezhnedne a klobásky nemajú kôrku.
  - Podávaj s horčicou a chlebom.
