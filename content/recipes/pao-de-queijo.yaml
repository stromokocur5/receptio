title: Pão de queijo
description: Brazílske syrové guličky z tapiokového škrobu – chrumkavé zvonka, ťahavé vnútri. Vegánske so zemiakom a výživným droždím.
cuisine: brazilska
meals: [snack, ranajky]
categories: [snacky/slane, prilohy/chlieb]
time: 40
active: 15
servings: 4
difficulty: 2
tags: [snack, party, pecenie]
spicy: 0
keeps: { fridge: 2, freezer: 3 }
leftovers: 'Surové guličky zamraz a peč rovno z mrazu o 5 minút dlhšie.'
ingredients:
  - tapiokovy-skrob: 200 g
  - zemiaky: 1 ks | uvarený a roztlačený
  - sojove-mlieko: 120 ml
  - olej: 60 ml
  - sol: 3/4 čl
  - vyzivne-drozdie: 3 pl
  - vegansky-syr: 1/2 hrnček | strúhaný, nepovinný
steps:
  - Mlieko, olej a soľ priveď do varu a zalej ním škrob. Premiešaj varechou – vznikne lepkavá hrudkovitá hmota. Nechaj 10 minút vychladnúť.
  - Pridaj zemiak, droždie a syr a rukami vymies hladké lepivé cesto.
  - Namočenými rukami tvaruj guličky veľké ako orech a klaď na plech s papierom.
  - Peč na 200 °C 20–25 minút, kým nie sú nafúknuté a zlatisté. Najlepšie sú teplé.
