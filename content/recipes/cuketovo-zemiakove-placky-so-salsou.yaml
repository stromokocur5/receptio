title: Cuketovo-zemiakové placky s paradajkovou salsou
description: Chrumkavé placky z nastrúhanej cukety a zemiakov, bez múky a bez vajec, s cesnakom a majoránkou. Navrch studená salsa z odkvapkaných paradajok a cibule. Studené na teplom, chrumkavé so šťavnatým.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/zelenina, ranajky/slane]
time: 40
active: 35
servings: 2
difficulty: 2
tags: [zlatica]
ingredients:
  - cuketa: 1 ks | stredná
  - zemiaky: 3 ks | múčnaté
  - sol: 1 čl | 1/2 na cuketu, zvyšok do ciesta a salsy
  - cesnak: 3 ks | 2 do placiek, 1 do salsy
  - majoranka: 1 čl
  - cierne-korenie: 1/2 čl
  - kukuricny-skrob: 3 pl
  - olej: 3 pl
  - paradajky: 3 ks
  - cibula-cervena: 1/2 ks
  - ocot: 1 čl
  - olivovy-olej: 1 pl
  - petrzlenova-vnat: 2 pl
steps:
  - Cuketu nastrúhaj na hrubom strúhadle, premiešaj s 1/2 ČL soli a nechaj 10 minút v sitku.
  - Medzitým salsa – paradajky nakrájaj na malé kocky, posoľ štipkou a daj odkvapkať do druhého sitka. Cibuľu nakrájaj nadrobno.
  - Zemiaky ošúp a nastrúhaj na hrubom strúhadle. Zemiaky aj cuketu spolu zabaľ do utierky a vyžmýkaj čo najsilnejšie nad miskou. Po minúte sa na dne vytlačenej tekutiny usadí biely škrob – vodu zlej a škrob vráť k zelenine. Suchá zelenina = chrumkavé placky, mokrá = rozpadnuté.
  - Pridaj 2 prelisované strúčiky cesnaku, majoránku, korenie, štipku soli a kukuričný škrob a premiešaj.
  - Na panvici rozohrej 1,5 PL oleja na strednom ohni. Daj na ňu kôpky cesta po lyžici a stlač ich na tenké placky. Peč 4–5 minút bez hýbania, kým nie sú spodky tmavozlaté, otoč a peč ďalšie 4 minúty. Rob v dvoch dávkach, druhú na zvyšnom oleji.
  - Salsu dokonči – paradajky zmiešaj s cibuľou, prelisovaným strúčikom cesnaku, octom, olivovým olejom a vňaťou. Na horúce placky daj salsu až pri jedle.
tips:
  - Placky ukladaj po upečení na mriežku alebo papierovú utierku, nie na seba – zospodu by zmäkli.
