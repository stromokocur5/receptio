title: Mrkvová nátierka so slnečnicovými semienkami
description: Sladkastá oranžová nátierka z opražených semienok a jemne strúhanej mrkvy. Stojí menej ako maslo a syr pre sedem ľudí a deti ju na chlebe jedia bez vypytovania.
cuisine: slovenska
meals: [ranajky, snack]
categories: [omacky/dipy, ranajky/slane]
time: 15
active: 15
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, rychle, deti, do-krabicky]
keeps: { fridge: 4 }
ingredients:
  - slnecnicove-semienka: 150 g
  - mrkva: 4 ks
  - cesnak: 1 ks
  - citron: 2 pl | šťava
  - olej: 2 pl
  - voda: 4 pl
  - sol: 3/4 čl
  - sladka-paprika: 1 čl
  - chlieb: 14 ks | na podávanie
steps:
  - Semienka opraž na suchej panvici na strednom ohni 4–5 minút za stáleho miešania, kým nezačnú voňať a zlatnúť. Hneď ich presyp na tanier, na panvici by zhoreli.
  - Mrkvu ošúp a nastrúhaj na najjemnejšom strúhadle.
  - Vychladnuté semienka rozmixuj s cesnakom, citrónovou šťavou, olejom, vodou, soľou a paprikou na hrubú pastu.
  - Vmiešaj mrkvu a ochutnaj. Ak je hustá, pridaj lyžicu vody, ak mdlá, štipku soli alebo kvapku citrónu.
  - Natri na chlieb.
tips:
  - Na tyčový mixér daj semienka s tekutinami do vysokej nádoby, inak sa rozletia.
