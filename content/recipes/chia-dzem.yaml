title: Chia džem
description: Džem bez varenia za 10 minút – rozmixované ovocie zahustené chia semienkami. Menej cukru, viac ovocia.
cuisine: moderna
meals: [ranajky, snack]
categories: [domace/zavarane, ranajky/kase]
time: 30
active: 10
servings: 8
difficulty: 1
tags: [rychle, bez-varenia, urob-si-sam]
ahead: Zhustne za 20 minút.
keeps: { fridge: 7, freezer: 3 }
howto: [dzemy-a-lekvare]
ingredients:
  - jahody: 2 hrnček | alebo maliny, aj mrazené
  - chia: 3 pl
  - javorovy-sirup: 2 pl
  - citron: 1 pl
steps:
  - Ovocie roztlač vidličkou alebo krátko rozmixuj. Mrazené nechaj najprv rozmraziť.
  - Vmiešaj chia, sirup a citrón a nechaj 20 minút odstáť. Ešte raz premiešaj, aby sa chia nezlepila.
  - Prelej do pohára a daj do chladničky. Do rána ešte zhustne.
tips:
  - Teplá verzia – ovocie najprv 5 minút povar, potom vmiešaj chia. Je hladšia a vydrží o pár dní dlhšie.
