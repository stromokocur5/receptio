title: Reďkovkový šalát s chrumkavým cícerom na údeno
description: Ľadový šalát a reďkovky v cesnakovo-citrónovom dresingu a navrch teplý cícer z panvice, ktorý chrumká ako oriešky. Rýchly obed s poriadnou porciou bielkovín.
cuisine: slovenska
meals: [obed, vecera]
categories: [salaty/syte]
time: 20
active: 20
servings: 2
difficulty: 1
tags: [rychle]
ingredients:
  - cicer-sterilizovany: 1 ks | plechovka
  - olivovy-olej: 4 pl | 2 na cícer, 2 do dresingu
  - udena-paprika: 1 čl
  - sol: 1/2 čl
  - salat: 200 g | ľadový, asi pol hlávky
  - redkovka: 10 ks
  - cesnak: 1 ks
  - citron: 1/2 ks
  - horcica: 1 čl
  - pazitka: 2 pl | nasekaná
  - cierne-korenie: 1 štipka
steps:
  - Cícer sceď, prepláchni a poriadne vysuš v čistej utierke – pošúchaj ho v nej, šupky, ktoré odpadnú, vyhoď. Mokrý cícer v oleji iba prská a nikdy nechrumkne.
  - Na panvici rozohrej 2 PL oleja na vyššom strednom ohni, pridaj cícer v jednej vrstve a opekaj 10–12 minút, každé 2–3 minúty panvicou potras. Hotový je, keď je zlatohnedý a pri hryznutí chrumká. Odstav z ohňa, posyp údenou paprikou a 1/4 ČL soli a premiešaj – paprika v teple panvice zavonia, na plameni by zhorkla.
  - Kým sa cícer opeká, sprav dresing. Cesnak prelisuj do misky, pridaj štipku soli a lyžicou ho rozotri na kašu. Pridaj citrónovú šťavu a horčicu a za šľahania vidličkou po troškách prilievaj 2 PL oleja, kým dresing nezhustne.
  - Šalát natrhaj na kúsky, umy a dobre osuš – na mokrých listoch dresing nedrží. Reďkovky nakrájaj na tenké plátky.
  - Tesne pred jedlom premiešaj šalát a reďkovky s dresingom, ochutnaj a podľa potreby dosoľ. Navrch daj teplý cícer, pažítku a čierne korenie.
tips:
  - Cícer chrumká len pár hodín. Ak ho robíš do zásoby, nechaj ho vychladnúť na tanieri, nie v krabičke.
  - Šalát s dresingom miešaj až pred jedlom, ľadový šalát v kyseline rýchlo zvädne.
