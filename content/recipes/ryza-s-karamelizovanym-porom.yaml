title: Ryža s karamelizovaným pórom, fazuľou a opraženými semienkami
description: Sypká ryža a k nej pór opečený pomaly do sladka a nakoniec sprudka do hneda, s cesnakom, fazuľou a kvapkou octu. Chrumkavé semienka navrch. Za 25 minút.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/ryza]
time: 25
active: 20
servings: 2
difficulty: 1
tags: [zlatica, rychle, lacne]
keeps: { fridge: 3 }
leftovers: 'Studená ryža s pórom sa dá opiecť na panvici na oleji ako smažená ryža.'
ingredients:
  - ryza-basmati: 150 g
  - voda: 300 ml
  - sol: 3/4 čl
  - por: 2 ks
  - olej: 2 pl
  - cesnak: 2 ks
  - majoranka: 1/2 čl
  - fazula-biela: 1 ks | plechovka, scedená a prepláchnutá
  - ocot: 1 čl
  - horcica: 1 čl
  - slnecnicove-semienka: 3 pl
  - petrzlenova-vnat: 2 pl
  - cierne-korenie: 1 štipka
steps:
  - Ryžu prepláchni v sitku, kým voda nie je číra – zmyje sa škrob, ktorý by ryžu zlepil. Zalej 300 ml vody, pridaj štipku soli, priveď do varu a pod pokrievkou var na najmiernejšom ohni 12 minút. Odstav a nechaj prikrytú ďalších 5 minút. Nemiešaj ju.
  - Medzitým pór pozdĺžne rozrež, umy medzi vrstvami a nakrájaj na kolieska hrubé 1 cm. Na panvici rozohrej olej na strednom ohni, pridaj pór a 1/2 ČL soli a za občasného miešania ho opekaj 8 minút, kým nezmäkne.
  - Zvýš oheň na vysoký a pór 3–4 minúty nechaj opekať, len občas premiešaj, kým nemá tmavohnedé okraje. Najprv sa v ňom pomaly uvoľní cukor, potom sa sprudka skaramelizuje – vďaka tomu chutí ako opečená cibuľka.
  - Stíš oheň, pridaj prelisovaný cesnak, majoránku, fazuľu a semienka a miešaj 2 minúty, kým sa fazuľa neprehreje. Vmiešaj horčicu a ocot.
  - Ryžu prehrabni vidličkou, pridaj ju k póru a premiešaj. Ochutnaj, dosoľ a podávaj s vňaťou a korením. Ku kapustovému alebo uhorkovému šalátu.
tips:
  - Ryžu nemiešaj, kým sa varí, a neotváraj pokrievku. Para ju dovarí a zrnká ostanú samostatné.
