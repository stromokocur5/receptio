title: Kokosová kari polievka s hubami a čínskou kapustou
description: Rýchla hustá polievka z kokosového mlieka s červenou kari pastou, šampiňónmi a kapustou. Na stole za 25 minút.
cuisine: thajska
meals: [obed, vecera]
categories: [polievky/azijske]
time: 25
active: 15
servings: 4
difficulty: 1
tags: [rychle, polievka, one-pot]
spicy: 2
keeps: { fridge: 3 }
leftovers: 'Zohrej pomaly, kapusta zmäkne, chuti to neuškodí.'
ingredients:
  - olej: 1 pl
  - cervena-kari-pasta: 2 pl | skontroluj, či je bez rybacej omáčky
  - cesnak: 2 ks | nasekaný
  - zazvor: 1 pl | nastrúhaný
  - sampinony: 300 g | na plátky
  - kokosove-mlieko: 1 ks
  - zeleninovy-vyvar: 3 hrnček
  - cinska-kapusta: 300 g | na prúžky
  - ryzove-rezance: 100 g | nepovinné, na sýtejšiu polievku
  - sojova-omacka: 1 pl
  - javorovy-sirup: 1 čl
  - limetka: 1 ks
steps:
  - V hrnci rozohrej olej na strednom ohni, pridaj kari pastu, cesnak a zázvor a miešaj 1 minútu, kým nezavoňajú.
  - Pridaj huby a opekaj 3 minúty.
  - Vlej kokosové mlieko a vývar, priveď do varu a var 5 minút.
  - Pridaj kapustu a rezance a var 4 minúty, kým rezance nezmäknú.
  - Dochuť sójovou omáčkou, sirupom a limetkovou šťavou. Vývar je slaný, preto sójovú omáčku pridávaj postupne a ochutnávaj.
tips:
  - Bezlepková verzia – tamari namiesto sójovej omáčky.
