title: Karfiol pečený do tmava s cícerom a horčicovou omáčkou
description: Karfiol na rozpálenom plechu, kým nemá tmavohnedé, skoro orieškové okraje, a s ním cícer, ktorý chrumká. Zalieva sa hustou horčicovo-cesnakovou omáčkou. Jeden plech, žiadne umývanie hrncov.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/rura, hlavne/zelenina]
time: 45
active: 15
servings: 2
difficulty: 1
tags: [meal-prep]
keeps: { fridge: 3 }
leftovers: 'Prehrej v rúre alebo air fryeri na 200 °C 6 minút, omáčku daj až potom.'
ingredients:
  - karfiol: 1 ks | stredný
  - cicer-sterilizovany: 1 ks | plechovka
  - olivovy-olej: 5 pl | 3 na plech, 2 do omáčky
  - sol: 3/4 čl
  - udena-paprika: 1 čl
  - sladka-paprika: 1 čl
  - cibula-cervena: 1 ks
  - horcica: 1 pl
  - citron: 1 ks | šťava
  - cesnak: 1 ks
  - voda: 2 pl
  - petrzlenova-vnat: 3 pl
  - cierne-korenie: 1 štipka
steps:
  - Rúru predhrej na 230 °C aj s plechom vnútri. Rozpálený plech začne karfiol opekať hneď, ako sa ho dotkne – na studenom by sa najprv dusil.
  - Karfiol rozober na ružičky a väčšie prekroj tak, aby mali jednu rovnú stranu. Cícer sceď, prepláchni a vysuš v utierke. Cibuľu nakrájaj na hrubé mesiačiky.
  - V miske premiešaj karfiol, cícer a cibuľu s 3 PL oleja, soľou a oboma paprikami, kým nie je všetko lesklé.
  - Plech vyber, vylož papierom a zeleninu rozlož v jednej vrstve, ružičky rovnou stranou dole. Peč 30–35 minút, v polovici obráť. Hotové je, keď má karfiol tmavohnedé okraje a cícer je chrumkavý. Nevyber ho skôr – svetlý karfiol chutí po varenom, tmavý po opražených orieškoch.
  - Medzitým omáčka – do misky prelisuj cesnak, pridaj horčicu, polovicu citrónovej šťavy a vodu a za šľahania vidličkou vlej 2 PL oleja. Má byť hustá a krémová, ak je príliš hustá, pridaj lyžicu vody.
  - Upečenú zeleninu pokvapkaj zvyškom citróna, posyp vňaťou a korením a polej horčicovou omáčkou.
tips:
  - Karfiol pred pečením poriadne osuš. Kvapky vody na plechu sa menia na paru.
  - Ak chceš sýtejšiu porciu, podávaj s ryžou alebo pečenými zemiakmi na druhom plechu.
