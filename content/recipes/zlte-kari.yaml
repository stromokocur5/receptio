title: Žlté kari
description: Jemné thajské kari s kurkumou, zemiakmi, mrkvou a cibuľou. Ideálne prvé kari pre deti.
cuisine: thajska
meals: [obed, vecera]
categories: [hlavne/kari]
time: 40
active: 15
servings: 4
difficulty: 1
tags: [deti, one-pot, lacne]
spicy: 1
keeps: { fridge: 4, freezer: 2 }
ingredients:
  - olej: 1 pl
  - kari-korenie: 1 pl
  - kurkuma: 1 čl
  - citronova-trava: 1 ks | rozdrvená
  - cesnak: 3 ks
  - zazvor: 1 pl
  - kokosove-mlieko: 400 ml
  - voda: 300 ml
  - zemiaky: 3 ks | na kocky
  - mrkva: 2 ks
  - cibula: 1 ks
  - cicer-sterilizovany: 1 ks
  - sojova-omacka: 1 pl
  - cukor: 1 čl
  - sol: 1/2 čl
  - ryza-jazminova: 300 g
steps:
  - Ryžu prepláchni, zalej 450 ml vody, pridaj štipku soli, priveď do varu, prikry a var na miernom ohni 12 minút. Nechaj prikrytú dôjsť, kým dokončíš zvyšok.
  - Na oleji na strednom ohni opraž kari, kurkumu, citrónovú trávu, cesnak a zázvor minútu.
  - Pridaj kokosové mlieko, vodu, zemiaky, mrkvu a cibuľu a var na miernom ohni 20 minút.
  - Pridaj cícer, sójovú omáčku, cukor a soľ a var na miernom ohni 5 minút. Podávaj s ryžou.
