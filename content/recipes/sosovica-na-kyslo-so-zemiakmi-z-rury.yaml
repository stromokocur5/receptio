title: Šošovica na kyslo so zemiakmi z rúry a kyslou uhorkou
description: Babkina šošovica na kyslo bez múčnej zápražky – zahustí ju rozmixovaná časť šošovice. K tomu chrumkavé zemiaky z rúry namiesto vareného chleba a kyslá uhorka.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/strukoviny]
time: 50
active: 20
servings: 4
difficulty: 1
tags: [klasika, lacne]
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Šošovica zhustne, zohrej ju s vodou. Zemiaky prehrej v rúre, nie v mikrovlnke.'
ingredients:
  - sosovica-hneda: 250 g
  - voda: 1 l
  - bobkovy-list: 2 ks
  - nove-korenie: 3 ks
  - zemiaky: 8 ks
  - olej: 4 pl | 2 na zemiaky, 2 do šošovice
  - sol: 1,5 čl
  - sladka-paprika: 1 čl
  - cibula: 1 ks
  - cesnak: 3 ks
  - horcica: 1 pl
  - ocot: 2 pl
  - cukor: 1 čl
  - cierne-korenie: 1/2 čl
  - kysle-uhorky: 4 ks
  - petrzlenova-vnat: 2 pl
steps:
  - Šošovicu prepláchni, zalej 1 l vody, pridaj bobkové listy a nové korenie a var na miernom ohni 25–30 minút do mäkka. Soľ zatiaľ nepridávaj, v slanej vode mäkne pomalšie.
  - Medzitým rúru predhrej na 220 °C. Zemiaky neošúpané nakrájaj na mesiačiky, premiešaj s 2 PL oleja, 1/2 ČL soli a sladkou paprikou a rozlož na plech s papierom v jednej vrstve. Peč 35 minút, v polovici otoč.
  - Cibuľu nakrájaj nadrobno. Na panvici rozohrej 2 PL oleja a cibuľu restuj na strednom ohni 8 minút dozlata, posledné 2 minúty s prelisovaným cesnakom.
  - Zo šošovice vylov korenie. Naberačku šošovice aj s vodou rozmixuj dohladka a vlej späť – zahustí ju lepšie ako múka. Pridaj cibuľu, horčicu, ocot, cukor, zvyšok soli a korenie a var ešte 5 minút.
  - Ochutnaj. Má byť výrazne kyslá aj trochu sladká. Ak je mdlá, pridaj ocot alebo soľ po troškách. Podávaj so zemiakmi, kyslými uhorkami a vňaťou.
tips:
  - Hnedú šošovicu netreba namáčať. Ak je stará, varí sa dlhšie, skús ju po 25 minútach.
