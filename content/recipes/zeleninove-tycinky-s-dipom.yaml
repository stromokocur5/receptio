title: Zeleninové tyčinky s arašidovým dipom
description: Mrkva, uhorka, paprika a kaleráb nakrájané na tyčinky a k tomu hustý arašidový dip s limetkou. Zelenina, ktorú deti naozaj zjedia.
cuisine: thajska
meals: [snack]
categories: [snacky/slane, snacky/na-cesty, omacky/dipy]
time: 15
active: 15
servings: 4
difficulty: 1
tags: [bez-varenia, rychle, deti, do-krabicky]
keeps: { fridge: 4, freezer: 0 }
ingredients:
  - mrkva: 2 ks
  - uhorka: 1 ks
  - paprika-cervena: 1 ks
  - kalerab: 1 ks
  - arasidove-maslo: 4 pl
  - sojova-omacka: 1 pl
  - limetka: 1/2 ks
  - javorovy-sirup: 1 čl
  - zazvor: 1 čl | nastrúhaný
  - voda: 3 pl | teplá
steps:
  - Zeleninu očisti a nakrájaj na tyčinky dlhé ako prst.
  - Arašidové maslo vymiešaj so sójovou omáčkou, limetkovou šťavou, sirupom a zázvorom. Po lyžiciach prilievaj teplú vodu, kým dip nie je hustý ako jogurt.
  - Podávaj tyčinky okolo misky s dipom.
tips:
  - Do krabičky daj dip do malého pohára a tyčinky postav do neho – nič sa nevyleje a zelenina ostane chrumkavá.
  - Nakrájaná zelenina vydrží v chladničke 4 dni v dóze s kúskom mokrej utierky.
