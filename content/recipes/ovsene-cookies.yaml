title: Ovsené cookies s arašidovým maslom
description: Päť surovín, jedna miska, dvanásť minút v rúre. Mäkké vnútri, s kúskami horkej čokolády.
cuisine: americka
meals: [dezert, snack]
time: 25
active: 10
servings: 12
difficulty: 1
tags: [pecenie]
ingredients:
  - banan: 1 ks | zrelý
  - arasidove-maslo: 6 pl
  - javorovy-sirup: 3 pl
  - ovsene-vlocky: 150 g
  - kypriaci-prasok: 1/2 čl
  - skorica: 1/2 čl
  - sol: 1 štipka
  - horka-cokolada: 50 g | nasekaná
steps:
  - Rúru predhrej na 180 °C.
  - Banán roztlač a zmiešaj s arašidovým maslom a sirupom.
  - Pridaj vločky, prášok do pečiva, škoricu, soľ a čokoládu.
  - Lyžicou tvaruj 12 kôpok na plech s papierom a mierne ich stlač.
  - Peč 12 minút. Po upečení sú mäkké, stuhnú až po vychladnutí.
