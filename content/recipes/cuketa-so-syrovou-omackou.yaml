title: Opečená cuketa so „syrovou“ omáčkou zo zemiaka
description: Cuketa nasolená, vysušená a opečená sprudka do hneda, nie len trochu ohriata. Polieva sa krémovou žltou omáčkou zo zemiaka a mrkvy, ktorá sa ťahá a chutí slano-kyslo ako syrová. Bez syra a bez náhrad z obchodu.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/zelenina, omacky/omacky]
time: 30
active: 25
servings: 2
difficulty: 1
tags: [zlatica, rychle]
keeps: { fridge: 3 }
leftovers: 'Omáčka v chladničke stuhne. Zohrej ju na panvici s lyžicou vody a stále miešaj, zas bude krémová.'
ingredients:
  - cuketa: 2 ks | stredné
  - sol: 1 čl | 1/2 na cuketu, 1/2 do omáčky
  - olej: 2 pl | na opekanie
  - zemiaky: 1 ks | múčnatý, stredný
  - mrkva: 1 ks
  - voda: 500 ml | na varenie, z nej 100 ml do omáčky
  - olivovy-olej: 2 pl
  - cesnak: 2 ks | 1 do omáčky, 1 na cuketu
  - horcica: 1 čl
  - citron: 1 pl
  - udena-paprika: 1/2 čl
  - kurkuma: 1 štipka | len pre farbu
  - cierne-korenie: 1 štipka
  - petrzlenova-vnat: 1 pl
steps:
  - Cuketu nakrájaj na kolieska hrubé 1,5 cm (tenšie by sa rozpadli skôr, než zhnednú). Rozlož ich na utierku, posyp 1/2 ČL soli a nechaj 10 minút. Soľ vytiahne vodu – na povrchu uvidíš kvapky. Potom kolieska z oboch strán dôkladne osuš utierkou. Toto je celý trik – mokrá cuketa sa na panvici dusí a ostane bledá a slizká.
  - Kým cuketa púšťa vodu, zemiak ošúp, nakrájaj ho aj s mrkvou na malé kocky a var v 500 ml vody 10–12 minút, kým nie sú úplne mäkké.
  - Na veľkej panvici rozohrej olej na vysokom ohni, kým sa nezačne vlniť. Kolieska polož v jednej vrstve s medzerami (radšej v dvoch dávkach). Nehýb nimi 3–4 minúty, kým nie sú tmavozlaté, potom otoč a opeč ďalšie 3 minúty. Na poslednú minútu pridaj 1 prelisovaný strúčik cesnaku a pretras.
  - Zemiak s mrkvou sceď, ale odober si 100 ml vody z varenia. Daj ich do vysokej nádoby s olivovým olejom, druhým strúčikom cesnaku, horčicou, citrónom, 1/2 ČL soli, údenou paprikou, kurkumou a vodou z varenia. Rozmixuj tyčovým mixérom, kým nie je hladká a lesklá, asi minútu. Škrob zo zemiaka spraví omáčku ťahavú ako roztopený syr, horčica s citrónom jej dajú tú syrovú kyslosť.
  - Ochutnaj omáčku – ak chutí mdlo, pridaj štipku soli alebo kvapku citróna. Polej ňou cuketu na tanieri, posyp vňaťou a čiernym korením.
tips:
  - Omáčku nemixuj dlhšie ako treba, kým je teplá. Čím dlhšie, tým ťahavejšia – a nakoniec až gumová.
  - Rovnakou omáčkou zalej hranolky, brokolicu alebo opečené zemiaky.
