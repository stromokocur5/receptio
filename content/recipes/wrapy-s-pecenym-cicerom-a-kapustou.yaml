title: Wrapy s pečeným cícerom, kapustou a cesnakovým dresingom
description: Chrumkavý cícer z rúry na rasci a paprike, rýchlo naložená kapusta s mrkvou a cesnakový jogurt v tortille. Každý si poskladá svoj, takže sa nikto nesťažuje.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/plnene]
time: 40
active: 20
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, vela-bielkovin, deti]
ingredients:
  - cicer-sterilizovany: 3 ks | scedený
  - olej: 3 pl
  - sladka-paprika: 2 čl
  - kmin: 1 čl
  - sol: 1,5 čl
  - biela-kapusta: 400 g
  - mrkva: 2 ks
  - ocot: 2 pl
  - paradajky: 3 ks
  - uhorka: 1 ks
  - sojovy-jogurt: 300 g | nesladený
  - cesnak: 2 ks
  - psenicne-tortilly: 14 ks
steps:
  - Rúru predhrej na 220 °C. Cícer osuš utierkou, premiešaj s olejom, paprikou, rascou a 1 lyžičkou soli a rozlož na plech s papierom.
  - Peč 20–25 minút, v polovici plechom zatras. Cícer má byť na povrchu chrumkavý.
  - Medzitým nakrájaj kapustu na tenké rezance a mrkvu nastrúhaj. Pridaj ocot a zvyšnú soľ a minútu ich mies rukami, kým kapusta nezmäkne a nepustí šťavu.
  - Paradajky a uhorku nakrájaj na kocky. Jogurt zmiešaj s prelisovaným cesnakom a štipkou soli.
  - Tortilly zohrej po jednej na suchej panvici 20 sekúnd z každej strany a prikry ich utierkou, nech nevyschnú.
  - Na stôl daj všetko zvlášť. Na tortillu sa natrie jogurt, navrch kapusta, zelenina a cícer, potom sa zroluje.
tips:
  - Cícer chrumká len krátko. Do wrapov ho daj hneď, v krabičke zmäkne.
