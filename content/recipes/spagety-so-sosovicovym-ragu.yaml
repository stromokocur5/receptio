title: Špagety s rýchlym šošovicovým ragú
description: Bolonská omáčka z červenej šošovice, mrkvy a paradajok za 20 minút varenia. Šošovica sa rozvarí do hustej omáčky, ktorá vyzerá aj chutí ako mäsová – a stojí zlomok.
cuisine: talianska
meals: [obed, vecera]
categories: [hlavne/cestoviny]
time: 40
active: 20
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, deti, vela-bielkovin, meal-prep]
keeps: { fridge: 4, freezer: 3 }
ingredients:
  - olej: 3 pl
  - cibula: 2 ks
  - mrkva: 3 ks
  - cesnak: 4 ks
  - paradajkovy-pretlak: 3 pl
  - sosovica-cervena: 300 g
  - paradajky-sterilizovane: 2 ks
  - voda: 700 ml
  - sol: 2 čl
  - oregano: 2 čl
  - sladka-paprika: 1 čl
  - cukor: 1 čl
  - sojova-omacka: 2 pl
  - cierne-korenie: 1/4 čl
  - cestoviny: 700 g | špagety
  - sol: ~1 pl | do vody na cestoviny
steps:
  - Cibuľu nakrájaj nadrobno a mrkvu nastrúhaj nahrubo. Šošovicu prepláchni v sitku.
  - V širokom hrnci zohrej olej na strednom ohni. Cibuľu a mrkvu opekaj 8 minút, kým nezmäknú a nezačnú zlatnúť.
  - Pridaj prelisovaný cesnak a pretlak a miešaj minútu, kým pretlak nestmavne.
  - Pridaj šošovicu, paradajky, vodu, soľ, oregano, papriku, cukor a sójovú omáčku. Priveď do varu, stíš na mierny oheň a var prikryté 20 minút, občas premiešaj aj dno. Šošovica sa rozvarí a omáčka zhustne.
  - Hneď ako omáčka začne variť, postav na sporák veľký hrniec so 4 litrami vody. Keď zovrie, osoľ ju a var špagety podľa obalu, zvyčajne 9–10 minút. Sceď ich.
  - Omáčku okoreň, ochutnaj soľ a podávaj na špagetách.
tips:
  - Ak je omáčka priveľmi hustá, rozrieď ju trochou vody z cestovín.
