title: Shorbat adas
description: Libanonská šošovicová polievka s kmínom a citrónom, podávaná s chrumkavou pitou a karamelizovanou cibuľou.
cuisine: libanonska
meals: [obed, vecera]
categories: [polievky/strukovinove]
time: 45
active: 20
servings: 4
difficulty: 1
tags: [polievka, lacne, one-pot]
spicy: 0
keeps: { fridge: 4, freezer: 3 }
ingredients:
  - olivovy-olej: 3 pl
  - cibula: 2 ks
  - mrkva: 1 ks
  - cesnak: 3 ks
  - kmin: 2 čl
  - kurkuma: 1/2 čl
  - sosovica-cervena: 250 g
  - zeleninovy-vyvar: 1,2 l
  - citron: 1 ks
  - sol: podľa chuti | vývar je už slaný
  - pita: 2 ks
steps:
  - Jednu cibuľu nakrájaj na mesiačiky a opekaj na 1 PL oleja na miernom ohni asi 15 minút do karamelova. Daj bokom.
  - Na zvyšnom oleji na strednom ohni speň druhú cibuľu, mrkvu a cesnak, pridaj kmín a kurkumu.
  - Pridaj šošovicu a vývar a var na miernom ohni 20 minút. Rozmixuj dohladka.
  - Pitu natrhaj na kúsky a opeč na suchej panvici alebo v rúre na 200 °C 6–8 minút dochrumkava.
  - Polievku dochuť citrónom, dosoľ len ak treba a podávaj s cibuľou a pitou.
