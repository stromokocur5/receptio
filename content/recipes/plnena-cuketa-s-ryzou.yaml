title: Plnená cuketa s ryžou zapečená v paradajkovej omáčke
description: Vydlabané cuketové lodičky najprv krátko upečené, aby pustili vodu, potom plnené ryžou, opečenou cibuľou a vnútrom cukety. Zapečené v hustej paradajkovej omáčke, navrchu do zlatista.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/rura, hlavne/plnene]
time: 60
active: 25
servings: 3
difficulty: 2
tags: [zlatica, meal-prep]
keeps: { fridge: 3 }
ingredients:
  - cuketa: 3 ks | stredné, rovné
  - sol: 1,5 čl
  - olivovy-olej: 3 pl
  - ryza-basmati: 150 g
  - voda: 500 ml | 300 na ryžu, 150 do omáčky
  - cibula: 1 ks
  - cesnak: 3 ks
  - majoranka: 1 čl
  - udena-paprika: 1 čl
  - paradajky: 4 ks | zrelé
  - paradajkovy-pretlak: 1 pl
  - cukor: 1/2 čl
  - petrzlenova-vnat: 2 pl
steps:
  - Rúru predhrej na 220 °C. Cukety prekroj pozdĺžne a lyžičkou vydlabaj stred, nech ostane stena hrubá asi 1 cm. Vydlabané vnútro nakrájaj nadrobno a odlož.
  - Lodičky posyp 1/2 ČL soli, pokvapkaj 1 PL oleja a peč rezom dole na plechu s papierom 12 minút. Cuketa v rúre pustí vodu – surová by plnku zmočila.
  - Medzitým prepláchni ryžu, zalej 300 ml vody so štipkou soli a pod pokrievkou var na miernom ohni 12 minút.
  - Na panvici rozohrej 1 PL oleja a nadrobno nakrájanú cibuľu restuj na strednom ohni 5 minút. Pridaj vnútro cukety a zvýš oheň, opekaj 5 minút, kým sa voda neodparí a nezačne hnednúť. Pridaj 2 prelisované strúčiky cesnaku, majoránku, údenú papriku a 1/2 ČL soli. Vmiešaj ryžu.
  - Omáčka – paradajky nastrúhaj na hrubom strúhadle do zapekacej misy (šupky vyhoď), pridaj pretlak, 150 ml vody, cukor, zvyšný prelisovaný cesnak a zvyšok soli a premiešaj.
  - Lodičky ulož do omáčky rezom hore, naplň ich plnkou a pritlač. Pokvapkaj 1 PL oleja a peč 25–30 minút, kým plnka navrchu nezozlatne a omáčka nezhustne. Posyp vňaťou.
tips:
  - Najlepšie sú rovné cukety, nie prerastené. Prerastené majú veľa semien a vodnatú dužinu.
