title: Mujaddara s uhorkovým šalátom
description: Libanonská šošovica s ryžou a karamelizovanou cibuľou. Jedlo chudobných, ktoré chutí ako kráľovské.
cuisine: libanonska
meals: [obed, vecera]
time: 50
active: 20
servings: 4
difficulty: 1
tags: [meal-prep]
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Opeč zvyšok na panvici dochrumkava a podávaj s jogurtom.'
ingredients:
  - sosovica-hneda: 200 g
  - voda: 4 hrnček
  - cibula: 3 ks | na tenké polmesiačiky
  - olivovy-olej: 4 pl
  - ryza-basmati: 200 g | prepláchnutá
  - kmin: 2 čl
  - skorica: 1/2 čl
  - sol: 1,5 čl
  - uhorka: 1 ks
  - paradajky: 2 ks
  - citron: 1 ks
  - bylinky-mata: 2 pl
steps:
  - Šošovicu var v 2 hrnčekoch vody 15 minút, má byť na skus. Nesceďuj.
  - Cibuľu pomaly smaž na oleji 20 až 25 minút do tmavozlatista. Polovicu odlož na ozdobu.
  - Do hrnca so šošovicou pridaj ryžu, zvyšnú vodu, kmín, škoricu, soľ a polovicu cibule. Prikry a na miernom ohni var 18 minút.
  - Uhorku a paradajky nakrájaj, polej citrónom, osoľ a pridaj mätu.
  - Mujaddaru posyp chrumkavou cibuľou a podávaj so šalátom.
tips:
  - Ryža a strukoviny v jednom jedle sa v bielkovinách pekne dopĺňajú (lyzín a metionín).
