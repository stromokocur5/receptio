title: Plnené papriky s ryžou a šošovicou v hustej paradajkovej omáčke
description: Papriky plnené ryžou, šošovicou a opraženou cibuľou s majoránkou a údenou paprikou. Omáčka z redukovaných paradajok, hustá a sladkokyslá, ako má byť. Bez múky, bez mäsa, bez sklamania.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/plnene, hlavne/strukoviny]
time: 75
active: 30
servings: 4
difficulty: 2
tags: [zlatica, klasika, meal-prep]
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Na druhý deň sú ešte lepšie. Zohrej ich v omáčke pod pokrievkou.'
ingredients:
  - sosovica-hneda: 120 g
  - ryza-basmati: 120 g
  - voda: 1,4 l | 600 na šošovicu, 800 do omáčky
  - olej: 3 pl
  - cibula: 2 ks | 1 do plnky, 1 do omáčky
  - cesnak: 4 ks
  - majoranka: 2 čl
  - udena-paprika: 1 čl
  - sladka-paprika: 1 čl
  - sol: 2 čl
  - paprika-cervena: 6 ks | alebo biele, rovnako veľké
  - paradajkovy-pretlak: 4 pl
  - paradajky-sterilizovane: 1 ks | plechovka krájaných
  - cukor: 2 pl
  - ocot: 1 pl
  - bobkovy-list: 1 ks
  - nove-korenie: 3 ks
  - petrzlenova-vnat: 3 pl
steps:
  - Šošovicu prepláchni a var v 600 ml vody bez soli 15 minút, kým nie je takmer mäkká. Sceď. Ryžu len prepláchni, surová sa dovarí v paprike a nasaje omáčku.
  - Medzitým na panvici rozohrej 2 PL oleja a jednu nadrobno nakrájanú cibuľu restuj na strednom ohni 8 minút dozlatista. Pridaj 2 prelisované strúčiky cesnaku, majoránku (rozdrv v dlaniach) a odstav. Vmiešaj údenú a sladkú papriku a 1 ČL soli. Zlatá cibuľa s majoránkou je dôvod, prečo plnka chutí ako u babky, aj keď v nej nie je mäso.
  - Zmiešaj šošovicu, ryžu a cibuľovú zmes. Paprikám odrež vrch so stopkou, vyber semená. Plň ich voľne, len do troch štvrtín – ryža napučí a natlačená plnka by papriku roztrhla.
  - V širokom hrnci rozohrej 1 PL oleja, pridaj druhú nakrájanú cibuľu a zvyšný cesnak a restuj 5 minút. Pridaj pretlak a miešaj 2 minúty, kým nestmavne. Vlej paradajky z plechovky, 800 ml vody, cukor, zvyšok soli, bobkový list a nové korenie.
  - Papriky ulož do omáčky otvorom hore, vedľa seba. Priveď do varu, prikry a var na miernom ohni 40 minút, kým nie je ryža v paprikách mäkká (skús nožom).
  - Papriky vyber na tanier. Omáčku bez pokrievky var na vyššom ohni 5–10 minút, kým nezhustne tak, že pokryje lyžicu. Vylov korenie, vmiešaj ocot, ochutnaj – má byť sladká aj kyslá. Ak chceš hladkú, rozmixuj ju. Papriky polej omáčkou a posyp vňaťou.
tips:
  - Zvyšnú plnku daj do omáčky ako „guľky“ alebo ju upeč v zapekacej mise.
  - Ako príloha stačí kúsok uvareného zemiaka – omáčky je veľa.
