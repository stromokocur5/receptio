title: Taktouka
description: Marocký šalát z pečených paprík a paradajok, dusený s cesnakom a kmínom do sladka.
cuisine: severoafricka
meals: [snack, obed]
categories: [omacky/dipy, salaty/prilohove]
time: 45
active: 15
servings: 4
difficulty: 1
tags: [party, meal-prep]
spicy: 1
keeps: { fridge: 5 }
ingredients:
  - paprika-cervena: 4 ks
  - olivovy-olej: 3 pl
  - cesnak: 3 ks
  - paradajky: 5 ks | nastrúhané
  - kmin: 1 čl
  - sladka-paprika: 1 čl
  - cili: 1/4 čl
  - sol: 1 čl
  - petrzlenova-vnat: 3 pl
steps:
  - Papriky peč celé na 230 °C 25 minút, kým šupka nesčernie. Daj ich do misky, prikry a nechaj 10 minút zapotiť – šupka sa potom ľahko stiahne.
  - Olúpané papriky nakrájaj na prúžky.
  - Na oleji na strednom ohni krátko opraž cesnak, pridaj paradajky a korenie a var na miernom ohni 10 minút do hustej omáčky.
  - Pridaj papriky, osoľ a dus ešte 10 minút. Posyp petržlenom a podávaj vlažné s chlebom.
