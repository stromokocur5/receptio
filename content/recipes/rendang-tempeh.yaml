title: Rendang z jackfruitu a tempehu
description: Sumatriansky „suchý“ kokosový rendang, dusený hodinu, kým kokosové mlieko nezkaramelizuje do tmavej voňavej pasty.
cuisine: indonezska
meals: [obed, vecera]
time: 90
active: 25
servings: 4
difficulty: 2
tags: [meal-prep, klasika]
spicy: 2
keeps: { fridge: 5, freezer: 3 }
leftovers: 'Rendang je na druhý deň ešte lepší.'
ingredients:
  - cibula: 2 ks
  - cesnak: 5 ks
  - zazvor: 2 pl
  - cili-papricka: 3 ks
  - kurkuma: 1 čl
  - koriander-mlety: 2 čl
  - kmin: 1 čl
  - skorica: 1/2 čl
  - klincek: 3 ks
  - olej: 2 pl
  - citronova-trava: 2 ks | rozdrvené
  - kokosove-mlieko: 800 ml
  - tempeh: 250 g | na kocky
  - jackfruit: 1 ks | scedený, natrhaný
  - kokos-struhany: 4 pl | opražený dohneda
  - tamarind: 1 pl
  - cukor: 1 pl
  - sol: 1 čl
  - ryza-jazminova: 300 g
steps:
  - Cibuľu, cesnak, zázvor, papričky a korenie rozmixuj na pastu. Na oleji na strednom ohni ju opekaj 5 minút, kým nezavonia.
  - Pridaj citrónovú trávu, kokosové mlieko, tempeh a jackfruit. Var bez pokrievky na miernom ohni 60 minút, občas premiešaj.
  - Keď sa tekutina takmer odparí a olej sa oddelí, pridaj opražený kokos, tamarind, cukor a soľ.
  - Opekaj na strednom ohni ďalších 10–15 minút za stáleho miešania, kým nie je rendang tmavohnedý a suchý. Podávaj s ryžou.
