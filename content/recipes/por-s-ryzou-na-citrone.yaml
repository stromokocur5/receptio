title: Dusený pór s ryžou, citrónom a kôprom
description: Kopa póru pomaly udusená na olivovom oleji do sladka, ryža, ktorá sa v ňom uvarí, a na konci veľa citrónu a kôpru. Grécke prasorizo – jednoduché, krémové a svieže zároveň.
cuisine: grecka
meals: [obed, vecera]
categories: [hlavne/ryza, hlavne/zelenina]
time: 40
active: 20
servings: 3
difficulty: 1
tags: [zlatica, lacne, one-pot]
keeps: { fridge: 3 }
leftovers: 'Studené je ako šalát. Teplé zohrej s lyžicou vody a kvapkou citróna.'
ingredients:
  - por: 3 ks
  - olivovy-olej: 4 pl | 3 do hrnca, 1 navrch
  - cibula: 1 ks
  - cesnak: 3 ks
  - paradajkovy-pretlak: 1 pl
  - ryza-basmati: 180 g
  - voda: 600 ml | horúca
  - sol: 1,5 čl
  - cierne-korenie: 1/2 čl
  - citron: 1 ks | šťava
  - kopor: 4 pl
  - petrzlenova-vnat: 2 pl
steps:
  - Pór rozrež pozdĺžne, umy medzi vrstvami a nakrájaj na kolieska 1 cm, aj svetlozelenú časť. Cibuľu nakrájaj nadrobno.
  - V širokom hrnci rozohrej 3 PL oleja na strednom ohni. Pridaj pór, cibuľu a štipku soli, prikry a dus 10 minút, občas premiešaj, kým pór nie je mäkký a sladký. Dusený pomaly chutí jemne, nie ostro ako cibuľa.
  - Zlož pokrievku, pridaj prelisovaný cesnak a pretlak a miešaj 2 minúty. Pridaj prepláchnutú ryžu a minútu miešaj.
  - Zalej horúcou vodou, pridaj zvyšok soli a korenie, prikry a var na miernom ohni 15 minút, kým ryža nie je mäkká. Má byť vláčna, trochu krémová, nie suchá – ak treba, dolej trochu vody.
  - Odstav, vmiešaj citrónovú šťavu, kôpor a vňať, prikry a nechaj 5 minút postáť. Ochutnaj, dosoľ a pokvapkaj olejom. Podávaj s paradajkovým alebo uhorkovým šalátom.
tips:
  - Citrón a kôpor nie sú ozdoba, sú to hlavné chute. Daj ich veľa.
