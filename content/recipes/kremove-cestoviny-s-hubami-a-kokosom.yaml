title: Krémové cestoviny s hubami a kokosovým mliekom
description: Cestoviny v cesnakovej omáčke z kokosového mlieka s opečenými šampiňónmi a citrónom. Kokos v nej takmer necítiť, je len krémová. Za 20 minút.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/cestoviny]
time: 20
active: 20
servings: 3
difficulty: 1
tags: [rychle, lacne]
spicy: 0
keeps: { fridge: 2 }
leftovers: 'Zohrej s trochou vody, cez noc omáčku vpijú cestoviny.'
ingredients:
  - cestoviny: 300 g | špagety alebo penne
  - olivovy-olej: 2 pl
  - sampinony: 500 g | na plátky
  - cesnak: 4 ks | na tenké plátky
  - kokosove-mlieko: 1 ks
  - sojova-omacka: 1 pl
  - vyzivne-drozdie: 2 pl | nepovinné, syrová chuť
  - citron: 1 pl | šťava
  - cierne-korenie: 1/2 čl
  - petrzlenova-vnat: 3 pl | nasekaná
steps:
  - V hrnci priveď do varu osolenú vodu a uvar cestoviny podľa obalu, zvyčajne 8–10 minút. Pred scedením odober hrnček vody z cestovín.
  - Medzitým vo veľkej panvici rozohrej olej na veľkom ohni a huby opekaj 7 minút, prvé 3 minúty bez miešania, kým nezhnednú.
  - Stiahni oheň, pridaj cesnak a miešaj minútu, nesmie zhnednúť.
  - Vlej kokosové mlieko, pridaj sójovú omáčku a droždie a var 3 minúty.
  - Pridaj cestoviny a trochu vody z cestovín a 1 minútu prehadzuj, kým omáčka neobalí cestoviny. Dochuť citrónom a korením a posyp vňaťou.
tips:
  - Na pikantnú verziu pridaj s cesnakom štipku čili.
