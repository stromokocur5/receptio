title: Poha
description: Maháraštrské raňajky zo sploštenej ryže s horčičnými semienkami, kurkumou, arašidmi a citrónom. Hotové za 15 minút.
cuisine: indicka-sever
meals: [ranajky]
categories: [ranajky/slane]
time: 15
active: 15
servings: 2
difficulty: 1
tags: [ranajky, rychle, lacne]
spicy: 1
keeps: { fridge: 1 }
ingredients:
  - poha: 2 hrnček | hrubá
  - olej: 2 pl
  - horcicne-semienko: 1 čl
  - arasidy: 3 pl
  - kari-listy: 8 ks
  - cibula: 1 ks | nadrobno
  - cili-papricka: 1 ks
  - zemiaky: 1 ks | na drobné kocky
  - kurkuma: 1/2 čl
  - cukor: 1 čl
  - sol: 3/4 čl
  - citron: 1/2 ks
  - bylinky-koriander: 2 pl
steps:
  - Pohu v sitku prepláchni pod tečúcou vodou, kým nezmäkne (len pár sekúnd), a nechaj odkvapkať.
  - Na oleji na strednom ohni nechaj prasknúť horčičné semienka, pridaj arašidy, kari listy, cibuľu, papričku a zemiak a opekaj 7 minút, kým zemiak nezmäkne.
  - Pridaj kurkumu, pohu, cukor a soľ, premiešaj a prikry na 2 minúty.
  - Pokvapkaj citrónom a posyp koriandrom.
