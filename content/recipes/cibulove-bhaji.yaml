title: Cibuľové bhaji
description: Chrumkavé indické cibuľové placky v cícerovom cestíčku. Pouličné jedlo, ktoré zmizne rýchlejšie, ako ho stihneš vyprážať.
cuisine: indicka-sever
meals: [snack]
time: 30
active: 30
servings: 4
difficulty: 2
tags: [party]
ingredients:
  - cibula: 3 ks | na tenké polmesiačiky
  - sol: 1 čl
  - cicerova-muka: 1 hrnček
  - ryzova-muka: 2 pl | pre chrumkavosť
  - kmin: 1 čl
  - kurkuma: 1/2 čl
  - cili: 1/2 čl
  - koriander-mlety: 1 čl
  - bylinky-koriander: 3 pl
  - voda: 6 pl
  - olej: 4 pl | toľko vsiakne, na vyprážanie treba ~500 ml
  - citron: 1/2 ks
equipment: [hrniec, teplomer]
no_equipment: [panvica]
steps:
  - Cibuľu premiešaj so soľou a nechaj 10 minút postáť – pustí šťavu, ktorá spojí cesto.
  - Pridaj obe múky, korenie a koriander a po lyžiciach prilievaj vodu, kým cibuľu neobalí husté cesto. Nemá byť riedke.
  - Olej rozohrej na 175 °C. Lyžicou vkladaj kôpky cibule a vyprážaj 3–4 minúty dozlatista, v polovici otoč.
  - Vyber na papierovú utierku a pokvapkaj citrónom.
tips:
  - Najlepšie s mätovým alebo tamarindovým chutney, alebo so sójovým jogurtom s mätou.
howto: [vyprazanie]
