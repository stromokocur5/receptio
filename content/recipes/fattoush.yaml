title: Fattoush
description: Libanonský šalát z chrumkavej pečenej pity, zeleniny, mäty a sumaku s granátovým jablkom. Svieži a kyslastý.
cuisine: libanonska
meals: [obed, snack]
categories: [salaty/syte]
time: 20
active: 20
servings: 4
difficulty: 1
tags: [rychle, zvysky]
spicy: 0
keeps: { fridge: 0 }
ingredients:
  - pita: 2 ks | natrhaná
  - olivovy-olej: 5 pl
  - sumak: 2 čl
  - salat: 1/2 ks | rímsky
  - paradajky: 3 ks
  - uhorka: 1 ks
  - redkovka: 6 ks | na plátky
  - jarna-cibulka: 3 ks
  - petrzlenova-vnat: 4 pl
  - bylinky-mata: 3 pl
  - citron: 1 ks
  - cesnak: 1 ks | prelisovaný
  - sol: 3/4 čl
  - granatove-jablko: 1/2 ks
steps:
  - Pitu premiešaj s 2 PL oleja a peč na 200 °C 8 minút dochrumkava.
  - Zeleninu nakrájaj na veľké kusy a premiešaj s bylinkami.
  - Zmiešaj zvyšný olej, citrón, cesnak, sumak a soľ a zalej šalát.
  - Tesne pred podávaním vmiešaj pitu a posyp granátovým jablkom a sumakom.
