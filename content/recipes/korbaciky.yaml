title: Vegánske korbáčiky
description: Oravská klasika bez mlieka – ťahavé pletené šnúrky z kešu a tapioky, údené alebo jemne slané. K pivu aj na výlet.
cuisine: slovenska
meals: [snack, domace]
categories: [domace/syry, snacky/slane, snacky/na-cesty]
time: 40
active: 30
servings: 4
difficulty: 3
tags: [urob-si-sam, party]
ahead: Kešu namoč na 4 hodiny (alebo 15 minút do vriacej vody). Hotové korbáčiky stuhnú 2 hodiny v chladničke.
yields: cca 12 korbáčikov
keeps: { fridge: 6 }
related: [kesu-syr, vegansky-parmezan]
no_equipment: [sitko]
ingredients:
  - kesu: 40 g | namočené, scedené
  - sojove-mlieko: 1 hrnček
  - tapiokovy-skrob: 5 pl
  - agar: 1 čl
  - kokosovy-olej: 3 pl | rafinovaný, bez kokosovej chuti
  - vyzivne-drozdie: 1 pl
  - citron: 1 pl
  - sol: 1 čl
  - tekuty-dym: ~1 čl | na údenú verziu
  - voda: ~2 hrnček | nálev na údenú verziu
steps:
  - Kešu, mlieko, škrob, agar, olej, droždie, citrón a soľ rozmixuj úplne dohladka – aspoň minútu, žiadne kúsky orechov.
  - Prelej do hrnca s hrubým dnom a na strednom až miernom ohni nepretržite miešaj silikónovou stierkou. Najprv je to riedke, po 3–4 minútach sa zrazí na hrudky – miešaj ďalej. Po 6–8 minútach je z toho lesklé, ťahavé cesto, ktoré sa odlepí od stien.
  - Kým je horúce, naplň ním pevné mraziace vrecko (alebo cukrárske vrecko) a odstrihni roh na 7–8 mm.
  - Na papier na pečenie striekaj tenké šnúrky dlhé 25 cm. Ak cesto v sáčku stuhne, daj ho na 20 sekúnd do mikrovlnky alebo do teplej vody.
  - Kým sú šnúrky vlažné, vezmi 5–6 naraz, jeden koniec stlač, šnúrky voľne zapleť do vrkoča alebo stoč a konce pritlač. Nechaj 2 hodiny stuhnúť v chladničke.
  - Na údené korbáčiky rozmiešaj vo vode tekutý dym a lyžičku soli, ponor do nálevu stuhnuté korbáčiky na 30 minút, vyber a nechaj oschnúť na mriežke.
tips:
  - Ťahavosť robí tapioka, pevnosť agar. Ak sa šnúrky trhajú, bolo cesto málo uvarené – nabudúce miešaj dlhšie.
  - Kukuričný škrob tapioku nenahradí, korbáčiky by neboli ťahavé.
  - Bez orechov – kešu nahraď 3 PL slnečnicových semienok namočených cez noc.
  - Na chrumkavejší povrch ich pred nálevom osuš pár hodín v chladničke bez prikrytia.
