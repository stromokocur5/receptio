title: Hrachová polievka s údeným tofu
description: Hustá žltá hrachovka s údenou paprikou, majoránkou a chrumkavými krutónmi. Lacná a plná bielkovín.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/strukovinove]
time: 60
active: 15
servings: 6
difficulty: 1
tags: [polievka, klasika, lacne]
ahead: Hrach namoč aspoň na 4 hodiny, uvarí sa rýchlejšie a lepšie sa rozvarí.
keeps: { fridge: 4, freezer: 3 }
ingredients:
  - zlty-hrach: 300 g | namočený
  - voda: 8 hrnček
  - bobkovy-list: 2 ks
  - olej: 2 pl
  - cibula: 1 ks
  - mrkva: 2 ks | na kocky
  - zemiaky: 2 ks | na kocky
  - cesnak: 3 ks
  - udena-paprika: 1 čl
  - majoranka: 1 pl
  - sol: 1,5 čl
  - tofu-udene: 150 g | na drobné kocky
  - chlieb: 3 ks | na krutóny
steps:
  - Hrach sceď, zalej vodou, pridaj bobkový list a var na miernom ohni 35 minút, kým sa nezačne rozpadať. Penu zbieraj.
  - Na oleji na strednom ohni speň cibuľu, pridaj mrkvu a zemiaky a všetko daj do polievky. Var ďalších 15 minút.
  - Pridaj cesnak, údenú papriku, majoránku a soľ. Časť polievky rozmixuj pre hustotu.
  - Na suchej panvici na strednom ohni opeč tofu a nakrájaný chlieb dochrumkava a podávaj navrchu.
