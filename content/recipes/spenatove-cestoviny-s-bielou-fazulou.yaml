title: Špenátové cestoviny s bielou fazuľou
description: Cestoviny v krémovej omáčke z mrazeného špenátu a roztlačenej fazule s cesnakom a citrónom. Za 20 minút, len zo špajze a mrazničky.
cuisine: talianska
meals: [obed, vecera]
categories: [hlavne/cestoviny]
time: 20
active: 15
servings: 4
difficulty: 1
tags: [rychle, lacne, vela-bielkovin]
spicy: 0
keeps: { fridge: 3 }
leftovers: 'Prehrej s 3–4 lyžicami vody, omáčka v chladničke zhustne.'
howto: [cestoviny]
ingredients:
  - cestoviny: 350 g | penne alebo fusilli
  - sol: ~1 pl | do vody na cestoviny
  - olivovy-olej: 3 pl
  - cesnak: 4 ks | na plátky
  - spenat: 450 g | mrazený, kocky alebo listy
  - fazula-biela: 1 ks | plechovka, scedená
  - vyzivne-drozdie: 3 pl
  - cili: 1/4 čl
  - sol: 1/2 čl
  - citron: 1 ks | šťava
steps:
  - Vo veľkom hrnci priveď do varu 3 litre vody, osoľ ju lyžicou soli a daj variť cestoviny o 1 minútu kratšie, ako píše obal.
  - Medzitým na veľkej panvici zohrej olivový olej na miernom ohni a 2 minúty v ňom nechaj voňať cesnak – má ostať svetlý. Pridaj špenát rovno z mrazničky, prikry a nechaj 5–6 minút roztopiť, potom odkry a 2 minúty odparuj vodu.
  - Pridaj fazuľu a polovicu z nej roztlač vidličkou – urobí omáčku krémovou. Vmiešaj droždie, čili, 1/2 čl soli a citrónovú šťavu.
  - Odober hrnček vody z cestovín, cestoviny sceď a pridaj na panvicu so 4–6 lyžicami vody z cestovín. Minútu spolu miešaj, kým omáčka neobalí cestoviny, a podávaj.
