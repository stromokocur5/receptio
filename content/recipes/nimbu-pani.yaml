title: Nimbu pani
description: Indická slanosladká limonáda s pečeným kmínom a čiernou soľou. Na horúce dni, kedy hasí smäd lepšie ako sladké.
cuisine: indicka-sever
meals: [snack]
categories: [napoje/limonady]
time: 5
active: 5
servings: 2
difficulty: 1
tags: [rychle, bez-varenia, lacne]
ingredients:
  - citron: 2 ks | alebo 3 limetky
  - cukor: 2 pl
  - kala-namak: 1 štipka
  - sol: 1 štipka
  - kmin: 1/2 čl | opražený nasucho a rozdrvený
  - bylinky-mata: 1 pl
  - voda: 2 hrnček | studená alebo perlivá (masala soda)
steps:
  - Kmín opraž na suchej panvici, kým nezavonia, a rozdrv v mažiari.
  - V pohároch rozmiešaj citrónovú šťavu, cukor, oba druhy soli a kmín.
  - Dolej vodou, pridaj mätu a ľad.
tips:
  - S perlivou vodou je to masala soda z indických ulíc.
  - Štipka soli pomáha doplniť, čo sa v horúčave vypotí.
