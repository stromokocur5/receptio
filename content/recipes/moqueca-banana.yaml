title: Moqueca s plantainom
description: Bahijský kokosový stew s plantainom, paprikami a limetkou. Sladkastý, sviežo kyslý a sýto oranžový.
cuisine: brazilska
meals: [obed, vecera]
categories: [hlavne/kari]
time: 40
active: 20
servings: 4
difficulty: 1
tags: [one-pot]
spicy: 1
keeps: { fridge: 3 }
ingredients:
  - plantain: 3 ks | zrelé, na hrubé kolieska
  - limetka: 2 ks
  - olivovy-olej: 2 pl
  - cibula: 1 ks | na kolieska
  - paprika-cervena: 2 ks | na prúžky
  - cesnak: 3 ks
  - paradajky: 3 ks | na kolieska
  - sladka-paprika: 2 čl
  - cili-papricka: 1 ks
  - kokosove-mlieko: 400 ml
  - sol: 1 čl
  - bylinky-koriander: 3 pl
  - ryza-basmati: 300 g
steps:
  - Plantain zmiešaj so šťavou z jednej limetky a štipkou soli.
  - V širokom hrnci na oleji na strednom ohni speň cibuľu, papriku a cesnak 5 minút.
  - Navrstvi paradajky a plantain, posyp paprikou, pridaj čili a zalej kokosovým mliekom. Osoľ.
  - Prikry a dus na miernom ohni 15 minút, nemiešaj, len jemne potras. Dochuť limetkou, posyp koriandrom a podávaj s ryžou.
tips:
  - Tradičný farebný olej dendê (palmový) nahradila paprika – chuť je bližšia a olej šetrnejší k pralesom.
