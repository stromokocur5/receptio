title: Krémová brokolicová polievka
description: Zelená krémová polievka z celej brokolice aj so stonkou, zjemnená kešu. Hotová za 25 minút.
cuisine: moderna
meals: [obed, vecera]
time: 25
active: 10
servings: 4
difficulty: 1
tags: [polievka, one-pot, meal-prep]
keeps: { fridge: 3, freezer: 3 }
leftovers: 'Zahustenú polievku použi ako zelenú omáčku na cestoviny.'
ingredients:
  - olej: 1 pl
  - cibula: 1 ks
  - cesnak: 2 ks
  - brokolica: 2 ks | ružičky aj ošúpaná stonka
  - zemiaky: 1 ks | na kocky
  - zeleninovy-vyvar: 4 hrnček
  - kesu: 40 g | namočené aspoň 15 min v horúcej vode
  - vyzivne-drozdie: 2 pl
  - citron: 1/2 ks | šťava
  - sol: 1 čl
  - tekvicove-semienka: 2 pl | opražené, na posypanie
steps:
  - Na oleji speň cibuľu a cesnak, 4 minúty.
  - Pridaj nakrájanú brokolicu so stonkou, zemiak a vývar. Var 12 minút, len kým brokolica nezmäkne – dlhším varením zošedne.
  - Pridaj scedené kešu a droždie a rozmixuj tyčovým mixérom dohladka.
  - Dochuť citrónom a soľou, podávaj posypané semienkami.
tips:
  - Stonku brokolice ošúp škrabkou – je sladká a zahustí polievku.
  - Pár ružičiek si odlož, krátko ich povar a pridaj do taniera celé.
