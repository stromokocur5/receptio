title: Agua de tamarindo
description: Mexický osviežujúci nápoj z tamarindu – sladkokyslý, hnedý a karamelový. Hodí sa k pálivému jedlu.
cuisine: mexicka
meals: [snack]
categories: [napoje/limonady]
time: 10
active: 5
servings: 4
difficulty: 1
tags: [rychle, lacne]
ingredients:
  - tamarind: 3 pl | pasta
  - cukor: 4 pl
  - voda: 1 l | studená
  - limetka: 1/2 ks
steps:
  - Tamarindovú pastu rozmiešaj s cukrom a pohárom teplej vody, kým sa nerozpustí.
  - Preceď cez sitko (odstrániš vlákna a zvyšky semien) a dolej studenou vodou.
  - Dochuť limetkou a podávaj s ľadom.
tips:
  - Zo sušených strukov – ošúp, zalej vriacou vodou na hodinu, rozmixuj a preceď.
