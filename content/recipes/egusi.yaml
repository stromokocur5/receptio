title: Egusi so špenátom
description: Nigérijská hustá polievka zo zomletých semienok so špenátom a paradajkami. Namiesto melónových egusi semienok tekvicové.
cuisine: zapadoafricka
meals: [obed, vecera]
time: 40
active: 20
servings: 4
difficulty: 2
tags: [meal-prep, vela-bielkovin]
spicy: 2
keeps: { fridge: 3, freezer: 3 }
ingredients:
  - tekvicove-semienka: 150 g | lúpané
  - olej: 3 pl
  - sladka-paprika: 1 čl
  - cibula: 1 ks
  - paprika-cervena: 1 ks
  - cili-papricka: 1 ks
  - paradajky: 2 ks
  - zeleninovy-vyvar: 500 ml
  - tofu-udene: 150 g | na kocky
  - spenat: 300 g
  - sol: 3/4 čl
  - ryza-basmati: 250 g
steps:
  - Semienka pomeli najemno a zmiešaj s 5 PL vody na hustú pastu.
  - Cibuľu, papriku, čili a paradajky rozmixuj.
  - Na oleji s paprikou opekaj zmes zo zeleniny na strednom ohni 10 minút, kým nezhustne.
  - Po lyžiciach pridaj semienkovú pastu a nemiešaj 5 minút – vytvoria sa hrudky ako praženica. Potom opatrne premiešaj, pridaj vývar a tofu a var na miernom ohni 10 minút.
  - Pridaj špenát a soľ a var na miernom ohni 3 minúty. Podávaj s ryžou alebo fufu.
