title: Baba ganoush
description: Dymový krém z pečeného baklažánu s tahini a citrónom. Najlepší s chrumkavou zeleninou alebo pitou.
cuisine: libanonska
meals: [snack]
time: 50
active: 10
servings: 4
difficulty: 1
tags: [party]
ingredients:
  - baklazan: 2 ks
  - tahini: 3 pl
  - citron: 1 ks
  - cesnak: 1 ks
  - kmin: 1/2 čl
  - sol: 1 čl
  - olivovy-olej: 2 pl
  - petrzlenova-vnat: 2 pl
steps:
  - Baklažány niekoľkokrát prepichni vidličkou a peč na 230 °C 40 minút (alebo ich opaľuj priamo nad plynovým horákom), kým nie sú úplne mäkké a šupka zuhoľnatená. Z toho je dymová chuť.
  - Nechaj ich trochu vychladnúť, prekroj a dužinu vyber lyžicou. Nechaj ju 5 minút odkvapkať v sitku.
  - Vidličkou ju roztlač s tahini, citrónom, prelisovaným cesnakom, kmínom a soľou. Mixér netreba, má mať štruktúru.
  - Polej olivovým olejom a posyp petržlenovou vňaťou.
