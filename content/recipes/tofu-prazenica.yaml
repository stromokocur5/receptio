title: Tofu praženica
description: Nedeľné raňajky, ktoré naozaj pripomínajú vajíčka. Vďaka kala namak aj chuťou.
cuisine: moderna
meals: [ranajky]
categories: [ranajky/slane]
time: 15
active: 15
servings: 2
difficulty: 1
tags: [ranajky]
keeps: { fridge: 2 }
leftovers: 'Zabaľ do tortilly so salsou – raňajkové burrito.'
ingredients:
  - olej: 1 pl
  - cibula: 1/2 ks | nadrobno
  - paprika-cervena: 1/2 ks | na kocky
  - tofu-natural: 200 g
  - kurkuma: 1/2 čl
  - vyzivne-drozdie: 1 pl
  - sojove-mlieko: 3 pl
  - spenat: 60 g
  - kala-namak: 1/2 čl
  - cierne-korenie: podľa chuti
steps:
  - Cibuľu nakrájaj nadrobno, papriku na malé kocky. Tofu vyber z obalu, zlej vodu a osuš ho papierovou utierkou.
  - V panvici rozohrej olej na strednom ohni – keď sa po minúte zavlní, je dosť horúci. Cibuľu a papriku speň 4–5 minút, kým cibuľa nezmäkne a nie je sklovitá.
  - Tofu rozdrv rukami priamo do panvice na nerovnomerné kúsky a 2 minúty opekaj bez miešania, nech trochu zozlatne.
  - Pridaj kurkumu, droždie a mlieko a 3 minúty restuj, kým sa tekutina nevstrebe.
  - Vmiešaj špenát, a keď zvädne, odstav, posyp kala namak a okoreň. Kala namak pridávaj až na konci, teplom stráca vajíčkovú vôňu. Ochutnaj – ak je mdlé, pridaj štipku soli.
tips:
  - Podávaj s chlebom (pri bezlepkovej strave s bezlepkovým) alebo v tortille.
