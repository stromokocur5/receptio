title: Tofu praženica
description: Nedeľné raňajky, ktoré naozaj pripomínajú vajíčka. Vďaka kala namak aj chuťou.
cuisine: moderna
meals: [ranajky]
time: 15
active: 15
servings: 2
difficulty: 1
tags: [ranajky]
ingredients:
  - olej: 1 pl
  - cibula: 1/2 ks | nadrobno
  - paprika-cervena: 1/2 ks | na kocky
  - tofu-natural: 200 g
  - kurkuma: 1/2 čl
  - vyzivne-drozdie: 1 pl
  - sojove-mlieko: 3 pl
  - spenat: 60 g
  - kala-namak: 1/2 čl
  - cierne-korenie: podľa chuti
steps:
  - Na oleji speň cibuľu a papriku.
  - Tofu rozdrv rukami priamo do panvice na nerovnomerné kúsky.
  - Pridaj kurkumu, droždie a mlieko a 3 minúty restuj, kým sa tekutina nevstrebe.
  - Vmiešaj špenát, a keď zvädne, odstav a posyp kala namak. Pridávaj ho až na konci, teplom stráca vôňu.
tips:
  - Ku krajcu bezlepkového chleba alebo do tortilly.
