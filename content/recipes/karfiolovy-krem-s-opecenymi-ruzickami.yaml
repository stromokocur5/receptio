title: Karfiolový krém s opečenými ružičkami
description: Hodvábna karfiolová polievka bez smotany, ktorej plnosť dodá zlatá cibuľa a zemiak. Navrch ružičky opečené do hneda a opražené semienka – to je tá chuť, ktorú by inak dal syr.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/kremove]
time: 40
active: 25
servings: 4
difficulty: 1
tags: [zlatica, lacne]
keeps: { fridge: 3, freezer: 3 }
leftovers: 'Zohrej s lyžicou vody, ružičky prihrej zvlášť na panvici, aby zas chrumkali.'
ingredients:
  - karfiol: 1 ks | stredný
  - olivovy-olej: 3 pl | 1 do hrnca, 2 na ružičky
  - cibula: 1 ks
  - cesnak: 3 ks
  - zemiaky: 2 ks | zahustia polievku namiesto smotany
  - voda: 1 l
  - sol: 1,5 čl
  - bobkovy-list: 1 ks
  - nove-korenie: 3 ks
  - horcica: 1 čl
  - citron: 1 pl
  - slnecnicove-semienka: 3 pl
  - pazitka: 2 pl | nasekaná
  - cierne-korenie: 1 štipka
steps:
  - Karfiol rozober na ružičky. Asi štvrtinu najmenších a najkrajších odlož navrch, zvyšok aj s nakrájaným košťaľom pôjde do polievky. Zemiaky ošúp a nakrájaj na kocky, cibuľu nadrobno.
  - V hrnci zohrej 1 PL oleja na strednom ohni a cibuľu restuj 6–8 minút, kým nie je mäkká a zlatá. Zlatá cibuľa je sladká a dodá polievke hĺbku – bledá by chutila len ako karfiolová voda. Pridaj prelisovaný cesnak a miešaj minútu.
  - Pridaj karfiol a zemiaky, 2 minúty premiešavaj, zalej vodou, pridaj soľ, bobkový list a nové korenie. Priveď do varu a pod pokrievkou mierne var 20 minút, kým zemiak nie je úplne mäkký.
  - Medzitým rozohrej na panvici 2 PL oleja na vyššom strednom ohni a odložené ružičky do nej polož rezom dole. Nemiešaj ich 4 minúty, nech poriadne zhnednú, potom ich otoč a opekaj ešte 3–4 minúty. Posledné 2 minúty pridaj semienka. Posoľ štipkou soli. Hnedé miesta sú tá chuť navyše – karfiol, ktorý sa stále premiešava, sa iba dusí.
  - Z polievky vylov bobkový list a nové korenie. Rozmixuj ju tyčovým mixérom úplne dohladka, aspoň 2 minúty.
  - Vmiešaj horčicu a citrónovú šťavu a ochutnaj. Kyselina polievku „zobudí“, horčica jej dodá plnosť, akú by dal syr. Ak je mdlá, pridaj štipku soli. Ak je príliš hustá, dolej trochu vody.
  - Nalej do tanierov a navrch daj opečené ružičky so semienkami, pažítku a čierne korenie.
tips:
  - Polievku nesoľ na konci naslepo. Ochutnaj ju až po pridaní citróna, kyselina mení, ako slane chutí.
