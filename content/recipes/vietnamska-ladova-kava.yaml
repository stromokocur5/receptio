title: Vietnamská ľadová káva
description: Cà phê sữa đá po vegánsky – silná káva s kokosovým „kondenzovaným mliekom“ a ľadom. Sladká, krémová a poriadne silná.
cuisine: vietnamska
meals: [snack]
categories: [napoje/limonady]
time: 10
active: 10
servings: 2
difficulty: 1
tags: [rychle]
ingredients:
  - kava: ~4 pl | tmavo pražená, jemne mletá
  - voda: 1 hrnček | vriaca
  - kokosove-mlieko: 1/4 ks
  - cukor: 2 pl
steps:
  - 'Kokosové „kondenzované mlieko“: kokosové mlieko s cukrom var na miernom ohni 5 minút, kým nezhustne. Nechaj vychladnúť.'
  - Uvar veľmi silnú kávu (vietnamský filter phin, moka kanvička alebo francúzsky lis s dvojnásobkom kávy).
  - Do pohárov daj 2–3 PL kokosovej zmesi, zalej horúcou kávou a premiešaj.
  - Doplň pohár ľadom a podávaj so slamkou.
tips:
  - Kokosovú zmes môžeš urobiť do zásoby – v chladničke vydrží týždeň.
