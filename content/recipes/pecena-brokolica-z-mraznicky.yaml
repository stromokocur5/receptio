title: Pečená brokolica z mrazničky
description: Mrazená brokolica, ktorá nie je vodnatá – na rozpálenom plechu sa opečie do tmava, s cesnakom a citrónom. Príloha alebo základ misky.
cuisine: moderna
meals: [obed, vecera]
categories: [prilohy/prilohy, hlavne/zelenina]
time: 40
active: 5
servings: 4
difficulty: 1
tags: [lacne]
spicy: 0
keeps: { fridge: 3 }
leftovers: 'Studená do šalátu s cícerom, alebo rozmixovaná s vývarom na polievku.'
ingredients:
  - brokolica: 800 g | mrazené ružičky
  - olivovy-olej: 3 pl
  - sol: 1 čl
  - cierne-korenie: 1/2 čl
  - cesnak: 3 ks | na plátky
  - citron: 1/2 ks | šťava
  - vyzivne-drozdie: 2 pl
steps:
  - Plech vlož do rúry a rozohrej ju na 230 °C. Rozpálený plech odparí vodu z mrazenej zeleniny skôr, než sa začne dusiť.
  - Brokolicu rovno z mrazničky premiešaj v miske s olejom, soľou a korením. Horúci plech opatrne vytiahni, vylož ho papierom na pečenie a brokolicu rozlož v jednej vrstve tak, aby sa ružičky nedotýkali.
  - Peč 15 minút, potom pridaj cesnak, premiešaj a peč ešte 8–10 minút, kým nie sú okraje tmavé a chrumkavé.
  - Pokvapkaj citrónovou šťavou, posyp droždím a podávaj hneď.
tips:
  - Rovnako sa pečie mrazený karfiol a ružičkový kel. Ružičkový kel pre na polovice, peč o 5 minút dlhšie.
