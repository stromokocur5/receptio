title: Palacinky
description: Tenké palacinky bez vajec a kravského mlieka – s arašidovým maslom a banánom, džemom alebo čím máš rád.
cuisine: slovenska
meals: [ranajky, dezert]
categories: [ranajky/palacinky, dezerty/pecene]
time: 30
active: 30
servings: 4
difficulty: 2
tags: [klasika]
keeps: { fridge: 2, freezer: 2 }
leftovers: 'Naplň ich zvyšnou zeleninou alebo chili a zapeč ako slané palacinky.'
ingredients:
  - hladka-muka: 250 g
  - sojove-mlieko: 2 hrnček
  - voda: 1/2 hrnček | ideálne perlivá
  - olej: 3 pl
  - cukor: 1 pl
  - sol: 1 štipka
  - arasidove-maslo: 4 pl | na plnenie
  - banan: 2 ks
steps:
  - Múku, mlieko, vodu, 2 PL oleja, cukor a soľ vyšľahaj na hladké riedke cesto. Nechaj 15 minút odpočívať.
  - Panvicu rozpáľ na strednom až vysokom ohni a potri tenkou vrstvou oleja.
  - Nalej naberačku cesta, krúživým pohybom ho roztiahni a peč, kým sa okraj neodlupuje (asi minútu). Otoč a ešte 30 sekúnd dopeč.
  - Natri arašidovým maslom, pridaj plátky banánu a zroluj.
tips:
  - Prvá palacinka sa takmer nikdy nepodarí – to je zákon.
  - Na bezlepkové palacinky je lepšia zmes ryžovej múky a škrobu (3:1) ako samotná ryžová múka.
