title: Grilovacie klobásky
description: Šťavnaté klobásky s majoránkou, cesnakom a údenou paprikou na gril, opekanie aj na panvicu. So skvelou chrumkavou kôrkou.
cuisine: slovenska
meals: [obed, vecera, domace]
categories: [domace/bielkoviny, hlavne/tofu, comfort/bufet]
time: 60
active: 20
servings: 4
difficulty: 2
tags: [vela-bielkovin, party, urob-si-sam, meal-prep]
yields: 8 klobások
keeps: { fridge: 5, freezer: 3 }
related: [domace-parky, pikantna-klobasa, klobasky-s-cibulou]
ingredients:
  - lepok-vital: 160 g
  - fazula-cervena: 1/2 ks | plechovka, scedená
  - vyzivne-drozdie: 2 pl
  - udena-paprika: 2 čl
  - sladka-paprika: 1 čl
  - majoranka: 2 čl
  - rasca: 1/2 čl | mletá
  - cesnak: 4 ks | prelisovaný
  - cierne-korenie: 1 čl
  - sol: 1 čl
  - sojova-omacka: 1 pl
  - paradajkovy-pretlak: 1 pl
  - olej: 3 pl
  - voda: 120 ml
steps:
  - Fazuľu roztlač vidličkou (nie dohladka – kúsky dajú textúru).
  - Zmiešaj lepok, droždie, všetky koreniny a soľ.
  - Zvlášť zmiešaj fazuľu, cesnak, sójovú omáčku, pretlak, 2 PL oleja a vodu. Spoj so suchou zmesou a mies 2 minúty.
  - Rozdeľ na 8 kúskov, vyvaľkaj hrubšie valčeky a každý pevne zabaľ do alobalu, konce zatoč.
  - Duste na pare 40 minút. Nechaj vychladnúť.
  - Pred jedlom ich rozbaľ, potri zvyšným olejom a opekaj na grile alebo panvici na strednom ohni 6–8 minút dohneda. Na ohni ich môžeš aj opekať na palici.
tips:
  - Podávaj s horčicou, chrenom, chlebom a kyslými uhorkami.
