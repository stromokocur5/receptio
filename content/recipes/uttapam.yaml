title: Uttapam
description: Hrubá mäkká placka z dosového cesta posypaná paradajkami, cibuľou a čili. Ako indická pizza na raňajky.
cuisine: indicka-juh
meals: [ranajky, vecera]
categories: [ranajky/palacinky]
time: 20
active: 20
servings: 2
difficulty: 1
tags: [ranajky, zvysky]
spicy: 1
ahead: Ryžu a dal namoč na 6 hodín, cesto potom kvasí 10–12 hodín – začni deň vopred.
keeps: { fridge: 1 }
related: [masala-dosa, kokosove-chutney]
ingredients:
  - ryza-basmati: 150 g | alebo lacná dlhozrnná
  - urad-dal: 50 g
  - voda: 200 ml | na mixovanie
  - sol: 1/2 čl
  - cibula-cervena: 1 ks | nadrobno
  - paradajky: 1 ks | nadrobno
  - cili-papricka: 1 ks | nadrobno
  - bylinky-koriander: 2 pl
  - olej: 2 pl
steps:
  - Ryžu a dal namoč zvlášť na 6 hodín. Dal rozmixuj s trochou vody na nadýchanú penu, potom ryžu na jemné cesto. Zmiešaj so soľou a nechaj 10–12 hodín v teple kvasiť, kým objem nenarastie.
  - Cesto nerieď – má byť hustejšie ako na palacinky, aby udržalo zeleninu.
  - Na naolejovanej panvici rozpálenej na strednom ohni rozlej naberačku cesta na kruh hrubý asi 1 cm.
  - Hneď posyp cibuľou, paradajkami, papričkou a koriandrom a jemne pritlač.
  - Pokvapkaj olejom, peč 3 minúty, obráť a peč ďalšie 2 minúty.
