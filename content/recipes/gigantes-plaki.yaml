title: Gigantes plaki
description: Grécke pečené veľké fazule v paradajkovej omáčke s kôprom a petržlenom. Najlepšie vlažné s chlebom.
cuisine: grecka
meals: [obed, vecera]
time: 50
active: 15
servings: 4
difficulty: 1
tags: [meal-prep]
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Podávaj studené s chlebom ako meze alebo zapeč s vegánskym syrom.'
ingredients:
  - olivovy-olej: 5 pl
  - cibula: 1 ks
  - cesnak: 3 ks
  - mrkva: 1 ks | nastrúhaná
  - zeler-stonkovy: 1 ks | nadrobno
  - paradajkovy-pretlak: 1 pl
  - paradajky-sterilizovane: 1 ks
  - fazula-biela: 3 ks | ideálne veľké (maslové) fazule
  - voda: 1/2 hrnček
  - oregano: 1 čl
  - skorica: 1 štipka
  - kopor: 2 pl
  - petrzlenova-vnat: 3 pl
  - sol: 1/2 čl
  - chlieb: 4 ks
steps:
  - Na 3 PL oleja na strednom ohni speň cibuľu, cesnak, mrkvu a zeler 8 minút.
  - Pridaj pretlak, paradajky, vodu, oregano, skoricu a soľ a 5 minút var.
  - Vmiešaj fazuľu a polovicu byliniek a prelož do zapekacej misy.
  - Polej zvyšným olejom a peč na 180 °C 35 minút, kým omáčka nezhustne a navrchu sa neopečie.
  - Posyp zvyšnými bylinkami a podávaj s chlebom.
