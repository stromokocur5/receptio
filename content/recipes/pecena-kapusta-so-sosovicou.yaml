title: Pečená kapusta so šošovicou a horčicovou vinaigrettou
description: Hrubé mesiačiky kapusty pečené do tmava, kým nie sú okraje chrumkavé a stred sladký a mäkký. Pod nimi hnedá šošovica v ostrej horčicovej zálievke s rascou. Lacné ako kapusta, chuť ako z bistra.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/rura, hlavne/strukoviny]
time: 45
active: 15
servings: 3
difficulty: 1
tags: [lacne]
keeps: { fridge: 3 }
ingredients:
  - biela-kapusta: 800 g | menšia hlávka
  - olej: 3 pl
  - sol: 1,5 čl
  - rasca: 1 čl
  - udena-paprika: 1 čl
  - sosovica-hneda: 180 g
  - voda: 700 ml
  - bobkovy-list: 1 ks
  - cibula-cervena: 1 ks
  - ocot: 2 pl
  - horcica: 1 pl
  - cukor: 1/2 čl
  - olivovy-olej: 3 pl
  - cesnak: 1 ks
  - petrzlenova-vnat: 3 pl
  - tekvicove-semienka: 2 pl
steps:
  - Rúru predhrej na 230 °C. Kapustu nakrájaj na 6 mesiačikov tak, aby každý mal kúsok košťaľa – ten drží listy pokope.
  - Mesiačiky ulož na plech s papierom, potri olejom z oboch strán a posyp 1 ČL soli, rascou a údenou paprikou. Peč 30–35 minút, v polovici otoč. Hotové sú, keď majú tmavohnedé až čierne okraje a stred prepichneš nožom. Na tmavých okrajoch sa kapusta karamelizuje – to je dôvod, prečo chutí sladko a nie ako varená.
  - Medzitým šošovicu prepláchni, zalej 700 ml vody, pridaj bobkový list a var na miernom ohni 20–25 minút, kým je mäkká, ale drží tvar. Sceď.
  - Cibuľu nakrájaj nadrobno, daj do misky a zalej octom. Pridaj horčicu, cukor, prelisovaný cesnak a 1/2 ČL soli a za šľahania vlej olivový olej, kým nezhustne. Opraž semienka na suchej panvici 3 minúty.
  - Teplú šošovicu premiešaj s polovicou vinaigretty a vňaťou. Teplá šošovica nasaje dresing lepšie ako studená. Ochutnaj a dosoľ.
  - Na tanier daj šošovicu, na ňu kapustu, polej zvyškom vinaigretty a posyp semienkami.
tips:
  - Kapustu na plechu neprekrývaj, ináč sa dusí. Ak sa nezmestí, použi dva plechy.
