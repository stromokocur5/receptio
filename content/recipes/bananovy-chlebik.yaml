title: Banánový chlebík s orechmi
description: Vláčny banánový chlebík z prezretých banánov, ktoré by inak skončili v koši. Bez vajec, s vlašskými orechmi.
cuisine: americka
meals: [ranajky, dezert, snack]
time: 70
active: 15
servings: 10
difficulty: 2
tags: [pecenie, zvysky]
ingredients:
  - banan: 3 ks | veľmi zrelé, s hnedými fľakmi
  - olej: 80 ml
  - cukor: 1/2 hrnček
  - sojove-mlieko: 80 ml
  - hladka-muka: 220 g
  - kypriaci-prasok: 2 čl
  - skorica: 1 čl
  - sol: 1 štipka
  - vlasske-orechy: 1/2 hrnček | nasekané
  - horka-cokolada: 50 g | nasekaná, voliteľne
steps:
  - Rúru predhrej na 175 °C a formu na chlebík vylož papierom na pečenie.
  - Banány roztlač vidličkou a zmiešaj s olejom, cukrom a mliekom.
  - Pridaj múku, prášok do pečiva, škoricu a soľ a len krátko premiešaj. Vmiešaj orechy a čokoládu.
  - Peč 50–55 minút, kým špáradlo zapichnuté do stredu nevyjde suché.
  - Nechaj 15 minút vychladnúť vo forme.
