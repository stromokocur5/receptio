title: Zemiakové lupienky z rúry
description: Domáce čipsy s lyžicou oleja na celý plech. Trik je tenký plátok, opláchnutý škrob a nízka teplota.
cuisine: slovenska
meals: [snack]
categories: [snacky/slane, snacky/party]
time: 50
active: 15
servings: 3
difficulty: 2
tags: [lacne, deti, party]
ingredients:
  - zemiaky: 500 g | múčne alebo prílohové
  - olej: 1 pl
  - sol: 1/2 čl
  - udena-paprika: 1/2 čl | voliteľne
  - rozmarin: 1 čl | nasekaný, voliteľne
steps:
  - Zemiaky umy a nakrájaj na strúhadle alebo ostrým nožom na plátky tenké 1–2 mm.
  - Plátky opláchni v studenej vode, kým voda nie je číra, a dôkladne osuš utierkou – mokré sa dusia, nie pečú.
  - Rúru predhrej na 160 °C. Plátky premiešaj s olejom a rozlož na dva plechy s papierom tak, aby sa neprekrývali.
  - Peč 20–30 minút, v polovici otoč plechy. Hotové lupienky sú zlatisté a pri okraji sa zvlnia; tie, ktoré sú už hotové, priebežne vyberaj.
  - Hneď osoľ a posyp paprikou alebo rozmarínom.
tips:
  - Rovnako sa robia lupienky z batatov, cvikly či paštrnáku – cvikla potrebuje o 10 minút dlhšie.
  - Hrubšie plátky na okrajoch vždy mäknú, preto sa oplatí strúhadlo s nastaviteľnou čepeľou.
