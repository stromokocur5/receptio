title: İmam bayıldı – plnený baklažán
description: „Imám omdlel“ – baklažány dusené v olivovom oleji s cibuľou, paradajkami a cesnakom až do úplnej mäkkosti. Najlepšie vlažné.
cuisine: turecka
meals: [obed, vecera]
categories: [hlavne/zelenina, hlavne/rura]
time: 75
active: 25
servings: 4
difficulty: 2
tags: [klasika, meal-prep]
keeps: { fridge: 4 }
leftovers: 'Druhý deň je chutnejší. Podávaj izbovo teplý.'
ingredients:
  - baklazan: 4 ks | menšie
  - sol: 1,5 čl
  - olivovy-olej: 6 pl
  - cibula: 2 ks | na mesiačiky
  - cesnak: 5 ks
  - paprika-cervena: 1 ks
  - paradajky: 4 ks
  - paradajkovy-pretlak: 1 pl
  - cukor: 1 čl
  - petrzlenova-vnat: 4 pl
  - voda: 1/2 hrnček
  - chlieb: 4 ks | na podávanie
steps:
  - Baklažány ošúp na pásiky (prúžok áno, prúžok nie), posoľ 1 ČL soli a nechaj 20 minút pustiť vodu. Osuš.
  - Opekaj ich celé na 3 PL oleja na strednom ohni 10 minút, zo všetkých strán, kým nezmäknú. Ulož do zapekacej misy.
  - Na zvyšnom oleji dus cibuľu na miernom ohni 10 minút do mäkka, pridaj cesnak a papriku a dus 3 minúty.
  - Pridaj nakrájané paradajky, pretlak, cukor a zvyšnú soľ a var 5 minút. Vmiešaj polovicu petržlenu.
  - Rúru predhrej na 180 °C. Baklažány pozdĺžne nareži do polovice hĺbky, lyžicou roztvor a naplň zmesou.
  - Podlej vodou, prikry alobalom a peč 35 minút.
  - Nechaj vychladnúť na izbovú teplotu, posyp petržlenom a podávaj s chlebom.
