title: Lablabi
description: Tuniská cícerová polievka s cesnakom, kmínom a harissou, nalievaná na kúsky starého chleba. Raňajky tuniských robotníkov.
cuisine: severoafricka
meals: [ranajky, obed]
categories: [polievky/strukovinove]
time: 30
active: 15
servings: 4
difficulty: 1
tags: [polievka, lacne, zvysky]
spicy: 2
keeps: { fridge: 4, freezer: 3 }
ingredients:
  - olivovy-olej: 3 pl
  - cesnak: 6 ks | prelisovaný
  - kmin: 2 čl
  - harissa: 1 pl
  - cicer-sterilizovany: 2 ks | aj s nálevom
  - zeleninovy-vyvar: 1 l
  - sol: 1/2 čl
  - citron: 1 ks
  - chlieb: 4 ks | starý, natrhaný
  - petrzlenova-vnat: 2 pl
steps:
  - Na oleji na miernom ohni minútu opraž cesnak s kmínom, pridaj harissu a zamiešaj.
  - Pridaj cícer aj s nálevom a vývar a 15 minút var na miernom ohni. Tretinu cíceru roztlač varechou, aby polievka zhustla, a osoľ.
  - Do misiek natrhaj chlieb, prelej horúcou polievkou a nechaj minútu nasať.
  - Pokvapkaj olejom a citrónom, posyp petržlenom a kmínom. Kto chce, pridá harissu.
