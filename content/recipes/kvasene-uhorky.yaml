title: Kvasené uhorky
description: Kyslé uhorky len zo soli, vody a kôpru – bez octu. Za pár dní sú plné chuti aj probiotík.
cuisine: slovenska
meals: [domace, snack]
categories: [domace/kvasene, snacky/slane]
time: 20
active: 20
servings: 12
difficulty: 1
tags: [urob-si-sam, fermentacia, lacne]
ahead: Kvasia 3–5 dní pri izbovej teplote.
yields: cca 2 poháre po 1,5 l
keeps: { fridge: 30 }
howto: [nakladana-zelenina]
ingredients:
  - uhorky-nakladacie: 1,5 kg | čerstvé, malé
  - voda: ~1,5 l | nechlórovaná alebo prevarená a vychladnutá
  - sol: 45 g | nejódovaná
  - kopor: 4 pl | s kvetom
  - cesnak: 6 ks | na polovice
  - chren: 1 pl | alebo list chrenu
  - horcicne-semienko: 1 čl
  - bobkovy-list: 2 ks
steps:
  - Uhorky umy, odrež kvetný koniec a na 2 hodiny namoč do studenej vody.
  - Soľ rozpusti vo vode.
  - Do pohárov daj kôpor, cesnak, chren a korenie, natlač uhorky a zalej slaným nálevom. Musia byť celé pod hladinou – zaťaž ich menším pohárom s vodou.
  - Prikry voľne viečkom alebo utierkou a nechaj 3–5 dní pri izbovej teplote. Nálev skalnie a uhorky zmenia farbu na olivovú.
  - Keď chutia kyslo, zavri a daj do chladničky alebo pivnice.
tips:
  - Biely povlak navrchu je neškodný, zober ho lyžicou. Farebná chlpatá pleseň znamená vyhodiť.
  - Kvasený nálev je výborný na zálievku aj do polievky.
