title: Krémová polenta s pečenou paprikou a fazuľou na údeno
description: Hustá krémová kukuričná kaša s cesnakom a horčicou a na nej fazuľa v hustej paradajkovej omáčke s opečenou paprikou a údenou paprikou. Sýte, lacné, v zime ako balzam.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/strukoviny, hlavne/ryza]
time: 40
active: 25
servings: 3
difficulty: 1
tags: [zlatica, lacne]
keeps: { fridge: 3 }
leftovers: 'Studená polenta stuhne. Nakrájaj ju na plátky a opeč na panvici do chrumkava, fazuľu zohrej zvlášť.'
ingredients:
  - kukuricna-krupica: 150 g
  - voda: 1,1 l | 800 na polentu, 300 do fazule
  - sol: 1 čl
  - olivovy-olej: 4 pl | 2 do polenty, 2 na papriku
  - horcica: 1 čl
  - cesnak: 4 ks
  - paprika-cervena: 2 ks
  - cibula: 1 ks
  - paradajkovy-pretlak: 2 pl
  - udena-paprika: 1 čl
  - fazula-cervena: 1 ks | plechovka
  - fazula-biela: 1 ks | plechovka
  - cukor: 1/2 čl
  - ocot: 1 čl
  - petrzlenova-vnat: 2 pl
steps:
  - V hrnci priveď do varu 800 ml vody s 1/2 ČL soli. Za stáleho miešania metličkou do nej pomaly sypi krupicu, aby nevznikli hrudky. Stíš na najmiernejší oheň a pod pokrievkou var 25 minút, každých 5 minút poriadne premiešaj aj od dna. Polenta pri tom prská – pokrievka ťa ochráni.
  - Medzitým papriku nakrájaj na prúžky a cibuľu na pásiky. Na panvici rozohrej 2 PL oleja na vysokom ohni a papriku s cibuľou opekaj 7–8 minút, kým nemajú tmavé škvrny.
  - Stíš na stredný oheň, pridaj 2 prelisované strúčiky cesnaku a pretlak a minútu miešaj, kým pretlak nestmavne. Odstav, vmiešaj údenú papriku.
  - Pridaj scedenú prepláchnutú fazuľu, 300 ml vody, cukor a štipku soli. Var na miernom ohni 10 minút bez pokrievky, kým omáčka nezhustne a nepokrýva fazuľu. Vmiešaj ocot.
  - Do hotovej polenty vmiešaj 2 PL oleja, horčicu, zvyšok soli (asi 1/4 ČL) a 2 prelisované strúčiky cesnaku. Má byť hladká a hustá ako kaša. Ak je príliš hustá, vmiešaj trochu horúcej vody.
  - Polentu rozotri do tanierov, navrch daj fazuľu s paprikou a posyp vňaťou.
tips:
  - Instantná polenta je hotová za 5 minút. Daj jej menej vody podľa obalu.
