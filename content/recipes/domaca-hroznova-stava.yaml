title: Domáca hroznová šťava do fliaš
description: Šťava z hrozna bez cukru a bez odšťavovača – bobule sa rozpučia, zohrejú, precedia cez plátno a horúca šťava ide do fliaš. Keď je hrozna z pergoly viac, ako sa dá zjesť.
cuisine: slovenska
meals: [domace]
categories: [domace/zavarane, napoje/limonady]
time: 90
active: 40
servings: 12
difficulty: 2
tags: [urob-si-sam, deti]
yields: cca 1,2 l
keeps: { fridge: 7 }
nutrition: false
howto: [zavaranie]
ingredients:
  - hrozno: 2 kg | zrelé, aj so semienkami
  - voda: 200 ml
  - citron: 1/2 ks | šťava, nepovinné
steps:
  - Fľaše a viečka umy, vlož do studenej rúry a vyhrej na 120 °C aspoň 20 minút. Viečka povar 5 minút vo vode.
  - Hrozno otrhaj zo strapcov, nahnité a scvrknuté bobule vyhoď a umy. V širokom hrnci ho rozpuč tĺčikom na zemiaky.
  - Pridaj vodu a zohrievaj na miernom ohni 10–15 minút, kým šupky nepustia farbu a bobule nie sú úplne rozpadnuté. Nenechaj ho vrieť, šťava by chutila varene – stačí, keď sa pari a mierne bublá na okraji.
  - Preceď cez sitko vystlané plátnom alebo gázou. Nechaj kvapkať 15 minút a na konci plátno zľahka vytlač – silné tlačenie zakalí šťavu a dostane do nej horkosť zo semienok.
  - Šťavu vráť do čistého hrnca, pridaj citrónovú šťavu a zohrej, kým sa nezačne pariť (asi 85 °C, tesne pod varom).
  - Horúcu nalej cez lievik do horúcich fliaš až po hrdlo, hneď zavri a otoč dolu hlavou na 10 minút. Nechaj vychladnúť pod utierkou.
tips:
  - Zavretá v tme vydrží do jari. Otvorenú drž v chladničke a vypi do týždňa.
  - Na dne sa usadí kal a kryštáliky vínneho kameňa, sú neškodné. Nalievaj opatrne.
  - Výlisky z plátna sa dajú pridať do kompostu.
