title: Marinované olivy s citrónom a rozmarínom
description: Obyčajné olivy z pohára vylepšené olejom, citrónovou kôrou, cesnakom a bylinkami. Na párty stačí misa a špáradlá.
cuisine: grecka
meals: [snack]
categories: [snacky/party, omacky/chutney]
time: 10
active: 10
servings: 6
difficulty: 1
tags: [rychle, party]
ahead: Najlepšie sú po jednom dni v chladničke.
keeps: { fridge: 14, freezer: 0 }
ingredients:
  - olivy: 300 g | zmes zelených a čiernych, scedené
  - olivovy-olej: 4 pl
  - citron: 1 ks | kôra a 1 pl šťavy
  - cesnak: 2 ks | na plátky
  - rozmarin: 1 čl | nasekaný
  - oregano: 1/2 čl
  - cili: 1 štipka
steps:
  - Olej zohrej v malom hrnci na miernom ohni s cesnakom, rozmarínom, oreganom a čili asi 2 minúty, kým cesnak nezačne voňať – nesmie zhnednúť.
  - Stiahni z ohňa, pridaj citrónovú kôru a šťavu a nechaj 5 minút vychladnúť.
  - Zalej olivy a premiešaj. Podávaj hneď, alebo nechaj cez noc v chladničke odležať.
tips:
  - Olej v chladničke stuhne – vyber olivy 20 minút pred podávaním.
  - Zvyšný olej z olív použi na dresing alebo na chlieb.
