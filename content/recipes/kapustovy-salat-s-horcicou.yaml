title: Kapustový šalát s horčicou a opraženými semienkami
description: Kapusta, ktorá sa najprv premasíruje so soľou, takže je jemná, nie ako seno. K tomu mrkva, hustý horčicový dresing a chrumkavé semienka. K zemiakom, fazuli aj len tak.
cuisine: slovenska
meals: [obed, vecera]
categories: [salaty/prilohove]
time: 20
active: 15
servings: 4
difficulty: 1
tags: [rychle, lacne]
keeps: { fridge: 3 }
leftovers: 'Na druhý deň je ešte lepší. Semienka pridávaj až pri podávaní.'
ingredients:
  - biela-kapusta: 400 g | asi štvrť hlávky
  - sol: 1 čl
  - mrkva: 2 ks
  - cibula: 1/2 ks | malá
  - ocot: 2 pl
  - horcica: 1 pl
  - cukor: 1 čl
  - olej: 3 pl
  - cierne-korenie: 1 štipka
  - petrzlenova-vnat: 2 pl | nasekaná
  - slnecnicove-semienka: 3 pl
steps:
  - Kapuste odkroj hrubý košťaľ a nakrájaj ju čo najtenšie. Daj ju do veľkej misy, posyp 1 ČL soli a 2 minúty ju miesi a stískaj rukami, kým nezmäkne a nepustí šťavu. Nechaj 10 minút postáť – soľ ju zjemní a vytiahne z nej vodu, ktorá by inak riedila dresing.
  - Medzitým nastrúhaj mrkvu na hrubom strúhadle a cibuľu nakrájaj nadrobno.
  - Semienka opraž na suchej panvici na strednom ohni 3–4 minúty, kým nezačnú hnednúť, a vysyp ich na tanier.
  - V menšej miske zmiešaj ocot, horčicu, cukor a korenie. Za šľahania vidličkou po troškách prilievaj olej, kým dresing nezhustne a nie je krémový.
  - Kapustu stlač v hrsti nad drezom a šťavu vylej. Pridaj mrkvu, cibuľu, petržlenovú vňať a dresing a dobre premiešaj. Ochutnaj – kapusta už je slaná, soľ pridávaj až potom. Semienka posyp navrch pri podávaní.
tips:
  - Ak je dresing kyslý, pridaj ešte štipku cukru. Ak je mdlý, kvapku octu.
