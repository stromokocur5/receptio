title: Tapioková mozzarella
description: Ťahavý rastlinný syr na pizzu, lasagne a zapekané jedlá. Z kešu, tapioky a kokosového oleja za 15 minút v hrnci.
cuisine: talianska
meals: [domace]
categories: [domace/syry]
time: 20
active: 15
servings: 6
difficulty: 2
tags: [urob-si-sam, party]
ahead: Kešu namoč na 4 hodiny (alebo 15 minút do vriacej vody).
yields: cca 400 g
keeps: { fridge: 5 }
related: [mozzarella-gulky, mozzarella-na-pizzu, pizza-al-taglio, lasagne]
ingredients:
  - kesu: 50 g | namočené, scedené
  - voda: 1 hrnček
  - tapiokovy-skrob: 4 pl
  - kokosovy-olej: 2 pl | rafinovaný
  - vyzivne-drozdie: 1 pl
  - citron: 1 pl
  - sol: 1 čl
steps:
  - Všetko rozmixuj úplne dohladka, aspoň minútu.
  - Prelej do hrnca a na strednom ohni nepretržite miešaj silikónovou stierkou. Po 3–4 minútach sa zrazí na hrudky, miešaj ďalej.
  - Po 5–6 minútach je z toho lesklá ťahavá hmota, ktorá sa odlepí od hrnca.
  - Horúcu ju rovno lyžicou rozdeľ na pizzu alebo lasagne, alebo ju vylej do misky a nechaj stuhnúť v chladničke – dá sa potom krájať a trhať.
tips:
  - Na pizzu ju pridaj do rúry posledných 5 minút pečenia, inak zhnedne.
  - Pevnejšia na krájanie bude s 1 ČL agaru, ktorý sa varí spolu s ostatným.
  - Ťahavá je, len kým je teplá. Zo stuhnutej v chladničke ju znova roztopíš na panvici s lyžicou vody.
  - Ktorá mozzarella na čo – táto na lasagne, toasty a ťahavý okraj pizze; guľky v náleve na caprese a margheritu; blok na strúhanie, keď chceš syr na pizzu dať od začiatku.
variants:
  - name: Bez orechov
    description: Namiesto kešu namočené slnečnicové semienka. Trochu výraznejšia a sivšia.
    replace:
      - { from: kesu, to: slnecnicove-semienka }
  - name: Údená
    description: S údenou paprikou, ako údený syr na toasty a burgre.
    add:
      - udena-paprika: 1/2 čl
