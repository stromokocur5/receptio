title: Adana kebab na špajdliach
description: Pikantné kebaby zo sójového granulátu a lepku na plochých špajdliach, opečené na grile alebo na panvici. S grilovanou paprikou a cibuľovým šalátom so sumakom.
cuisine: turecka
meals: [obed, vecera]
categories: [comfort/kebab, hlavne/tofu, hlavne/plnene]
time: 45
active: 30
servings: 4
difficulty: 2
tags: [party, vela-bielkovin]
spicy: 2
keeps: { fridge: 3, freezer: 3 }
leftovers: 'Prehrej na panvici, zamrazené surové rovno opeč o 3 minúty dlhšie.'
ingredients:
  - sojove-granule: 1,5 hrnček
  - zeleninovy-vyvar: 1,5 hrnček | horúci
  - lepok-vital: 60 g
  - cibula: 1 ks | nastrúhaná, vyžmýkaná
  - cesnak: 3 ks
  - paradajkovy-pretlak: 2 pl
  - sladka-paprika: 2 čl
  - udena-paprika: 1 čl
  - cili: 1 čl
  - kmin: 1 čl
  - sol: 1/2 čl
  - olej: 3 pl
  - paprika-cervena: 2 ks
  - cili-papricka: 2 ks
  - cibula-cervena: 1 ks
  - sumak: 2 čl
  - petrzlenova-vnat: 3 pl
  - pita: 4 ks
steps:
  - Granulát zalej horúcim vývarom a nechaj 10 minút nasiaknuť. Potom ho v utierke poriadne vyžmýkaj.
  - V sekáčiku ho krátko zomeľ s cibuľou, cesnakom, pretlakom a koreninami na jemnú hmotu.
  - Vmiešaj lepok a 1 PL oleja a mies rukami 2 minúty, kým hmota nezačne byť pružná a lepiť sa.
  - Mokrými rukami ju natlač na 8 plochých špajdlí (alebo vytvaruj podlhovasté šúľky) hrubé asi 2 cm.
  - Opekaj na zvyšnom oleji na strednom ohni alebo na grile 8–10 minút, často otáčaj, kým nie sú zo všetkých strán hnedé.
  - Na tej istej panvici opeč papriku a čili papričky dočierna.
  - Červenú cibuľu nakrájaj na tenké mesiačiky a premiešaj so sumakom, petržlenom a štipkou soli.
  - Podávaj na teplej pite s paprikou a cibuľou.
tips:
  - Drevené špajdle namoč na 30 minút do vody, aby nezhoreli.
  - Obsahuje lepok. Bez lepku vynechaj lepok a daj 3 PL cícerovej múky – budú mäkšie, tvaruj ich ako karbonátky.
