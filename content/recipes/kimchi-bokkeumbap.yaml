title: Kimchi bokkeumbap
description: Kórejská smažená ryža s kimchi, gochujangom a tofu. Desať minút a hotovo.
cuisine: korejska
meals: [obed, vecera, ranajky]
categories: [hlavne/ryza]
time: 15
active: 15
servings: 2
difficulty: 1
tags: [rychle, zvysky]
spicy: 2
keeps: { fridge: 2 }
related: [kimchi]
ingredients:
  - olej: 1 pl
  - tofu-natural: 150 g | rozdrobené
  - kimchi: 150 g | nasekané
  - gochujang: 1 pl
  - sojova-omacka: 1 pl
  - ryza-sushi: 180 g | uvarená a vychladnutá
  - sezamovy-olej: 1 čl
  - nori: 1 ks | na prúžky
  - jarna-cibulka: 2 ks
steps:
  - Na oleji na strednom ohni opeč tofu, pridaj kimchi a 3 minúty opekaj.
  - Vmiešaj gochujang, sójovú omáčku a lyžicu nálevu z kimchi.
  - Pridaj ryžu a opekaj 4 minúty na prudkom ohni. Pokvapkaj sezamovým olejom, posyp nori a cibuľkou.
