title: Crumble z mrazeného lesného ovocia
description: Horúce ovocie pod chrumkavou ovsenou drobenkou. Ovocie ide do misy rovno z mrazničky, takže sa dá upiecť kedykoľvek v roku.
cuisine: moderna
meals: [dezert]
categories: [dezerty/pecene]
time: 60
active: 15
servings: 6
difficulty: 1
tags: [lacne, deti, pecenie, dezert]
spicy: 0
keeps: { fridge: 3 }
leftovers: 'Studené ráno s jogurtom, alebo prehrej v rúre 10 minút na 180 °C – drobenka znova schrumkavie.'
ingredients:
  - lesne-ovocie: 600 g | rovno z mrazničky
  - kukuricny-skrob: 1 pl
  - cukor: 2 pl | k ovociu
  - citron: 1/2 ks | šťava
  - ovsene-vlocky: 1 hrnček
  - hladka-muka: 80 g
  - cukor: 4 pl | do drobenky
  - skorica: 1 čl
  - sol: 1 štipka
  - rastlinne-maslo: 80 g | studené, na kúsky
steps:
  - Rúru rozohrej na 190 °C. Zapekaciu misu (asi 20 × 25 cm) vymasti trochou masla.
  - Zmrazené ovocie premiešaj priamo v mise so škrobom, 2 PL cukru a citrónovou šťavou. Nerozmrazuj ho – škrob zahustí šťavu, ktorú pri pečení pustí.
  - Vločky, múku, 4 PL cukru, škoricu a štipku soli zmiešaj v miske. Pridaj studené maslo a vtieraj ho prstami do suchej zmesi, kým nevzniknú hrudky veľké ako hrášok.
  - Drobenku rovnomerne nasyp na ovocie a peč 35–40 minút, kým nie je navrch zlatá a ovocie na okrajoch neprebubláva. Nechaj 10 minút postáť, šťava zhustne.
tips:
  - Namiesto lesného ovocia višne, slivky alebo nakrájané jablká. Jablká peč o 10 minút dlhšie.
