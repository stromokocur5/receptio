title: Pečená paradajková polievka s ryžou
description: Paradajky, paprika a cibuľa najprv pečené v rúre, kým okraje nezačnú černieť, a potom rozmixované. Hustá, sladkastá a dymová, nie kyslá voda. S ryžou.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/kremove]
time: 50
active: 15
servings: 4
difficulty: 1
tags: [zlatica]
keeps: { fridge: 3, freezer: 3 }
leftovers: 'Ryžu skladuj zvlášť, v polievke napučí a rozvarí sa.'
ingredients:
  - paradajky: 8 ks | asi 1 kg
  - paprika-cervena: 2 ks
  - cibula: 1 ks
  - cesnak: 5 ks | celé, v šupke
  - olivovy-olej: 3 pl
  - sol: 1,5 čl
  - ryza-basmati: 100 g
  - voda: 750 ml | 250 na ryžu, 500 do polievky
  - paradajkovy-pretlak: 1 pl
  - udena-paprika: 1/2 čl
  - cukor: 1 čl | podľa kyslosti paradajok
  - petrzlenova-vnat: 2 pl
steps:
  - Rúru predhrej na 220 °C. Paradajky prekroj na polovice, papriku nakrájaj na široké pásy, cibuľu na mesiačiky. Všetko rozlož na plech s papierom (paradajky rezom hore), pridaj celé strúčiky cesnaku, pokvapkaj olejom a posyp 1 ČL soli.
  - Peč 35 minút, kým paradajky nesplasnú a okraje zeleniny nezačnú černieť. V rúre sa voda z paradajok odparí a chuť zhustne – preto táto polievka nebude vodová.
  - Kým sa zelenina pečie, prepláchni ryžu, zalej 250 ml vody, pridaj štipku soli, priveď do varu a pod pokrievkou var na miernom ohni 12 minút. Odstav a nechaj prikrytú.
  - Z upečeného cesnaku vytlač mäkkú dužinu do hrnca, pridaj všetku zeleninu aj so šťavou z plechu, 500 ml vody, pretlak a údenú papriku. Priveď do varu a rozmixuj tyčovým mixérom dohladka.
  - Ochutnaj. Ak je kyslá, pridaj cukor, ak mdlá, štipku soli. Do tanierov daj lyžicu ryže, zalej polievkou a posyp vňaťou.
tips:
  - V zime, keď paradajky nechutia, daj namiesto čerstvých dve plechovky krájaných a peč ich v zapekacej mise s ostatnou zeleninou.
