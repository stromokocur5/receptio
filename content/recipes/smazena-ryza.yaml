title: Smažená ryža s tofu a zeleninou
description: Najlepší spôsob, ako zužitkovať včerajšiu ryžu. Tofu s kala namak namiesto vajíčka, hrášok a mrkva.
cuisine: cinska
meals: [obed, vecera]
categories: [hlavne/ryza]
time: 20
active: 20
servings: 3
difficulty: 1
tags: [rychle, zvysky]
ahead: Ryžu uvar deň vopred a vychladni ju v chladničke – čerstvá sa zlepí.
keeps: { fridge: 2 }
ingredients:
  - ryza-jazminova: 250 g | uvarená a vychladená
  - tofu-natural: 200 g | rozdrobené
  - kurkuma: 1/4 čl
  - kala-namak: 1/2 čl
  - olej: 3 pl
  - cesnak: 3 ks
  - jarna-cibulka: 4 ks
  - mrkva: 1 ks | na drobné kocky
  - hrasok: 1 hrnček
  - sojova-omacka: 2 pl
  - sezamovy-olej: 1 čl
  - cierne-korenie: podľa chuti
steps:
  - Tofu opraž na 1 PL oleja na strednom ohni s kurkumou 4 minúty, posyp kala namak a daj bokom. Toto je „vajíčko“.
  - Panvicu rozpáľ na vysokom ohni čo najviac, pridaj zvyšný olej, cesnak, biele časti cibuľky a mrkvu a 2 minúty restuj.
  - Pridaj ryžu, rozdrob hrudky a nechaj ju 1–2 minúty nehýbať, nech sa pripečie. Potom premiešaj a zopakuj.
  - Pridaj hrášok, tofu a sójovú omáčku a 2 minúty prehadzuj.
  - Dochuť sezamovým olejom, korením a zelenou cibuľkou.
tips:
  - Veľká panvica a vysoký oheň – ryža sa má opekať, nie dusiť.
variants:
  - name: Viac bielkovín
    description: 'Dvojnásobok tofu – opeč ho na dvakrát, nech sa neduší.'
    add:
      - tofu-natural: 200 g | rozdrobené
