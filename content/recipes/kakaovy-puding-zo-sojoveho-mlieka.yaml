title: Kakaový puding s banánom
description: Domáci čokoládový puding zo škrobu a kakaa, sladší banánom a s polovicou cukru oproti tomu z vrecúška. Deti ho chcú každý deň a ty vieš, čo v ňom je.
cuisine: moderna
meals: [dezert, snack]
categories: [dezerty/kremy]
time: 75
active: 15
servings: 7
difficulty: 1
tags: [nasarodinka, deti, lacne, dezert]
keeps: { fridge: 3 }
ingredients:
  - sojove-mlieko: 1,2 l
  - kukuricny-skrob: 7 pl
  - kakao: 4 pl
  - cukor: 4 pl
  - sol: 1 štipka
  - vanilka: 1 čl
  - banan: 3 ks
steps:
  - Z mlieka odlej asi 300 ml a rozšľahaj v ňom škrob, kakao a cukor dohladka, bez hrudiek.
  - Zvyšok mlieka so soľou zohrej v hrnci na strednom ohni, kým sa pri okraji neobjavia bublinky.
  - Za stáleho šľahania vlej kakaovú zmes. Stíš na mierny oheň a šľahaj 2 minúty, kým puding nezhustne a nezačne bublať. Odstav a vmiešaj vanilku.
  - Rozlej do 7 pohárov alebo misiek. Aby sa na povrchu neurobila koža, prikry každý priamo na povrchu potravinovou fóliou.
  - Nechaj vychladnúť a daj aspoň na hodinu do chladničky. Pred podávaním navrch nakrájaj banány na kolieska.
tips:
  - Puding musí po pridaní škrobu aspoň chvíľu bublať, inak ostane riedky a cítiť v ňom škrob.
