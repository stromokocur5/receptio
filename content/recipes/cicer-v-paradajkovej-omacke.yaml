title: Cícer v paradajkovej omáčke so špenátom
description: Jedna panvica, dvadsaťpäť minút – cícer dusený v passate s rímskou rascou a údenou paprikou, na konci hrsť špenátu. S kuskusom, ktorý sa len zaleje.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/strukoviny]
time: 25
active: 15
servings: 4
difficulty: 1
tags: [meal-prep, rychle, zo-spajze, vela-bielkovin, vela-vlakniny]
spicy: 1
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Rozrieď vývarom na polievku, alebo zohrej v pite s lyžicou jogurtu.'
related: [marinara-omacka, tagine-cicer, chana-masala]
ingredients:
  - olivovy-olej: 2 pl
  - cibula: 1 ks
  - cesnak: 3 ks
  - kmin: 1 čl
  - udena-paprika: 1 čl
  - cili: 1/4 čl
  - passata: 2 hrnček
  - cicer-sterilizovany: 2 ks | scedený
  - sol: 1 čl
  - spenat: 200 g | čerstvý alebo mrazený
  - citron: 1 pl | šťava
  - kuskus: 1,5 hrnček
  - voda: 1,5 hrnček | vriaca, na kuskus
steps:
  - Na oleji na strednom ohni speň nadrobno nakrájanú cibuľu 5 minút. Pridaj prelisovaný cesnak, rímsku rascu, údenú papriku a čili a pol minúty miešaj, nech sa korenie rozvonia.
  - Prilej passatu, pridaj cícer a 3/4 čl soli. Var na miernom ohni 12 minút, občas premiešaj.
  - Medzitým kuskus v mise zmiešaj so zvyšnou soľou, zalej vriacou vodou, prikry tanierom a nechaj 5 minút stáť. Potom ho vidličkou nakypri.
  - Do omáčky vmiešaj špenát a var 2–3 minúty, kým nezvädne (mrazený 5 minút). Dochuť citrónovou šťavou.
  - Podávaj na kuskuse.
tips:
  - Do krabičiek dávaj kuskus a cícer vedľa seba, nie na seba – kuskus tak nerozmokne.
