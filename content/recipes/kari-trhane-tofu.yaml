title: Krémové kari s trhaným tofu
description: Hodvábna paradajková omáčka bez jediného kúska cibule, trhané tofu v chrumkavej škrobovej kruste a opražené tekvicové semienka. Veľká porcia s poriadnou dávkou bielkovín.
cuisine: indicka-sever
meals: [obed, vecera]
time: 45
active: 35
servings: 3
difficulty: 2
tags: []
spicy: 1
keeps: { fridge: 3, freezer: 2 }
leftovers: 'Zohrej pomaly s lyžicou vody, semienka pridaj čerstvé.'
related: [tofu-butter-masala]
ingredients:
  - tofu-natural: 500 g | čo najtvrdšie
  - kukuricny-skrob: 2 pl
  - olivovy-olej: 2 pl
  - sol: 1,5 čl | ½ ČL na tofu, zvyšok do omáčky
  - cibula: 1 ks | veľká
  - cesnak: 5 ks
  - zazvor: 30 g | kúsok veľký ako palec
  - voda: 2 pl
  - rastlinne-maslo: 50 g
  - kari-korenie: 1,5 pl
  - kurkuma: 1 čl
  - udena-paprika: 1 čl
  - skorica: 1/2 čl
  - cierne-korenie: 1/2 čl
  - passata: 400 g
  - javorovy-sirup: 1 pl | nepovinné, zjemní kyslosť paradajok
  - cili: podľa chuti
  - rastlinna-smotana: 200 ml | hustá, na varenie
  - citron: 1 pl
  - ryza-basmati: 250 g
  - tekvicove-semienka: 30 g | nasucho opražené
steps:
  - Tofu neumývaj ani nekrájaj – len z neho papierovou utierkou vysaj vodu a rukami ho natrhaj na kúsky veľké ako vlašský orech. Trhané okraje majú oveľa väčší povrch, omáčka sa na ne lepšie chytí.
  - V miske ho posyp škrobom a ½ ČL soli a pretrep, kým sa všetko neobalí. Na olivovom oleji opekaj na strednom ohni 8–10 minút, kým nemá zlatistú tvrdú krustu. Daj bokom.
  - Ryžu prepláchni a uvar pod pokrievkou s 1,5-násobkom vody, asi 12 minút.
  - Medzitým v sekáčiku alebo mixéri rozmixuj cibuľu (na štvrtiny), cesnak, olúpaný zázvor a 2 PL vody na úplne hladkú, tekutú pastu – v omáčke potom nenájdeš ani kúsok cibule.
  - V hlbokej panvici na strednom ohni rozpusť maslo, vlej pastu a za stáleho miešania restuj 5–7 minút, kým sa voda neodparí a pasta nezozlatne.
  - Stíš oheň, pridaj všetko mleté korenie a miešaj 30 sekúnd – horúci tuk z neho vytiahne vôňu. Dlhšie nie, zhorklo by.
  - Vlej passatu, pridaj zvyšnú soľ, sirup a čili a 8–10 minút mierne var, kým omáčka nestmavne do tehlovej farby a po vareche na dne neostane stopa.
  - Až teraz vmiešaj smotanu – vznikne hustá oranžová krémová omáčka. Pridaj tofu a zohrievaj len 1–2 minúty, aby krusta nasala omáčku, ale nerozpadla sa.
  - Odstav z ohňa, vmiešaj citrónovú šťavu a podávaj na ryži posypané tekvicovými semienkami.
tips:
  - Smotanu pridaj až do zhustnutej omáčky. Do riedkej a kyslej by sa mohla zraziť a omáčka by bola vodová.
  - Semienka opraž na suchej panvici 3–4 minúty, kým nezačnú praskať. Dodajú chrumkavosť aj zinok a horčík.
  - Citrón nevynechaj – kyslosť na konci osvieži ťažkú smotanovú omáčku.
variants:
  - name: S kokosovým olejom
    description: Namiesto rastlinného masla rafinovaný (dezodorizovaný) kokosový olej – omáčka nebude chutiť po kokose.
    replace:
      - from: rastlinne-maslo
        to: kokosovy-olej
        amount: 3 pl
  - name: Bez náhrad
    description: Kešu krém namiesto smotany. 60 g kešu zalej vriacou vodou na 15 minút, sceď a rozmixuj s 3/4 hrnčeka vody dohladka.
    replace:
      - from: rastlinna-smotana
        to: kesu
        amount: 60 g | namočené a rozmixované s vodou
      - from: rastlinne-maslo
        to: olej
        amount: 3 pl
    add:
      - voda: 3/4 hrnček
