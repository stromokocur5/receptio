title: Shawarma z hlivy s tahini a nakladanou zeleninou
description: Hliva opečená v shawarma korení so škoricou a kardamónom, zabalená v lavaši s tahini omáčkou, nakladanou zeleninou a hranolkami.
cuisine: libanonska
meals: [obed, vecera]
categories: [hlavne/plnene, hlavne/zelenina]
time: 35
active: 25
servings: 3
difficulty: 1
tags: [rychle, party]
spicy: 1
keeps: { fridge: 2 }
related: [durum-hliva, tahini-dresing]
ingredients:
  - hliva: 450 g
  - olej: 3 pl
  - kmin: 1 čl
  - koriander-mlety: 1 čl
  - sladka-paprika: 1 čl
  - kurkuma: 1/2 čl
  - skorica: 1/4 čl
  - kardamom: 1/4 čl
  - nove-korenie: 1/4 čl | mleté
  - cesnak: 3 ks
  - citron: 1 ks
  - sol: 1 čl
  - tahini: 3 pl
  - voda: 3 pl
  - psenicne-tortilly: 3 ks | alebo lavaš
  - kysle-uhorky: 2 ks
  - redkovka: 4 ks | alebo nakladaná repa
  - paradajky: 1 ks
  - petrzlenova-vnat: 3 pl
steps:
  - Hlivu natrhaj na prúžky. Zmiešaj všetky koreniny, 2 prelisované strúčiky cesnaku, šťavu z polovice citróna, 1 PL oleja a soľ a hlivu v tom obaľ.
  - Opekaj na zvyšnom oleji na veľkom ohni 8–10 minút, kým nemá chrumkavé tmavé okraje.
  - Tahini vyšľahaj so šťavou zo zvyšku citróna, posledným cesnakom a vodou dohladka.
  - Tortillu prehrej, natri tahini, pridaj hlivu, uhorky, redkovku, paradajku a petržlen.
  - Pevne zroluj a opeč na suchej panvici švom dole, aby držala.
