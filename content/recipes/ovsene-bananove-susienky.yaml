title: Ovsené banánové sušienky s hrozienkami
description: Mäkké sušienky z vločiek, banánu a arašidového masla bez múky a bez cukru. Zmiešaš ich v jednej miske za 10 minút a zjedia sa skôr, ako vychladnú.
cuisine: moderna
meals: [snack, dezert, ranajky]
categories: [dezerty/susienky]
time: 30
active: 10
servings: 7
difficulty: 1
tags: [nasarodinka, deti, lacne, do-krabicky]
keeps: { fridge: 5, freezer: 2 }
ingredients:
  - banan: 4 ks | zrelé, s hnedými bodkami
  - arasidove-maslo: 4 pl
  - skorica: 1 čl
  - sol: 1 štipka
  - ovsene-vlocky: 300 g
  - hrozienka: 4 pl
steps:
  - Rúru predhrej na 180 °C a plech vystel papierom na pečenie.
  - Banány roztlač v miske vidličkou na kašu. Vmiešaj arašidové maslo, škoricu a soľ.
  - Pridaj vločky a hrozienka a premiešaj. Nechaj 10 minút postáť, vločky zmäknú a cesto sa dá tvarovať.
  - Lyžicou rozlož na plech 28 kôpok a roztlač ich na kolieska hrubé asi 1 cm. Neroztečú sa, takže stačí malý rozostup.
  - Peč 15–18 minút, kým nie sú okraje zlatisté. Nechaj vychladnúť na plechu, potom stuhnú.
tips:
  - Ak niekto nesmie arašidy, nahraď arašidové maslo 3 lyžicami oleja.
