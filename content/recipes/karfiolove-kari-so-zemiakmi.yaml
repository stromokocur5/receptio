title: Karfiolové kari so zemiakmi a hráškom
description: Karfiol a zemiaky najprv opečené do hneda, potom dusené v paradajkovom základe s cibuľou, cesnakom a kari korením rozpusteným v oleji. Suché, voňavé kari, nie vodová omáčka. S ryžou.
cuisine: indicka-sever
meals: [obed, vecera]
categories: [hlavne/kari, hlavne/zelenina]
time: 40
active: 25
servings: 3
difficulty: 1
tags: [zlatica, meal-prep]
keeps: { fridge: 3, freezer: 2 }
ingredients:
  - karfiol: 1 ks | stredný
  - zemiaky: 3 ks
  - olej: 4 pl | 2 na zeleninu, 2 na základ
  - sol: 1,5 čl
  - cibula: 1 ks
  - cesnak: 4 ks
  - rasca: 1 čl
  - kari-korenie: 1 pl
  - kurkuma: 1/2 čl
  - paradajky: 3 ks | alebo pol plechovky krájaných
  - voda: 550 ml | 100 do kari, 450 na ryžu
  - hrasok: 150 g | mrazený
  - citron: 1 pl
  - ryza-basmati: 200 g
  - petrzlenova-vnat: 3 pl
steps:
  - Karfiol rozober na ružičky, zemiaky ošúp a nakrájaj na kocky 2 cm. Cibuľu nakrájaj nadrobno, paradajky na malé kocky.
  - Vo veľkej panvici rozohrej 2 PL oleja na vyššom strednom ohni. Pridaj zemiaky a karfiol a opekaj 10 minút, premiešaj len každé 2–3 minúty, kým nemajú hnedé miesta. Vyber na tanier. Opečená zelenina drží tvar a chutí orieškovo.
  - Prepláchni ryžu, zalej 450 ml vody so štipkou soli, priveď do varu a pod pokrievkou var na miernom ohni 12 minút. Odstav prikrytú.
  - Do panvice daj 2 PL oleja a rascu. Keď začne praskať, pridaj cibuľu a restuj 6 minút dozlata. Pridaj prelisovaný cesnak, kari a kurkumu a miešaj 30 sekúnd – korenie rozpustené v horúcom oleji chutí oveľa silnejšie.
  - Pridaj paradajky a soľ a var 3 minúty, kým sa nerozpadnú. Vráť karfiol a zemiaky, prilej 100 ml vody, prikry a dus na miernom ohni 10 minút, kým zemiaky nie sú mäkké. Posledné 3 minúty pridaj hrášok.
  - Odkry a ak je na dne voda, nechaj ju 1–2 minúty odpariť. Vmiešaj citrónovú šťavu, ochutnaj, dosoľ a posyp vňaťou. Podávaj s ryžou.
tips:
  - Kari korenie býva bezlepkové, ale pozri na etiketu – niektoré zmesi majú pridanú múku.
