title: Kuskus so siedmimi zeleninami
description: Piatkový marocký kuskus – nadýchané zrnká a voňavý vývar s tekvicou, mrkvou, cuketou, cícerom a hrozienkami.
cuisine: severoafricka
meals: [obed, vecera]
time: 55
active: 20
servings: 4
difficulty: 1
tags: [klasika, one-pot]
spicy: 1
keeps: { fridge: 3, freezer: 3 }
leftovers: 'Kuskus a zeleninu skladuj zvlášť, inak kuskus rozmočí.'
ingredients:
  - olivovy-olej: 3 pl
  - cibula: 2 ks | na mesiačiky
  - paradajky: 2 ks | na štvrtiny
  - kurkuma: 1 čl
  - zazvor: 1 čl | nastrúhaný
  - skorica: 1/2 čl
  - cierne-korenie: 1/2 čl
  - mrkva: 3 ks | pozdĺžne na polky
  - tekvica-hokkaido: 400 g | na veľké kusy
  - cuketa: 1 ks | na hrubé kusy
  - biela-kapusta: 200 g | na mesiačiky
  - cicer-sterilizovany: 1 ks
  - hrozienka: 3 pl
  - zeleninovy-vyvar: 1,2 l
  - sol: 1 čl
  - kuskus: 300 g
  - harissa: 1 čl | na stôl
  - bylinky-koriander: 3 pl
steps:
  - V širokom hrnci na strednom ohni speň cibuľu na 2 PL oleja, pridaj paradajky a korenie a 5 minút duste.
  - Pridaj mrkvu, kapustu a vývar a var na miernom ohni 15 minút. Potom tekvicu, cuketu, cícer a hrozienka a var ďalších 15 minút.
  - Kuskus premiešaj so soľou a 1 PL oleja, zalej rovnakým objemom vriaceho vývaru z hrnca, prikry a nechaj 5 minút. Potom ho vidličkou prehrab.
  - Kuskus navŕš na tanier, zeleninu naukladaj do kopčeka a polej vývarom. Harissu rozmiešaj v naberačke vývaru a podávaj zvlášť.
tips:
  - Zeleninu pridávaj od najtvrdšej po najmäkšiu, aby sa nič nerozvarilo.
