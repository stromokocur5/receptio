title: Pečené sójové zrná (soy nuts)
description: Chrumkavý snack z najlacnejšej bielkoviny vôbec. Namočiť, upiecť, okoreniť – ako oriešky, ale za pár centov.
cuisine: moderna
meals: [snack, domace]
time: 55
active: 5
servings: 6
difficulty: 1
tags: [urob-si-sam, vela-bielkovin, lacne]
ahead: Zrná namoč na 12 hodín (cez noc).
keeps: { fridge: 14 }
ingredients:
  - sojove-zrna: 200 g | namočené cez noc
  - olej: 1 pl
  - sol: 1 čl
  - udena-paprika: 1 čl
  - cesnak: 1 ks | prelisovaný
steps:
  - Namočené zrná var 10 minút, sceď a dôkladne osuš utierkou.
  - Rozprestri na plech a peč na 175 °C 40–50 minút, každých 10 minút premiešaj, kým nie sú zlatohnedé a chrumkavé.
  - Ešte horúce premiešaj s olejom, soľou, paprikou a cesnakom.
tips:
  - Po vychladnutí ešte chrumkavejú. Skladuj v uzavretej dóze.
