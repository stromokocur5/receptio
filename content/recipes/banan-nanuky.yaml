title: Banánové nanuky v čokoláde
description: Polovica banánu na špajli, čokoládový kabát a posýpka z orechov. Zmrzlina bez zmrzlinovača aj bez pridaného cukru v strede.
cuisine: moderna
meals: [snack, dezert]
categories: [snacky/sladke, dezerty/kremy]
time: 180
active: 15
servings: 6
difficulty: 1
tags: [deti, party, lacne]
ahead: Banány zmrazuj aspoň 2 hodiny.
keeps: { fridge: 0, freezer: 2 }
ingredients:
  - banan: 3 ks | zrelé, ale pevné
  - horka-cokolada: 100 g
  - kokosovy-olej: 1 pl
  - arasidy: 3 pl | nasekané
  - kokos-struhany: 2 pl
steps:
  - Banány olúp, prekroj napoly a do každej polovice zapichni špajdľu alebo drevenú paličku.
  - Polož ich na tanier s papierom na pečenie a daj na 1 hodinu do mrazničky.
  - Čokoládu s kokosovým olejom rozpusť vo vodnom kúpeli a prelej do vysokého pohára.
  - Zmrznuté banány ponor do čokolády, nechaj odkvapkať a hneď posyp arašidmi alebo kokosom – na studenom banáne čokoláda stuhne za pár sekúnd.
  - Vráť do mrazničky aspoň na hodinu. Pred jedlom nechaj 5 minút postáť.
tips:
  - Kokosový olej robí čokoládu tenkou a chrumkavou, bez neho je kabát hrubý a láme sa.
  - Prezreté banány nepoužívaj – sú mäkké a zo špajle sa zosunú.
