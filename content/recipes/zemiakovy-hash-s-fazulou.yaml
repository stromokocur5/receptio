title: Raňajkový zemiakový hash s paprikou a fazuľou
description: Kocky zemiakov najprv pod pokrievkou zmäknuté a potom bez nej opečené dozlata, s paprikou, cibuľou a fazuľou na údeno. Slané raňajky, s ktorými vydržíš do obeda.
cuisine: slovenska
meals: [ranajky, obed]
categories: [ranajky/slane, hlavne/zelenina]
time: 30
active: 25
servings: 2
difficulty: 1
tags: [rychle]
ingredients:
  - zemiaky: 4 ks
  - olej: 3 pl
  - voda: 4 pl
  - sol: 3/4 čl
  - cibula: 1 ks
  - paprika-cervena: 1 ks
  - cesnak: 2 ks
  - udena-paprika: 1 čl
  - fazula-cervena: 1 ks | plechovka, scedená a prepláchnutá
  - paradajky: 2 ks
  - pazitka: 2 pl
  - cierne-korenie: 1 štipka
steps:
  - Zemiaky ošúp (alebo len dobre umy) a nakrájaj na malé kocky 1,5 cm. Malé kocky sa uvaria aj opečú naraz.
  - Na veľkej panvici rozohrej 2 PL oleja na strednom ohni, pridaj zemiaky, 1/2 ČL soli a 4 PL vody. Prikry pokrievkou a nechaj 8 minút. Para ich uvarí do mäkka.
  - Zlož pokrievku, zvýš oheň a opekaj 8–10 minút, premiešaj len každé 2–3 minúty, kým nemajú zlatú kôrku zo všetkých strán. Časté miešanie kôrku nedovolí.
  - Odsuň zemiaky na kraj, do voľného miesta daj 1 PL oleja, nakrájanú cibuľu a papriku a opekaj 4–5 minút. Pridaj prelisovaný cesnak a fazuľu, premiešaj so zemiakmi, odstav a posyp údenou paprikou a zvyškom soli.
  - Paradajky nakrájaj na kocky a navrch ich daj čerstvé, s pažítkou a korením. Šťavnaté studené paradajky na horúcich chrumkavých zemiakoch – tak to má byť.
tips:
  - Ak máš uvarené zemiaky zo včera, preskoč varenie pod pokrievkou, opekaj ich rovno.
