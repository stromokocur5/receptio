title: Chrumkavé tofu kocky so sezamom
description: Kocky tofu obalené v škrobe a sezame, opečené dozlatista a namáčané v sladko-pikantnej omáčke. Na párty zmiznú prvé.
cuisine: cinska
meals: [snack, vecera]
categories: [snacky/party, hlavne/tofu]
time: 30
active: 25
servings: 3
difficulty: 1
spicy: 1
tags: [vela-bielkovin, party, rychle]
related: [tofu-nuggets]
ingredients:
  - tofu-natural: 400 g | pevné
  - kukuricny-skrob: 3 pl
  - sezam: 3 pl
  - sol: 1/2 čl
  - olej: 3 pl
  - sojova-omacka: 2 pl
  - javorovy-sirup: 1 pl
  - ryzovy-ocot: 1 pl
  - sriracha: 1 čl
steps:
  - Tofu 10 minút zaťaž v utierke, nakrájaj na kocky 2 cm a osoľ.
  - Kocky obaľ v škrobe a potom v sezame – vlhké tofu ho chytí samo.
  - Na panvici rozohrej olej na strednom ohni a kocky opekaj 8–10 minút, postupne otáčaj, kým nie sú zlatisté zo všetkých strán.
  - Zmiešaj sójovú omáčku, sirup, ocot a srirachu a podávaj ako dip so špáradlami.
tips:
  - Nepreplňuj panvicu, inak sa tofu dusí a nechrumká – radšej opekaj na dvakrát.
