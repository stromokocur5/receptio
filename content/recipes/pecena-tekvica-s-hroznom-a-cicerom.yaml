title: Pečená tekvica s hroznom, cícerom a tahini
description: Mesiačiky hokkaida a chrumkavý cícer z jedného plechu, ku koncu pribudne hrozno, ktoré v rúre praskne a urobí z šťavy sladkokyslú omáčku. Navrch tahini, orechy a bulgur popod. Jesenný obed z jedného plechu.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/rura, hlavne/zelenina]
time: 50
active: 20
servings: 3
difficulty: 1
tags: [meal-prep, do-krabicky]
spicy: 0
keeps: { fridge: 3 }
ingredients:
  - tekvica-hokkaido: 1 kg | menšia, so šupkou
  - cibula-cervena: 2 ks
  - cicer-sterilizovany: 2 ks | 2 konzervy, scedený
  - olivovy-olej: 4 pl
  - sol: 1,5 čl
  - udena-paprika: 1 čl
  - rozmarin: 1 ks
  - hrozno: 300 g | bezsemenné
  - ocot: 1 pl | ideálne balzamikový
  - bulgur: 150 g
  - voda: 300 ml | vriaca
  - tahini: 3 pl
  - citron: 1/2 ks | šťava
  - cesnak: 1 ks
  - vlasske-orechy: 40 g
  - petrzlenova-vnat: 2 pl
steps:
  - Rúru predhrej na 220 °C. Tekvicu prekroj, lyžicou vyber semená a nakrájaj na mesiačiky hrubé asi 2 cm. Cibuľu nakrájaj na osminky.
  - Cícer sceď, prepláchni a vysuš utierkou – suchý v rúre zhnedne a chrumká, mokrý sa dusí. Na plechu s papierom premiešaj tekvicu, cibuľu a cícer s 3 PL oleja, 1 ČL soli, údenou paprikou a ihličím rozmarínu. Rozlož v jednej vrstve, ak treba na dva plechy.
  - Peč 20 minút. Potom pridaj na plech hrozno otrhané zo strapca, premiešaj a peč ešte 15 minút, kým tekvica nie je mäkká s hnedými okrajmi a hrozno popraskané.
  - Medzitým bulgur zalej vriacou vodou s 1/4 ČL soli, prikry a nechaj 15 minút, potom prehrabni vidličkou. Orechy opraž na suchej panvici 3 minúty a nahrubo nasekaj.
  - Tahini rozmiešaj s citrónovou šťavou, prelisovaným cesnakom a štipkou soli. Zhustne – prilievaj po lyžici studenú vodu (asi 4–5 PL), kým nie je hladké a tečie z lyžice.
  - Hneď po vybratí z rúry pokvapkaj plech octom a zvyšným olejom a premiešaj so šťavou z hrozna. Podávaj na bulgure, polej tahini a posyp orechmi a vňaťou.
tips:
  - Namiesto bulguru quinoa alebo pohánka, ak varíš bez lepku.
  - Šupka hokkaida sa nelúpe, po upečení zmäkne.
