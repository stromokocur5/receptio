title: Kapustová polievka so zemiakmi a fazuľou
description: Sýta polievka z čerstvej bielej kapusty, zemiakov a fazule s rascou a majoránkou. Kapusta sa najprv opečie, preto chutí sladko a nie ako varená. Hrniec pre sedem ľudí stojí okolo troch eur.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/zeleninove]
time: 40
active: 20
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, one-pot, polievka, klasika, meal-prep]
keeps: { fridge: 4, freezer: 3 }
ingredients:
  - olej: 2 pl
  - cibula: 2 ks
  - biela-kapusta: 600 g
  - cesnak: 2 ks
  - sladka-paprika: 2 čl
  - rasca: 1 čl
  - voda: 2,2 l
  - zemiaky: 600 g
  - mrkva: 2 ks
  - bobkovy-list: 2 ks
  - nove-korenie: 3 ks
  - sol: 2,5 čl
  - fazula-biela: 2 ks | scedená
  - ocot: 1 pl
  - majoranka: 1 čl
steps:
  - Cibuľu nakrájaj nadrobno a kapustu na tenké rezance. Zemiaky ošúp a nakrájaj na kocky, mrkvu na kolieska.
  - V širokom hrnci zohrej olej na strednom ohni. Cibuľu opekaj 4 minúty, pridaj kapustu a opekaj ju 8 minút za častého miešania, kým nezmäkne a miestami nezačne zlatnúť.
  - Pridaj prelisovaný cesnak, papriku a rascu a miešaj 30 sekúnd.
  - Prilej vodu, pridaj zemiaky, mrkvu, bobkový list, nové korenie a soľ. Priveď do varu a var na miernom ohni 20 minút, kým zemiaky nezmäknú.
  - Pridaj fazuľu a var ešte 5 minút. Odstav, vmiešaj ocot a majoránku rozdrvenú medzi dlaňami. Ochutnaj soľ a ocot.
tips:
  - Na druhý deň je ešte lepšia.
