title: Nadýchané lievance s javorovým sirupom
description: Americké pancakes bez vajec – vysoké, nadýchané a hotové za dvadsať minút.
cuisine: americka
meals: [ranajky]
categories: [ranajky/palacinky]
time: 25
active: 25
servings: 3
difficulty: 1
tags: [ranajky]
keeps: { fridge: 2, freezer: 2 }
leftovers: 'Zamraz ich preložené papierom, rozmrazíš v hriankovači.'
ingredients:
  - sojove-mlieko: 300 ml
  - ocot: 1 pl
  - hladka-muka: 200 g
  - kypriaci-prasok: 2 čl
  - cukor: 1 pl
  - sol: 1 štipka
  - olej: 2 pl
  - javorovy-sirup: 4 pl
  - maliny: 1 hrnček
steps:
  - Do mlieka vmiešaj ocot a nechaj 5 minút postáť – zrazí sa na „cmar“, ktorý lievance nadvihne.
  - Múku, prášok do pečiva, cukor a soľ premiešaj, prilej mlieko a lyžicu oleja a len krátko premiešaj. Hrudky sú v poriadku, premiešané cesto je tvrdé.
  - Panvicu potri olejom a na strednom ohni peč po naberačke. Otoč, keď sa na povrchu robia bublinky a okraje matnú.
  - Podávaj s javorovým sirupom a malinami.
variants:
  - name: Ľahšia verzia
    description: Sirupu len lyžicu navrch a namiesto neho kopa čerstvého ovocia.
    replace:
      - from: javorovy-sirup
        to: javorovy-sirup
        amount: 1 pl
    add:
      - cucoriedky: 1 hrnček
