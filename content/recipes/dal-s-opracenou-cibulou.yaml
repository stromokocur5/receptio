title: Šošovicový dal s opraženou cibuľkou a cesnakom
description: Červená šošovica rozvarená do krému a na konci zaliata horúcim olejom s cesnakom, cibuľkou a údenou paprikou – vtedy to zasyčí a celá kuchyňa zavonia. S ryžou a uhorkovým šalátom.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/strukoviny]
time: 30
active: 15
servings: 3
difficulty: 1
tags: [zlatica, rychle, lacne, meal-prep]
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Zhustne – zohrej ho s vodou a pridaj kvapku citróna.'
ingredients:
  - sosovica-cervena: 200 g
  - voda: 1,2 l | 750 na šošovicu, 450 na ryžu
  - kurkuma: 1/2 čl
  - sol: 1,5 čl
  - ryza-basmati: 200 g
  - olej: 3 pl
  - cibula: 1 ks
  - cesnak: 4 ks
  - rasca: 1 čl
  - udena-paprika: 1 čl
  - paradajky: 2 ks
  - citron: 1/2 ks | šťava
  - uhorka: 1/2 ks
  - petrzlenova-vnat: 2 pl
steps:
  - Šošovicu prepláchni v sitku, kým nie je voda číra. Daj ju do hrnca so 750 ml vody a kurkumou, priveď do varu, zober penu a var na miernom ohni 20 minút, občas premiešaj. Rozpadne sa na hustý krém. Soľ zatiaľ nepridávaj – v slanej vode šošovica mäkne pomalšie.
  - Hneď ako šošovica zovrie, prepláchni ryžu, zalej 450 ml vody so štipkou soli, priveď do varu a pod pokrievkou var na miernom ohni 12 minút. Odstav prikrytú.
  - Paradajky nakrájaj nadrobno a vmiešaj ich do šošovice posledných 5 minút varenia.
  - Na malej panvici rozohrej olej na strednom ohni, pridaj rascu a keď začne praskať (asi 20 sekúnd), pridaj nadrobno nakrájanú cibuľu. Opekaj 6–7 minút, kým nie je tmavozlatá. Pridaj nakrájaný cesnak a miešaj 1 minútu do zlatista. Odstav a vmiešaj údenú papriku.
  - Horúci olej s cibuľou vylej rovno do šošovice – zasyčí. Pridaj soľ a citrónovú šťavu, premiešaj a ochutnaj. Korenie rozpustené v horúcom oleji chutí desaťkrát silnejšie ako to, čo by si len vsypal do hrnca.
  - Podávaj s ryžou, nakrájanou uhorkou s kvapkou citróna a vňaťou.
tips:
  - Ak máš rád pálivé, pridaj do oleja s cesnakom štipku čili.
