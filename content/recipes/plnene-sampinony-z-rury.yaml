title: Plnené šampiňóny z rúry
description: Veľké klobúky plnené nasekanými stopkami, cibuľkou, cesnakom, strúhankou a orechmi, zapečené dozlatista. Predjedlo na oslavu aj večera so šalátom.
cuisine: moderna
meals: [vecera, snack]
categories: [snacky/party, hlavne/rura]
time: 40
active: 20
servings: 4
difficulty: 1
tags: [party, lacne]
spicy: 0
keeps: { fridge: 2 }
leftovers: 'Prehrej v rúre na 180 °C 10 minút.'
ingredients:
  - sampinony: 600 g | 12 veľkých klobúkov
  - olivovy-olej: 3 pl
  - cibula: 1 ks | nadrobno
  - cesnak: 3 ks | nasekaný
  - vlasske-orechy: 40 g | nasekané
  - struhanka: 1/2 hrnček
  - vyzivne-drozdie: 2 pl
  - petrzlenova-vnat: 3 pl | nasekaná
  - sol: 1/2 čl
  - cierne-korenie: 1/4 čl
  - citron: 1 pl | šťava
steps:
  - Rozohrej rúru na 200 °C a plech vystel papierom na pečenie. Z húb vylom stopky a nadrobno ich nasekaj.
  - Na panvici rozohrej 1 PL oleja na strednom ohni a cibuľu opekaj 5 minút. Pridaj nasekané stopky a opekaj 5 minút, kým sa neodparí voda. Pridaj cesnak a minútu miešaj.
  - Odstav a vmiešaj orechy, strúhanku, droždie, vňať, soľ, korenie, citrónovú šťavu a 1 PL oleja.
  - Klobúky potri zvyšným olejom, polož ich dutinou nahor na plech a naplň plnkou, mierne ju pritlač.
  - Peč 20 minút, kým huby nezmäknú a plnka nezhnedne.
tips:
  - Plnku môžeš pripraviť deň vopred, plnenie potom trvá 5 minút.
