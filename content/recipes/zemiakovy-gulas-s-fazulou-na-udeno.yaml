title: Zemiakový guláš s fazuľou na údeno
description: Hustý červený guláš, kde sa cibuľa opečie poriadne do zlata, paprika sa nespáli a zemiaky ho zahustia samy. Fazuľa a údená paprika mu dajú to, čo by inak dala klobása.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/strukovinove, hlavne/zelenina]
time: 45
active: 20
servings: 4
difficulty: 1
tags: [zlatica, klasika, lacne, one-pot]
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Na druhý deň je ešte lepší. Zohrej ho s trochou vody.'
ingredients:
  - olej: 2 pl
  - cibula: 2 ks
  - paprika-cervena: 1 ks
  - cesnak: 3 ks
  - paradajkovy-pretlak: 2 pl
  - sladka-paprika: 1,5 pl
  - udena-paprika: 1 čl
  - rasca: 1 čl
  - majoranka: 1 čl
  - zemiaky: 8 ks | asi 1,2 kg
  - voda: 1,2 l
  - sol: 1,5 čl
  - bobkovy-list: 1 ks
  - fazula-cervena: 1 ks | plechovka, scedená a prepláchnutá
  - ocot: 1 čl
  - kysle-uhorky: 4 ks | k podávaniu
steps:
  - Cibuľu nakrájaj nadrobno, papriku na kocky, zemiaky ošúp a nakrájaj na kocky 2 cm.
  - V hrnci rozohrej olej na strednom ohni a cibuľu restuj 10 minút, kým nie je mäkká a tmavozlatá. Toľko cibule a toľko času je základ gulášu – z nej je sladkosť aj hustota.
  - Pridaj papriku, prelisovaný cesnak, rascu a pretlak a miešaj 2 minúty, kým pretlak nestmavne.
  - Odstav hrniec z ohňa, vsyp sladkú a údenú papriku, premiešaj a hneď zalej vodou. Mletá paprika na horúcom tuku za pár sekúnd zhorkne, preto ide mimo ohňa.
  - Pridaj zemiaky, soľ, bobkový list a majoránku (rozdrv ju v dlaniach). Priveď do varu a mierne var pod pokrievkou 20 minút, kým zemiaky nie sú mäkké.
  - Pridaj fazuľu a var ešte 5 minút bez pokrievky. Varechou roztlač o stenu hrnca pár kociek zemiakov – guláš zhustne bez múky.
  - Vylov bobkový list, vmiešaj ocot, ochutnaj a dosoľ. Podávaj s kyslou uhorkou.
tips:
  - Ak chceš guláš pálivý, pridaj s paprikou štipku čili.
