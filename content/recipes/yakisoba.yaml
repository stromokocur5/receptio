title: Yakisoba
description: Japonské opekané rezance s kapustou, mrkvou a tofu v sladko-kyslej omáčke ako Worcester. Jedlo z festivalov.
cuisine: japonska
meals: [obed, vecera]
categories: [hlavne/cestoviny]
time: 20
active: 20
servings: 2
difficulty: 1
tags: [rychle]
spicy: 0
keeps: { fridge: 2 }
ingredients:
  - psenicne-rezance: 200 g
  - olej: 2 pl
  - tofu-natural: 150 g | na prúžky
  - cibula: 1 ks
  - biela-kapusta: 200 g | na kusy
  - mrkva: 1 ks | na prúžky
  - sojova-omacka: 2 pl
  - paradajkovy-pretlak: 1 pl
  - javorovy-sirup: 1 pl
  - ocot: 1 pl
  - zazvor: 1 čl
  - nori: 1 ks | rozdrobený
steps:
  - Rezance uvar a sceď.
  - Na oleji na strednom ohni opeč tofu, pridaj cibuľu, kapustu a mrkvu a 4 minúty opekaj.
  - Zmiešaj sójovú omáčku, pretlak, sirup, ocot a zázvor.
  - Pridaj rezance a omáčku a premiešavaj 2 minúty. Posyp nori.
