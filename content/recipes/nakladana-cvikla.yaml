title: Nakladaná cvikla
description: Sladkokyslá cvikla s rascou a chrenom. Príloha k zemiakom, do šalátu aj na hummusový toast.
cuisine: slovenska
meals: [domace]
categories: [domace/zavarane, salaty/prilohove]
time: 90
active: 30
servings: 16
difficulty: 1
tags: [urob-si-sam, lacne]
yields: cca 4 poháre po 0,5 l
keeps: { fridge: 21 }
howto: [nakladana-zelenina, zavaranie]
ingredients:
  - cvikla: 10 ks
  - cibula: 1 ks | na kolieska
  - rasca: 1 čl
  - chren: 1 pl | nastrúhaný
  - voda: ~400 ml | nálev
  - ocot: ~300 ml | nálev, 8 %
  - cukor: 120 g
  - sol: 1 čl
steps:
  - Cviklu uvar v šupke do mäkka, 40–60 minút podľa veľkosti. Nechaj vychladnúť a ošúp (v rukaviciach, farbí).
  - Nakrájaj na plátky alebo kocky a natlač do vyparených pohárov s cibuľou, rascou a chrenom.
  - Vodu, ocot, cukor a soľ priveď do varu a zalej cviklu. Zavri.
  - Zaváraj 30 minút vo vriacej vode (voda 3 cm nad viečkami) a nechaj vychladnúť.
tips:
  - Rýchlejšia verzia do chladničky – zalej horúcim nálevom a bez zavárania drž v chladničke 2 týždne.
