title: Vlašský šalát
description: Hustý majonézový šalát so zeleninou, uhorkami a kúskami údeného tofu alebo klobásy. Základ každých chlebíčkov.
cuisine: slovenska
meals: [ranajky, vecera, snack]
categories: [salaty/prilohove, omacky/dipy, comfort/bufet]
time: 70
active: 30
servings: 6
ahead: 'Hotový šalát nechaj aspoň hodinu odležať v chladničke, najlepší je na druhý deň.'
difficulty: 1
tags: [klasika, party]
keeps: { fridge: 3 }
related: [oblozene-chlebicky, zemiakovy-salat]
ingredients:
  - zemiaky: 2 ks
  - mrkva: 1 ks
  - petrzlen-koren: 1 ks
  - hrasok: 1/2 hrnček | mrazený
  - kysle-uhorky: 3 ks
  - tofu-udene: 120 g | alebo pikantná klobása
  - veganska-majoneza: 6 pl
  - sojovy-jogurt: 2 pl
  - horcica: 1 čl
  - citron: 1 čl
  - sol: 1/2 čl
  - cierne-korenie: 1 štipka
steps:
  - Zemiaky v šupke a ošúpanú mrkvu s petržlenom daj variť do osolenej vody. Mrkvu a petržlen vyber po 15 minútach, zemiaky po 20–25. Hrášok povar 2 minúty a sceď. Všetko nechaj úplne vychladnúť – teplá zelenina majonézu roztopí. Zemiaky ošúp.
  - Zemiaky, mrkvu, petržlen, uhorky a údené tofu nakrájaj na drobné kocky.
  - Majonézu zmiešaj s jogurtom, horčicou, citrónom, soľou a korením.
  - Všetko spolu s hráškom premiešaj a nechaj aspoň hodinu v chladničke.
