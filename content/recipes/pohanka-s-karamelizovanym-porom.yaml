title: Pohánka s karamelizovaným pórom a opraženými semienkami
description: Sypká, orieškovo voňajúca pohánka, nie lepkavá kaša, a k nej pór opečený pomaly do sladka a nakoniec sprudka do hneda. Chrumkavé semienka, cesnak a kvapka octu. Za 25 minút.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/ryza]
time: 25
active: 20
servings: 2
difficulty: 1
tags: [zlatica, rychle, lacne]
keeps: { fridge: 3 }
ingredients:
  - pohanka: 150 g
  - voda: 300 ml
  - sol: 1 čl
  - por: 2 ks
  - olej: 2 pl
  - cesnak: 2 ks
  - majoranka: 1/2 čl
  - ocot: 1 čl
  - horcica: 1 čl
  - slnecnicove-semienka: 3 pl
  - tekvicove-semienka: 2 pl
  - petrzlenova-vnat: 2 pl
  - cierne-korenie: 1 štipka
steps:
  - Pohánku prepláchni a nasucho ju praž v hrnci na strednom ohni 2–3 minúty, kým nezačne voňať a jemne praskať. Opražené zrná ostanú po uvarení sypké.
  - Zalej 300 ml vriacej vody (pozor, prská), pridaj 1/2 ČL soli, prikry a var na najmiernejšom ohni 12 minút. Odstav a nechaj prikrytú ďalších 5 minút. Nemiešaj ju – miešanie z nej robí kašu.
  - Medzitým pór pozdĺžne rozrež, umy medzi vrstvami a nakrájaj na kolieska hrubé 1 cm. Na panvici rozohrej olej na strednom ohni, pridaj pór a 1/2 ČL soli a za občasného miešania ho opekaj 8 minút, kým nezmäkne.
  - Zvýš oheň na vysoký a pór 3–4 minúty nechaj opekať a len občas ho premiešaj, kým nemá tmavohnedé okraje. Najprv sa v ňom pomaly uvoľní cukor, potom sa sprudka skaramelizuje – vďaka tomu chutí ako opečená cibuľka na halušky.
  - Stíš oheň, pridaj prelisovaný cesnak, majoránku a semienka a miešaj 1 minútu. Vmiešaj horčicu a ocot.
  - Pohánku prehrabni vidličkou, pridaj ju k póru a premiešaj. Ochutnaj, dosoľ a podávaj s vňaťou a korením. Ku kapustovému alebo uhorkovému šalátu.
tips:
  - Pohánka je bezlepková, ale pozri na obale, či je bez krížovej kontaminácie.
