title: Quesadilla s batátom a čiernou fazuľou do mrazničky
description: Chrumkavé quesadilly so sladkým batátom, fazuľou, špenátom a roztaveným syrom. Upečieš ich naraz, zamrazíš a ráno opečieš na panvici za pár minút.
cuisine: mexicka
meals: [ranajky, obed, vecera]
categories: [hlavne/plnene, ranajky/slane]
time: 40
active: 30
servings: 6
difficulty: 1
tags: [meal-prep, do-krabicky, deti, ranajky, tortilla-na-tyzden]
keeps: { fridge: 3, freezer: 3 }
leftovers: 'Z mrazu opeč na suchej panvici pod pokrievkou na miernom ohni 4 minúty z každej strany. V mikrovlnke zmäknú, potom ich minútu opeč na panvici.'
related: [quesadilla, ranajkove-burrito-do-mraznicky, domace-psenicne-tortilly]
ingredients:
  - batat: 1 ks | asi 300 g
  - olej: 3 pl
  - cibula: 1 ks
  - kmin: 1 čl
  - udena-paprika: 1 čl
  - sol: 1 čl
  - fazula-cierna: 2 ks
  - spenat: 150 g | čerstvý
  - limetka: 1 ks
  - vegansky-syr: 1 hrnček
  - psenicne-tortilly: 6 ks
steps:
  - Batát ošúp a nastrúhaj nahrubo, cibuľu nakrájaj nadrobno.
  - Na 1 PL oleja na strednom ohni opekaj cibuľu a batát 8 minút, kým batát nezmäkne. Pridaj kmín, papriku a soľ na 30 sekúnd.
  - Pridaj fazuľu, polovicu z nej roztlač, vmiešaj špenát a nechaj zvädnúť. Dochuť limetkou a nechaj trochu vychladnúť.
  - Plnku rozdeľ na polovicu každej tortilly, posyp syrom a druhú polovicu preklop a pritlač.
  - Panvicu potri trochou oleja a opeč quesadilly na strednom ohni 3 minúty z každej strany do chrumkava. Upeč všetky po dvoch.
  - Tie na mrazenie nechaj úplne vychladnúť, prelož ich papierom na pečenie a zamraz vo vrecku.
tips:
  - Bez syra drží quesadillu pokope roztlačená fazuľa – je ľahšia a pri mrazení sa správa rovnako.
  - Do krabičky pribaľ salsu alebo sójový jogurt na namáčanie.
