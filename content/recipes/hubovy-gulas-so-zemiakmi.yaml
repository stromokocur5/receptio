title: Hubový guláš so zemiakmi
description: Hustý guláš zo šampiňónov a zemiakov s cibuľou, paprikou, rascou a majoránkou. Pomaly dusený, sýty, ako z kotlíka – a na druhý deň ešte lepší.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/zelenina, polievky/zeleninove]
time: 70
active: 25
servings: 4
difficulty: 1
tags: [klasika, lacne, one-pot, meal-prep]
spicy: 0
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Zohrej s trochou vody, zemiaky ho cez noc zahustia.'
ingredients:
  - olej: 3 pl
  - cibula: 3 ks | nadrobno
  - sampinony: 600 g | na štvrtiny
  - cesnak: 4 ks | nasekaný
  - sladka-paprika: 2 pl
  - udena-paprika: 1 čl
  - rasca: 1 čl
  - paradajkovy-pretlak: 2 pl
  - passata: 200 g
  - zemiaky: 800 g | na kocky 2 cm
  - voda: 1 l
  - bobkovy-list: 2 ks
  - majoranka: 2 čl
  - sol: 1,5 čl
  - cierne-korenie: 1/2 čl
  - chlieb: 4 ks | krajce na podávanie
steps:
  - V hrnci rozohrej olej na strednom ohni a cibuľu opekaj 10 minút, kým nezmäkne a nezačne hnednúť. Pomalá cibuľa je základ chuti gulášu.
  - Pridaj huby, zvýš oheň a opekaj 8 minút, kým nepustia vodu a tá sa neodparí.
  - Stiahni oheň, pridaj cesnak, obe papriky, rascu a pretlak a miešaj 1 minútu – paprika nesmie zhorknúť.
  - Hneď vlej passatu a vodu, pridaj zemiaky, bobkové listy, soľ a korenie. Priveď do varu, prikry a var na miernom ohni 30 minút, kým zemiaky nezmäknú.
  - Niekoľko kúskov zemiakov rozmačkaj o stenu hrnca, nech guláš zhustne. Vmiešaj majoránku rozmrvenú v dlaniach a var ešte 5 minút. Bobkové listy vyber.
  - Podávaj s chlebom.
tips:
  - Ak máš lesné huby, nahraď nimi tretinu šampiňónov – guláš bude výraznejší.
