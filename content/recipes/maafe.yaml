title: Maafe – arašidový prívarok
description: Západoafrické krémové arašidové kari s batátmi a cícerom. Sýte a hrejivé.
cuisine: zapadoafricka
meals: [obed, vecera]
time: 45
active: 15
servings: 4
difficulty: 1
tags: [meal-prep, one-pot]
spicy: 1
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Podávaj s kuskusom alebo zabaľ do placky s uhorkou.'
ingredients:
  - olej: 1 pl
  - cibula: 1 ks
  - cesnak: 3 ks
  - zazvor: 1 pl
  - koriander-mlety: 1 čl
  - cili: 1/2 čl
  - paradajkovy-pretlak: 2 pl
  - batat: 2 ks | na kocky
  - paradajky-sterilizovane: 1 ks
  - zeleninovy-vyvar: 3 hrnček
  - arasidove-maslo: 6 pl
  - cicer-sterilizovany: 1 ks
  - spenat: 150 g
  - sol: podľa chuti
  - ryza-basmati: 300 g | na prílohu
steps:
  - Na oleji na strednom ohni speň cibuľu, pridaj cesnak, zázvor, korenie a pretlak a 2 minúty restuj.
  - Pridaj batáty, paradajky a vývar a var na miernom ohni 15 minút.
  - Arašidové maslo rozmiešaj s naberačkou horúceho vývaru a vlej späť, tak sa nezrazí.
  - Pridaj cícer a var na miernom ohni 10 minút, kým batát nezmäkne a omáčka nezhustne.
  - Vmiešaj špenát, dochuť soľou a podávaj s ryžou.
tips:
  - Pri celiakii použi bujón s označením bezlepkový, bežné kocky často obsahujú pšenicu.
