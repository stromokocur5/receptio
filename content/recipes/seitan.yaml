title: Domáci seitan
description: Mäsitý seitan z pšeničného lepku, dusený vo vývare. Na gyros, rezne, do stir-fry – okolo 20 g bielkovín na porciu.
cuisine: moderna
meals: [obed, vecera, domace]
categories: [domace/bielkoviny, hlavne/tofu]
time: 75
active: 20
servings: 6
difficulty: 3
tags: [meal-prep, vela-bielkovin]
keeps: { fridge: 5, freezer: 3 }
leftovers: 'Nakrájaj na tenké plátky do sendviča alebo opeč na kocky do gulášu.'
ingredients:
  - lepok-vital: 150 g
  - cicerova-muka: 2 pl
  - vyzivne-drozdie: 3 pl
  - udena-paprika: 1 čl
  - cesnak: 2 ks | prelisovaný
  - tamari: 3 pl
  - paradajkovy-pretlak: 1 pl
  - olej: 1 pl
  - voda: 180 ml
  - zeleninovy-vyvar: ~6 hrnček | na dusenie
steps:
  - Zmiešaj lepok, cícerovú múku, droždie a papriku.
  - Zvlášť zmiešaj cesnak, tamari, pretlak, olej a vodu a vlej k suchým surovinám.
  - Mies 2–3 minúty, kým nevznikne pružné cesto. Nie dlhšie, inak bude gumový.
  - Nechaj 10 minút odpočívať, potom vytvaruj valček alebo plátky.
  - Vývar priveď do varu, stíš na minimum a seitan v ňom 45 minút jemne dus. Nesmie prudko vrieť, inak bude hubovitý ako špongia.
  - Nechaj ho vychladnúť vo vývare. Potom nakrájaj a opeč na oleji na strednom ohni dozlatista.
tips:
  - Seitan je čistý lepok – pri celiakii nie.
