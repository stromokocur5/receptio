title: Čokoládový chia puding s malinami
description: Dezert aj raňajky pripravené večer. Ráno stačí vybrať z chladničky.
cuisine: moderna
meals: [ranajky, dezert]
time: 240
active: 5
servings: 2
difficulty: 1
tags: [bez-varenia, ranajky]
ingredients:
  - chia: 4 pl
  - sojove-mlieko: 1 hrnček
  - kakao: 1 pl
  - javorovy-sirup: 1 pl
  - maliny: 1/2 hrnček
steps:
  - Vyšľahaj mlieko s kakaom a sirupom, pridaj chia a premiešaj.
  - Po 10 minútach premiešaj znova, aby sa neurobili hrudky.
  - Nechaj v chladničke aspoň 4 hodiny alebo cez noc a podávaj s malinami.
tips:
  - 2 PL chia pokryjú viac ako dennú potrebu omega-3 ALA.
