title: Mrazené hrozno ako kyslé cukríky
description: Bobule hrozna obalené v limetke a cukre a zamrazené. Zvonka chrumkavá kyslá kôrka, vnútri sorbet. Najjednoduchšia hovadinka z mrazničky.
cuisine: moderna
meals: [snack, dezert]
categories: [dezerty/mrazene, snacky/sladke]
time: 130
active: 10
servings: 4
difficulty: 1
tags: [deti, party, bez-varenia, lacne]
spicy: 0
ahead: Mrzne aspoň 2 hodiny.
keeps: { fridge: 0, freezer: 2 }
related: [banan-nanuky, jogurtova-kora]
ingredients:
  - hrozno: 3 hrnček | bezsemenné, pevné bobule
  - limetka: 1 ks | šťava a kôra
  - cukor: 2 pl
steps:
  - Hrozno otrhaj zo strapca, umy a len zľahka otras – má ostať trochu vlhké.
  - V miske ho premiešaj s limetkovou šťavou. Cukor zmiešaj s nastrúhanou limetkovou kôrou a hrozno v ňom obaľ.
  - Rozlož bobule na tácku s papierom na pečenie tak, aby sa nedotýkali, a mraz aspoň 2 hodiny.
  - Jedz rovno z mrazničky. Po vybratí rýchlo mäknú, vyberaj len toľko, koľko zješ.
tips:
  - Malým deťom bobule rozkroj pozdĺžne, celé zmrznuté hrozno je tvrdé a guľaté.
  - Zmrznuté hrozno namiesto ľadu schladí limonádu a nezriedi ju.
