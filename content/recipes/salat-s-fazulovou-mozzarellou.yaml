title: Paradajky so šalátom a marinovanou fazuľou namiesto mozzarelly
description: Ľadový šalát a nasolené paradajky v hustom bazalkovom dresingu. Namiesto mozzarelly krémová biela fazuľa naložená v olivovom oleji, citróne a cesnaku – jemná, biela, mäkká a slaná ako syr.
cuisine: talianska
meals: [obed, vecera]
categories: [salaty/syte]
time: 20
active: 15
servings: 2
difficulty: 1
tags: [zlatica, rychle]
ingredients:
  - fazula-biela: 1 ks | plechovka, najlepšie veľké zrná
  - olivovy-olej: 4 pl | 2 na fazuľu, 2 do dresingu
  - citron: 1 ks | šťava
  - cesnak: 1 ks
  - sol: 3/4 čl
  - oregano: 1/2 čl
  - paradajky: 3 ks
  - salat: 200 g | ľadový, asi pol hlávky
  - horcica: 1/2 čl
  - bazalka: 2 pl | lístky, alebo petržlenová vňať
  - cierne-korenie: 1 štipka
  - slnecnicove-semienka: 2 pl
steps:
  - Fazuľu sceď, prepláchni a nechaj dobre odkvapkať. V miske ju zmiešaj s 2 PL oleja, polovicou citrónovej šťavy, prelisovaným cesnakom, 1/2 ČL soli, oreganom a korením. Nechaj aspoň 10 minút nasiaknuť – fazuľa sama nechutí ničím, marináda z nej spraví slané krémové sústa ako syr.
  - Paradajky nakrájaj na kúsky, daj do sitka nad misku, posyp 1/4 ČL soli a nechaj 10 minút odkvapkať. Voda odtečie, chuť zostane.
  - Semienka opraž na suchej panvici na strednom ohni 3 minúty dozlata.
  - Dresing – do misky daj 1 PL šťavy, ktorá odkvapkala z paradajok, zvyšok citrónovej šťavy, horčicu a nasekanú bazalku. Za šľahania vidličkou vlej 2 PL oleja, kým nezhustne.
  - Šalát natrhaj, umy a dobre osuš. Premiešaj ho s dresingom, navrch daj paradajky, fazuľu aj s marinádou a semienka.
tips:
  - Fazuľu môžeš naložiť aj večer vopred, cez noc v chladničke chutí ešte lepšie.
