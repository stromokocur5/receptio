title: Pita chipsy so za'atarom
description: Chrumkavé trojuholníky zo staršej pity upečené s olivovým olejom a za'atarom. Na namáčanie do hummusu aj namiesto krutónov do šalátu.
cuisine: libanonska
meals: [snack]
categories: [snacky/slane, snacky/party]
time: 15
active: 5
servings: 4
difficulty: 1
tags: [rychle, party, zero-waste]
keeps: { fridge: 0 }
leftovers: 'V uzavretej dóze pri izbovej teplote vydržia chrumkavé 4–5 dní. Zvlhnuté vráť na 3 minúty do rúry.'
related: [pita-chlieb, hummus, baba-ganoush, fattoush]
ingredients:
  - pita: 4 ks | pokojne 2–3 dni staré
  - olivovy-olej: 2 pl
  - zaatar: 1 pl
  - sol: 1/4 čl
steps:
  - Rúru rozohrej na 180 °C.
  - Každú pitu rozdeľ na dve tenké placky (roztrhni vrecko po obvode) a nakrájaj na 8 trojuholníkov.
  - V mise ich premiešaj s olejom, za'atarom a soľou, aby boli obalené zo všetkých strán.
  - Rozlož na plech v jednej vrstve a peč 8–10 minút, kým nie sú zlaté. Po 5 minútach premiešaj a posledné minúty stráž – rýchlo prihoria.
  - Nechaj na plechu vychladnúť, až potom úplne schrumkavejú.
tips:
  - Bez za'ataru – zmiešaj 1 čl sušeného tymianu, 1 čl sezamu a štipku sumaku alebo citrónovej kôry.
