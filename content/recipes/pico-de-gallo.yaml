title: Pico de gallo
description: Čerstvá mexická salsa z nasekaných paradajok, cibule, jalapeña, koriandra a limetky. K všetkému.
cuisine: mexicka
meals: [snack]
categories: [omacky/chutney]
time: 10
active: 10
servings: 4
difficulty: 1
tags: [rychle, bez-varenia, party]
spicy: 1
keeps: { fridge: 2 }
ingredients:
  - paradajky: 4 ks | pevné, nadrobno
  - cibula-cervena: 1/2 ks | nadrobno
  - cili-papricka: 1 ks | jalapeño, nadrobno
  - bylinky-koriander: 4 pl
  - limetka: 1 ks
  - sol: 1/2 čl
steps:
  - Všetko nasekaj na rovnako malé kocky a premiešaj s limetkou a soľou.
  - Nechaj 10 minút odstáť a podávaj s tortilla chipsami, tacos alebo na ryži.
