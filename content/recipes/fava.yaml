title: Fava zo Santorini
description: Hodvábne pyré zo žltého hrachu s olivovým olejom, citrónom a karamelizovanou cibuľou. Grécky hummus.
cuisine: grecka
meals: [snack, obed]
categories: [omacky/dipy, snacky/slane]
time: 60
active: 15
servings: 4
difficulty: 1
tags: [party, lacne, meal-prep]
spicy: 0
keeps: { fridge: 4 }
ingredients:
  - zlty-hrach: 250 g
  - cibula: 2 ks
  - bobkovy-list: 1 ks
  - voda: 900 ml
  - olivovy-olej: 5 pl
  - citron: 1 ks
  - sol: 1 čl
  - oregano: 1/2 čl
steps:
  - Hrach prepláchni a var s jednou cibuľou a bobkovým listom vo vode na miernom ohni 40 minút, penu zbieraj.
  - Vyber bobkový list, pridaj 3 PL oleja, citrón a soľ a rozmixuj dohladka.
  - Druhú cibuľu nakrájaj na mesiačiky a pomaly opekaj na zvyšnom oleji na miernom ohni 15–20 minút do karamelova.
  - Pyré podávaj vlažné s cibuľou, oreganom a kvapkou oleja.
