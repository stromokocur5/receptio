title: Fazuľa na kyslo so zemiakmi a kyslou uhorkou
description: Biela fazuľa v hustej kyslastej omáčke s bobkovým listom, ako ju robila mama, k tomu varené zemiaky a uhorka. Z konzerv je hotová za pol hodiny a strukoviny zasýtia aj tých najhladnejších.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/strukoviny]
time: 35
active: 15
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, klasika, vela-bielkovin]
keeps: { fridge: 4 }
ingredients:
  - zemiaky: 1,2 kg
  - sol: ~1 pl | do vody na zemiaky
  - olej: 3 pl
  - cibula: 2 ks
  - hladka-muka: 3 pl
  - sladka-paprika: 1 čl
  - cesnak: 2 ks
  - voda: 1 l
  - bobkovy-list: 2 ks
  - nove-korenie: 3 ks
  - fazula-biela: 4 ks | scedená
  - ocot: 3 pl
  - cukor: 1 čl
  - horcica: 1 pl
  - sol: 1,5 čl
  - cierne-korenie: 1/4 čl
  - kysle-uhorky: 7 ks | na podávanie
steps:
  - Zemiaky ošúp, nakrájaj na štvrtiny a v hrnci zalej studenou vodou. Osoľ, priveď do varu a var na strednom ohni 20 minút, kým nie sú mäkké. Sceď.
  - Medzitým nakrájaj cibuľu nadrobno. V širokom hrnci zohrej olej na strednom ohni a cibuľu opekaj 6 minút dozlatista.
  - Pridaj múku a miešaj 2 minúty, kým nezačne voňať ako sušienky. Odstav, vmiešaj papriku a prelisovaný cesnak.
  - Postupne prilievaj vodu a šľahaj metličkou, aby nevznikli hrudky. Pridaj bobkový list a nové korenie, priveď do varu a var 5 minút.
  - Pridaj fazuľu, ocot, cukor, horčicu, 1,5 lyžičky soli a korenie a var na miernom ohni ešte 5 minút. Ochutnaj – má byť jemne kyslá a slaná zároveň.
  - Podávaj so zemiakmi a kyslou uhorkou.
tips:
  - Hrubšiu omáčku dosiahneš tak, že pár lyžíc fazule roztlačíš o stenu hrnca.
