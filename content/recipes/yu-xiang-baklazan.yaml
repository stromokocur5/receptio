title: Yu xiang baklažán
description: Hodvábny baklažán v „rybej“ omáčke bez rýb – sladko, kyslo, pikantne s cesnakom a zázvorom.
cuisine: cinska
meals: [obed, vecera]
categories: [hlavne/zelenina]
time: 45
active: 25
servings: 3
difficulty: 2
tags: [klasika]
spicy: 2
keeps: { fridge: 3 }
ingredients:
  - baklazan: 2 ks | na prsty
  - sol: 1/2 čl
  - kukuricny-skrob: 2 pl
  - olej: 4 pl
  - cesnak: 4 ks
  - zazvor: 1 pl
  - doubanjiang: 1 pl
  - jarna-cibulka: 3 ks
  - sojova-omacka: 2 pl
  - ryzovy-ocot: 2 pl
  - cukor: 1 pl
  - voda: 100 ml
  - ryza-jazminova: 250 g
steps:
  - Ryžu prepláchni, zalej 1,5-násobkom vody so štipkou soli, priveď do varu a pod pokrievkou var na miernom ohni 12 minút. Nechaj 10 minút dôjsť – medzitým priprav zvyšok.
  - Baklažán posyp soľou, nechaj 15 minút pustiť vodu, osuš a obaľ v 1,5 PL škrobu.
  - Na 3 PL oleja na strednom ohni ho opekaj po dávkach 6–8 minút, kým nie je mäkký a zlatistý. Daj bokom.
  - Na zvyšnom oleji na strednom ohni opraž cesnak, zázvor, doubanjiang a biele časti cibuľky.
  - Zmiešaj sójovú omáčku, ocot, cukor, vodu a zvyšný škrob, vlej do panvice a nechaj zhustnúť. Vráť baklažán, obaľ a posyp zelenou cibuľkou.
