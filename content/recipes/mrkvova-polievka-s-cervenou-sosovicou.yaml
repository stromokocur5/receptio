title: Mrkvová polievka s červenou šošovicou a krutónmi
description: Hustá oranžová krémová polievka z mrkvy, zemiakov a červenej šošovice. Šošovica sa v nej rozvarí do krému, takže deti nevedia, že ju jedia – a polievka zasýti ako hlavné jedlo.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/kremove]
time: 35
active: 15
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, deti, one-pot, polievka, meal-prep]
keeps: { fridge: 4, freezer: 3 }
ingredients:
  - olej: 2 pl
  - cibula: 2 ks
  - cesnak: 3 ks
  - sladka-paprika: 1 čl
  - kmin: 1/2 čl
  - mrkva: 8 ks
  - zemiaky: 300 g
  - sosovica-cervena: 250 g
  - voda: 2 l
  - sol: 2 čl
  - citron: 2 pl | šťava
  - chlieb: 7 ks | na krutóny
steps:
  - Cibuľu nakrájaj nadrobno, mrkvu na kolieska, zemiaky ošúp a nakrájaj na kocky. Šošovicu prepláchni v sitku.
  - V hrnci zohrej olej na strednom ohni a cibuľu opekaj 5 minút, kým nezmäkne. Pridaj prelisovaný cesnak, papriku a rascu a miešaj 30 sekúnd.
  - Pridaj mrkvu, zemiaky, šošovicu, vodu a soľ. Priveď do varu, stíš na mierny oheň a var prikryté 20 minút, kým mrkva nezmäkne a šošovica sa nerozpadne.
  - Medzitým nakrájaj chlieb na kocky a opekaj ho na suchej panvici na strednom ohni 6–8 minút za občasného miešania dochrumkava.
  - Polievku rozmixuj tyčovým mixérom dohladka a vmiešaj citrónovú šťavu. Ak je hustá, prilej vodu. Ochutnaj soľ.
  - Podávaj s krutónmi navrch.
tips:
  - Citrón na konci ju prebudí – bez neho chutí mdlo a sladko.
