title: Jablkový koláč z ovsených vločiek na plechu
description: Jednoduchý koláč s vrstvou škoricových jabĺk medzi drobenkou z vločiek a múky. Má málo cukru a veľa jabĺk – plech stačí na celú rodinu aj s návštevou.
cuisine: slovenska
meals: [dezert, snack]
categories: [dezerty/pecene]
time: 50
active: 15
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, deti, pecenie]
keeps: { fridge: 4, freezer: 2 }
ingredients:
  - jablko: 6 ks
  - citron: 1 pl | šťava
  - skorica: 2 čl
  - cukor: 5 pl
  - ovsene-vlocky: 250 g
  - hladka-muka: 150 g
  - kypriaci-prasok: 2 čl
  - sol: 1 štipka
  - olej: 6 pl
  - sojove-mlieko: 300 ml
steps:
  - Rúru predhrej na 180 °C. Zapekaciu misu alebo plech (asi 25 × 35 cm) vymasti trochou oleja.
  - Jablká nastrúhaj nahrubo aj so šupkou a premiešaj s citrónovou šťavou, škoricou a 2 lyžicami cukru.
  - V miske zmiešaj vločky, múku, prášok do pečiva, zvyšný cukor a soľ. Pridaj olej a mlieko a premiešaj na vlhké hrudkovité cesto.
  - Polovicu cesta natlač na dno misy. Rozlož na ňu jablká aj so šťavou a zvyšok cesta rozdrob navrch.
  - Peč 35 minút, kým nie je povrch zlatý. Pred krájaním nechaj aspoň 15 minút vychladnúť, inak sa rozpadá.
tips:
  - Najlepší je vlažný s lyžicou jogurtu.
