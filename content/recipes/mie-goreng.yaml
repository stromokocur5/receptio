title: Mie goreng
description: Indonézske smažené rezance s kecap manis, pak choi a tofu. Sladké, slané a pikantné naraz.
cuisine: indonezska
meals: [obed, vecera]
categories: [hlavne/cestoviny]
time: 20
active: 20
servings: 3
difficulty: 1
tags: [rychle]
spicy: 2
keeps: { fridge: 2 }
ingredients:
  - psenicne-rezance: 250 g
  - olej: 3 pl
  - tofu-natural: 200 g | na kocky
  - cesnak: 3 ks
  - cibula: 1 ks | na mesiačiky
  - cili-papricka: 1 ks
  - pak-choi: 2 ks | nakrájané
  - mrkva: 1 ks | na tenké prúžky
  - klicky: 1 hrnček
  - kecap-manis: 3 pl
  - sojova-omacka: 1 pl
  - sriracha: 1 pl
  - limetka: 1 ks
steps:
  - Rezance uvar, sceď a prepláchni studenou vodou.
  - Na 1 PL oleja na strednom ohni opeč tofu, vyber.
  - Na zvyšnom oleji na strednom ohni opeč cesnak, cibuľu a papričku, pridaj mrkvu a pak choi a 2 minúty opekaj.
  - Pridaj rezance, tofu, klíčky a omáčky a premiešavaj 2 minúty na prudkom ohni. Podávaj s limetkou.
