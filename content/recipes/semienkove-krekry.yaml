title: Semienkové krekry
description: Chrumkavé krekry len zo semienok – ľan a chia ich zlepia bez múky. Bezlepkové, sýte a k hummusu lepšie ako kupované.
cuisine: moderna
meals: [snack]
categories: [snacky/slane, snacky/na-cesty]
time: 75
active: 15
servings: 8
difficulty: 1
tags: [meal-prep, do-krabicky, vela-bielkovin]
keeps: { fridge: 21, freezer: 3 }
ingredients:
  - lanove-semienko: 1/2 hrnček
  - chia: 3 pl
  - slnecnicove-semienka: 1/2 hrnček
  - tekvicove-semienka: 1/2 hrnček
  - sezam: 3 pl
  - sol: 1 čl
  - rasca: 1 čl
  - voda: 250 ml
steps:
  - Všetko zmiešaj v miske a nechaj 15 minút napučať, kým z hmoty nie je lepkavá kaša.
  - Rúru predhrej na 160 °C. Hmotu rozotri mokrou lyžicou na plech s papierom na pečenie čo najtenšie, asi na 3 mm.
  - Peč 30 minút, vyber a nožom narež na obdĺžniky.
  - Otoč celú platňu (alebo jednotlivé kúsky) a peč ďalších 20–25 minút, kým nie sú suché a chrumkavé aj v strede.
  - Nechaj vychladnúť na plechu – až vtedy dochrumkavejú.
tips:
  - Ak po vychladnutí zmäknú, daj ich na 5 minút späť do rúry.
  - Namiesto rasce skús rozmarín alebo zaatar.
