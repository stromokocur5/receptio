title: Shakshuka s hodvábnym tofu
description: Paprikovo-paradajková omáčka s „vajíčkami“ z hodvábneho tofu, kurkumy a kala namak. Na raňajky aj večeru.
cuisine: severoafricka
meals: [ranajky, obed, vecera]
time: 30
active: 20
servings: 3
difficulty: 1
tags: [one-pot]
spicy: 1
keeps: { fridge: 2 }
leftovers: 'Omáčku bez tofu zamraz, tofu pridaj pri ohrievaní.'
ingredients:
  - olivovy-olej: 2 pl
  - cibula: 1 ks
  - paprika-cervena: 2 ks | na prúžky
  - cesnak: 3 ks
  - kmin: 1 čl
  - udena-paprika: 1 čl
  - cili: 1/2 čl
  - paradajky-sterilizovane: 2 ks
  - sol: 1/2 čl
  - tofu-hodvabne: 300 g
  - kurkuma: 1/2 čl
  - kala-namak: 1/2 čl
  - bylinky-koriander: 3 pl
  - chlieb: 3 ks | na namáčanie
steps:
  - Na oleji na strednom ohni speň cibuľu a papriku 8 minút do mäkka, pridaj cesnak a korenie a minútu restuj.
  - Vlej paradajky, osoľ a var na miernom ohni 10 minút, kým omáčka nezhustne.
  - Hodvábne tofu rozmixuj alebo roztlač s kurkumou a polovicou kala namak na hustý krém.
  - V omáčke sprav lyžicou 5–6 jamiek a do každej daj lyžicu tofu krému. Prikry a na miernom ohni 5 minút zohrej.
  - Posyp zvyšnou kala namak a koriandrom a podávaj rovno z panvice s chlebom.
