title: Fasolia
description: Etiópske zelené fazuľky s mrkvou dusené s karamelizovanou cibuľou a cesnakom.
cuisine: etiopska
meals: [obed, vecera]
categories: [hlavne/strukoviny]
time: 35
active: 15
servings: 4
difficulty: 1
tags: [lacne, rychle]
spicy: 0
keeps: { fridge: 4 }
ingredients:
  - olej: 3 pl
  - cibula: 2 ks | na mesiačiky
  - cesnak: 3 ks
  - zazvor: 1 čl | nastrúhaný
  - zelene-fazulky: 500 g | na 4 cm kúsky
  - mrkva: 3 ks | na tyčinky
  - paradajkovy-pretlak: 1 pl
  - voda: 150 ml
  - sol: 3/4 čl
  - cierne-korenie: 1/4 čl
steps:
  - Na oleji na strednom ohni opekaj cibuľu 10 minút do zlatohneda, pridaj cesnak, zázvor a pretlak.
  - Pridaj fazuľky, mrkvu a vodu, prikry a duste na miernom ohni 12–15 minút, kým sú mäkké, ale nerozvarené.
  - Osoľ, okoreň a nechaj bez pokrievky odpariť zvyšnú vodu.
