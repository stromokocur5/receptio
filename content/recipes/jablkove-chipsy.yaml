title: Jablkové chipsy so škoricou
description: Tenko nakrájané jablká pomaly sušené v rúre. Chrumkavé, sladké samé od seba, bez cukru.
cuisine: slovenska
meals: [snack]
categories: [snacky/sladke, snacky/na-cesty]
time: 130
active: 10
servings: 4
difficulty: 1
tags: [lacne, deti, do-krabicky]
keeps: { fridge: 14 }
ingredients:
  - jablko: 4 ks | pevné, kyslejšie
  - skorica: 1 čl
  - citron: 1 pl
steps:
  - Jablká nakrájaj na plátky hrubé 2 mm (s jadrovníkom, jadierka vyber). Najlepšie ide mandolína.
  - Pokvapkaj citrónom, posyp škoricou a rozlož v jednej vrstve na plechy s papierom.
  - Suš v rúre pri 100 °C s pootvorenými dvierkami (zastrč vareškou) 1,5–2 hodiny, v polovici otoč. Chrumkavé sú až po vychladnutí.
tips:
  - Ak po vychladnutí nie sú chrumkavé, vráť ich na 15 minút.
  - Skladuj v uzavretej dóze, inak zmäknú.
  - Rovnako sa robia hruškové a banánové.
