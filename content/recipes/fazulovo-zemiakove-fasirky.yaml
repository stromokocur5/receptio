title: Fazuľovo-zemiakové fašírky s uhorkovým šalátom
description: Fašírky z roztlačenej fazule a zemiakov s opečenou cibuľou, majoránkou a cesnakom, opečené na panvici do chrumkavej kôrky. Bez vajca, bez strúhanky, drží ich škrob. K tomu uhorkový šalát s horčicovým dresingom.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/strukoviny, hlavne/plnene]
time: 45
active: 30
servings: 3
difficulty: 2
tags: [meal-prep]
keeps: { fridge: 3, freezer: 2 }
leftovers: 'Prehrej na suchej panvici alebo v air fryeri, aby zas chrumkali.'
ingredients:
  - zemiaky: 3 ks | múčnaté
  - fazula-cervena: 1 ks | plechovka
  - fazula-biela: 1 ks | plechovka
  - cibula: 1 ks
  - olej: 4 pl | 1 na cibuľu, 3 na fašírky
  - cesnak: 3 ks
  - majoranka: 2 čl
  - udena-paprika: 1 čl
  - sol: 1 čl
  - cierne-korenie: 1/2 čl
  - kukuricny-skrob: 4 pl | 2 do cesta, 2 na obalenie
  - horcica: 2 čl | 1 do fašírok, 1 do dresingu
  - uhorka: 1 ks
  - ocot: 1 pl
  - olivovy-olej: 2 pl
  - kopor: 2 pl
steps:
  - Zemiaky ošúp, nakrájaj na kocky a var v osolenej vode 12–15 minút do mäkka. Sceď a nechaj vyparovať, kým nie sú suché.
  - Medzitým cibuľu nakrájaj nadrobno a na 1 PL oleja ju restuj na strednom ohni 7–8 minút dozlata, posledné 2 minúty s prelisovaným cesnakom. Surová cibuľa by vo fašírkach chutila ostro a pustila vodu.
  - Fazuľu sceď, prepláchni a dôkladne osuš v utierke. Mokrá fazuľa = fašírky, ktoré sa rozpadnú. V miske ju roztlač so zemiakmi štuchadlom na hrubú kašu – pár celých kúskov fazule môže ostať.
  - Pridaj cibuľu, majoránku, údenú papriku, soľ, korenie, 1 ČL horčice a 2 PL škrobu a rukou premiešaj. Ochutnaj teraz – zmes je už jedlá a soľ sa dá doladiť len teraz. Nechaj 5 minút postáť, škrob natiahne vlhkosť.
  - Mokrými rukami vytvaruj 9 plochých fašírok hrubých 1,5 cm a z oboch strán ich obaľ v zvyšnom škrobe.
  - Na panvici rozohrej 3 PL oleja na strednom ohni. Fašírky opekaj 4–5 minút z každej strany bez hýbania, kým nemajú tmavozlatú kôrku. Otáčaj ich opatrne, širokou obracačkou.
  - Medzitým uhorku nakrájaj na tenké plátky, posoľ štipkou a nechaj 5 minút, potom vytlač vodu. Ocot, 1 ČL horčice a olivový olej zašľahaj vidličkou do hustého dresingu a premiešaj s uhorkou a kôprom.
tips:
  - Ak sa zmes lepí na ruky a nedrží, pridaj ešte lyžicu škrobu.
  - Fašírky sa dajú zamraziť surové, prekladané papierom. Opeč ich rovno zo zmrazených, o 2 minúty dlhšie.
