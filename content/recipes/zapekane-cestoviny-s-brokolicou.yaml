title: Zapekané cestoviny s brokolicou a bielou omáčkou
description: Cestoviny s brokolicou v krémovej omáčke z múky a mlieka, zapečené pod chrumkavou strúhankou. Výživné droždie a horčica jej dajú plnú „syrovú“ chuť, ktorú majú radi aj tí, čo zeleninu nemusia.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/rura, hlavne/cestoviny]
time: 40
active: 20
servings: 7
difficulty: 2
tags: [nasarodinka, lacne, deti, meal-prep]
keeps: { fridge: 3 }
ingredients:
  - cestoviny: 600 g | penne alebo kolienka
  - sol: ~1 pl | do vody na cestoviny
  - brokolica: 2 ks
  - olej: 4 pl
  - cesnak: 3 ks
  - hladka-muka: 5 pl
  - sojove-mlieko: 1,2 l | nesladené
  - vyzivne-drozdie: 4 pl
  - horcica: 1 pl
  - sol: 2 čl
  - muskatovy-orech: 1/4 čl
  - cierne-korenie: 1/4 čl
  - struhanka: 5 pl
steps:
  - Rúru predhrej na 200 °C. Brokolicu rozober na malé ružičky, stonku ošúp a nakrájaj na kocky.
  - Vo veľkom hrnci priveď do varu vodu a osoľ ju. Cestoviny var o 3 minúty kratšie, ako píšu na obale – dopečú sa v rúre. Posledné 3 minúty pridaj k nim brokolicu. Sceď.
  - Medzitým v inom hrnci zohrej 3 lyžice oleja na strednom ohni. Pridaj prelisovaný cesnak na 30 sekúnd, potom múku a miešaj minútu.
  - Mlieko prilievaj postupne za stáleho šľahania metličkou, aby nevznikli hrudky. Var na miernom ohni 5 minút, kým omáčka nezhustne. Vmiešaj droždie, horčicu, soľ, muškátový oriešok a korenie.
  - Cestoviny s brokolicou zmiešaj s omáčkou a vysyp do zapekacej misy. Posyp strúhankou a pokvapkaj zvyšným olejom.
  - Peč 15 minút, kým strúhanka nezozlatne.
tips:
  - Omáčka má byť pred zapečením redšia, ako sa ti zdá správne. Cestoviny v rúre nasajú časť tekutiny.
