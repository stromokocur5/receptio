title: Zapekané rožky so zeleninou a cícerovou zálievkou
description: Slaný nákyp z kociek starých rožkov, papriky, kukurice a hrášku zaliaty zálievkou z cícerovej múky, ktorá pri pečení stuhne ako vajíčko. Večera z toho, čo ostalo, pre celú rodinu.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/rura]
time: 60
active: 20
servings: 7
difficulty: 1
tags: [nasarodinka, zvysky, lacne, deti]
keeps: { fridge: 3 }
ingredients:
  - rozok: 10 ks | starý
  - olej: 3 pl
  - cibula: 1 ks
  - paprika-cervena: 2 ks
  - cesnak: 2 ks
  - cicerova-muka: 150 g
  - sojove-mlieko: 700 ml | nesladené
  - sol: 1,5 čl
  - sladka-paprika: 1 čl
  - kurkuma: 1/2 čl
  - majoranka: 1 čl
  - vyzivne-drozdie: 3 pl
  - kukurica: 1 ks | scedená
  - hrasok: 200 g | mrazený
steps:
  - Rúru predhrej na 190 °C a zapekaciu misu (asi 25 × 35 cm) vymasti trochou oleja.
  - Rožky nakrájaj na kocky asi 2 cm. Cibuľu nakrájaj nadrobno, papriku na kocky.
  - Na panvici zohrej zvyšný olej na strednom ohni. Cibuľu a papriku opekaj 5 minút, na konci pridaj prelisovaný cesnak.
  - Vo veľkej mise rozšľahaj cícerovú múku s mliekom, soľou, paprikou, kurkumou, majoránkou a droždím dohladka.
  - Pridaj kocky rožkov, opečenú zeleninu, kukuricu a hrášok a premiešaj. Nechaj 10 minút postáť, aby rožky nasiakli.
  - Vysyp do misy a peč 35–40 minút, kým nie je stred pevný na dotyk a vrch chrumkavý a zlatý.
tips:
  - K tomu sa hodí kapustový alebo uhorkový šalát.
