title: Canh chua
description: Juhovietnamská kyslá polievka s tamarindom, ananásom, paradajkami a tofu. Sladko, kyslo, slano naraz.
cuisine: vietnamska
meals: [obed, vecera]
categories: [polievky/azijske]
time: 25
active: 15
servings: 3
difficulty: 1
tags: [polievka, rychle]
spicy: 1
keeps: { fridge: 2 }
ingredients:
  - zeleninovy-vyvar: 1 l
  - tamarind: 2 pl
  - cukor: 1 pl
  - sojova-omacka: 2 pl
  - paradajky: 2 ks | na mesiačiky
  - ananas: 200 g | čerstvý alebo z plechovky, na kúsky (alebo kyslé jablko)
  - okra: 6 ks | na kolieska
  - tofu-natural: 200 g | na kocky
  - klicky: 1 hrnček
  - cili-papricka: 1 ks
  - bazalka: 2 pl
  - bylinky-koriander: 2 pl
steps:
  - Vývar s tamarindom, cukrom a sójovou omáčkou priveď do varu.
  - Pridaj paradajky, ananás, okru a tofu a var na miernom ohni 5 minút.
  - Pridaj klíčky a papričku a hneď stiahni. Posyp bylinkami.
tips:
  - Chuť má byť výrazne kyslá. Dochuť tamarindom alebo limetkou.
