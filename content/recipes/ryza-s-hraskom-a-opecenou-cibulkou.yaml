title: Ryža s hráškom, fazuľou a opečenou cibuľkou
description: Rizi-bizi, ktoré nie je bledé. Ryža sa najprv opraží na cibuli, hrášok sa pridá až nakoniec, aby ostal sladký a zelený, a navrch ide cibuľka opečená do chrumkava s cesnakom.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/ryza]
time: 30
active: 20
servings: 2
difficulty: 1
tags: [zlatica, rychle, lacne]
keeps: { fridge: 3 }
ingredients:
  - olej: 3 pl | 1 na ryžu, 2 na cibuľku
  - cibula: 2 ks | 1 do ryže, 1 na opečenú cibuľku
  - ryza-basmati: 150 g
  - voda: 300 ml
  - sol: 3/4 čl
  - hrasok: 150 g | mrazený
  - fazula-biela: 1 ks | plechovka, scedená a prepláchnutá
  - cesnak: 2 ks
  - citron: 1 pl
  - petrzlenova-vnat: 3 pl
  - cierne-korenie: 1 štipka
steps:
  - Ryžu prepláchni, kým voda nie je číra. Jednu cibuľu nakrájaj nadrobno.
  - V hrnci rozohrej 1 PL oleja na strednom ohni a cibuľu restuj 4 minúty. Pridaj ryžu a 2 minúty miešaj, kým zrná nie sú na okrajoch priesvitné. Opražená ryža chutí orieškovo a ostane sypká.
  - Zalej 300 ml vriacej vody, pridaj 1/2 ČL soli, prikry a var na najmiernejšom ohni 12 minút. Potom na ryžu nasyp hrášok a fazuľu, nemiešaj, rýchlo prikry a nechaj mimo ohňa 5 minút. Para hrášok prehreje, ale neuvarí ho na sivú kašu.
  - Medzitým druhú cibuľu nakrájaj na tenké polkolieska. Na panvici rozohrej 2 PL oleja na strednom ohni a cibuľu opekaj 10–12 minút, kým nie je tmavohnedá a okraje chrumkajú. Posledné 2 minúty pridaj nakrájaný cesnak a štipku soli.
  - Ryžu s hráškom prehrabni vidličkou, vmiešaj citrónovú šťavu, vňať, zvyšok soli a korenie. Ochutnaj a navrch daj opečenú cibuľku aj s olejom.
tips:
  - K tomu sa hodí uhorkový alebo paradajkový šalát.
