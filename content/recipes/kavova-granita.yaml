title: Kávová granita s kokosovou šľahačkou
description: Silná sladká káva zmrazená na drť, navrchu kopček kokosovej šľahačky. Sicílske letné raňajky aj popoludňajšia káva naraz.
cuisine: talianska
meals: [dezert, snack]
categories: [dezerty/mrazene, napoje/limonady]
time: 200
active: 20
servings: 4
difficulty: 1
tags: [party]
spicy: 0
ahead: Mrzne asi 3 hodiny, každú polhodinu ju treba prehrabať. Plechovku kokosového mlieka daj deň vopred do chladničky.
keeps: { fridge: 0, freezer: 1 }
related: [citronova-granita, vietnamska-ladova-kava]
ingredients:
  - kava: ~4 pl | mletá
  - voda: 500 ml
  - cukor: 60 g
  - kokosove-mlieko: 1/2 ks | vychladené, len tuhá časť z vrchu plechovky
  - javorovy-sirup: 1 pl
  - vanilka: 1/2 čl
  - kakao: 1 čl | na posypanie
steps:
  - Uvar silnú kávu z celého množstva vody – v moka kanvičke, džezve alebo zalievanú a precedenú.
  - V horúcej káve rozpusti cukor a nechaj ju vychladnúť.
  - Nalej do plytkej nádoby a daj do mrazničky. Po 45 minútach zoškrab vidličkou zamrznuté okraje do stredu.
  - Opakuj každých 30 minút, ešte tri až štyri razy, kým nie je celá káva sypká tmavá drť.
  - Tuhú časť vychladeného kokosového mlieka vyšľahaj metličkou so sirupom a vanilkou 2 minúty na šľahačku.
  - Granitu naber do pohárov, navrch daj šľahačku a popráš kakaom.
tips:
  - Kokosové mlieko sa vyšľahá, len ak je plnotučné a poriadne studené. Vodnatú časť zo spodku plechovky použi do smoothie.
  - Večer ju sprav z bezkofeínovej kávy.
