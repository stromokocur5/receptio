title: Tom kha s hubami a tofu
description: Thajská kokosová polievka s citrónovou trávou, zázvorom a limetkou. Hrejivá, kyslastá a hotová za pol hodiny.
cuisine: thajska
meals: [obed, vecera]
time: 30
active: 15
servings: 4
difficulty: 1
tags: [polievka, one-pot]
spicy: 2
keeps: { fridge: 3 }
ingredients:
  - kokosove-mlieko: 2 ks
  - zeleninovy-vyvar: 2 hrnček
  - citronova-trava: 2 ks | rozklepnutá a nakrájaná na kúsky
  - zazvor: 2 pl | na tenké plátky
  - cili: 1/2 čl
  - sampinony: 250 g | na plátky
  - tofu-natural: 200 g | na kocky
  - paradajky: 1 ks | na mesiačiky
  - tamari: 2 pl
  - javorovy-sirup: 1 čl
  - limetka: 2 ks
  - bylinky-koriander: 3 pl
steps:
  - V hrnci priveď do varu kokosové mlieko s vývarom, citrónovou trávou, zázvorom a čili. Var 10 minút, nech sa arómy pustia.
  - Pridaj huby, tofu a paradajku a var ďalších 5 minút.
  - Odstav a dochuť tamari, sirupom a limetkou. Polievka má byť výrazne kyslastá.
  - Podávaj s koriandrom. Citrónová tráva a zázvor sa nejedia, len dochucujú.
tips:
  - Ak zoženieš kaffirové listy alebo galangal, pridaj ich spolu s citrónovou trávou.
