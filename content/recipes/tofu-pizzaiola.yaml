title: Tofu alla pizzaiola
description: Plátky opečeného tofu dusené v paradajkovej omáčke s cesnakom, oreganom a olivami – ako neapolské mäso „na spôsob pizzaiola“. Zužitkuje pohár načatej passaty alebo zvyšnú pizzovú omáčku.
cuisine: talianska
meals: [obed, vecera]
categories: [hlavne/tofu]
time: 25
active: 20
servings: 2
difficulty: 1
tags: [zvysky, rychle, lacne]
keeps: { fridge: 3 }
leftovers: 'Druhý deň plátky nakrájaj, zohrej s omáčkou a daj do bagety alebo na cestoviny.'
related: [pizzova-omacka, chlebove-pizzky-z-rury, pizza-quesadilla]
ingredients:
  - tofu-natural: 200 g
  - kukuricny-skrob: 1 pl
  - olivovy-olej: 2 pl
  - cesnak: 2 ks
  - passata: 1 hrnček | alebo zvyšná pizzová omáčka
  - oregano: 1 čl
  - olivy: 8 ks | rozpolené
  - sol: 1/2 čl
  - cierne-korenie: 1 štipka
  - bazalka: 1/4 hrnček | alebo petržlenová vňať
  - chlieb: 2 ks | na vytieranie omáčky
steps:
  - Tofu vytlač v utierke, nakrájaj na 6 plátkov hrubých asi 1 cm, osoľ a obal v škrobe.
  - Na panvici rozpáľ olej a plátky opeč z oboch strán dozlatista, spolu 6–8 minút. Vyber ich na tanier.
  - Na zvyšný olej daj nakrájaný cesnak a minútu ho opekaj, kým nezavonia.
  - Prilej passatu, pridaj oregano a olivy a var 5 minút. Hotová pizzová omáčka stačí 2 minúty. Keď je hustá, prilej 2–3 PL vody.
  - Plátky tofu vráť do omáčky, polej ich a nechaj 3 minúty prebublať. Okoreň, posyp bazalkou a jedz s chlebom.
tips:
  - Ku cestovinám alebo k zemiakovej kaši vystačí aj pre troch – pridaj ďalší plátok tofu na osobu.
  - Kapary alebo nakrájaná pečená paprika z pohára sa sem hodia tiež.
