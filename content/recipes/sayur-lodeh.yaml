title: Sayur lodeh
description: Jávska zeleninová polievka v kokosovom mlieku s kurkumou, citrónovou trávou a tempehom. Jemná, krémová a voňavá.
cuisine: indonezska
meals: [obed, vecera]
categories: [polievky/azijske]
time: 35
active: 15
servings: 4
difficulty: 1
tags: [polievka, one-pot]
spicy: 1
keeps: { fridge: 3 }
ingredients:
  - cibula: 1 ks
  - cesnak: 4 ks
  - zazvor: 1 pl
  - kurkuma: 1 čl
  - koriander-mlety: 1 čl
  - cili-papricka: 1 ks
  - olej: 2 pl
  - citronova-trava: 1 ks | rozdrvená
  - bobkovy-list: 2 ks
  - kokosove-mlieko: 400 ml
  - zeleninovy-vyvar: 600 ml
  - tempeh: 150 g | na kocky
  - baklazan: 1/2 ks | na kocky
  - zelene-fazulky: 150 g
  - biela-kapusta: 200 g
  - tekvica-hokkaido: 200 g
  - sol: 1 čl
  - ryza-jazminova: 300 g
steps:
  - Cibuľu, cesnak, zázvor, kurkumu, koriander a papričku rozmixuj na pastu a na oleji na strednom ohni 3 minúty opekaj.
  - Pridaj citrónovú trávu, bobkový list, kokosové mlieko a vývar a priveď do varu.
  - Pridaj tekvicu a tempeh, po 5 minútach zvyšok zeleniny a var na miernom ohni ďalších 10 minút. Osoľ a podávaj s ryžou.
