title: Banánovo-jablkové smoothie s ovsom a špenátom
description: Husté smoothie, ktoré nahradí raňajky – banán, jablko, vločky a hrsť špenátu, ktorý v ňom nie je cítiť. Jeden mixér stačí pre sedem pohárov.
cuisine: moderna
meals: [ranajky, snack]
categories: [napoje/smoothie]
time: 10
active: 10
servings: 7
difficulty: 1
tags: [nasarodinka, rychle, bez-varenia, deti]
ingredients:
  - banan: 4 ks
  - jablko: 3 ks
  - ovsene-vlocky: 80 g
  - spenat: 60 g | čerstvý alebo mrazený
  - sojove-mlieko: 1,2 l
  - sojovy-jogurt: 300 g
  - skorica: 1 čl
steps:
  - Jablká nakrájaj na kúsky aj so šupkou, bez jadrovníka. Banány ošúp a nalámaj.
  - Do mixéra daj najprv mlieko a jogurt, potom vločky, špenát a ovocie. Pridaj škoricu.
  - Mixuj 1–2 minúty dohladka. Ak sa všetko nezmestí, mixuj na dvakrát a premiešaj v džbáne.
  - Rozlej do pohárov a pi hneď.
tips:
  - Zamrazený banán urobí smoothie studené a husté ako shake.
