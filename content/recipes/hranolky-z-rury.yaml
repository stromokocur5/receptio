title: Chrumkavé hranolky z rúry
description: Hranolky, ktoré sú naozaj chrumkavé aj bez fritézy. Celý trik je namáčanie, sušenie a horúca rúra.
cuisine: americka
meals: [obed, vecera, snack]
categories: [prilohy/prilohy, snacky/slane]
time: 50
active: 15
servings: 3
difficulty: 1
tags: [lacne, deti, klasika]
keeps: { fridge: 2 }
leftovers: 'Prehrej 6 minút v rúre na 220 °C alebo na suchej panvici, nie v mikrovlnke.'
ingredients:
  - zemiaky: 6 ks | múčnaté (typ C)
  - kukuricny-skrob: 1 pl
  - olej: 3 pl
  - sol: 1 čl
  - sladka-paprika: 1/2 čl
  - cesnak: 1 ks | voliteľne, prelisovaný
steps:
  - Rúru predhrej na 230 °C aj s prázdnym plechom vnútri.
  - Zemiaky nakrájaj na hranolky hrubé asi 1 cm. Namoč ich na 20 minút do studenej vody – vyplaví sa škrob a nebudú sa lepiť.
  - Sceď a poriadne osuš utierkou. Mokré zemiaky sa dusia, nie pečú.
  - V miske ich premiešaj so škrobom, potom s olejom, aby bol každý kúsok obalený.
  - Rozlož ich na rozpálený plech s papierom v jednej vrstve s medzerami. Radšej dva plechy ako jeden preplnený.
  - Peč 20 minút, otoč a peč ďalších 12–15 minút, kým nie sú zlaté.
  - Hneď osoľ a posyp paprikou. Ak chceš, premiešaj s cesnakom.
tips:
  - Soľ až na konci – na začiatku by z nich vytiahla vodu.
  - V teplovzdušnej fritéze stačí 1 PL oleja a 18–20 minút na 200 °C, v polovici pretras.
variants:
  - name: Z batátov
    description: Namiesto zemiakov daj batáty. Budú mäkšie, škrob je o to dôležitejší.
    replace:
      - from: zemiaky
        to: batat
        amount: 3 ks
