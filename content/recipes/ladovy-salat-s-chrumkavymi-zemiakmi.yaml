title: Ľadový šalát s chrumkavými zemiakmi a horčicovým dresingom
description: Veľká misa chrumkavého ľadového šalátu, uhorky a paradajok v hustom horčicovom dresingu a navrch horúce zemiakové kocky opečené dozlata s údenou paprikou. Teplé a studené, mäkké a chrumkavé v jednej miske.
cuisine: moderna
meals: [obed, vecera]
categories: [salaty/syte]
time: 30
active: 25
servings: 2
difficulty: 1
tags: [zlatica, rychle]
ingredients:
  - zemiaky: 4 ks
  - olej: 2 pl
  - sol: 3/4 čl
  - udena-paprika: 1 čl
  - cesnak: 2 ks
  - salat: 300 g | ľadový, hlávka
  - uhorka: 1/2 ks
  - paradajky: 2 ks
  - cibula-cervena: 1/2 ks
  - horcica: 2 čl
  - ocot: 1,5 pl
  - cukor: 1/2 čl
  - olivovy-olej: 3 pl
  - pazitka: 2 pl
  - cierne-korenie: 1 štipka
steps:
  - Zemiaky ošúp a nakrájaj na kocky 1,5 cm. Na panvici rozohrej olej na strednom ohni, pridaj zemiaky, štipku soli a 3 PL vody, prikry a nechaj 7 minút. Zlož pokrievku a opekaj 10 minút, premiešaj len každé 2–3 minúty, kým nie sú zlaté a chrumkavé. Posledné 2 minúty pridaj nakrájaný cesnak. Odstav a posyp údenou paprikou a štipkou soli.
  - Medzitým paradajky a uhorku nakrájaj na kúsky, posoľ štipkou a daj do sitka odkvapkať. Cibuľu nakrájaj na tenké pásiky.
  - Dresing – v miske, v ktorej budeš miešať šalát, zmiešaj horčicu, ocot, cukor a zvyšok soli. Za šľahania vidličkou po troškách vlej olivový olej, kým nie je hustý a krémový. Horčica drží olej s octom pokope, takže dresing obalí listy namiesto toho, aby stiekol na dno.
  - Šalát natrhaj na veľké kusy, umy a v utierke dobre osuš. Premiešaj ho v miske s dresingom, cibuľou, uhorkou a paradajkami.
  - Navrch nasyp horúce zemiaky, posyp pažítkou a korením a jedz hneď, kým zemiaky chrumkajú.
tips:
  - Šalát s dresingom miešaj až tesne pred jedlom. Ľadový šalát v octe rýchlo zvädne.
