title: Mrkvovo-ovsené fašírky z rúry so zemiakovou kašou
description: Fašírky z vločiek, mrkvy a cíceru upečené na plechu, k tomu poriadna zemiaková kaša a kyslá uhorka. Nedeľný tanier, ktorý stojí okolo eura na osobu a nemusíš pri ňom stáť nad panvicou.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/zelenina]
time: 65
active: 35
servings: 7
difficulty: 2
tags: [nasarodinka, lacne, deti, klasika]
keeps: { fridge: 3, freezer: 3 }
ingredients:
  - cicer-sterilizovany: 2 ks | scedený
  - mrkva: 5 ks
  - cibula: 1 ks
  - cesnak: 3 ks
  - ovsene-vlocky: 250 g
  - majoranka: 2 čl
  - sladka-paprika: 1 čl
  - sojova-omacka: 2 pl
  - sol: 1,5 čl
  - cierne-korenie: 1/4 čl
  - olej: 3 pl
  - zemiaky: 1,4 kg
  - sol: ~1 pl | do vody na zemiaky
  - sojove-mlieko: 300 ml | nesladené
  - rastlinne-maslo: 3 pl
  - kysle-uhorky: 7 ks | na podávanie
steps:
  - Rúru predhrej na 200 °C a plech vystel papierom na pečenie.
  - Zemiaky ošúp, nakrájaj na rovnaké kusy a v hrnci zalej studenou vodou. Osoľ, priveď do varu a var na strednom ohni 20 minút, kým nie sú mäkké.
  - Medzitým vo veľkej miske roztlač cícer vidličkou na hrubú kašu. Mrkvu nastrúhaj najjemnejšie, cibuľu nakrájaj nadrobno.
  - K cíceru pridaj mrkvu, cibuľu, prelisovaný cesnak, vločky, majoránku, papriku, sójovú omáčku, 1,5 lyžičky soli a korenie. Premiesi rukami a nechaj 10 minút postáť, vločky natiahnu vlhkosť a zmes sa dá tvarovať.
  - Mokrými rukami vytvaruj 21 placiek hrubých asi 1,5 cm a ulož ich na plech. Potri ich olejom.
  - Peč 25 minút, v polovici ich otoč, kým nie sú z oboch strán zlatohnedé.
  - Mlieko zohrej. Zemiaky sceď, roztlač s maslom a horúcim mliekom na hladkú kašu a ochutnaj soľ. Podávaj s fašírkami a kyslou uhorkou.
tips:
  - Ak sa ti zmes rozpadá, pridaj lyžicu-dve hladkej múky. Ak je suchá, lyžicu vody.
