title: Jollof rice
description: Západoafrická dymová paradajková ryža s paprikou a čili, ktorá je hviezdou každej oslavy od Ghany po Nigériu.
cuisine: zapadoafricka
meals: [obed, vecera]
time: 55
active: 20
servings: 4
difficulty: 2
tags: [party, one-pot]
spicy: 2
keeps: { fridge: 3 }
leftovers: 'Opeč s fazuľou na panvici, alebo ho naplň do papriky a zapeč.'
ingredients:
  - paprika-cervena: 2 ks
  - paradajky-sterilizovane: 1 ks
  - cibula: 2 ks
  - cesnak: 3 ks
  - zazvor: 1 pl
  - cili: 1 čl | ideálne scotch bonnet
  - olej: 4 pl
  - paradajkovy-pretlak: 3 pl
  - kari-korenie: 1 čl
  - tymian: 1 čl
  - bobkovy-list: 2 ks
  - ryza-basmati: 350 g | prepláchnutá
  - zeleninovy-vyvar: 2 hrnček
  - sol: 1/2 čl
  - fazula-cervena: 1 ks
  - hrasok: 1 hrnček
steps:
  - Papriku, paradajky, jednu cibuľu, cesnak, zázvor a čili rozmixuj dohladka.
  - Druhú cibuľu nakrájaj a na oleji 5 minút speň. Pridaj pretlak a 3 minúty praž, kým nestmavne.
  - Vlej zmixovaný základ, pridaj kari, tymian a bobkový list a var 15 minút, kým omáčka nezhustne a olej sa neoddelí. Toto je kľúč k chuti, neskracuj to.
  - Pridaj ryžu, vývar a soľ, premiešaj a prikry alobalom a pokrievkou. Na najmenšom ohni var 25 minút. Nemiešaj.
  - Primiešaj fazuľu a hrášok, prikry a nechaj 5 minút dôjsť.
tips:
  - Trochu pripálené dno („party jollof“) je žiaduce – tam je dymová chuť.
