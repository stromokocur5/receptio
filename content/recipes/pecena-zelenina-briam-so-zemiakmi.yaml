title: Pečené zemiaky, cuketa a paradajky v jednom pekáči
description: Zemiaky, cuketa a cibuľa pečené v kope nastrúhaných paradajok s cesnakom a olivovým olejom, kým sa paradajky nezmenia na hustú sladkú omáčku a vrch nezhnedne. Grécky briam, ktorý sa robí sám.
cuisine: grecka
meals: [obed, vecera]
categories: [hlavne/rura, hlavne/zelenina]
time: 75
active: 25
servings: 4
difficulty: 1
tags: [zlatica, meal-prep, lacne]
keeps: { fridge: 4 }
leftovers: 'Ešte lepšie na druhý deň, vlažné. Prehrej v rúre.'
ingredients:
  - zemiaky: 6 ks
  - cuketa: 2 ks
  - cibula: 2 ks
  - paradajky: 6 ks | zrelé
  - cesnak: 5 ks
  - olivovy-olej: 5 pl
  - sol: 2 čl
  - cukor: 1/2 čl
  - oregano: 1 čl
  - cierne-korenie: 1/2 čl
  - petrzlenova-vnat: 4 pl
steps:
  - Rúru predhrej na 200 °C. Zemiaky ošúp a nakrájaj na plátky 5 mm, cuketu na kolieska 1 cm, cibuľu na pásiky.
  - Štyri paradajky nastrúhaj na hrubom strúhadle do misky, šupky vyhoď. Pridaj prelisovaný cesnak, 1 ČL soli, cukor, oregano, korenie a 3 PL oleja a premiešaj. Zvyšné dve paradajky nakrájaj na plátky.
  - Do pekáča (netreba ho mastiť, paradajková zmes pustí šťavu) daj zemiaky, cuketu, cibuľu, posyp 1 ČL soli a polej paradajkovou zmesou. Rukami všetko premiešaj, aby bol každý kúsok obalený. Navrch ulož plátky paradajok a pokvapkaj 2 PL oleja.
  - Prikry alobalom a peč 30 minút. Potom alobal zlož, premiešaj a peč ešte 30–35 minút, kým nie sú zemiaky mäkké, tekutina sa nezmení na hustú omáčku a vrch nemá hnedé okraje. Pod alobalom sa zelenina uvarí, bez neho sa voda odparí a chuť zhustne.
  - Nechaj 10 minút postáť, posyp vňaťou. Chutí s uhorkovým šalátom.
tips:
  - Zemiaky krájaj tenšie ako cuketu. Pečú sa dlhšie, takto budú hotové naraz.
