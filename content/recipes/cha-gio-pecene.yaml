title: Pečené chả giò
description: Vietnamské jarné závitky z ryžového papiera s hubami, sklenenými rezancami a mrkvou, upečené dochrumkava bez fritézy.
cuisine: vietnamska
meals: [snack, vecera]
categories: [snacky/party]
time: 55
active: 35
servings: 4
difficulty: 2
tags: [party, snack]
spicy: 0
keeps: { fridge: 2, freezer: 2 }
ingredients:
  - sklenene-rezance: 50 g | namočené, nastrihané
  - susene-huby: 15 g | namočené, nasekané
  - tofu-natural: 150 g | rozdrobené
  - mrkva: 2 ks | nastrúhaná
  - cibula: 1/2 ks | nadrobno
  - cesnak: 2 ks
  - sojova-omacka: 2 pl
  - cierne-korenie: 1/2 čl
  - ryzovy-papier: 16 ks
  - olej: 3 pl
  - limetka: 1 ks
  - cukor: 1 pl
  - cili-papricka: 1 ks
steps:
  - Zmiešaj rezance, huby, tofu, mrkvu, cibuľu, cesnak, 1 PL sójovej omáčky a korenie.
  - Ryžový papier namoč na 2 sekundy do vody, daj naň lyžicu náplne, zahni boky a pevne zroluj.
  - Závitky ulož na plech s papierom na pečenie, potri olejom a peč na 220 °C 20–25 minút, v polovici obráť, kým nie sú zlaté a chrumkavé.
  - Podávaj s omáčkou zo zvyšnej sójovej omáčky, limetky, cukru, vody a papričky.
