title: Escondidinho
description: Brazílsky zapekaný „schovaný“ koláč – korenisté sójové mäso pod vrstvou krémového batátového pyré.
cuisine: brazilska
meals: [obed, vecera]
categories: [hlavne/rura]
time: 60
active: 30
servings: 4
difficulty: 2
tags: [meal-prep, klasika, vela-bielkovin]
spicy: 0
keeps: { fridge: 4, freezer: 3 }
ingredients:
  - batat: 3 ks | na kocky
  - zemiaky: 2 ks | na kocky
  - rastlinne-maslo: 30 g
  - sojove-mlieko: 100 ml
  - sol: 1,5 čl
  - sojove-granule: 1 hrnček
  - zeleninovy-vyvar: 1 hrnček | horúci
  - olej: 2 pl
  - cibula: 1 ks | nadrobno
  - cesnak: 3 ks
  - paradajky: 2 ks | nakrájané
  - sladka-paprika: 2 čl
  - kmin: 1/2 čl
  - olivy: 8 ks | nakrájané
  - petrzlenova-vnat: 3 pl
  - vegansky-syr: 1/2 hrnček | strúhaný
steps:
  - Batáty a zemiaky var v osolenej vode 15 minút do mäkka, sceď a roztlač s maslom, mliekom a štipkou soli.
  - Granule zalej horúcim vývarom a nechaj 10 minút napučať, potom vytlač.
  - Na oleji na strednom ohni speň cibuľu s cesnakom, pridaj granule a opekaj 5 minút. Pridaj paradajky, korenie, olivy a zvyšok soli a 5 minút duste. Vmiešaj petržlen.
  - Do zapekacej misy daj náplň, navrch rozotri pyré a posyp syrom. Peč na 200 °C 20 minút dozlatista.
