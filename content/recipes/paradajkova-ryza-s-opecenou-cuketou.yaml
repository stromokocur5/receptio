title: Paradajková ryža s opečenou cuketou
description: Ryža uvarená namiesto vody v rozvarených čerstvých paradajkách s cesnakom, takže je červená, sýta a voňavá. Navrch cuketa opečená do hneda s cesnakom. Jeden hrniec, jedna panvica.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/ryza]
time: 35
active: 25
servings: 3
difficulty: 1
tags: [zlatica, lacne]
keeps: { fridge: 3 }
ingredients:
  - paradajky: 5 ks | zrelé
  - olivovy-olej: 4 pl | 2 do ryže, 2 na cuketu
  - cibula: 1 ks
  - cesnak: 5 ks | 4 do ryže, 1 na cuketu
  - paradajkovy-pretlak: 1 pl
  - udena-paprika: 1 čl
  - ryza-basmati: 220 g
  - voda: 300 ml
  - sol: 1,5 čl | 1/2 na cuketu
  - cuketa: 2 ks
  - citron: 1 pl
  - petrzlenova-vnat: 3 pl
steps:
  - Paradajky prekroj a nastrúhaj reznou stranou na hrubom strúhadle do misky, šupka ostane v ruke. Cuketu nakrájaj na polkolieska 1,5 cm, posyp 1/2 ČL soli a nechaj v sitku púšťať vodu.
  - V hrnci rozohrej 2 PL oleja na strednom ohni a nadrobno nakrájanú cibuľu restuj 5 minút. Pridaj prelisovaný cesnak a pretlak a miešaj 2 minúty, kým pretlak nestmavne.
  - Vlej nastrúhané paradajky a var 5 minút, kým trochu nezhustnú. Vmiešaj údenú papriku, prepláchnutú ryžu, vodu a 1 ČL soli. Priveď do varu, prikry a var na najmiernejšom ohni 14 minút. Odstav a nechaj prikryté 5 minút. Ryža nasaje celú paradajkovú šťavu, preto chutí, akoby bola v omáčke.
  - Medzitým cuketu osuš v utierke. Na panvici rozohrej 2 PL oleja na vysokom ohni a cuketu opekaj v jednej vrstve 3–4 minúty bez hýbania, otoč a opeč ďalšie 3 minúty do hneda. Na poslednú minútu pridaj prelisovaný strúčik cesnaku.
  - Ryžu prehrabni vidličkou, vmiešaj citrón a vňať, ochutnaj a navrch daj cuketu.
tips:
  - Ak sa ryža na dne trochu prichytí, nemiešaj ju – tá opečená vrstva je chutná.
