title: Nasucho opečené fazuľky
description: Sečuánske zelené fazuľky opekané do zvráskavena s cesnakom, čili a chrumkavým tofu.
cuisine: cinska
meals: [obed, vecera]
categories: [prilohy/prilohy]
time: 20
active: 20
servings: 3
difficulty: 1
tags: [rychle]
spicy: 2
keeps: { fridge: 2 }
ingredients:
  - zelene-fazulky: 500 g | osušené
  - olej: 3 pl
  - tofu-udene: 100 g | nadrobno
  - cesnak: 4 ks
  - zazvor: 1 čl
  - cili: 1/2 čl
  - secuanske-korenie: 1/2 čl
  - sojova-omacka: 1,5 pl
  - cukor: 1 čl
  - ryza-jazminova: 250 g
steps:
  - Fazuľky opekaj na 2 PL oleja na prudkom ohni 8–10 minút, kým nie sú zvráskavené a miestami pripálené. Vyber.
  - Na zvyšnom oleji na strednom ohni opeč tofu, pridaj cesnak, zázvor, čili a korenie.
  - Vráť fazuľky, pridaj sójovú omáčku a cukor a minútu premiešavaj. Podávaj s ryžou.
