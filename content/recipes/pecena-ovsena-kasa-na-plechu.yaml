title: Pečená ovsená kaša na plechu s jablkami a banánom
description: Raňajky pre celú rodinu naraz – vločky, banány a jablká zmiešaš za päť minút a rúra urobí zvyšok. Sladí ju len ovocie, deti ju jedia ako koláč a kocky sa dajú vziať aj do školy.
cuisine: moderna
meals: [ranajky, snack]
categories: [ranajky/kase]
time: 40
active: 10
servings: 7
difficulty: 1
tags: [nasarodinka, deti, lacne, meal-prep]
keeps: { fridge: 4, freezer: 2 }
leftovers: 'Studené kocky zohrej 1 minútu v mikrovlnke alebo zjedz rovno z chladničky s jogurtom.'
ingredients:
  - ovsene-vlocky: 400 g
  - banan: 3 ks | čím zrelšie, tým sladšia kaša
  - jablko: 3 ks
  - sojove-mlieko: 900 ml
  - olej: 2 pl
  - kypriaci-prasok: 2 čl
  - skorica: 2 čl
  - sol: 1 štipka
  - slnecnicove-semienka: 4 pl
steps:
  - Rúru predhrej na 190 °C. Zapekaciu misu alebo hlboký plech (asi 25 × 35 cm) vymasti trochou oleja.
  - Banány roztlač vo veľkej miske vidličkou na kašu. Vmiešaj mlieko, zvyšok oleja, skoricu a soľ.
  - Pridaj vločky a prášok do pečiva a premiešaj. Jablká nastrúhaj nahrubo aj so šupkou a polovicu vmiešaj do kaše.
  - Kašu vylej do misy a uhlaď. Navrch rozlož zvyšok jabĺk a posyp semienkami.
  - Peč 30 minút, kým nie je stred pevný na dotyk a okraje zlatisté. Nechaj 5 minút postáť, potom krájaj na kocky.
tips:
  - Večer môžeš všetko zmiešať v mise a dať do chladničky. Ráno ju len vložíš do rúry a pečieš o 5 minút dlhšie.
  - Komu je málo sladká, pokvapká si porciu sirupom až na tanieri – ostatní ho nemusia mať.
