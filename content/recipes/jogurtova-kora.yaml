title: Mrazená jogurtová kôra s ovocím
description: Sójový jogurt rozotretý na plech, posypaný ovocím a orechmi a zmrazený. Nalámeš na kúsky ako čokoládu – na leto ideálne.
cuisine: moderna
meals: [snack, ranajky, dezert]
categories: [snacky/sladke, dezerty/kremy]
time: 190
active: 10
servings: 6
difficulty: 1
tags: [bez-varenia, deti, vela-bielkovin]
ahead: Mrazí sa aspoň 3 hodiny.
keeps: { fridge: 0, freezer: 2 }
ingredients:
  - sojovy-jogurt: 500 g | hustý, grécky typ
  - javorovy-sirup: 2 pl
  - vanilka: 1/2 čl
  - jahody: 1 hrnček | nakrájané
  - cucoriedky: 1/2 hrnček
  - mandle: 3 pl | nasekané
  - horka-cokolada: 20 g | nastrúhaná
steps:
  - Jogurt vymiešaj so sirupom a vanilkou.
  - Plech alebo väčšiu dosku vystel papierom na pečenie a jogurt rozotri na vrstvu hrubú asi 1 cm.
  - Rovnomerne posyp ovocím, mandľami a čokoládou a zľahka pritlač.
  - Zmraz aspoň 3 hodiny, potom nalámaj na kúsky a skladuj v dóze v mrazničke.
tips:
  - Riedky jogurt najprv 2 hodiny odkvapkaj cez utierku na sitku – kôra potom nie je ľadová.
  - Mrazené ovocie posyp až tesne pred mrazením, inak zafarbí jogurt.
