title: Nasu dengaku
description: Japonský baklažán pečený s lesklou sladkou miso glazúrou. Krémový vnútri, karamelový navrchu.
cuisine: japonska
meals: [obed, vecera, snack]
categories: [hlavne/zelenina, prilohy/prilohy]
time: 35
active: 10
servings: 2
difficulty: 1
tags: []
spicy: 0
keeps: { fridge: 2 }
ingredients:
  - baklazan: 2 ks | pozdĺžne rozpolené
  - olej: 2 pl
  - miso: 2 pl
  - javorovy-sirup: 1 pl
  - sojova-omacka: 1 čl
  - ryzovy-ocot: 1 čl
  - sezam: 1 čl
  - jarna-cibulka: 1 ks
  - ryza-sushi: 150 g
steps:
  - Ryžu prepláchni do čírej vody, zalej 1,2-násobkom vody, priveď do varu a pod pokrievkou var na najmenšom ohni 12 minút. Nechaj 10 minút dôjsť, nepodvihuj pokrievku.
  - Dužinu baklažánu nareži do mriežky, potri olejom a peč reznou stranou nahor na 210 °C 25 minút do mäkka.
  - Miso, sirup, sójovú omáčku a ocot zmiešaj na glazúru.
  - Natri na baklažán a daj pod gril na 3–4 minúty, kým nezačne bublať a karamelizovať. Posyp sezamom a cibuľkou.
