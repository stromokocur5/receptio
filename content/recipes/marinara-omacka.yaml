title: Marinara – paradajková omáčka do zásoby
description: Základná talianska omáčka z passaty, cibule, cesnaku a bazalky. Uvar veľký hrniec a máš základ na cestoviny, pizzu, lasagne aj fazuľu na celý týždeň.
cuisine: talianska
meals: [domace]
categories: [omacky/omacky, domace/zaklady]
time: 35
active: 10
servings: 6
difficulty: 1
tags: [meal-prep, urob-si-sam, lacne]
yields: cca 700 ml
keeps: { fridge: 5, freezer: 4 }
leftovers: 'Zamraz v tvorítku na ľad – 2–3 kocky stačia na porciu cestovín alebo pod pitu pizzu.'
related: [domaca-passata, arrabbiata, pita-pizza, lasagne]
ingredients:
  - olivovy-olej: 3 pl
  - cibula: 1 ks | nadrobno
  - cesnak: 3 ks
  - passata: 3 hrnček
  - oregano: 1 čl
  - sol: 1 čl
  - cukor: 1/2 čl | ak je passata kyslá
  - bazalka: 1/2 hrnček | lístky
steps:
  - Na oleji na miernom ohni speň cibuľu 8 minút do sklovita, nesmie zhnednúť. Pridaj prelisovaný cesnak a minútu miešaj.
  - Prilej passatu, pridaj oregano, soľ a cukor. Pohár od passaty vypláchni 3 lyžicami vody a prilej aj tú.
  - Var na miernom ohni s pootvorenou pokrievkou 25 minút, občas premiešaj. Omáčka má zhustnúť a stratiť surovú chuť.
  - Odstav, vmiešaj natrhanú bazalku a ochutnaj – podľa potreby dosoľ.
  - Čo nespotrebuješ do 5 dní, rozdeľ po vychladnutí do dóz a zamraz.
tips:
  - Hladkú omáčku pre deti dostaneš, keď ju na konci rozmixuješ ponorným mixérom.
  - Dvojitá dávka sa varí rovnako dlho, len v širšom hrnci.
