title: Philly cheesesteak s hlivou
description: Bageta plná opečenej hlivy, papriky a cibule zaliata horúcou syrovou omáčkou. Filadelfská klasika, ktorá kvapká po lakťoch.
cuisine: americka
meals: [obed, vecera]
categories: [comfort/burgre, hlavne/plnene, hlavne/zelenina]
time: 30
active: 25
servings: 3
difficulty: 1
tags: [rychle, party]
keeps: { fridge: 2 }
leftovers: 'Plnku uchovaj zvlášť a zohrej na panvici, do bagety až pred jedlom.'
ingredients:
  - hliva: 400 g
  - olej: 3 pl
  - cibula: 1 ks | na tenké pásiky
  - paprika-cervena: 1 ks | na pásiky
  - sojova-omacka: 2 pl
  - udena-paprika: 1/2 čl
  - cierne-korenie: 1/2 čl
  - bageta: 1 ks | alebo 3 bagetky
  - kesu: 1/3 hrnček | namočené v horúcej vode
  - vyzivne-drozdie: 2 pl
  - horcica: 1 čl
  - kukuricny-skrob: 1 čl
  - voda: 1/2 hrnček
  - sol: 1/4 čl
steps:
  - Syrová omáčka. Kešu rozmixuj s droždím, horčicou, škrobom, vodou a soľou dohladka. Zohrej na miernom ohni, kým nezhustne ako fondue.
  - Hlivu natrhaj na tenké prúžky a opekaj na 2 PL oleja na veľkom ohni 6 minút bez veľkého miešania, kým nezhnedne.
  - Pridaj zvyšný olej, cibuľu a papriku a opekaj 5 minút, kým nezmäknú.
  - Podlej sójovou omáčkou, pridaj papriku a korenie a opekaj minútu.
  - Bagetu rozkroj pozdĺžne a opeč v rúre na 200 °C 5 minút alebo na panvici.
  - Naplň hlivou a štedro polej syrovou omáčkou.
