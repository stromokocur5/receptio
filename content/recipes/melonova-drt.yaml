title: Melónová ľadová drť
description: Zamrazené kocky melóna rozmixované s limetkou a mätou. Ľadová drť ako z kúpaliska, len namiesto farebného sirupu je v nej ovocie.
cuisine: moderna
meals: [snack, dezert]
categories: [napoje/limonady, dezerty/mrazene]
time: 10
active: 10
servings: 3
difficulty: 1
tags: [rychle, bez-varenia, deti, party, lacne]
spicy: 0
ahead: Melón nakrájaj na kocky a zamraz aspoň na 4 hodiny.
keeps: { fridge: 0, freezer: 0 }
related: [agua-de-sandia, citronova-granita]
ingredients:
  - melon: 4 hrnček | kocky bez kôstok, zamrazené
  - limetka: 1 ks | šťava
  - bylinky-mata: 1 pl
  - voda: 1/2 hrnček | studená
  - cukor: 1 pl | len ak je melón málo sladký
steps:
  - Kocky melóna rozlož na tácku v jednej vrstve a zamraz. Na kope zmrznú do jedného bloku.
  - Zamrazený melón daj do mixéra s limetkovou šťavou, mätou a polovicou vody.
  - Mixuj krátkymi pulzmi a vodu prilievaj len toľko, aby sa mixér točil. Má ostať hustá drť, ktorá sa je lyžičkou aj pije slamkou.
  - Ochutnaj, prípadne doslaď, nalej do pohárov a hneď podávaj.
tips:
  - Zamraz si celý melón naraz, keď je v auguste najlacnejší. Kocky vo vrecku vydržia v mrazničke tri mesiace.
  - Rovnako funguje ananás, jahody alebo broskyne.
