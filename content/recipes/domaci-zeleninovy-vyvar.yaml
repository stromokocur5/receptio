title: Domáci zeleninový vývar
description: Poctivý vývar z koreňovej zeleniny a húb. Istota bez lepku a éčok, ktoré bývajú v kockách – a skvelé využitie šupiek.
cuisine: moderna
meals: [domace]
time: 70
active: 10
servings: 8
difficulty: 1
tags: [urob-si-sam, zvysky]
nutrition: false
yields: cca 2 l vývaru
ingredients:
  - cibula: 2 ks | prekrojená, aj so šupkou
  - mrkva: 3 ks
  - zeler-stonkovy: 2 ks
  - petrzlen-koren: 1 ks
  - cesnak: 3 ks
  - sampinony: 100 g | alebo hrsť sušených húb
  - bobkovy-list: 2 ks
  - nove-korenie: 4 ks
  - voda: 3 l
  - sol: 2 čl
steps:
  - Cibuľu opeč reznou plochou nadol na suchom hrnci dotmava – vývar bude mať krásnu zlatú farbu.
  - Pridaj nahrubo nakrájanú zeleninu, huby, korenie a studenú vodu.
  - Var hodinu odkrytý na miernom ohni. Nesmie prudko vrieť, inak sa zakalí.
  - Preceď, osoľ a nechaj vychladnúť.
tips:
  - Zbieraj šupky a konce zeleniny do vrecka v mrazničke. Keď je plné, uvar z neho vývar.
  - Zamraz v tvorítkach na ľad – kocky vývaru sú potom vždy po ruke.
