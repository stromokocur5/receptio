title: Zeleninový bujón v prášku
description: Domáca „vegeta“ zo sušenej zeleniny a soli, bez glutamanu a palmového tuku. Lyžička do polievky, omáčky aj ryže.
cuisine: slovenska
meals: [domace]
categories: [domace/zaklady, domace/zavarane]
time: 540
active: 40
servings: 60
difficulty: 1
tags: [urob-si-sam, zvysky, lacne]
yields: cca 300 g (60 lyžičiek)
keeps: { fridge: 30 }
nutrition: false
howto: [susenie]
ingredients:
  - mrkva: 5 ks
  - petrzlen-koren: 2 ks
  - zeler-stonkovy: 4 ks | alebo kúsok bulvy
  - por: 1 ks
  - cibula: 2 ks
  - petrzlenova-vnat: 1 hrnček
  - sol: 150 g
  - vyzivne-drozdie: 4 pl
  - kurkuma: 1 čl
  - cierne-korenie: 1 čl
steps:
  - Zeleninu nastrúhaj na hrubom strúhadle alebo nakrájaj nadrobno, vňať nasekaj.
  - Rozlož na plechy s papierom v tenkej vrstve a suš pri 50–60 °C s pootvorenými dvierkami 6–8 hodín (alebo v sušičke), kým nie je úplne krehká.
  - Vychladnutú rozmel v mixéri alebo mlynčeku na kávu so soľou, výživným droždím, kurkumou a korením.
  - Nasyp do suchého pohára a skladuj v tme. Na liter vody stačia 2 ČL.
tips:
  - Zeleninu zbieraj celý týždeň – konce mrkvy, zeleru a póru v mrazničke – a suš naraz.
  - Menej soli – vydrží kratšie, skladuj v chladničke.
