title: Domáca granola
description: Chrumkavá orechovo-semienková granola s javorovým sirupom. Lacnejšia a lepšia ako kupovaná.
cuisine: moderna
meals: [ranajky, snack]
categories: [ranajky/kase, snacky/na-cesty]
time: 35
active: 10
servings: 10
difficulty: 1
tags: [ranajky, meal-prep]
keeps: { fridge: 30 }
ingredients:
  - ovsene-vlocky: 300 g
  - vlasske-orechy: 1 hrnček | nahrubo nasekané
  - tekvicove-semienka: 4 pl
  - lanove-semienko: 2 pl
  - skorica: 2 čl
  - sol: 1/2 čl
  - javorovy-sirup: 5 pl
  - kokosovy-olej: 4 pl | rozpustený
  - susene-marhule: 8 ks | nakrájané
steps:
  - Rúru predhrej na 160 °C.
  - Zmiešaj vločky, orechy, semienka, škoricu a soľ, prilej sirup a olej a dôkladne premiešaj.
  - Rozprestri na plech s papierom a stlač. Peč 25 minút, v polovici premiešaj.
  - Nechaj úplne vychladnúť – až vtedy stvrdne do chrumkavých hrudiek. Potom primiešaj marhule.
