title: Prosové rizoto s opečenou cuketou a citrónom
description: Krémové „rizoto“ z pšena, ktoré sa pri miešaní zahustí samo, a cuketa opečená zvlášť do hneda, aby sa v ňom nerozvarila. Citrón a cesnakový olej nakoniec. Žiadna smotana, žiadny syr, a predsa krémové.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/ryza, hlavne/zelenina]
time: 35
active: 30
servings: 2
difficulty: 1
tags: [zlatica]
keeps: { fridge: 2 }
leftovers: 'Proso v chladničke stuhne. Zohrej ho s pár lyžicami vody a miešaj, kým nie je znova krémové.'
ingredients:
  - proso: 150 g
  - cibula: 1 ks
  - olivovy-olej: 4 pl | 2 do hrnca, 2 na cuketu
  - cesnak: 3 ks
  - voda: 700 ml | horúca
  - sol: 1 čl | 1/2 na cuketu
  - cuketa: 1 ks
  - horcica: 1 čl
  - citron: 1/2 ks | šťava
  - petrzlenova-vnat: 3 pl
  - cierne-korenie: 1 štipka
  - tekvicove-semienka: 2 pl
steps:
  - Proso prepláchni v sitku horúcou vodou, aspoň trikrát – zmyje sa z neho horkosť.
  - Cuketu nakrájaj na kocky 1,5 cm, posyp 1/2 ČL soli a nechaj ju v sitku púšťať vodu, kým varíš proso.
  - V hrnci rozohrej 2 PL oleja na strednom ohni a nadrobno nakrájanú cibuľu restuj 5 minút. Pridaj 2 prelisované strúčiky cesnaku a proso a miešaj 2 minúty, kým zrná nevoňajú.
  - Zalej 500 ml horúcej vody, pridaj 1/2 ČL soli a var na miernom ohni 15 minút, každé 2–3 minúty premiešaj. Postupne dolievaj zvyšok vody, keď zhustne. Miešanie uvoľní z prosa škrob a urobí ho krémovým ako rizoto.
  - Medzitým cuketu stlač v sitku a osuš v utierke. Na panvici rozohrej 2 PL oleja na vysokom ohni a cuketu opekaj v jednej vrstve 6–7 minút, otoč ju až keď je spodok hnedý. Na poslednú minútu pridaj zvyšný strúčik cesnaku a semienka.
  - Proso má byť mäkké a husté, ale tečúce ako kaša. Odstav, vmiešaj horčicu, citrónovú šťavu a vňať, ochutnaj a dosoľ. Navrch daj opečenú cuketu so semienkami a korenie.
tips:
  - Cuketu nikdy nevar priamo v rizote, pustí vodu a rozvarí sa.
