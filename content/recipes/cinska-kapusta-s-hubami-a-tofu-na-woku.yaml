title: Čínska kapusta s hubami a tofu na woku
description: Kapusta opečená na veľkom ohni, kým jej okraje nezhnednú, šampiňóny a tofu v cesnakovo-sójovej omáčke. Rýchla večera s ryžou.
cuisine: cinska
meals: [obed, vecera]
categories: [hlavne/tofu, hlavne/zelenina]
time: 35
active: 30
servings: 4
difficulty: 1
tags: [rychle, lacne, vela-bielkovin]
spicy: 0
keeps: { fridge: 2 }
leftovers: 'Prehrej krátko na panvici. Kapusta pustí vodu, preto je najlepšia hneď.'
ingredients:
  - tofu-natural: 400 g | pevné
  - sojova-omacka: 4 pl | 1 na tofu, 3 do omáčky
  - kukuricny-skrob: 2 pl | 1 na tofu, 1 do omáčky
  - olej: 3 pl
  - sampinony: 300 g | na plátky
  - cinska-kapusta: 600 g | asi 3/4 hlávky
  - cesnak: 4 ks | nasekaný
  - zazvor: 1 pl | nastrúhaný
  - ryzovy-ocot: 1 pl
  - javorovy-sirup: 1 pl
  - voda: 4 pl
  - sezamovy-olej: 1 čl
  - jarna-cibulka: 2 ks | na kolieska
  - ryza-jazminova: 300 g
  - sol: 1/2 čl | do ryže
steps:
  - Tofu osuš utierkou, nakrájaj na kocky 2 cm, premiešaj s 1 PL sójovej omáčky a nechaj 10 minút postáť. Potom ho obaľ v 1 PL škrobu.
  - Medzitým uvar ryžu – prepláchni ju v site, zalej 450 ml vody, osoľ a priveď do varu. Prikry a na najmenšom ohni var 12 minút, potom odstav a nechaj 10 minút dôjsť pod pokrievkou.
  - Kapustu pozdĺžne rozpoľ a nakrájaj na kusy 3 cm, biele časti od spodku daj zvlášť. V miske zmiešaj zvyšné 3 PL sójovej omáčky, ocot, sirup, vodu a 1 PL škrobu.
  - Vo woku alebo veľkej panvici rozohrej 2 PL oleja na veľkom ohni a tofu opekaj 8 minút, kým nie je chrumkavé. Vyber ho.
  - Na suchom woku opekaj šampiňóny 5 minút, kým nepustia vodu a nezhnednú. Vyber ich k tofu.
  - Pridaj zvyšný 1 PL oleja a biele časti kapusty a 3 minúty opekaj na veľkom ohni bez veľkého miešania, nech chytia farbu. Pridaj zelené listy, cesnak a zázvor a opekaj ešte 2 minúty.
  - Vráť tofu a huby, omáčku v miske premiešaj (škrob klesne ku dnu) a vlej do woku. 1 minútu prehadzuj, kým omáčka nezhustne a nezaleskne sa.
  - Odstav, pokvapkaj sezamovým olejom, posyp jarnou cibuľkou a podávaj s ryžou.
tips:
  - Ak máš malú panvicu, kapustu opekaj na dvakrát – naložená naraz sa dusí a pustí veľa vody.
  - Bezlepková verzia – namiesto sójovej omáčky tamari.
