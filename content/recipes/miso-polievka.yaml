title: Miso polievka s tofu a wakame
description: Japonská každodenná polievka za 15 minút. Vývar z húb, hodvábne tofu a riasy.
cuisine: japonska
meals: [obed, vecera, snack]
categories: [polievky/azijske]
time: 15
active: 10
servings: 4
difficulty: 1
tags: [polievka, rychle]
keeps: { fridge: 2 }
leftovers: 'Miso neprevarievaj – ohrej len do horúca.'
ingredients:
  - voda: 4 hrnček
  - susene-huby: 5 g | shiitake pre umami
  - wakame: 1 pl
  - tofu-hodvabne: 200 g | na kocky
  - miso: 3 pl
  - jarna-cibulka: 2 ks | na kolieska
steps:
  - Vodu so sušenými hubami priveď do varu a 10 minút jemne var. Huby vyber, nakrájaj a vráť späť.
  - Wakame namoč na 5 minút do studenej vody a sceď. Zväčší sa niekoľkonásobne.
  - Do vývaru pridaj tofu a 2 minúty zohrej. Stiahni z ohňa.
  - Miso rozmiešaj v naberačke vývaru a vlej späť. Po pridaní misa už polievku nevar, stráca chuť aj živé kultúry.
  - Pridaj wakame a jarnú cibuľku.
tips:
  - Pri celiakii použi ryžové (kome) miso, jačmenné (mugi) obsahuje lepok.
