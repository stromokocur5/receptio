title: Opekaná kapusta so zemiakmi, fazuľou a rascou
description: Kapusta opečená na panvici do hneda, kým nie je sladká a karamelová, so zemiakmi, cibuľou, rascou a bielou fazuľou. Lacné, sýte, ako u babky – len ťa nebude čakať bledá dusená kapusta.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/zelenina, hlavne/strukoviny]
time: 40
active: 30
servings: 3
difficulty: 1
tags: [zlatica, lacne]
keeps: { fridge: 3 }
ingredients:
  - zemiaky: 5 ks
  - biela-kapusta: 600 g | asi pol menšej hlávky
  - olej: 4 pl
  - cibula: 1 ks
  - cesnak: 2 ks
  - rasca: 1,5 čl
  - sladka-paprika: 1 čl
  - sol: 1,5 čl
  - cukor: 1/2 čl
  - fazula-biela: 1 ks | plechovka, scedená a prepláchnutá
  - ocot: 1 pl
  - cierne-korenie: 1/2 čl
  - kopor: 2 pl | alebo petržlenová vňať
steps:
  - Zemiaky ošúp, nakrájaj na kocky 2 cm a var v osolenej vode 10 minút, kým nie sú takmer mäkké. Sceď a nechaj vyparovať.
  - Medzitým kapuste vyrež košťaľ a nakrájaj ju na štvorčeky 2–3 cm. Cibuľu nakrájaj na pásiky.
  - Vo veľkej panvici rozohrej 2 PL oleja na vysokom ohni. Pridaj kapustu, posyp 1/2 ČL soli a cukrom a opekaj 10–12 minút, premiešaj len každé 2 minúty. Kapusta má mať tmavohnedé okraje. Cukor pomôže karamelizácii – čím viac hnedej, tým sladšia a menej „kapustová“ chuť.
  - Kapustu odsuň na kraj, do voľného miesta daj 2 PL oleja, cibuľu a zemiaky. Opekaj 8 minút, kým zemiaky nemajú zlatú kôrku.
  - Pridaj rascu, prelisovaný cesnak a fazuľu, premiešaj všetko spolu a opekaj 2 minúty. Odstav, vmiešaj sladkú papriku, zvyšok soli, korenie a ocot.
  - Ochutnaj, dosoľ a posyp kôprom. Ku kyslej uhorke alebo paradajkovému šalátu.
tips:
  - Ak je panvica malá, kapustu opekaj na dvakrát. Navŕšená sa dusí a ostane bledá.
