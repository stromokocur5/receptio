title: Bazový sirup
description: Májová klasika zo starej mamy – kvety bazy, citrón a cukor. Z jednej várky je leto na celý rok.
cuisine: slovenska
meals: [domace]
categories: [napoje/limonady, domace/zaklady]
time: 20
active: 20
servings: 40
difficulty: 1
tags: [urob-si-sam, lacne]
ahead: Kvety sa lúhujú 2 dni.
yields: cca 2 l sirupu (na 40 pohárov)
keeps: { fridge: 30 }
ingredients:
  - bazovy-kvet: 25 ks | nepraný, bez hrubých stopiek
  - citron: 3 ks | na plátky
  - voda: 1,5 l
  - cukor: 1,5 kg
steps:
  - Kvety a citróny daj do veľkej misy a zalej vychladenou prevarenou vodou. Prikry utierkou a nechaj 2 dni na chladnom mieste, raz denne premiešaj.
  - Preceď cez utierku, dobre vyžmýkaj.
  - Do tekutiny vmiešaj cukor a miešaj (alebo krátko zohrej do 60 °C), kým sa úplne nerozpustí.
  - Nalej do vyparených fliaš a uzavri. Na limonádu riedi 1 diel sirupu s 8 dielmi vody.
tips:
  - Menej cukru znamená kratšiu trvanlivosť – so 1 kg ho drž v chladničke a spotrebuj do mesiaca, alebo zamraz v kockách.
  - Kvety zbieraj za slnka a ďaleko od ciest. Pozor, nezamieňaj s bazou chabzďovou – tá má kvety ružkasté, rastie nízko a páchne.
