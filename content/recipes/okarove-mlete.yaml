title: Okarové „mleté“ na tacos a cestoviny
description: Okara opečená na panvici do hneda s cibuľou, paradajkovým pretlakom a údenou paprikou. Drobí sa ako mleté mäso – do tacos, na cestoviny alebo do plnených paprík.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/strukoviny]
time: 30
active: 25
servings: 3
difficulty: 1
tags: [zvysky, lacne, meal-prep]
spicy: 1
keeps: { fridge: 3, freezer: 3 }
related: [domace-sojove-mlieko, okarove-placky]
ingredients:
  - okara: 300 g
  - olej: 4 pl
  - cibula: 1 ks | nadrobno
  - cesnak: 3 ks
  - paradajkovy-pretlak: 2 pl
  - sojova-omacka: 2 pl
  - udena-paprika: 2 čl
  - kmin: 1 čl
  - oregano: 1 čl
  - cili: 1/4 čl
  - sol: 1/2 čl
  - voda: 4 pl
steps:
  - Na veľkej panvici rozohrej 3 PL oleja na strednom ohni a pridaj okaru. Rozdrob ju varechou a opekaj 10–12 minút, občas premiešaj. Najprv sa z nej odparí voda, potom začne hnednúť – nechaj ju vždy chvíľu ležať, nech sa spodok opečie.
  - Keď je okara zlatohnedá a suchá ako strúhanka, posuň ju na kraj panvice, pridaj zvyšný olej a cibuľu a opekaj 5 minút, kým cibuľa nezmäkne. Pridaj prelisovaný cesnak a minútu opekaj.
  - Primiešaj pretlak, papriku, kmín, oregano a čili a opekaj 1 minútu, aby korenie zavoňalo.
  - Prilej sójovú omáčku a vodu, premiešaj a nechaj 2 minúty, kým sa tekutina nevsiakne. Ochutnaj a dosoľ.
tips:
  - Na tacos ho daj do tortíl s kapustou a avokádom, na cestoviny ho pridaj do paradajkovej omáčky posledných 5 minút.
  - Bez dlhého opekania chutí okara ako mokrý chlieb – hnednutie je to, čo z nej robí „mäso“.
