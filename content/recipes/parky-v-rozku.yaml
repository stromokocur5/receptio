title: Párky v rožku
description: Domáce rastlinné párky v teplom rožku s horčicou a kečupom. Párky spravíš za pol hodiny na pare a zvyšok zamraziš – potom je to raňajky za 5 minút.
cuisine: slovenska
meals: [ranajky, obed, snack]
categories: [comfort/burgre, hlavne/plnene, snacky/na-cesty]
time: 50
active: 20
servings: 4
difficulty: 2
tags: [deti, klasika, vela-bielkovin]
keeps: { fridge: 5, freezer: 3 }
leftovers: 'Uvarené párky vydržia v chladničke 5 dní, zamrazené 3 mesiace. Rozmraz ich rovno v horúcej vode.'
related: [domace-parky, hot-dog-mrkva]
ingredients:
  - fazula-biela: 1/2 ks | plechovka, scedená
  - lepok-vital: 80 g
  - vyzivne-drozdie: 1 pl
  - sladka-paprika: 1 čl
  - udena-paprika: 1/2 čl
  - cesnak: 1 ks | prelisovaný
  - muskatovy-orech: 1 štipka
  - cierne-korenie: 1/4 čl
  - sol: 1/2 čl
  - sojova-omacka: 1 čl
  - tekuty-dym: 1/4 čl | voliteľne
  - olej: 1 pl
  - voda: 50 ml
  - bageta: 2 ks | alebo 4 rožky
  - horcica: 4 čl
  - kecup: 4 pl
steps:
  - Párky. Fazuľu rozmixuj dohladka s vodou, olejom, sójovou omáčkou, cesnakom a dymom.
  - Lepok zmiešaj s droždím, oboma paprikami, muškátom, korením a soľou. Vlej fazuľovú zmes a mies 2 minúty na hladké pružné cesto.
  - Rozdeľ ho na 4 kúsky a každý vyvaľkaj na valček dlhý ako rožok a hrubý ako prst – pri varení ešte napučí.
  - Každý zabaľ do kúska alobalu a konce zatoč ako cukrík.
  - Duste na pare nad vriacou vodou 30 minút. Nechaj ich 10 minút vychladnúť v alobale, potom rozbaľ.
  - Tesne pred jedlom daj párky na 3 minúty do horúcej vody, ktorá už nevrie, alebo ich opeč na panvici.
  - Rožky prehrej v rúre alebo hriankovači, nareži z boku a naplň horčicou a kečupom.
  - Vlož párok a jedz, kým je teplý.
tips:
  - Sprav dvojitú dávku a polovicu zamraz – nabudúce máš párky v rožku hotové za 5 minút.
  - S kúpenými vegánskymi párkami preskoč prvých päť krokov.
  - Párky sú z lepku, bez lepku nie.
