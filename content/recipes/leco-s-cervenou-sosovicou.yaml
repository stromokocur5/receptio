title: Lečo s červenou šošovicou
description: Lečo, kde sa paprika naozaj opečie a paradajky povaria do hustej omáčky, nie zelenina plávajúca vo vode. Červená šošovica ho zasýti a zahustí. Za pol hodiny.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/strukoviny, hlavne/zelenina]
time: 35
active: 25
servings: 3
difficulty: 1
tags: [zlatica, lacne]
keeps: { fridge: 3, freezer: 3 }
ingredients:
  - olej: 2 pl
  - cibula: 2 ks
  - paprika-cervena: 4 ks | alebo mix s bielymi
  - cesnak: 3 ks
  - paradajky: 5 ks | zrelé, alebo 1 plechovka krájaných
  - paradajkovy-pretlak: 1 pl
  - sladka-paprika: 1 čl
  - udena-paprika: 1 čl
  - sosovica-cervena: 120 g
  - voda: 400 ml
  - sol: 1,5 čl
  - cukor: 1/2 čl
  - ocot: 1 čl
  - petrzlenova-vnat: 2 pl
  - cierne-korenie: 1 štipka
steps:
  - Cibuľu nakrájaj na pásiky, papriky na prúžky, paradajky na kocky. Šošovicu prepláchni v sitku, kým voda nie je číra.
  - Vo veľkej panvici rozohrej olej na strednom ohni a restuj cibuľu 5 minút, kým nezmäkne. Pridaj papriku, zvýš oheň a opekaj 7–8 minút bez pokrievky, len občas premiešaj. Na paprike sa majú objaviť hnedé škvrny – to je chuť, ktorú pokrievka a prepláchnutá voda zabíjajú.
  - Pridaj prelisovaný cesnak a pretlak a minútu miešaj. Odstav z ohňa, vmiešaj sladkú aj údenú papriku.
  - Pridaj paradajky, šošovicu, vodu, soľ a cukor. Priveď do varu, stíš na mierny oheň a var bez pokrievky 15 minút, občas premiešaj. Šošovica sa rozvarí a lečo zhustne. Ak by sa prilepovalo, dolej trochu vody.
  - Vmiešaj ocot, ochutnaj a dosoľ. Podávaj posypané vňaťou a korením, s chrumkavými pečenými zemiakmi alebo ryžou.
tips:
  - Ak máš v lete veľa paprík, uvar dvojitú dávku a polovicu zamraz.
