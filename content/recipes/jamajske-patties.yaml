title: Jamajské patties
description: Zlaté polmesiačiky z kurkumového cesta plnené korenistou šošovicou. Jamajský pouličný obed do ruky.
cuisine: karibska
meals: [obed, snack]
categories: [hlavne/cesto, snacky/na-cesty]
time: 90
active: 40
servings: 8
difficulty: 2
tags: [pecenie, do-krabicky, meal-prep]
spicy: 2
keeps: { fridge: 4, freezer: 3 }
gf_swap: false
ingredients:
  - hladka-muka: 350 g
  - kurkuma: 2 čl
  - kari-korenie: 1 čl
  - sol: 1 čl
  - rastlinne-maslo: 150 g | studené
  - voda: 120 ml | ľadová
  - olej: 2 pl
  - cibula: 1 ks | nadrobno
  - cesnak: 3 ks
  - jarna-cibulka: 3 ks
  - tymian: 1 čl
  - nove-korenie: 1 čl
  - cili-papricka: 1 ks
  - sosovica-hneda: 200 g
  - sojove-granule: 1/2 hrnček
  - struhanka: 3 pl
steps:
  - Múku zmiešaj s kurkumou, kari a polovicou soli. Vtrhaj studené maslo prstami na drobky, pridaj vodu a rýchlo spoj do cesta. Zabaľ a daj na 30 minút do chladničky.
  - Kým cesto chladne, šošovicu var v neosolenej vode 20–25 minút domäkka a sceď. Granule zalej horúcou vodou, nechaj 10 minút nasiaknuť a vyžmýkaj.
  - Na oleji na strednom ohni speň cibuľu, cesnak, cibuľku, papričku a korenie. Pridaj šošovicu, granule, zvyšok soli a trochu vody a 10 minút dus. Vmiešaj strúhanku a nechaj vychladnúť.
  - Cesto vyvaľkaj na 3 mm a vykrajuj kruhy veľkosti tanierika. Na polovicu daj náplň, prelož a okraje pritlač vidličkou.
  - Ulož na plech s papierom na pečenie a peč na 200 °C 25 minút dozlatista.
