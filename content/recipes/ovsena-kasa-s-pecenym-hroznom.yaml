title: Ovsená kaša s hroznom z panvice
description: Krémová kaša so sójovým mliekom a hrozno, ktoré na panvici s javorovým sirupom a škoricou praskne a pustí šťavu. Navrch vlašské orechy a ľan. Jesenné raňajky za desať minút.
cuisine: moderna
meals: [ranajky]
categories: [ranajky/kase]
time: 12
active: 12
servings: 2
difficulty: 1
tags: [rychle, ranajky, lacne]
spicy: 0
keeps: { fridge: 2 }
ingredients:
  - ovsene-vlocky: 160 g
  - sojove-mlieko: 400 ml
  - voda: 200 ml
  - sol: 1 štipka
  - hrozno: 250 g
  - javorovy-sirup: 2 čl
  - skorica: 1/2 čl
  - vlasske-orechy: 30 g
  - lanove-semienko: 2 pl | mleté
steps:
  - Vločky daj do hrnca s mliekom, vodou a soľou a var na strednom ohni za stáleho miešania 5 minút, kým kaša nezhustne. Ak je hustá, prilej trochu vody.
  - Medzitým rozohrej panvicu na strednom ohni, daj na ňu hrozno otrhané zo strapca, sirup a škoricu. Opekaj 4–5 minút a občas potras, kým bobule nezačnú praskať a šťava nezhustne na sirup.
  - Kašu rozdeľ do misiek, polej hroznom aj so šťavou a posyp nasekanými orechmi a ľanom.
tips:
  - Hrozno z panvice vydrží v chladničke 3 dni, urob ho viac a daj aj na jogurt.
