title: Tofu jerky
description: Tenké plátky údeného tofu v sladko-slanej marináde, pomaly sušené v rúre. Žuvacie, výrazné a na výlet vydržia aj bez chladničky.
cuisine: americka
meals: [snack]
categories: [snacky/na-cesty, snacky/slane]
time: 150
active: 20
servings: 4
difficulty: 2
tags: [do-krabicky, vela-bielkovin, meal-prep]
ahead: Marinuj aspoň hodinu, najlepšie cez noc.
keeps: { fridge: 7, freezer: 3 }
ingredients:
  - tofu-udene: 400 g
  - sojova-omacka: 4 pl
  - javorovy-sirup: 1 pl
  - tekuty-dym: 1/2 čl | voliteľne
  - udena-paprika: 1 čl
  - cesnak: 1 ks | prelisovaný
  - cierne-korenie: 1/2 čl
steps:
  - Tofu zabaľ do utierky a 15 minút zaťaž doskou, aby pustilo vodu. Nakrájaj na plátky hrubé 4–5 mm.
  - Zmiešaj sójovú omáčku, sirup, dym, papriku, cesnak a korenie. Plátky v marináde obaľ a nechaj v chladničke aspoň hodinu.
  - Rúru predhrej na 110 °C. Plátky rozlož na plech s papierom (alebo na mriežku) a zvyšok marinády potri navrch.
  - Suš 1,5–2 hodiny, po hodine otoč. Hotové jerky je tmavé, pružné a na povrchu suché – na dotyk nesmie byť mäkké v strede.
  - Nechaj vychladnúť a skladuj v dóze.
tips:
  - Dvierka rúry nechaj pootvorené vareškou, para unikne a jerky sa suší rovnomernejšie.
  - Bez chladničky ho ber najviac na deň, nie je to trvanlivé mäsové jerky.
