title: Rozbité zemiaky s cesnakovým olejom na fazuľovom kréme
description: Uvarené malé zemiaky rozpučené na plech a upečené, kým nemajú chrumkavé roztrhané okraje. Polievajú sa cesnakovo-vňaťovým olejom a ležia na krémovej fazuli. S uhorkovým šalátom.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/zelenina, prilohy/prilohy]
time: 55
active: 20
servings: 2
difficulty: 1
tags: [zlatica, party]
ingredients:
  - zemiaky: 700 g | malé, neošúpané
  - sol: 3/4 čl | na zemiaky a do krému
  - sol: ~1 pl | do vody
  - olivovy-olej: 5 pl | 3 na zemiaky, 2 na cesnakový olej
  - udena-paprika: 1/2 čl
  - fazula-biela: 1 ks | plechovka
  - citron: 1 ks | šťava
  - cesnak: 3 ks
  - voda: 3 pl
  - petrzlenova-vnat: 4 pl
  - uhorka: 1 ks
  - horcica: 1/2 čl
  - cierne-korenie: 1 štipka
steps:
  - Zemiaky umy, daj do studenej vody s 1 PL soli a var 15–20 minút, kým ich nôž prepichne bez odporu. Medzitým predhrej rúru na 230 °C.
  - Zemiaky sceď a nechaj 5 minút vyparovať. Polož ich na plech s papierom a dnom pohára ich rozpuč na placky hrubé 1,5 cm. Čím viac roztrhaných okrajov, tým viac chrumkavých kúskov.
  - Pokvapkaj ich 3 PL oleja, posyp 1/2 ČL soli a údenou paprikou. Peč 25 minút, kým nie sú okraje tmavozlaté a chrumkavé. Neotáčaj ich.
  - Fazuľový krém – fazuľu rozmixuj s polovicou citrónovej šťavy, 1 strúčikom cesnaku, vodou a štipkou soli úplne dohladka.
  - Cesnakový olej – zvyšné 2 strúčiky prelisuj, pridaj nadrobno nasekanú vňať, 2 PL oleja, štipku soli a lyžicu citrónovej šťavy.
  - Uhorku nakrájaj na tenké plátky a premiešaj so zvyškom citrónu, horčicou, štipkou soli a korením.
  - Na tanier rozotri fazuľový krém, nalož horúce zemiaky, polej cesnakovým olejom a podávaj s uhorkou.
tips:
  - Najlepšie sú malé zemiaky veľké ako vajce, rozpučia sa najkrajšie.
