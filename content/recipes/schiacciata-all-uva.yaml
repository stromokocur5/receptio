title: Schiacciata all'uva – toskánska placka s hroznom
description: Tenké kysnuté cesto v dvoch vrstvách s hroznom medzi nimi aj navrchu, posypané cukrom a rozmarínom. Bobule v rúre prasknú a šťava sa zapečie do cesta. Toskánsky jesenný koláč z oberačiek.
cuisine: talianska
meals: [dezert, snack]
categories: [dezerty/pecene]
time: 150
active: 25
servings: 8
difficulty: 2
tags: [pecenie, party, klasika]
spicy: 0
keeps: { fridge: 2, freezer: 1 }
gf_swap: false
ingredients:
  - hladka-muka: 400 g
  - drozdie: 1,5 čl | sušené
  - cukor: 5 pl
  - sol: 1 čl
  - voda: 260 ml | vlažná
  - olivovy-olej: 5 pl
  - hrozno: 700 g | tmavé, pokojne so semienkami
  - rozmarin: 1 ks | ihličie z jednej vetvičky
steps:
  - Múku, droždie, 1 PL cukru a soľ premiešaj v miske. Pridaj vodu a 2 PL oleja a miešaj, kým nevznikne mäkké cesto. Na pomúčenej doske ho mies 5 minút do hladka, vráť do misky, prikry a nechaj kysnúť 1 hodinu, kým nezdvojnásobí objem.
  - Hrozno otrhaj zo strapca, umy a dobre osuš utierkou, mokré by cesto rozmočilo. Plech (asi 25 × 35 cm) vymasti 1 PL oleja.
  - Rúru predhrej na 200 °C. Cesto rozdeľ na dve polovice. Prvú rozvaľkaj alebo roztiahni prstami na veľkosť plechu, tenko, asi na 5 mm, a polož na plech.
  - Rozlož naň polovicu hrozna, posyp 2 PL cukru a polovicou rozmarínu. Druhú polovicu cesta roztiahni rovnako a polož navrch. Okraje stlač k sebe.
  - Na vrch zatlač zvyšné hrozno tak, aby bobule boli do polovice v ceste. Pokvapkaj 2 PL oleja, posyp zvyšným cukrom a rozmarínom. Nechaj ešte 20 minút postáť.
  - Peč 40–45 minút, kým nie je povrch zlatohnedý a hrozno popraskané a karamelizované na okrajoch. Pred krájaním nechaj aspoň 20 minút vychladnúť, šťava zhustne.
tips:
  - V Toskánsku sa pečie s hroznom so semienkami a jedia sa aj s nimi – chrumkajú. Bezsemenné je pohodlnejšie.
  - Najlepšie chutí vlažná alebo na druhý deň.
