title: Kakaové guľky z mandľových výliskov
description: Drť, ktorá zostane po mandľovom mlieku, rozmixovaná s datľami a kakaom na guľky bez pečenia. Chutia ako marcipán s čokoládou.
cuisine: moderna
meals: [snack, dezert]
categories: [snacky/sladke, dezerty/nepecene]
time: 15
active: 15
servings: 12
difficulty: 1
tags: [zvysky, bez-varenia, do-krabicky, deti]
spicy: 0
keeps: { fridge: 5, freezer: 3 }
related: [mandlove-mlieko, energeticke-gulky]
ingredients:
  - mandlove-vylisky: 200 g | z 150 g mandlí, dobre vyžmýkané
  - datle: 12 ks | vykôstkované
  - kakao: 3 pl
  - ovsene-vlocky: 40 g
  - vanilka: 1/2 čl
  - sol: 1 štipka
  - kokos-struhany: 3 pl | na obaľovanie
steps:
  - Ak sú datle tvrdé, namoč ich na 10 minút do horúcej vody a dobre sceď.
  - V sekáčiku rozmixuj datle na hrubú pastu. Pridaj výlisky, kakao, vločky, vanilku a soľ a mixuj, kým sa zmes nezačne lepiť.
  - Ak je mokrá a lepí sa na ruky, pridaj ešte vločky po lyžici. Výlisky z menej vyžmýkanej utierky majú viac vody.
  - Mokrými rukami vytvaruj 12 guliek, obaľ ich v kokose a daj na hodinu do chladničky stuhnúť.
tips:
  - Výlisky majú vodu, preto vydržia kratšie ako bežné guľky – čo nezješ do 5 dní, zamraz.
  - Rovnako funguje drť z lieskových orechov alebo kešu.
