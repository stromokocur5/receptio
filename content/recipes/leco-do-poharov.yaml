title: Lečo do pohárov
description: Letné lečo z papriky, paradajok a cibule zaváraté na zimu. Na chlieb, do ryže, k tofu alebo ako základ gulášu.
cuisine: slovenska
meals: [domace]
categories: [domace/zavarane, omacky/chutney]
time: 120
active: 60
servings: 24
difficulty: 2
tags: [urob-si-sam, lacne, meal-prep]
yields: cca 8 pohárov po 0,5 l
keeps: { fridge: 7 }
howto: [zavaranie]
ingredients:
  - paprika-cervena: 3 kg | žltá a červená, na pásiky
  - paradajky: 1,5 kg | spariť, ošúpať, nakrájať
  - cibula: 5 ks | na mesiačiky
  - olej: 6 pl
  - sladka-paprika: 2 pl
  - sol: 2 pl
  - cukor: 2 pl
  - ocot: 6 pl | 8 %, kvôli bezpečnosti nevynechávaj
steps:
  - Poháre a viečka umy a vyvar 10 minút.
  - Vo veľkom hrnci na oleji na strednom ohni speň cibuľu, asi 8 minút. Stiahni z ohňa, vmiešaj sladkú papriku.
  - Pridaj papriku a duste prikryté 15 minút, kým nepustí šťavu. Pridaj paradajky, soľ, cukor a ocot a varte odkryté 10–15 minút, kým paprika nezmäkne, ale nerozpadne sa.
  - Horúce lečo naplň do horúcich pohárov 1–2 cm pod okraj, okraje utri a pevne zavri.
  - Poháre ulož do hrnca na utierku, zalej teplou vodou nad viečka a zaváraj 30 minút pri 90–100 °C.
  - Nechaj vychladnúť na utierke. Skontroluj, či sú viečka prisaté, a ulož do chladu a tmy.
tips:
  - Ocot je tu kvôli bezpečnosti – lečo bez kyseliny patrí len do mrazničky alebo do tlakového hrnca.
  - Otvorený pohár vydrží v chladničke týždeň. Na obed s údeným tofu a ryžou je hotové za 10 minút.
