title: Lečo do zásoby
description: Letné lečo z papriky, paradajok a cibule do mrazničky na celú zimu. Na chlieb, do ryže, k tofu alebo ako základ gulášu.
cuisine: slovenska
meals: [domace]
categories: [domace/zavarane, omacky/chutney]
time: 120
active: 60
servings: 24
difficulty: 2
tags: [urob-si-sam, lacne, meal-prep]
yields: cca 8 vreciek po 0,5 l
keeps: { fridge: 7 }
howto: [mrazenie-urody, zavaranie]
ingredients:
  - paprika-cervena: 3 kg | žltá a červená, na pásiky
  - paradajky: 1,5 kg | spariť, ošúpať, nakrájať
  - cibula: 5 ks | na mesiačiky
  - olej: 6 pl
  - sladka-paprika: 2 pl
  - sol: 2 pl
  - cukor: 2 pl
  - ocot: 6 pl | 8 %, kvôli bezpečnosti nevynechávaj
steps:
  - Vo veľkom hrnci na oleji na strednom ohni speň cibuľu, asi 8 minút. Stiahni z ohňa, vmiešaj sladkú papriku.
  - Pridaj papriku a duste prikryté 15 minút, kým nepustí šťavu. Pridaj paradajky, soľ, cukor a ocot a varte odkryté 10–15 minút, kým paprika nezmäkne, ale nerozpadne sa.
  - Nechaj vychladnúť a rozdeľ do dóz alebo vreciek na mrazenie po porciách (2–3 porcie na balenie). Označ dátum.
  - Zamraz. Vydrží 10–12 mesiacov, rozmrazuj v chladničke alebo rovno v hrnci.
tips:
  - Lečo je nekyslá zelenina – do pohárov vo vriacej vode ho nezaváraj, ani s lyžicou octu. Bezpečne len v mrazničke alebo v tlakovom hrnci určenom na zaváranie.
  - Otvorené alebo rozmrazené vydrží v chladničke 4 dni. Na obed s údeným tofu a ryžou je hotové za 10 minút.
