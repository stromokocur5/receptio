title: Slané hrianky v cícerovom cestíčku
description: Chlieb vo vajíčku bez vajíčka – krajce namočené v cestíčku z cícerovej múky a opečené dozlatista. Spotrebuješ v nich starší chlieb a k zelenine sú to slušné raňajky aj večera.
cuisine: slovenska
meals: [ranajky, vecera]
categories: [ranajky/slane]
time: 25
active: 25
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, deti, zvysky]
ingredients:
  - chlieb: 14 ks | aj dva dni starý
  - cicerova-muka: 150 g
  - sojove-mlieko: 400 ml
  - sol: 1 čl
  - sladka-paprika: 1 čl
  - cesnak: 2 ks | prelisovaný
  - cierne-korenie: 1 štipka
  - olej: 4 pl
  - paradajky: 4 ks | na podávanie
  - uhorka: 1 ks | na podávanie
steps:
  - V plytkej miske rozšľahaj cícerovú múku s mliekom, soľou, paprikou, cesnakom a korením na cestíčko hustoty smotany.
  - Paradajky a uhorku nakrájaj, nech sú pripravené na stole.
  - Veľkú panvicu zohrej na strednom ohni s lyžicou oleja.
  - Krajec namoč v cestíčku z oboch strán na 2 sekundy, nech nenasiakne skrz. Ulož na panvicu a peč 2–3 minúty z každej strany dozlatista. Naraz sa zmestia 3–4 krajce.
  - Pred každou dávkou prilej trochu oleja. Hotové hrianky jedz hneď s nakrájanou zeleninou.
tips:
  - K tomu sa hodí kečup alebo kyslá uhorka.
