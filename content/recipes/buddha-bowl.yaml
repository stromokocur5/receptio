title: Buddha bowl s pečeným batátom a tahini
description: Farebná miska s quinoou, pečeným batátom, chrumkavým cícerom, brokolicou a citrónovým tahini dresingom.
cuisine: moderna
meals: [obed, vecera]
time: 40
active: 15
servings: 3
difficulty: 1
tags: [do-krabicky, meal-prep]
ingredients:
  - batat: 1 ks | na kocky
  - cicer-sterilizovany: 1 ks | osušený
  - brokolica: 1/2 ks | na ružičky
  - olivovy-olej: 2 pl
  - udena-paprika: 1 čl
  - sol: 1 čl
  - quinoa: 150 g
  - voda: 300 ml
  - spenat: 60 g
  - avokado: 1 ks
  - tahini: 3 pl
  - citron: 1 ks
  - javorovy-sirup: 1 čl
  - tekvicove-semienka: 2 pl
steps:
  - Rúru predhrej na 210 °C. Batát, cícer a brokolicu premiešaj s olejom, paprikou a soľou a peč 25 minút.
  - Medzitým uvar quinou vo vode 15 minút.
  - Dresing. Tahini vyšľahaj s citrónom, sirupom, štipkou soli a 3–4 PL vody dohladka.
  - Do misiek daj špenát, quinou, pečenú zeleninu a avokádo, polej dresingom a posyp semienkami.
