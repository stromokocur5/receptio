title: Kelové chipsy
description: Chrumkavé chipsy z kučeravého kelu s „syrovým“ droždím a údenou paprikou. Zdravší snack k filmu.
cuisine: moderna
meals: [snack]
categories: [snacky/slane]
time: 30
active: 10
servings: 3
difficulty: 1
tags: [snack, lacne, deti]
spicy: 0
keeps: { fridge: 3 }
ingredients:
  - kel: 250 g | bez stoniek, na veľké kusy
  - olivovy-olej: 1,5 pl
  - vyzivne-drozdie: 2 pl
  - udena-paprika: 1/2 čl
  - sol: 1/2 čl
steps:
  - Kel umy a úplne osuš – mokrý nebude chrumkať.
  - Rukami ho premasíruj s olejom, droždím, paprikou a soľou.
  - Rozlož na dva plechy v jednej vrstve a peč na 140 °C 18–22 minút, kým nie je chrumkavý. Sleduj ho, rýchlo zhnedne.
