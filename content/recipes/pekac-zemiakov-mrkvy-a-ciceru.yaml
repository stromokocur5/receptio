title: Pekáč zemiakov, mrkvy a cíceru s cesnakovým jogurtom
description: Všetko nakrájaš, premiešaš s olejom a paprikou a rúra to upečie do chrumkava. K tomu studený cesnakový jogurt. Minimum práce, jeden riad a sýty obed pre celú rodinu.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/rura]
time: 50
active: 15
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, deti, vela-bielkovin]
keeps: { fridge: 3 }
ingredients:
  - zemiaky: 1,4 kg
  - mrkva: 6 ks
  - cibula: 2 ks
  - cicer-sterilizovany: 3 ks | scedený
  - olej: 5 pl
  - sladka-paprika: 2 čl
  - udena-paprika: 1 čl
  - rasca: 1 čl
  - sol: 2 čl
  - sojovy-jogurt: 500 g | nesladený
  - cesnak: 2 ks
  - citron: 1 pl | šťava
  - petrzlenova-vnat: 2 pl | nasekaná
steps:
  - Rúru predhrej na 220 °C. Priprav dva plechy s papierom na pečenie – na jednom by sa zelenina dusila namiesto pečenia.
  - Zemiaky dobre umy a nakrájaj na kocky asi 3 cm, šúpať ich netreba. Mrkvu nakrájaj na hrubé hranolky, cibuľu na mesiačiky. Cícer osuš utierkou, aby chrumkal.
  - Vo veľkej miske premiešaj zeleninu a cícer s olejom, oboma paprikami, rascou a 1,5 lyžičky soli. Rozlož na plechy v jednej vrstve.
  - Peč 35–40 minút. V polovici zeleninu premiešaj a plechy vymeň, aby sa piekli rovnako. Hotová je, keď sú zemiaky na okrajoch hnedé a vnútri mäkké.
  - Medzitým zmiešaj jogurt s prelisovaným cesnakom, citrónovou šťavou, zvyšnou soľou a vňaťou. Nechaj ho v chladničke.
  - Podávaj horúcu zeleninu s lyžicou studeného jogurtu.
tips:
  - Ak máš len jeden plech, peč na dvakrát. Prvú dávku drž v teple pod alobalom.
