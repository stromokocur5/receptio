title: Kapustové fliačky s karamelizovanou kapustou
description: Slovenská klasika z troch lacných vecí – kapusty, cibule a cestovín. Celé tajomstvo je v trpezlivosti, kapusta sa musí pomaly opiecť dozlatista, až kým nie je sladká.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/cestoviny]
time: 40
active: 25
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, klasika, deti]
keeps: { fridge: 3 }
ingredients:
  - biela-kapusta: 1000 g
  - sol: 2 čl
  - olej: 4 pl
  - cibula: 2 ks
  - cukor: 1 čl
  - cierne-korenie: 1/2 čl
  - cestoviny: 600 g | fliačky alebo široké rezance
  - sol: ~1 pl | do vody na cestoviny
steps:
  - Kapustu nakrájaj na štvorčeky asi 2 cm. V miske ju premiešaj s 1 lyžičkou soli a nechaj 10 minút postáť, pustí vodu a rýchlejšie sa opečie. Potom ju vytlač rukami.
  - Cibuľu nakrájaj nadrobno. V širokom hrnci alebo panvici zohrej olej na strednom ohni a cibuľu opekaj 5 minút.
  - Pridaj cukor a kapustu. Opekaj odokryté 20 minút a miešaj každé 2–3 minúty, kým kapusta nezmäkne a nezhnedne do karamelova. Ak sa začne pripaľovať, stíš oheň a prilej lyžicu vody.
  - Medzitým priveď do varu veľký hrniec vody, osoľ ju a var cestoviny podľa obalu, zvyčajne 8–10 minút. Sceď ich.
  - Cestoviny zmiešaj s kapustou, okoreň a dosoľ zvyšnou soľou podľa chuti.
tips:
  - Kto chce, posype si porciu opraženými slnečnicovými semienkami – pribudnú bielkoviny aj chrumkavosť.
