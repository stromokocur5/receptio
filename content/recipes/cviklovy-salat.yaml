title: Pečená cvikla s jablkom a orechmi
description: Teplý jesenný šalát z pečenej cvikly, kyslého jablka a vlašských orechov s javorovo-horčicovým dresingom.
cuisine: slovenska
meals: [obed, vecera, snack]
categories: [salaty/syte]
time: 60
active: 15
servings: 4
difficulty: 1
tags: [meal-prep, do-krabicky]
keeps: { fridge: 4 }
leftovers: 'Rozmixuj zvyšnú cviklu s cícerom – vznikne cviklový hummus.'
ingredients:
  - cvikla: 4 ks
  - olivovy-olej: 3 pl
  - jablko: 1 ks | kyslé, na tenké plátky
  - vlasske-orechy: 1/2 hrnček | opražené
  - salat: 1/2 ks | alebo rukola
  - horcica: 1 čl
  - javorovy-sirup: 1 pl
  - ocot: 1 pl
  - sol: 1/2 čl
  - petrzlenova-vnat: 2 pl
steps:
  - Rúru predhrej na 200 °C. Cviklu umy, každú zabaľ do alobalu a peč 45 minút, kým nie je mäkká (vidlička prejde ľahko).
  - Nechaj ju vychladnúť, ošúp (v rukaviciach, farbí) a nakrájaj na mesiačiky.
  - Dresing – vyšľahaj olej, horčicu, sirup, ocot a soľ.
  - Na šalát poukladaj cviklu, jablko a orechy, polej dresingom a posyp vňaťou.
tips:
  - Upeč cviklu na celý týždeň naraz, v chladničke vydrží 5 dní.
  - Ponáhľaš sa? Kúp uvarenú cviklu vo vákuu.
