title: Andský quinoa šalát
description: Sýty šalát z quinoy, fazule a kukurice s limetkovým dresingom. Ideálny do krabičky.
cuisine: peruanska
meals: [obed, vecera]
time: 25
active: 15
servings: 4
difficulty: 1
tags: [meal-prep, do-krabicky]
spicy: 1
keeps: { fridge: 4 }
leftovers: 'Čím dlhšie stojí, tým je chutnejší – ideálny do krabičky.'
ingredients:
  - quinoa: 200 g | prepláchnutá
  - voda: 2 hrnček
  - fazula-cierna: 1 ks
  - kukurica: 1 ks
  - paprika-cervena: 1 ks | na kocky
  - cibula-cervena: 1/2 ks | nadrobno
  - avokado: 1 ks
  - limetka: 2 ks
  - olivovy-olej: 2 pl
  - kmin: 1 čl
  - bylinky-koriander: 4 pl
  - sol: 1 čl
steps:
  - Quinou prepláchni, inak horkne, a var ju vo vode 15 minút. Nechaj vychladnúť.
  - Dresing zo šťavy z limetiek, oleja, kmínu a soli vyšľahaj.
  - Zmiešaj quinou, fazuľu, kukuricu, papriku, cibuľu a koriander a polej dresingom.
  - Avokádo pridaj až pred podávaním.
tips:
  - V chladničke vydrží 3 dni. Avokádo daj do krabičky zvlášť.
variants:
  - name: Viac bielkovín
    description: 'Pridaj opečené údené tofu na kocky.'
    add:
      - tofu-udene: 150 g | na kocky, opečené
