title: Karfiolové rezne z rúry so zemiakovým šalátom
description: Obľúbený vyprážaný karfiol bez vajec a bez fritovania. Obalený v chrumkavej strúhanke a upečený v rúre.
cuisine: slovenska
meals: [obed, vecera]
time: 45
active: 20
servings: 4
difficulty: 2
tags: [klasika, deti]
keeps: { fridge: 2 }
leftovers: 'Prehrej v rúre na 200 °C, v mikrovlnke zmäkne.'
related: [zemiakovy-salat]
ingredients:
  - karfiol: 1 ks | na väčšie ružičky
  - hladka-muka: 1/2 hrnček
  - sojove-mlieko: 1 hrnček
  - horcica: 1 čl
  - sladka-paprika: 1 čl
  - sol: 1,5 čl
  - struhanka: 1,5 hrnček
  - olej: 4 pl
  - citron: 1 ks | na podávanie
steps:
  - Rúru predhrej na 220 °C. Karfiol var v osolenej vode 4 minúty, aby bol na skus, a nechaj odpariť.
  - Cestíčko – v miske vyšľahaj múku, sójové mlieko, horčicu, papriku a soľ. Má byť husté ako na palacinky.
  - Strúhanku zmiešaj s olejom v druhej miske.
  - Každú ružičku namoč do cestíčka, obaľ v strúhanke a poukladaj na plech s papierom.
  - Peč 20 minút, v polovici otoč, kým nie sú zlaté. Podávaj s citrónom a zemiakovým šalátom.
tips:
  - Rovnako obalíš aj plátky zelera alebo hlivu.
