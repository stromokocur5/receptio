title: Ovsené tyčinky s orechmi
description: Tyčinky na cesty a do batohu – vločky, arašidové maslo, datle a semienka. Bez pečenia, rozpadnúť sa nedajú.
cuisine: moderna
meals: [snack, ranajky]
categories: [snacky/na-cesty, snacky/sladke]
time: 15
active: 15
servings: 10
difficulty: 1
tags: [bez-varenia, do-krabicky, deti, meal-prep]
ahead: V chladničke stuhnú za hodinu.
keeps: { fridge: 14, freezer: 3 }
ingredients:
  - ovsene-vlocky: 2 hrnček
  - datle: 12 ks
  - arasidove-maslo: 6 pl
  - javorovy-sirup: 3 pl
  - tekvicove-semienka: 3 pl
  - slnecnicove-semienka: 3 pl
  - horka-cokolada: 40 g | nasekaná
  - sol: 1 štipka
steps:
  - Datle rozmixuj s arašidovým maslom, sirupom a soľou na lepkavú pastu. Ak sú datle tvrdé, namoč ich na 10 minút do horúcej vody.
  - Primiešaj vločky, semienka a čokoládu a rukami dobre prehneť.
  - Hmotu pevne natlač do formy vystlanej papierom, asi 2 cm vysoko. Nechaj hodinu v chladničke a nakrájaj na 10 tyčiniek.
tips:
  - Pevne natláčaj – na tom záleží, či sa budú drobiť.
  - Pri celiakii certifikované bezlepkové vločky.
