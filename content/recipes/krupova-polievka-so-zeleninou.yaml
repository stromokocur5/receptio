title: Krúpová polievka so zeleninou a šampiňónmi
description: Hustá polievka z krúp, koreňovej zeleniny a zemiakov ako od babky. Krúpy patria k najlacnejším obilninám, majú veľa vlákniny a polievka udrží sýtych celé popoludnie.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/zeleninove]
time: 55
active: 15
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, polievka, klasika, meal-prep]
keeps: { fridge: 4, freezer: 3 }
ingredients:
  - krupy: 150 g
  - voda: 2,2 l
  - bobkovy-list: 2 ks
  - olej: 2 pl
  - cibula: 1 ks
  - mrkva: 3 ks
  - petrzlen-koren: 2 ks
  - sampinony: 250 g
  - cesnak: 2 ks
  - zemiaky: 300 g
  - sol: 2,5 čl
  - majoranka: 1 čl
  - cierne-korenie: 1/4 čl
  - petrzlenova-vnat: 2 pl | nasekaná
steps:
  - Krúpy prepláchni v sitku, kým voda nie je číra. V hrnci ich zalej vodou, pridaj bobkový list a var na miernom ohni 20 minút.
  - Medzitým nakrájaj cibuľu nadrobno, mrkvu a petržlen na kolieska, šampiňóny na plátky a zemiaky na kocky.
  - Na panvici zohrej olej na strednom ohni. Cibuľu a šampiňóny opekaj 6–7 minút, kým huby nepustia vodu a nezačnú hnednúť. Pridaj prelisovaný cesnak na 30 sekúnd.
  - Obsah panvice, mrkvu, petržlen, zemiaky a soľ pridaj ku krúpam. Var ďalších 20 minút, kým krúpy aj zemiaky nezmäknú.
  - Vmiešaj majoránku rozdrvenú medzi dlaňami a korenie, posyp vňaťou. Ak je hustá, prilej vodu a ochutnaj soľ.
tips:
  - Krúpy v polievke ďalej napučiavajú. Na druhý deň ju zrieď vodou.
