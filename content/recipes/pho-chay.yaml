title: Pho chay – vietnamská rezancová polievka
description: Hlboký vývar z opálenej cibule, zázvoru, badiánu a húb s rezancami, tofu a kopou čerstvých byliniek. Víkendový projekt, ktorý stojí za to.
cuisine: vietnamska
meals: [obed, vecera]
time: 90
active: 30
servings: 4
difficulty: 3
tags: [polievka]
spicy: 1
keeps: { fridge: 3, freezer: 3 }
leftovers: 'Vývar zamraz zvlášť, rezance a bylinky pridaj čerstvé.'
ingredients:
  - cibula: 2 ks | prekrojená na polovice, neošúpaná
  - zazvor: 60 g | na hrubé plátky
  - badian: 4 ks
  - skorica: 1 čl | ideálne celá tyčinka
  - klincek: 4 ks
  - koriander-mlety: 1 čl | ideálne celé semienka
  - susene-huby: 20 g | shiitake alebo hríby
  - mrkva: 2 ks | na veľké kusy
  - voda: 8 hrnček
  - tamari: 4 pl
  - javorovy-sirup: 1 čl
  - sol: 1/2 čl
  - ryzove-rezance: 300 g | ploché
  - tofu-natural: 300 g | na plátky
  - olej: 1 pl
  - sampinony: 150 g | na tenké plátky
  - klicky: 1 hrnček
  - bazalka: 1/2 hrnček
  - bylinky-koriander: 4 pl
  - jarna-cibulka: 3 ks
  - limetka: 2 ks
  - sriracha: 2 pl | podľa chuti
steps:
  - Cibuľu a zázvor opaľuj reznou plochou nadol na suchej panvici na strednom až vysokom ohni 8–10 minút, kým nie sú miestami čierne. Z toho je farba a dymová chuť vývaru.
  - V suchom hrnci na strednom ohni 1 minútu opraž badián, škoricu, klinčeky a koriander, kým nezavoňajú.
  - Pridaj cibuľu, zázvor, sušené huby, mrkvu a vodu. Priveď do varu a hodinu jemne var pod pokrievkou. Nesmie prudko vrieť, inak sa zakalí.
  - Vývar preceď a dochuť tamari, sirupom a soľou. Má byť o trochu slanší, než sa zdá, rezance ho zriedia.
  - Rezance namoč podľa obalu, tofu opeč na oleji na strednom ohni dozlatista.
  - Do misiek daj rezance, tofu a surové plátky húb a zalej ich vriacim vývarom – huby sa v ňom uvaria.
  - Na stôl daj klíčky, bylinky, cibuľku, limetku a srirachu – každý si dochutí sám.
tips:
  - Vývar sa dá uvariť deň vopred a zamraziť, potom je pho hotové za 15 minút.
