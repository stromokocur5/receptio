title: Keralský zeleninový stew
description: Jemný biely stew zo zeleniny v kokosovom mlieku s celými koreninami, zázvorom a kari listami. Podáva sa k appam alebo ryži.
cuisine: indicka-juh
meals: [obed, vecera]
categories: [hlavne/kari]
time: 35
active: 15
servings: 4
difficulty: 1
tags: [one-pot, deti]
spicy: 0
keeps: { fridge: 3, freezer: 2 }
ingredients:
  - kokosovy-olej: 2 pl
  - skorica: 1/4 čl
  - klincek: 3 ks
  - kardamom: 1/4 čl
  - cierne-korenie: 1/2 čl
  - cibula: 1 ks | na mesiačiky
  - zazvor: 1 pl | na tenké prúžky
  - cili-papricka: 2 ks | pozdĺžne rozrezané
  - kari-listy: 10 ks
  - zemiaky: 3 ks | na kocky
  - mrkva: 2 ks | na kolieska
  - zelene-fazulky: 150 g
  - hrasok: 1/2 hrnček
  - kokosove-mlieko: 400 ml
  - voda: 250 ml
  - sol: 1 čl
  - ryza-basmati: 300 g
steps:
  - Na kokosovom oleji na strednom ohni krátko opraž korenie, pridaj cibuľu, zázvor, papričky a kari listy a 5 minút speň – cibuľa má ostať svetlá.
  - Pridaj zemiaky, mrkvu, fazuľky, vodu, polovicu kokosového mlieka a soľ. Prikry a var na miernom ohni 15 minút.
  - Pridaj hrášok a zvyšok mlieka a len prehrej, nevar. Podávaj s ryžou.
