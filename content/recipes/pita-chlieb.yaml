title: Pita chlieb s vreckom
description: Mäkké arabské placky, ktoré sa v horúcej rúre nafúknu a spravia vrecko na plnenie. Šesť surovín a jedno kysnutie.
cuisine: libanonska
meals: [domace]
categories: [prilohy/chlieb, domace/zaklady]
time: 120
active: 30
servings: 8
difficulty: 2
tags: [urob-si-sam, meal-prep]
gf_swap: false
yields: 8 pít s priemerom asi 15 cm
keeps: { fridge: 3, freezer: 3 }
leftovers: 'Staršiu pitu nakrájaj na trojuholníky a upeč s olejom na chipsy, alebo ju natrhaj do šalátu fattoush.'
related: [pita-chipsy, sabich-pita, hummus]
howto: [kysnute-cesto]
ingredients:
  - hladka-muka: 500 g | a trochu na podsypanie
  - drozdie: 1 ks | 7 g sušeného
  - cukor: 1 čl
  - voda: 300 ml | vlažná
  - olivovy-olej: 2 pl
  - sol: 1,5 čl
steps:
  - Múku zmiešaj s droždím, cukrom a soľou. Prilej vlažnú vodu a olej a mies rukou 8–10 minút (alebo 5 minút robotom), kým cesto nie je hladké, pružné a nelepí sa na ruky.
  - Misu prikry utierkou a nechaj cesto kysnúť na teplom mieste 60 minút, kým zdvojnásobí objem.
  - Rúru aj s plechom v dolnej tretine rozohrej na 250 °C – plech musí byť rozpálený, inak sa pity nenafúknu. Rozohrievaj aspoň 20 minút.
  - Cesto rozdeľ na 8 rovnakých kúskov a z každého urob guľku. Na pomúčenej doske ich rozvaľkaj na placky hrubé asi 5 mm s priemerom 15 cm. Valkaj rovnomerne, bez tenkých okrajov. Prikry utierkou a nechaj 10 minút odpočívať.
  - Po 2–3 placky rýchlo prelož na rozpálený plech a peč 4–6 minút. Po 2–3 minútach sa nafúknu ako balón. Vyber ich, kým sú ešte svetlé, len s pár zlatými škvrnami – dlhšie pečené stvrdnú.
  - Horúce pity ulož na seba a prikry utierkou. Para ich zmäkčí a ostanú ohybné. Na plnenie ich prekroj na polovice a vrecko opatrne otvor.
tips:
  - Nenafúkla sa? Najčastejšie bol plech málo horúci, placka príliš tenká alebo mala dierku. Chutiť bude aj tak – použi ju ako placku na zavinutie.
  - Bez rúry – suchú ťažkú panvicu rozpáľ na veľkom ohni a peč placku 30 sekúnd z prvej strany, 1–2 minúty z druhej a ešte minútu z prvej, kým sa nafúkne.
  - Do mrazničky ukladaj vychladnuté pity vo vrecku. Rozmrazíš ich za minútu na panvici alebo v hriankovači.
