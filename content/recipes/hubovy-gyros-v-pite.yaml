title: Hubový gyros v pite s tzatziki
description: Šampiňóny opečené s oreganom, kmínom a údenou paprikou, v teplej pite s cesnakovým jogurtovým tzatziki, paradajkou a cibuľou. Za 25 minút.
cuisine: grecka
meals: [obed, vecera]
categories: [comfort/kebab, hlavne/zelenina]
time: 25
active: 25
servings: 3
difficulty: 1
tags: [rychle, lacne]
spicy: 0
keeps: { fridge: 2 }
leftovers: 'Huby a tzatziki drž zvlášť, pitu plň až pred jedlom.'
ingredients:
  - sampinony: 500 g | na hrubšie plátky
  - olivovy-olej: 2 pl
  - udena-paprika: 1 čl
  - oregano: 1 čl
  - kmin: 1/2 čl
  - sol: 1/2 čl | na huby
  - cierne-korenie: 1/4 čl
  - citron: 1 pl | šťava
  - sojovy-jogurt: 200 g | nesladený
  - uhorka: 1/2 ks | nastrúhaná
  - cesnak: 2 ks | prelisovaný
  - pita: 3 ks
  - paradajky: 2 ks | na plátky
  - cibula: 1/2 ks | červená, na tenké pásiky
steps:
  - Uhorku nastrúhaj, vytlač z nej rukami vodu a zmiešaj s jogurtom, cesnakom a štipkou soli – to je tzatziki.
  - Vo veľkej panvici rozohrej olej na veľkom ohni a huby opekaj 8 minút, prvé 3 minúty bez miešania, kým nezhnednú a voda sa neodparí.
  - Stiahni oheň, posyp paprikou, oreganom, kmínom, soľou a korením a minútu miešaj. Pokvapkaj citrónom.
  - Pity zohrej na suchej panvici alebo v hriankovači 1 minútu, kým nezmäknú.
  - Pity rozkroj, potri tzatziki a naplň hubami, paradajkou a cibuľou.
tips:
  - Namiesto pity sa hodí tortilla alebo ryža s miskou šalátu.
