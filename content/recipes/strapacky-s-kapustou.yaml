title: Strapačky s kapustou a údeným tofu
description: Halušky z domáceho zemiakového cesta s dusenou kyslou kapustou a údeným tofu ako slaninkou.
cuisine: slovenska
meals: [obed, vecera]
time: 45
active: 35
servings: 4
difficulty: 2
tags: [klasika]
gf_swap: false
keeps: { fridge: 2 }
leftovers: 'Opeč na panvici na troche oleja, až kým sa neprichytia.'
ingredients:
  - olej: 3 pl
  - cibula: 1 ks | nadrobno
  - tofu-udene: 200 g | na drobné kocky
  - kysla-kapusta: 500 g
  - rasca: 1/2 čl
  - zemiaky: 5 ks | surové, ošúpané
  - hladka-muka: 250 g | ideálne polohrubá
  - sol: 1 čl
  - cierne-korenie: podľa chuti
steps:
  - Na oleji na strednom ohni opeč tofu a cibuľu dochrumkava. Polovicu daj bokom na posypanie.
  - Kapustu (ak je veľmi kyslá, prepláchni ju) pridaj k zvyšku, posyp rascou a duste na miernom ohni 10–15 minút.
  - Zemiaky nastrúhaj najjemnejšie, zmiešaj s múkou a soľou na husté lepkavé cesto.
  - Vo veľkom hrnci priveď do varu osolenú vodu. Cesto pretláčaj cez haluškár (alebo z dosky odkrajuj nožom).
  - Keď halušky vyplávajú, var ich ešte minútu, vyber dierovanou naberačkou a hneď zmiešaj s kapustou.
  - Posyp chrumkavým tofu a korením.
tips:
  - Na bezlepkové halušky nestačí ryžová múka – použi hotovú bezlepkovú zmes a pridaj lyžicu škrobu.
