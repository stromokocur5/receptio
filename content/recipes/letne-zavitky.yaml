title: Letné závitky s arašidovou omáčkou
description: Vietnamské čerstvé závitky plné bylín a tofu s návykovou arašidovou omáčkou.
cuisine: vietnamska
meals: [obed, vecera, snack]
categories: [snacky/party, hlavne/plnene]
time: 40
active: 35
servings: 3
difficulty: 2
tags: [bez-varenia, party]
spicy: 1
keeps: { fridge: 1 }
leftovers: 'Zvyšnú zeleninu a rezance zamiešaj s arašidovou omáčkou na šalát.'
ingredients:
  - ryzove-rezance: 100 g
  - tofu-natural: 200 g | na prúžky
  - uhorka: 1 ks | na tenké prúžky
  - mrkva: 2 ks | na tenké prúžky
  - salat: 1/2 ks
  - bylinky-mata: 4 pl | celé lístky
  - bylinky-koriander: 4 pl
  - ryzovy-papier: 12 ks
  - arasidove-maslo: 4 pl
  - tamari: 2 pl
  - limetka: 1 ks
  - javorovy-sirup: 1 pl
  - cesnak: 1 ks
  - voda: 3 pl
  - cili: 1 štipka
steps:
  - Rezance zalej vriacou vodou na 5 minút, sceď a prepláchni studenou.
  - Tofu opeč na nepriľnavej panvici na strednom ohni nasucho alebo s kvapkou oleja dozlatista.
  - Omáčka. Arašidové maslo rozmiešaj s tamari, limetkou, sirupom, prelisovaným cesnakom, čili a vodou do hladka.
  - List ryžového papiera ponor na 3 sekundy do vlažnej vody a polož na vlhkú utierku.
  - Do spodnej tretiny daj šalát, rezance, zeleninu, tofu a bylinky, prelož boky a pevne zroluj.
tips:
  - Papier zmäkne až na doske, nenamáčaj ho dlhšie, inak sa trhá.
  - Hotové závitky prikry vlhkou utierkou, aby nevyschli.
