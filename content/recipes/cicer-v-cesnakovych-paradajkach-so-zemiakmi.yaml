title: Cícer v cesnakových paradajkách s chrumkavými zemiakmi
description: Kopa čerstvých paradajok rozvarená s cesnakom a údenou paprikou do hustej sladkokyslej omáčky, v nej cícer, a navrch chrumkavé zemiaky z panvice. Ako shakshuka, len sýtejšia a bez vajec.
cuisine: moderna
meals: [obed, vecera, ranajky]
categories: [hlavne/strukoviny, hlavne/zelenina]
time: 35
active: 30
servings: 2
difficulty: 1
tags: [rychle]
keeps: { fridge: 3 }
ingredients:
  - zemiaky: 3 ks
  - olej: 4 pl | 2 na zemiaky, 2 na paradajky
  - sol: 1 čl
  - cibula: 1 ks
  - cesnak: 5 ks
  - paradajky: 6 ks | zrelé, asi 750 g
  - udena-paprika: 1 čl
  - kmin: 1/2 čl | nepovinné
  - cukor: 1/2 čl
  - cicer-sterilizovany: 1 ks | plechovka
  - ocot: 1 čl
  - petrzlenova-vnat: 3 pl
  - cierne-korenie: 1 štipka
steps:
  - Zemiaky ošúp a nakrájaj na kocky 1,5 cm. Na panvici rozohrej 2 PL oleja na strednom ohni, pridaj zemiaky, štipku soli a 3 PL vody, prikry a nechaj 7 minút. Potom zlož pokrievku a opekaj 8–10 minút, kým nie sú zlaté a chrumkavé. Vyber na tanier.
  - Medzitým paradajky nakrájaj na kocky (šupku nechaj, rozvarí sa), cibuľu nadrobno, cesnak na plátky.
  - Do tej istej panvice daj 2 PL oleja a cibuľu a restuj 5 minút. Pridaj cesnak a minútu miešaj, kým nezačne voňať. Odstav, vmiešaj údenú papriku a kmín.
  - Pridaj paradajky, 1/2 ČL soli a cukor a var na strednom ohni bez pokrievky 12–15 minút, občas premiešaj a roztlač varechou. Omáčka má zhustnúť tak, že keď ňou prejdeš varechou, chvíľu ostane stopa. Čerstvé paradajky sú z väčšiny voda – až keď sa odparí, začnú chutiť ako paradajky.
  - Pridaj scedený prepláchnutý cícer, var 3 minúty, vmiešaj ocot, ochutnaj a dosoľ. Navrch daj chrumkavé zemiaky, vňať a korenie a jedz rovno z panvice.
tips:
  - Zemiaky daj navrch až pri podávaní, v omáčke by zmäkli.
