title: Agua de sandía
description: Vodový melón rozmixovaný s limetkou a mätou. Najrýchlejšia letná limonáda – melón je sladký sám.
cuisine: mexicka
meals: [snack]
categories: [napoje/limonady]
time: 5
active: 5
servings: 4
difficulty: 1
tags: [rychle, bez-varenia, deti, party]
ingredients:
  - melon: 1 kg | dužina bez kôry
  - limetka: 1 ks
  - bylinky-mata: 1 pl
  - voda: 2 hrnček | studená
steps:
  - Melón rozmixuj dohladka, semienka nevadia – potom ich zachytí sitko.
  - Preceď, dolej vodou a dochuť limetkou. Sladiť zvyčajne netreba.
  - Podávaj s ľadom a mätou.
tips:
  - Zmrazené kocky melóna namiesto ľadu nápoj nezriedia.
