title: Zeleninové thieboudienne
description: Senegalská národná ryža varená v paradajkovom vývare so zeleninou – kapusta, mrkva, baklažán a batát – a korenistou petržlenovou plnkou.
cuisine: zapadoafricka
meals: [obed, vecera]
categories: [hlavne/ryza]
time: 75
active: 30
servings: 4
difficulty: 2
tags: [one-pot, party]
spicy: 1
keeps: { fridge: 3, freezer: 2 }
ingredients:
  - petrzlenova-vnat: 4 pl
  - cesnak: 4 ks
  - cili-papricka: 1 ks
  - olej: 3 pl
  - cibula: 2 ks
  - paradajkovy-pretlak: 3 pl
  - zeleninovy-vyvar: 1,2 l
  - biela-kapusta: 300 g | na 4 mesiačiky
  - mrkva: 3 ks | pozdĺžne na polky
  - baklazan: 1 ks | na veľké kusy
  - batat: 1 ks | na veľké kusy
  - tamarind: 1 pl
  - sol: 1 čl
  - ryza-basmati: 300 g
  - limetka: 1 ks
steps:
  - Petržlen, cesnak a papričku rozmixuj na zelenú pastu (rof).
  - Na oleji na strednom ohni speň cibuľu 8 minút, pridaj pretlak a polovicu rofu a 3 minúty restuj.
  - Pridaj vývar, tamarind, soľ a zeleninu a var na miernom ohni 25 minút, kým nezmäkne. Zeleninu vyber a udržuj v teple.
  - Do vývaru nasyp ryžu (má byť prikrytá asi 1 cm tekutiny, prípadne odober), prikry a var na miernom ohni 20 minút.
  - Ryžu vyklop na veľký tanier, navrch naukladaj zeleninu a zvyšný rof. Podávaj s limetkou – jedáva sa spolu z jedného taniera.
