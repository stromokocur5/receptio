title: Tortilly s tofu praženicou a paprikou
description: Rozdrobené tofu s cibuľou, paprikou a paradajkami, dochutené tak, že pripomína vajíčkovú praženicu. Zabalené v tortille sú to raňajky za 20 minút, ktoré zasýtia aj pubertiaka.
cuisine: moderna
meals: [ranajky, vecera]
categories: [ranajky/slane]
time: 20
active: 20
servings: 7
difficulty: 1
tags: [nasarodinka, rychle, vela-bielkovin, tortilla-na-tyzden]
ingredients:
  - tofu-natural: 600 g
  - cibula: 1 ks
  - paprika-cervena: 2 ks
  - paradajky: 3 ks
  - olej: 2 pl
  - kurkuma: 1/2 čl
  - sladka-paprika: 1 čl
  - sojova-omacka: 2 pl
  - vyzivne-drozdie: 2 pl
  - cierne-korenie: 1/4 čl
  - psenicne-tortilly: 7 ks
steps:
  - Cibuľu nakrájaj nadrobno, papriku a paradajky na kocky. Tofu sceď a otri utierkou.
  - Na veľkej panvici zohrej olej na strednom ohni. Cibuľu opekaj 3 minúty, pridaj papriku a opekaj ďalšie 3 minúty.
  - Tofu rozdrob rukami priamo do panvice na hrudky ako praženicu. Pridaj kurkumu a papriku a opekaj 5 minút bez veľkého miešania, kým sa voda neodparí a tofu nezačne na spodku zlatnúť.
  - Vmiešaj sójovú omáčku a výživné droždie – dajú praženici slanú, syrovú chuť. Pridaj paradajky a korenie a ohrej ešte minútu.
  - Tortilly zohrej po jednej na suchej panvici, 20 sekúnd z každej strany. Naplň ich praženicou a zroluj.
tips:
  - Kto nechce tortillu, zje praženicu s chlebom.
