title: Sviečková na smotane s knedľou
description: Hladká zeleninová omáčka z mrkvy, petržlenu a cibule, sladkokyslá, s kyslými bobuľami a smotanou. Plátky údeného tofu a kysnutá knedľa – nedeľa ako má byť.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/kari, hlavne/tofu]
time: 90
active: 35
servings: 4
difficulty: 2
tags: [klasika, vela-bielkovin]
ahead: Tofu marinuj cez noc v octe, sójovej omáčke a korení – nasiakne chuťou pečene.
keeps: { fridge: 3, freezer: 3 }
leftovers: 'Omáčku zamraz, knedľu tiež. Rozmrazená omáčka sa môže trochu oddeliť – rozmixuj ju.'
related: [knedla-kysnuta]
ingredients:
  - tofu-udene: 360 g
  - sojova-omacka: 1 pl
  - ocot: 2 pl
  - olej: 3 pl
  - mrkva: 3 ks
  - petrzlen-koren: 2 ks
  - cibula: 2 ks
  - bobkovy-list: 3 ks
  - nove-korenie: 5 ks
  - cierne-korenie: 1/2 čl | celé
  - tymian: 1/2 čl
  - horcica: 1 čl
  - cukor: 1 pl
  - zeleninovy-vyvar: 3 hrnček
  - rastlinna-smotana: 1 hrnček | na varenie
  - citron: 1/2 ks
  - ribezle-cervene: 3 pl | alebo brusnice, voliteľne
  - hladka-muka: 250 g | na knedľu
  - drozdie: 1 čl | sušené, na knedľu
  - sojove-mlieko: 150 ml | vlažné, na knedľu
  - sol: 1/2 čl | do knedle
steps:
  - Knedľa. Múku zmiešaj s droždím a soľou, prilej vlažné mlieko a vypracuj mäkké hladké cesto. Prikry a nechaj hodinu kysnúť.
  - Tofu nakrájaj na hrubšie plátky a pokvapkaj sójovou omáčkou a 1 PL octu.
  - Mrkvu, petržlen a cibuľu nakrájaj na kúsky a opekaj na 2 PL oleja na strednom ohni 10 minút, kým nezačnú hnednúť.
  - Pridaj bobkový list, nové a čierne korenie, tymian a cukor a nechaj 2 minúty karamelizovať.
  - Zalej vývarom, pridaj zvyšný ocot a dus prikryté na miernom ohni 40 minút do úplnej mäkkosti.
  - Medzitým z vykysnutého cesta vytvaruj valček, nechaj 10 minút podkysnúť a var vo vriacej osolenej vode 10 minút, otoč a var ďalších 10 minút. Hneď prepichni vidličkou.
  - Vyber bobkový list a korenie, pridaj smotanu a horčicu a rozmixuj dohladka. Dochuť citrónom, cukrom a soľou – má byť jemne sladkokyslá.
  - Plátky tofu opeč na zvyšnom oleji z oboch strán dozlatista.
  - Knedľu nakrájaj niťou na plátky. Na tanier daj knedľu, tofu, polej omáčkou a navrch lyžicu ríbezlí alebo brusníc a plátok citróna.
tips:
  - Omáčka musí byť naozaj hladká. Ak nemáš ponorný mixér, pretri ju cez sito.
