title: Hubové bolonské špagety
description: Šampiňóny nasekané nadrobno a opečené dohneda ako mleté mäso, dusené s passatou, mrkvou a oreganom. Klasická bolonská za pol hodiny.
cuisine: talianska
meals: [obed, vecera]
categories: [hlavne/cestoviny]
time: 35
active: 30
servings: 4
difficulty: 1
tags: [rychle, lacne, deti, do-krabicky, meal-prep]
spicy: 0
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Omáčku zamraz zvlášť, cestoviny uvar čerstvé.'
ingredients:
  - sampinony: 500 g
  - olivovy-olej: 3 pl
  - cibula: 1 ks | nadrobno
  - mrkva: 1 ks | nastrúhaná najemno
  - cesnak: 3 ks | nasekaný
  - paradajkovy-pretlak: 2 pl
  - sojova-omacka: 1 pl
  - passata: 500 g
  - oregano: 1 čl
  - sol: 1/2 čl
  - cierne-korenie: 1/4 čl
  - cestoviny: 400 g | špagety
  - bazalka: 3 pl | čerstvá, nepovinné
steps:
  - Huby nasekaj nadrobno nožom, alebo ich pulzne nasekaj v sekáčiku na kúsky veľkosti hrášku – nie na kašu.
  - Vo veľkej panvici rozohrej 2 PL oleja na veľkom ohni a huby opekaj 10 minút. Najprv pustia vodu, nechaj ju celú odpariť, potom ich opekaj, kým nezhnednú a nezačnú sa lepiť na dno.
  - Stiahni oheň na stredný, pridaj zvyšný olej, cibuľu a mrkvu a opekaj 5 minút. Pridaj cesnak a pretlak a 1 minútu miešaj.
  - Vlej sójovú omáčku a passatu, pridaj oregano, soľ a korenie a var 10 minút na miernom ohni.
  - Medzitým uvar cestoviny v osolenej vode podľa obalu, zvyčajne 8–10 minút, a sceď.
  - Podávaj omáčku na cestovinách s natrhanou bazalkou.
tips:
  - Sójová omáčka a dohneda opečené huby dávajú omáčke mäsovú chuť – oba kroky neskracuj.
  - Bezlepková verzia – bezlepkové cestoviny a tamari.
