title: Jahodovo-banánové smoothie
description: Klasika z jahôd, banánu a ovsených vločiek. Sýte na raňajky, zamrazené jahody ho spravia hustým.
cuisine: moderna
meals: [ranajky, snack]
categories: [napoje/smoothie, ranajky/kase]
time: 5
active: 5
servings: 2
difficulty: 1
tags: [rychle, bez-varenia, deti, ranajky]
ingredients:
  - jahody: 2 hrnček | aj mrazené
  - banan: 1 ks
  - ovsene-vlocky: 3 pl
  - sojove-mlieko: 1 hrnček
  - sojovy-jogurt: 4 pl
  - chia: 1 pl
steps:
  - Všetko rozmixuj dohladka. Vločky a chia smoothie zahustia a zasýtia.
tips:
  - Hnedé bodkované banány sú najsladšie – nakrájaj ich a zamraz na smoothie.
