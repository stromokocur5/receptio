title: Mrkvové hranolky z rúry s ružovou omáčkou
description: Sladké mrkvové hranolky s paprikou, chrumkavé vďaka tenkej vrstve škrobu, a k nim jogurt s kečupom na namáčanie. Snack, ktorý zmizne rýchlejšie ako čipsy.
cuisine: moderna
meals: [snack, obed]
categories: [snacky/slane, prilohy/prilohy]
time: 40
active: 10
servings: 7
difficulty: 1
tags: [nasarodinka, deti, lacne, snack]
ingredients:
  - mrkva: 1,2 kg
  - olej: 3 pl
  - kukuricny-skrob: 2 pl
  - sladka-paprika: 1 čl
  - sol: 1 čl
  - sojovy-jogurt: 300 g | nesladený
  - kecup: 3 pl
steps:
  - Rúru predhrej na 220 °C a dva plechy vystel papierom na pečenie.
  - Mrkvu ošúp a nakrájaj na hranolky hrubé asi 1 cm. Osuš ich utierkou.
  - V miske premiešaj mrkvu s olejom, potom posyp škrobom, paprikou a soľou a premiešaj, kým nie sú všetky obalené.
  - Rozlož ich na plechy v jednej vrstve s rozostupmi – natlačené by sa dusili.
  - Peč 25–30 minút, v polovici ich otoč, kým nie sú na okrajoch hnedé.
  - Jogurt zmiešaj s kečupom a podávaj k horúcim hranolkám.
tips:
  - Mrkva nebude chrumkať ako zemiak, ale okraje sa skaramelizujú a sú sladké.
