title: Cesnakové chrumky zo starých rožkov
description: Kolieska starých rožkov obalené v cesnakovom oleji s paprikou a upečené dochrumkava. Snack na pozeranie filmu, do polievky aj k šalátu, a vrecko rožkov sa nevyhodí.
cuisine: slovenska
meals: [snack]
categories: [snacky/slane]
time: 25
active: 10
servings: 7
difficulty: 1
tags: [nasarodinka, zvysky, lacne, snack, party]
ingredients:
  - rozok: 10 ks | starý
  - olivovy-olej: 6 pl
  - cesnak: 5 ks
  - sol: 1 čl
  - sladka-paprika: 1 čl
  - oregano: 1 čl
steps:
  - Rúru predhrej na 180 °C a dva plechy vystel papierom na pečenie.
  - Rožky nakrájaj na kolieska hrubé asi 1 cm.
  - Vo veľkej mise rozmiešaj olej s prelisovaným cesnakom, soľou, paprikou a oreganom. Pridaj kolieska a rukami premiešaj, kým nie sú všetky obalené.
  - Rozlož ich na plechy v jednej vrstve.
  - Peč 12–15 minút, v polovici premiešaj, kým nie sú zlatisté. Pozor na posledné minúty, cesnak sa rýchlo pripáli.
  - Nechaj vychladnúť na plechu – až vtedy poriadne schrumkavejú.
tips:
  - V uzavretej dóze vydržia chrumkavé 4–5 dní.
