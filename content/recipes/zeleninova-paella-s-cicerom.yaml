title: Zeleninová paella s cícerom a chrumkavou kôrkou
description: Ryža uvarená v panvici v paradajkovom základe s údenou paprikou, s pečenou paprikou, cuketou a cícerom. Na konci sa nechá prihrievať, kým na dne nevznikne chrumkavá kôrka – najlepšia časť.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/ryza]
time: 45
active: 30
servings: 3
difficulty: 2
tags: [zlatica, one-pot]
keeps: { fridge: 3 }
ingredients:
  - olivovy-olej: 4 pl
  - paprika-cervena: 2 ks
  - cuketa: 1 ks
  - cibula: 1 ks
  - cesnak: 4 ks
  - paradajky: 2 ks | nastrúhané, šupka do koša
  - paradajkovy-pretlak: 1 pl
  - udena-paprika: 2 čl
  - kurkuma: 1/2 čl
  - ryza-basmati: 250 g
  - voda: 750 ml | horúca
  - sol: 1,5 čl
  - cicer-sterilizovany: 1 ks | plechovka, scedený
  - hrasok: 100 g | mrazený
  - citron: 1 ks | na mesiačiky
  - petrzlenova-vnat: 3 pl
steps:
  - Papriku nakrájaj na prúžky, cuketu na polkolieska, cibuľu nadrobno. Paradajky prekroj a nastrúhaj reznou stranou na hrubom strúhadle, šupka ti ostane v ruke.
  - Vo veľkej širokej panvici (aspoň 28 cm) rozohrej 2 PL oleja na vysokom ohni. Opeč papriku a cuketu 5–6 minút, kým nemajú hnedé miesta, osoľ štipkou a vyber na tanier. Keby sa varili s ryžou, rozpadli by sa a pustili vodu.
  - Stíš na stredný oheň, pridaj 2 PL oleja a cibuľu a restuj 5 minút. Pridaj prelisovaný cesnak, pretlak a nastrúhané paradajky a var 4–5 minút, kým sa šťava neodparí a zmes nie je hustá ako džem. Toto je základ chuti celého jedla.
  - Vmiešaj údenú papriku, kurkumu a ryžu (neumytú) a minútu miešaj, kým sa zrná neobalia.
  - Zalej horúcou vodou, pridaj soľ a cícer, rovnomerne rozprestri a od tejto chvíle už nemiešaj. Var na miernom ohni bez pokrievky 15 minút, kým ryža nenasaje vodu. Posledných 5 minút na vrch rozlož papriku, cuketu a hrášok.
  - Na záver zvýš oheň na 2 minúty. Keď počuješ jemné praskanie a cítiš opečenú ryžu (nie spálenú), odstav. Na dne vznikne chrumkavá kôrka. Prikry utierkou a nechaj 5 minút postáť. Podávaj s citrónom a vňaťou.
tips:
  - Ochutnaj vodu po pridaní soli. Má byť slaná ako polievka – ryža všetku soľ nasaje.
  - Ryžu po zaliatí nemiešaj, inak bude kašovitá a kôrka sa nevytvorí.
