title: Kulajda s hubami a kôprom
description: Hustá krémová zemiaková polievka s hubami, kôprom a octom, navrch „stratené vajce“ z hodvábneho tofu. Juhočeská, ale na Slovensku ju má rád každý.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/kremove]
time: 40
active: 20
servings: 4
difficulty: 1
tags: [klasika, polievka, one-pot]
keeps: { fridge: 3 }
leftovers: 'Pri zohrievaní ju zrieď trochou vody, zhustne.'
ingredients:
  - zemiaky: 3 ks | na kocky
  - susene-huby: 10 g | namočené 15 min, alebo 200 g čerstvých
  - sampinony: 1 hrnček
  - rastlinne-maslo: 2 pl
  - hladka-muka: 2 pl
  - voda: 5 hrnček
  - rasca: 1/2 čl
  - bobkovy-list: 1 ks
  - nove-korenie: 3 ks
  - sol: 1,5 čl
  - rastlinna-smotana: 1 hrnček | na varenie
  - ocot: 2 pl
  - kopor: 4 pl | čerstvý, nasekaný
  - tofu-hodvabne: 200 g
  - kurkuma: 1 štipka
  - kala-namak: 1/4 čl
steps:
  - Zemiaky daj do hrnca s vodou, rascou, bobkovým listom, novým korením a soľou a var 10 minút.
  - Pridaj namočené huby aj s vodou (bez usadeniny na dne) a nakrájané šampiňóny a var ďalších 10 minút, kým zemiaky nezmäknú.
  - Na masle krátko opeč múku na svetlú zápražku. Rozmiešaj s trochou polievky a vlej späť. Povar 5 minút.
  - Vmiešaj smotanu a ocot a už nevar, len zohrej. Pridaj kôpor a dochuť – má byť jemne kyslá.
  - Hodvábne tofu nakrájaj lyžicou na veľké kúsky, pokvapkaj kurkumou rozmiešanou s kvapkou vody a posyp kala namak.
  - Polievku rozlej do tanierov a do každého vlož kúsok tofu „vajca“.
tips:
  - Bez lepku sprav zápražku z ryžovej múky.
