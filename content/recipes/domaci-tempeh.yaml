title: Domáci tempeh
description: Indonézsky fermentovaný sójový „koláč“ z vlastnej kuchyne. Chce to trpezlivosť a teplé miesto, výsledok je orieškový, hubový a plný bielkovín.
cuisine: indonezska
meals: [domace]
time: 60
active: 40
servings: 6
difficulty: 3
tags: [urob-si-sam, fermentacia]
yields: cca 500 g tempehu
ahead: Zrná namoč cez noc. Po príprave tempeh fermentuje 24–36 hodín pri 30–32 °C.
keeps: { fridge: 5, freezer: 3 }
ingredients:
  - sojove-zrna: 250 g | namočené cez noc
  - ocot: 2 pl
  - tempeh-starter: 1 čl
equipment: [teplomer]
steps:
  - Zrná zbav šupiek – vo vode ich šúchaj medzi dlaňami a šupky, ktoré vyplávajú, zlievaj. Je to zdĺhavé, ale dôležité, pod šupkou pleseň nerastie. Rýchlejšie ide pulzovanie v mixéri, aby sa zrná rozpolili.
  - Zrná var 30 minút vo vode s octom. Kyselina chráni tempeh pred nežiaducimi baktériami.
  - Sceď a úplne osuš – rozprestri na utierku a nechaj vyparovať, kým povrch nie je suchý a zrná len vlažné (pod 37 °C). Mokré zrná zahnijú.
  - Dôkladne primiešaj štartér, aby bolo každé zrnko pokryté.
  - Natlač do zipsového vrecka na vrstvu hrubú 2 cm a vrecko prepichni špáradlom každé 2 cm. Pleseň potrebuje vzduch.
  - Nechaj v teple 30–32 °C (rúra so zapnutým svetlom, sušička, box s termoforom). Po 12 hodinách začne tempeh sám hriať – vtedy ho stráž, nad 37 °C sa pleseň prehrieva a hynie.
  - Po 24–36 hodinách je hotový, keď biela pleseň spojí zrná do pevného koláča a vonia ako šampiňóny.
  - Daj do chladničky. Pred jedlom ho vždy uvar v pare 10 minút alebo opeč.
tips:
  - Čierne alebo sivé fľaky pri dierkach sú spóry, to je v poriadku. Ružová, žltá či zelená farba alebo zápach po čpavku znamenajú zlú várku – vyhoď ju.
  - Rovnako sa dá urobiť tempeh z cíceru alebo čiernej fazule.
  - V mrazničke vydrží mesiace.
