title: Paradajková polievka z čerstvých paradajok
description: Letná paradajková polievka s ryžou, keď je paradajok viac ako treba. Sladkokyslá, ako si ju pamätáme zo škôlky – len lepšia.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/kremove]
time: 40
active: 15
servings: 4
difficulty: 1
tags: [polievka, klasika, lacne]
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Zvyšok zahusti a použi ako omáčku na cestoviny.'
ingredients:
  - olivovy-olej: 2 pl
  - cibula: 1 ks
  - mrkva: 1 ks | nastrúhaná
  - cesnak: 2 ks
  - paradajky: 10 ks | zrelé, nakrájané
  - paradajkovy-pretlak: 1 pl
  - zeleninovy-vyvar: 3 hrnček
  - cukor: 1 pl
  - sol: 1 čl
  - ryza-basmati: 60 g | uvarená zvlášť
  - bazalka: 2 pl
steps:
  - Na oleji na strednom ohni speň cibuľu a mrkvu, 5 minút. Pridaj cesnak a pretlak a 1 minútu opekaj.
  - Pridaj paradajky a vývar, var na miernom ohni 20 minút.
  - Rozmixuj tyčovým mixérom a pretlač cez sitko, ak nechceš šupky a jadierka.
  - Dochuť cukrom a soľou – kyslosť paradajok sa líši. Podávaj s ryžou a bazalkou.
tips:
  - Mimo sezóny použi 2 plechovky krájaných paradajok, chutia viac ako skleníkové.
  - Ryžu var zvlášť, v polievke by nasiakla a rozvarila sa.
