title: Plnené datle „snickers“
description: Datle plnené arašidovým maslom a arašidmi, ponorené do čokolády. Chutia ako tyčinka, len majú štyri suroviny.
cuisine: moderna
meals: [snack, dezert]
categories: [snacky/sladke, dezerty/nepecene]
time: 25
active: 15
servings: 6
difficulty: 1
tags: [bez-varenia, party, deti]
keeps: { fridge: 10, freezer: 3 }
ingredients:
  - datle: 18 ks | mäkké, typ medjool, ak zoženieš
  - arasidove-maslo: 4 pl
  - arasidy: 3 pl | pražené, solené
  - horka-cokolada: 80 g
  - kokosovy-olej: 1 čl
  - sol: 1 štipka | vločková, voliteľne
steps:
  - Datle pozdĺžne narež, ale nerozpoľ, a vyber kôstky.
  - Do každej daj pol lyžičky arašidového masla a 2–3 arašidy a jemne stlač.
  - Čokoládu s kokosovým olejom rozpusť vo vodnom kúpeli alebo v mikrovlnke po 20 sekundách, zakaždým premiešaj.
  - Datle ponáraj vidličkou do čokolády, nechaj odkvapkať a ukladaj na papier na pečenie. Posyp štipkou soli.
  - Daj na 15 minút do chladničky, kým čokoláda stuhne.
tips:
  - Z mrazničky sú ešte lepšie – čokoláda praskne a stred ostane mäkký.
  - Pri alergii na arašidy použi slnečnicové maslo a tekvicové semienka.
