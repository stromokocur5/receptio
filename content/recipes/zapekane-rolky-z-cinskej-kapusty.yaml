title: Zapekané rolky z čínskej kapusty s tofu a hubami
description: Mäkké listy čínskej kapusty plnené opečeným tofu a šampiňónmi, zapečené v paradajkovej omáčke s kokosovým mliekom. Ako holubky, ale bez varenia celej hlávky.
cuisine: slovenska
meals: [obed, vecera]
categories: [hlavne/plnene, hlavne/rura]
time: 75
active: 40
servings: 4
difficulty: 2
tags: [vela-bielkovin, meal-prep]
spicy: 0
keeps: { fridge: 3, freezer: 2 }
leftovers: 'Zohrej v rúre alebo v mikrovlnke prikryté, aby rolky nevyschli.'
ingredients:
  - cinska-kapusta: 1 ks | 12 veľkých vonkajších listov, zvyšok do omáčky
  - tofu-natural: 400 g | pevné
  - sojova-omacka: 2 pl
  - udena-paprika: 1 čl
  - olej: 2 pl
  - cibula: 1 ks | nadrobno
  - sampinony: 300 g | nadrobno
  - cesnak: 4 ks | nasekaný
  - majoranka: 1 čl
  - cierne-korenie: 1/4 čl
  - passata: 500 g
  - kokosove-mlieko: 1 ks
  - sol: 1/2 čl | do omáčky
  - zemiaky: 1 kg | na prílohu
steps:
  - Rozohrej rúru na 200 °C. Z kapusty opatrne odlom 12 veľkých vonkajších listov. Zvyšok hlávky nakrájaj na tenké prúžky.
  - Tofu osuš utierkou a rukami ho rozdrob na kúsky veľkosti hrášku. Premiešaj ho so sójovou omáčkou a údenou paprikou.
  - Vo veľkej panvici rozohrej olej na strednom ohni a cibuľu opekaj 5 minút do mäkka. Pridaj huby a opekaj 6 minút, kým sa voda z nich neodparí.
  - Pridaj tofu a opekaj 5 minút, kým sa jemne neopečie. Primiešaj polovicu cesnaku, majoránku a korenie a odstav.
  - Vo veľkom hrnci priveď do varu vodu a listy v nej spar 1 minútu, po troch naraz, kým nezmäknú. Vyber ich na utierku. Hrubú bielu žilu na spodku listu zrež nožom naplocho, aby sa list dal zrolovať.
  - Medzitým očisti zemiaky, nakrájaj ich na štvrtiny a v osolenej vode var 20 minút do mäkka.
  - Do zapekacej misy (asi 20 × 30 cm) nalej passatu, kokosové mlieko, zvyšný cesnak, soľ a prúžky kapusty a premiešaj. Omáčka na dne zároveň chráni rolky pred prilepením.
  - Na každý list daj 2 PL plnky, zahni spodok, potom boky a zroluj. Rolky ukladaj spojom nadol do omáčky tesne vedľa seba.
  - Prikry alobalom a peč 20 minút. Potom alobal odstráň a peč ešte 10 minút, kým omáčka nezhustne. Podávaj so zemiakmi a omáčkou.
tips:
  - Plnku môžeš urobiť deň vopred, rolovanie potom trvá 10 minút.
  - Bezlepková verzia – namiesto sójovej omáčky tamari.
