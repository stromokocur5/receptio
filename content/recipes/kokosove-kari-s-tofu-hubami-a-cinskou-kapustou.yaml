title: Kokosovo-paradajkové kari s tofu, hubami a čínskou kapustou
description: Paradajková omáčka zjemnená kokosovým mliekom, opečené šampiňóny, chrumkavé tofu a čínska kapusta, ktorá zmäkne až na konci. S ryžou na jednu večeru pre štyroch.
cuisine: moderna
meals: [obed, vecera]
categories: [hlavne/kari, hlavne/tofu]
time: 55
active: 40
servings: 4
difficulty: 1
tags: [lacne, vela-bielkovin, do-krabicky]
spicy: 1
keeps: { fridge: 3, freezer: 2 }
leftovers: 'Zohrej pomaly s lyžicou vody. Kapusta po dni zmäkne, chuti to neuškodí.'
ingredients:
  - tofu-natural: 400 g | pevné
  - sojova-omacka: 3 pl | 1 na tofu, 2 do omáčky
  - kukuricny-skrob: 1 pl
  - olej: 3 pl
  - sampinony: 400 g | na plátky
  - cibula: 1 ks | nadrobno
  - cesnak: 4 ks | nasekaný
  - zazvor: 1 pl | nastrúhaný
  - kari-korenie: 1 pl
  - kurkuma: 1/2 čl
  - passata: 400 g
  - kokosove-mlieko: 1 ks
  - cinska-kapusta: 400 g | asi pol hlávky
  - javorovy-sirup: 1 čl
  - limetka: 1 ks
  - cili: podľa chuti
  - ryza-jazminova: 300 g
  - sol: 1/2 čl | do ryže
steps:
  - Tofu osuš utierkou, nakrájaj na kocky 2 cm, premiešaj s 1 PL sójovej omáčky a nechaj 10 minút postáť. Potom ho obaľ v škrobe.
  - Medzitým uvar ryžu – prepláchni ju v site, zalej 450 ml vody, osoľ a priveď do varu. Prikry a na najmenšom ohni var 12 minút, potom odstav a nechaj 10 minút dôjsť pod pokrievkou.
  - Kapustu pozdĺžne rozpoľ a nakrájaj na prúžky 2 cm. Biele hrubé časti od spodku daj bokom zvlášť od zelených listov – varia sa dlhšie.
  - Vo veľkej panvici rozohrej 2 PL oleja na strednom až veľkom ohni a tofu opekaj 8 minút, kým nie je zo všetkých strán zlatisté. Vyber ho na tanier.
  - Na tej istej panvici bez ďalšieho oleja opekaj šampiňóny na veľkom ohni 6 minút. Najprv pustia vodu, nechaj ju odpariť a huby nechaj zhnednúť – až potom majú chuť.
  - Stiahni oheň na stredný, pridaj zvyšný 1 PL oleja a cibuľu a opekaj 5 minút do mäkka. Prisyp cesnak, zázvor, kari a kurkumu a 1 minútu miešaj, kým korenie nezavonia.
  - Vlej passatu, pridaj biele časti kapusty a 10 minút var na miernom ohni, kým omáčka nezhustne a kapusta nezmäkne.
  - Vmiešaj kokosové mlieko, zvyšné 2 PL sójovej omáčky a sirup, pridaj zelené listy kapusty a var 3 minúty, len kým nezvädnú.
  - Vráť tofu do omáčky, dochuť limetkovou šťavou a čili. Podávaj s ryžou.
tips:
  - Tofu pridávaj až na konci, inak v omáčke stratí chrumkavosť.
  - Bezlepková verzia – namiesto sójovej omáčky tamari.
