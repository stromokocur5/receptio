title: Nakladané uhorky
description: Chrumkavé sladkokyslé uhorky v octovom náleve s kôprom a horčičným semienkom, ako od starej mamy.
cuisine: slovenska
meals: [domace]
categories: [domace/zavarane, domace/kvasene]
time: 60
active: 40
servings: 20
difficulty: 1
tags: [urob-si-sam, lacne, klasika]
ahead: Uhorky namoč na 2–4 hodiny do ľadovej vody.
yields: cca 4 poháre po 0,7 l
keeps: { fridge: 21 }
howto: [nakladana-zelenina, zavaranie]
ingredients:
  - uhorky-nakladacie: 2 kg | malé, konce odrezané
  - cibula: 2 ks | na kolieska
  - mrkva: 1 ks | na kolieska
  - kopor: 4 pl | s kvetom
  - cesnak: 4 ks
  - horcicne-semienko: 2 čl
  - nove-korenie: 8 ks
  - bobkovy-list: 4 ks
  - voda: ~1 l | nálev
  - ocot: ~500 ml | nálev, 8 % (alebo 1 l 5 %)
  - cukor: 120 g
  - sol: 1 pl
steps:
  - Uhorky umy, odrež kvetný koniec a namoč na 2–4 hodiny do ľadovej vody. Budú chrumkavejšie.
  - Do vyparených pohárov daj kôpor, cesnak, cibuľu, mrkvu a korenie a natlač uhorky nastojato, čo najtesnejšie.
  - Vodu, ocot, cukor a soľ prived do varu a horúcim nálevom zalej uhorky až po okraj. Zavri.
  - Zaváraj 30 minút pri 82–85 °C s teplomerom (chrumkavejšie) alebo 10 minút vo vriacej vode. Nechaj vychladnúť na utierke.
  - Ochutnaj najskôr o 3 týždne, dovtedy sa chute spoja.
tips:
  - List chrenu alebo viniča v pohári pomôže udržať chrumkavosť.
  - Zvyšný nálev ide do dresingov a do zemiakového šalátu.
