title: Guacamole
description: Poctivé guacamole roztlačené vidličkou, nie rozmixované. S limetkou, koriandrom a čili.
cuisine: mexicka
meals: [snack]
categories: [omacky/dipy, snacky/party]
time: 10
active: 10
servings: 4
difficulty: 1
tags: [party, rychle]
spicy: 1
keeps: { fridge: 1 }
ingredients:
  - avokado: 3 ks | zrelé
  - limetka: 1 ks
  - cibula-cervena: 1/2 ks | nadrobno
  - paradajky: 1 ks | bez semienok, nadrobno
  - bylinky-koriander: 3 pl
  - cili: 1/4 čl
  - sol: 1 čl
  - kukuricne-tortilly: 6 ks | na domáce chipsy
  - olej: 1 pl | na chipsy
steps:
  - Avokádo roztlač vidličkou nahrubo – kúsky sú žiaduce.
  - Primiešaj limetku, cibuľu, paradajku, koriander, čili a soľ. Ochutnaj a dolaď limetkou a soľou.
  - Chipsy. Tortilly nakrájaj na trojuholníky, potri olejom, osoľ a peč na 200 °C 8–10 minút.
tips:
  - Prikry fóliou priamo na povrch, aby sa k nemu nedostal vzduch – tak zhnedne menej. Samotná kôstka v miske nepomôže.
