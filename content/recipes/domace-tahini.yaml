title: Domáce tahini
description: Sezamová pasta, ktorá v obchode stojí majland. Doma stačí sezam, olej a trpezlivý mixér.
cuisine: libanonska
meals: [domace]
categories: [domace/zaklady, omacky/dipy]
time: 20
active: 15
servings: 16
difficulty: 1
tags: [urob-si-sam]
yields: cca 250 g
related: [hummus, baba-ganoush, falafel]
keeps: { fridge: 30 }
ingredients:
  - sezam: 250 g | lúpaný (svetlý)
  - olej: 3 pl | neutrálny
  - sol: 1 štipka
steps:
  - Sezam opraž na suchej panvici na miernom až strednom ohni 4–5 minút za stáleho miešania, len kým nezavonia a jemne nezozlatne. Tmavý je horký.
  - Nechaj vychladnúť a v sekáčiku mixuj 1 minútu na drvinu.
  - Pridaj olej a soľ a mixuj 5–10 minút, občas zotri steny, kým nie je hladké a tekuté.
tips:
  - Z nelúpaného sezamu bude tmavšie a horkejšie, ale s oveľa viac vápnikom.
  - Olej, ktorý sa oddelí, len zamiešaj.
