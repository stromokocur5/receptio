title: Katsu sando s tofu
description: Japonský sendvič – hrubý plátok tofu v panko obale, sladko-pikantná tonkatsu omáčka a jemná kapusta v mäkkom bielom chlebe bez kôrky.
cuisine: japonska
meals: [obed, vecera]
categories: [comfort/burgre, hlavne/plnene, hlavne/tofu]
time: 35
active: 25
servings: 2
difficulty: 1
tags: [vela-bielkovin, do-krabicky]
keeps: { fridge: 1 }
related: [tofu-katsu-don]
ingredients:
  - tofu-natural: 300 g | vylisované
  - sol: 1/4 čl
  - hladka-muka: 3 pl
  - sojove-mlieko: 1/3 hrnček
  - kukuricny-skrob: 1 pl
  - struhanka: 3/4 hrnček | ideálne panko
  - olej: 5 pl | na vyprážanie
  - kecup: 2 pl
  - sojova-omacka: 1 pl
  - javorovy-sirup: 1 čl
  - horcica: 1/2 čl
  - chlieb: 4 ks | mäkký toastový
  - veganska-majoneza: 1 pl
  - biela-kapusta: 1 hrnček | na tenučko
steps:
  - Tofu nakrájaj na 2 hrubé plátky veľkosti chleba a osoľ.
  - Obaľ v múke, v mlieku vyšľahanom so škrobom a v strúhanke.
  - Vyprážaj na oleji na strednom ohni 3 minúty z každej strany dozlatista.
  - Tonkatsu omáčka. Zmiešaj kečup, sójovú omáčku, sirup a horčicu.
  - Chlieb natri majonézou, daj kapustu, tofu natreté omáčkou a prikry.
  - Pritlač, odkroj kôrky a rozkroj na polovice.
howto: [tofu]
variants:
  - name: Ľahšia verzia
    description: Obalené tofu pokvapkaj olejom a peč 20 minút na 210 °C, v polovici otoč. Použi celozrnný toastový chlieb a majonézu vynechaj.
    replace:
      - from: olej
        to: olej
        amount: 1 pl
    remove: [veganska-majoneza]
