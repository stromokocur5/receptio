title: Marocký tagine s cícerom a marhuľami
description: Sladko-pikantný dusený cícer s batátom, mrkvou a sušenými marhuľami. Voňavý ako marocký trh.
cuisine: severoafricka
meals: [obed, vecera]
categories: [hlavne/kari, hlavne/strukoviny]
time: 50
active: 20
servings: 4
difficulty: 2
tags: [meal-prep, one-pot]
spicy: 1
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Podávaj s kuskusom alebo quinoou, chutí aj studený.'
ingredients:
  - olivovy-olej: 2 pl
  - cibula: 2 ks | na polmesiačiky
  - cesnak: 3 ks
  - zazvor: 1 pl | nastrúhaný
  - kmin: 2 čl
  - skorica: 1 čl
  - kurkuma: 1 čl
  - sladka-paprika: 1 čl
  - batat: 1 ks | na kocky
  - mrkva: 3 ks | na hrubé kolieska
  - cicer-sterilizovany: 2 ks
  - paradajky-sterilizovane: 1 ks
  - susene-marhule: 10 ks | na štvrtinky
  - zeleninovy-vyvar: 2 hrnček
  - citron: 1/2 ks
  - bylinky-koriander: 3 pl
  - quinoa: 250 g | na prílohu
steps:
  - Na oleji na strednom ohni speň cibuľu 8 minút do zlatista, pridaj cesnak, zázvor a všetko korenie a minútu restuj.
  - Pridaj batát, mrkvu, cícer, paradajky, marhule a vývar. Prikry a dus na miernom ohni 30 minút, kým zelenina nezmäkne.
  - Medzitým quinou prepláchni v sitku (inak horkne), zalej 600 ml vody so štipkou soli, priveď do varu, prikry a var na miernom ohni 15 minút. Nechaj 5 minút prikrytú dôjsť a prehrab vidličkou.
  - Tagine dochuť soľou a citrónom a posyp koriandrom.
tips:
  - Tradične sa podáva s kuskusom (pšenica) – quinoa alebo ryža sú bezlepkové.
  - Na pikantnejšiu verziu pridaj lyžičku harissy.
