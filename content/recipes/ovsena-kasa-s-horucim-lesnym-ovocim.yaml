title: Ovsená kaša s horúcim lesným ovocím
description: Krémová ovsená kaša a mrazené ovocie zohriate do sladkej šťavy. Raňajky na 10 minút, aj keď doma nie je čerstvé ovocie.
cuisine: slovenska
meals: [ranajky]
categories: [ranajky/kase]
time: 12
active: 10
servings: 2
difficulty: 1
tags: [rychle, lacne, ranajky, deti]
spicy: 0
keeps: { fridge: 2 }
leftovers: 'Kaša v chladničke stuhne. Prehrej s trochou mlieka, ovocie zvlášť.'
ingredients:
  - ovsene-vlocky: 1 hrnček
  - sojove-mlieko: 300 ml
  - voda: 200 ml
  - sol: 1 štipka
  - skorica: 1/2 čl
  - lesne-ovocie: 1 hrnček | rovno z mrazničky
  - javorovy-sirup: 1 pl
  - lanove-semienko: 2 pl | mleté
steps:
  - Vločky zalej mliekom a vodou, pridaj štipku soli a skoricu a var na miernom ohni 5 minút za občasného miešania, kým kaša nezhustne.
  - Medzitým daj ovocie rovno z mrazničky do malého hrnčeka so sirupom a 2 PL vody, prikry a zohrievaj na miernom ohni 5 minút, kým nepustí šťavu. Lyžicou rozmačkaj zopár bobúľ – šťava zhustne a zafarbí sa.
  - Kašu rozdeľ do misiek, polej horúcim ovocím aj so šťavou a posyp mletým ľanom.
