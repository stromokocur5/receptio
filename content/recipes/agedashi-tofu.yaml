title: Agedashi tofu
description: Jemné tofu v chrumkavom škrobovom obale, zaliate teplým dashi vývarom so sójovou omáčkou a strúhanou reďkvou.
cuisine: japonska
meals: [snack, vecera]
time: 25
active: 20
servings: 2
difficulty: 2
tags: [klasika]
spicy: 0
keeps: { fridge: 0 }
ingredients:
  - tofu-natural: 300 g | mäkšie, na veľké kocky
  - kukuricny-skrob: 4 pl | alebo zemiakový
  - olej: ~200 ml | na vyprážanie, zostane v panvici
  - voda: 250 ml
  - susene-huby: 5 g | shiitake
  - sojova-omacka: 2 pl
  - javorovy-sirup: 1 čl
  - biela-redkev: 80 g | najemno nastrúhaná
  - zazvor: 1 čl | nastrúhaný
  - jarna-cibulka: 1 ks
steps:
  - Vodu s hubami var na miernom ohni 10 minút, dochuť sójovou omáčkou a sirupom – to je vegánsky dashi.
  - Tofu osuš utierkou a obaľ v škrobe.
  - Vyprážaj v oleji zohriatom na 175 °C (asi 2 cm v panvici) 3–4 minúty, kým nie je obal chrumkavý.
  - Tofu daj do misky, zalej horúcim vývarom a navrch daj reďkev, zázvor a cibuľku. Jedz hneď.
