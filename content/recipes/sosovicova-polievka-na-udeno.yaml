title: Šošovicová polievka na údeno
description: Červená šošovica rozvarená do hustej, sýtej polievky s mrkvou, opraženým pretlakom a údenou paprikou. Chutí, akoby v nej bola klobása, a za pol hodiny je hotová.
cuisine: slovenska
meals: [obed, vecera]
categories: [polievky/strukovinove]
time: 40
active: 20
servings: 4
difficulty: 1
tags: [rychle, lacne]
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Zhustne – zohrej ju s trochou vody a znova ochutnaj soľ.'
ingredients:
  - olivovy-olej: 2 pl
  - cibula: 1 ks
  - mrkva: 2 ks
  - cesnak: 3 ks
  - paradajkovy-pretlak: 2 pl
  - udena-paprika: 1 čl
  - sladka-paprika: 1 čl
  - majoranka: 1 čl
  - sosovica-cervena: 200 g
  - voda: 1,2 l
  - sol: 1,5 čl
  - bobkovy-list: 1 ks
  - ocot: 1 pl | na koniec
  - slnecnicove-semienka: 3 pl
  - petrzlenova-vnat: 2 pl
steps:
  - Cibuľu nakrájaj nadrobno, mrkvu na malé kocky. V hrnci zohrej olej na strednom ohni a restuj ich 6–7 minút, kým cibuľa nie je zlatá.
  - Pridaj prelisovaný cesnak a pretlak a miešaj 1–2 minúty, kým pretlak nestmavne do tehlovej farby. Opražený pretlak stratí kovovú kyslosť a dodá polievke hĺbku.
  - Stíš oheň na minimum, pridaj obe papriky a majoránku a miešaj iba 20 sekúnd. Mletá paprika na horúcom oleji zhorkne za pár sekúnd.
  - Hneď zalej vodou, pridaj prepláchnutú šošovicu, soľ a bobkový list. Priveď do varu, stíš na mierny oheň a var 20 minút, občas premiešaj. Šošovica sa rozpadne a polievku zahustí sama, bez múky.
  - Medzitým opraž semienka na suchej panvici 3 minúty dozlata.
  - Vyber bobkový list, vmiešaj ocot a ochutnaj. Ocot je to, čo z dobrej polievky robí výbornú – zjasní ťažkú šošovicu. Podávaj so semienkami a vňaťou.
tips:
  - Ak chceš polievku úplne hladkú, rozmixuj ju. Ak s kúskami, nechaj tak.
  - Kúsok čili papričky s cesnakom jej dodá pálivosť.
