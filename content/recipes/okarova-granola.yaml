title: Okarová granola
description: Chrumkavá granola, v ktorej polovicu vločiek nahradí okara zo sójového mlieka. Viac bielkovín a vlákniny a zvyšok, ktorý by inak skončil v koši, vydrží v pohári mesiac.
cuisine: moderna
meals: [ranajky, snack]
categories: [ranajky/kase, snacky/na-cesty]
time: 75
active: 15
servings: 10
difficulty: 1
tags: [ranajky, meal-prep, zvysky]
spicy: 0
keeps: { fridge: 30 }
related: [domace-sojove-mlieko, domace-tofu, granola]
ingredients:
  - okara: 300 g | čerstvá alebo rozmrazená
  - ovsene-vlocky: 200 g
  - vlasske-orechy: 80 g | nahrubo nasekané
  - slnecnicove-semienka: 4 pl
  - skorica: 2 čl
  - sol: 1/2 čl
  - javorovy-sirup: 6 pl
  - olej: 4 pl
  - hrozienka: 60 g
steps:
  - Rúru predhrej na 150 °C. Okaru rozdrob prstami v miske, aby nezostali hrudky.
  - Pridaj vločky, orechy, semienka, škoricu a soľ, prilej sirup a olej a dôkladne premiešaj rukami, kým nie je všetko rovnomerne vlhké.
  - Rozprestri na dva plechy s papierom v tenkej vrstve. Okara má veľa vody – v hrubej vrstve by sa dusila a nevyschla.
  - Peč 50–60 minút, každých 15 minút premiešaj a vymeň plechy. Hotová je, keď je zlatistá a pri premiešaní šuchoce. Okara sa suší pomalšie ako vločky, preto je čas dlhší ako pri bežnej granole.
  - Nechaj na plechu úplne vychladnúť, až vtedy stvrdne. Primiešaj hrozienka a nasyp do pohára.
tips:
  - Ak po vychladnutí nie je chrumkavá, vráť ju na 15 minút do rúry – zvnútra bola ešte vlhká a v pohári by splesnivela.
  - Okara zo surového mletia (keď sa mlieko varí až po precedení) musí byť upečená celá, surová sa neje.
