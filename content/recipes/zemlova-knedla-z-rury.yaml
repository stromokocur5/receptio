title: Žemľová knedľa zo starých rožkov z rúry
description: Knedľa z rožkov, mlieka a opraženej cibuľky upečená vo forme a nakrájaná na plátky. Netreba ju variť v utierke a k paprikášu alebo omáčke je lepšia ako kúpená.
cuisine: slovenska
meals: [obed, vecera]
categories: [prilohy/prilohy]
time: 70
active: 20
servings: 7
difficulty: 2
tags: [nasarodinka, zvysky, lacne, klasika]
keeps: { fridge: 3, freezer: 3 }
ingredients:
  - rozok: 10 ks | starý
  - olej: 3 pl
  - cibula: 1 ks
  - sojove-mlieko: 400 ml | nesladené
  - sol: 1 čl
  - hladka-muka: 150 g
  - cicerova-muka: 50 g
  - kypriaci-prasok: 1 čl
  - petrzlenova-vnat: 3 pl | nasekaná
  - muskatovy-orech: 1 štipka
  - cierne-korenie: 1 štipka
steps:
  - Rúru predhrej na 180 °C. Formu na chlieb (asi 25 cm) vystel papierom na pečenie.
  - Rožky nakrájaj na kocky asi 1,5 cm. Cibuľu nakrájaj nadrobno.
  - Vo veľkej panvici zohrej olej na strednom ohni a cibuľu opekaj 4 minúty. Pridaj kocky rožkov a opekaj ich 3–4 minúty za miešania, kým nezačnú zlatnúť.
  - Mlieko zohrej so soľou, aby bolo teplé, nie horúce. Rožky s cibuľou daj do misy, zalej mliekom a nechaj 10 minút nasiaknuť.
  - Pridaj obe múky, prášok do pečiva, vňať, muškátový oriešok a korenie. Rukou premiesi, kým sa hmota nezačne lepiť a držať pokope.
  - Hmotu natlač do formy a prikry alobalom. Peč 35 minút, potom alobal zlož a peč ešte 10 minút.
  - Nechaj 10 minút vychladnúť vo forme, vyklop a krájaj ostrým nožom alebo niťou na plátky.
tips:
  - Zvyšné plátky opeč na panvici s trochou oleja – na druhý deň sú ešte lepšie.
  - Pri celiakii použi bezlepkové pečivo aj múky.
