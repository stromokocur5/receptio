title: Roti s kari cícerom a zemiakmi
description: Trinidadské mäkké placky zabalené okolo kari zo zemiakov a cíceru. Obed, ktorý vydrží do večera.
cuisine: karibska
meals: [obed, vecera]
categories: [hlavne/plnene, hlavne/kari]
time: 60
active: 35
servings: 4
difficulty: 2
tags: [do-krabicky, meal-prep]
spicy: 2
keeps: { fridge: 3, freezer: 2 }
gf_swap: false
ingredients:
  - hladka-muka: 300 g
  - kypriaci-prasok: 1 čl
  - sol: 1,5 čl
  - voda: 180 ml
  - olej: 4 pl
  - cibula: 1 ks
  - cesnak: 4 ks
  - kari-korenie: 2 pl
  - kmin: 1 čl
  - zemiaky: 3 ks | na kocky
  - cicer-sterilizovany: 1 ks
  - cili-papricka: 1 ks
  - bylinky-koriander: 3 pl
steps:
  - Múku, prášok, pol ČL soli, vodu a 1 PL oleja zmiešaj na mäkké cesto a nechaj 30 minút odpočívať.
  - Na 2 PL oleja na strednom ohni speň cibuľu, cesnak, kari a kmín, pridaj zemiaky, cícer, papričku, zvyšnú soľ a 400 ml vody. Var na miernom ohni 20 minút, kým zemiaky nezmäknú a omáčka nezhustne.
  - Cesto rozdeľ na 4 časti, vyvaľkaj na tenké kruhy a peč na suchej rozpálenej panvici na strednom ohni po minúte z každej strany, potri olejom.
  - Kari zabaľ do roti ako burrito a posyp koriandrom.
