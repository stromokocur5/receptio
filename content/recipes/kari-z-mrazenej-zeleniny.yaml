title: Kari z mrazenej zeleniny s cícerom
description: Kokosové kari, ktoré uvaríš aj vtedy, keď v chladničke nič nie je – zelenina ide rovno z mrazničky, cícer a mlieko zo špajze.
cuisine: indicka-sever
meals: [obed, vecera]
categories: [hlavne/kari]
time: 35
active: 15
servings: 4
difficulty: 1
tags: [lacne, rychle, meal-prep, do-krabicky]
spicy: 1
keeps: { fridge: 4, freezer: 3 }
leftovers: 'Kari zamraz bez ryže. Na druhý deň je ešte lepšie – zohrej s 2–3 lyžicami vody.'
related: [kokosovy-dal, zlte-kari]
ingredients:
  - ryza-basmati: 300 g
  - voda: 600 ml | na ryžu
  - olej: 2 pl
  - cibula: 1 ks | nadrobno
  - cesnak: 3 ks | prelisovaný
  - zazvor: 1 pl | nastrúhaný
  - kari-korenie: 2 pl
  - paradajky-sterilizovane: 1 ks | plechovka krájaných
  - kokosove-mlieko: 1 ks | plechovka
  - cicer-sterilizovany: 1 ks | plechovka, scedený
  - sol: 1 čl
  - zeleninova-zmes: 600 g | rovno z mrazničky
  - citron: 1/2 ks | šťava
steps:
  - Ryžu prepláchni, zalej 600 ml vody so štipkou soli, priveď do varu a var pod pokrievkou na najmenšom ohni 12 minút. Odstav a nechaj 10 minút dôjsť.
  - Medzitým opeč cibuľu na oleji na strednom ohni 6 minút do zlatista. Pridaj cesnak, zázvor a kari korenie a minútu praž za stáleho miešania, kým nezavonia.
  - Pridaj paradajky, kokosové mlieko, scedený cícer a soľ a priveď do varu.
  - Vsyp zeleninu rovno z mrazničky, nerozmrazuj ju – rozmrazená by pustila vodu a rozvarila sa. Var na miernom ohni 8–10 minút, kým nie je mäkká.
  - Dochuť citrónovou šťavou, ochutnaj soľ a podávaj s ryžou.
tips:
  - Akákoľvek mrazená zelenina – brokolica, karfiol, fazuľky, hrášok, špenát. Špenát pridaj až na posledné 3 minúty.
