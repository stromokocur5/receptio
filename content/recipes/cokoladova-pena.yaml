title: Čokoládová pena z aquafaby
description: Vzdušná čokoládová pena z vody z plechovky cíceru. Nikto neuhádne, z čoho je.
cuisine: moderna
meals: [dezert]
categories: [dezerty/kremy]
time: 20
active: 20
servings: 4
difficulty: 2
tags: [dezert]
ahead: Po príprave nechaj stuhnúť v chladničke aspoň 3 hodiny.
keeps: { fridge: 2 }
ingredients:
  - horka-cokolada: 150 g
  - aquafaba: 1/2 hrnček | z jednej plechovky cíceru
  - citron: 1 čl
  - cukor: 2 pl
  - sol: 1 štipka
  - maliny: 1/2 hrnček
steps:
  - Čokoládu roztop nad vodným kúpeľom a nechaj vychladnúť na vlažnú.
  - Aquafabu s citrónom a soľou šľahaj mixérom 5–8 minút do mäkkého snehu, potom postupne pridávaj cukor a šľahaj do tuhého snehu.
  - Čokoládu vmiešaj do snehu na tri razy, stierkou a opatrne zospodu nahor, aby pena nespľasla.
  - Rozdeľ do pohárov a nechaj stuhnúť v chladničke. Podávaj s malinami.
tips:
  - Aquafaba sa šľahá dlhšie ako bielky – vydrž.
  - Cícer z plechovky použi na hummus.
