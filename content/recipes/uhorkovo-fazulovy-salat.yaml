title: Uhorkovo-fazuľový šalát s kôprom a opraženými semienkami
description: Chrumkavá uhorka, ktorá nepláva vo vode, krémová biela fazuľa a hustý horčicový dresing, ktorý drží na každom kúsku. Sýty šalát na obed za štvrť hodiny.
cuisine: slovenska
meals: [obed, vecera]
categories: [salaty/syte]
time: 15
active: 15
servings: 2
difficulty: 1
tags: [zlatica, rychle]
keeps: { fridge: 1 }
leftovers: 'Na druhý deň je uhorka mäkšia, ale chutí. Semienka pridaj čerstvé.'
ingredients:
  - uhorka: 1 ks
  - sol: 1/2 čl | na uhorku
  - fazula-biela: 1 ks | plechovka, scedená a prepláchnutá
  - cibula-cervena: 1/2 ks
  - ocot: 1 pl
  - horcica: 1 čl
  - cukor: 1/4 čl
  - olivovy-olej: 3 pl
  - kopor: 2 pl | nasekaný
  - cierne-korenie: 1 štipka
  - slnecnicove-semienka: 3 pl
steps:
  - Uhorku prekroj pozdĺžne, lyžičkou vyškrab mäkký stred so semienkami a nakrájaj ju na polmesiačiky. Daj do sitka, posyp 1/2 ČL soli, premiešaj a nechaj 10 minút odkvapkať. Soľ z uhorky vytiahne vodu – šalát potom nepláva a dresing sa nezriedi.
  - Medzitým opraž semienka na suchej panvici na strednom ohni 3–4 minúty, kým nezačnú voňať a hnednúť. Hneď ich vysyp na tanier, v horúcej panvici by zhoreli.
  - Cibuľu nakrájaj na tenké pásiky a v miske, v ktorej budeš robiť šalát, ju zalej octom. Za 5 minút v octe stratí ostrosť a zružovie.
  - K cibuli s octom pridaj horčicu, cukor a korenie. Šľahaj vidličkou a po troškách prilievaj olej, kým dresing nezhustne. Horčica spojí olej s octom do emulzie – tá sa nalepí na zeleninu, namiesto aby stiekla na dno.
  - Uhorku v sitku stlač dlaňou, nech pustí ešte trochu vody. Pridaj ju do misky s fazuľou a kôprom a premiešaj. Ochutnaj – ak je šalát mdlý, pridaj štipku soli, ak ťažký, kvapku octu. Semienka posyp až tesne pred jedlom, aby ostali chrumkavé.
tips:
  - Fazuľu z plechovky vždy prepláchni pod tečúcou vodou. Nálev je slaný a slizký.
  - Uhorka už je osolená, do dresingu soľ nepridávaj, kým neochutnáš.
