title: Cestovinový šalát s fazuľou, kukuricou a paprikou
description: Farebný šalát z koleniek, červenej fazule a chrumkavej zeleniny s horčicovým dresingom. Urobíš ho ráno, do obeda sa prejde chuťou a je ideálny na výlet aj na grilovačku.
cuisine: moderna
meals: [obed, vecera]
categories: [salaty/syte]
time: 25
active: 15
servings: 7
difficulty: 1
tags: [nasarodinka, lacne, do-krabicky, party, vela-bielkovin]
keeps: { fridge: 3 }
ingredients:
  - cestoviny: 500 g | kolienka
  - sol: ~1 pl | do vody na cestoviny
  - fazula-cervena: 2 ks | scedená
  - kukurica: 1 ks | scedená
  - paprika-cervena: 2 ks
  - uhorka: 1 ks
  - cibula-cervena: 1 ks
  - olivovy-olej: 5 pl
  - ocot: 3 pl
  - horcica: 1 pl
  - cukor: 1 čl
  - sol: 1,5 čl
  - cierne-korenie: 1/4 čl
  - petrzlenova-vnat: 3 pl | nasekaná
steps:
  - Vo veľkom hrnci priveď do varu vodu, osoľ ju a var kolienka podľa obalu, zvyčajne 8–10 minút. Sceď ich a prepláchni studenou vodou, aby sa nezlepili.
  - Medzitým v hrnčeku rozšľahaj olej, ocot, horčicu, cukor, soľ a korenie.
  - Papriku a uhorku nakrájaj na kocky, cibuľu nadrobno. Fazuľu a kukuricu prepláchni v sitku.
  - Vo veľkej mise zmiešaj cestoviny, zeleninu, fazuľu a kukuricu. Prelej dresingom a premiešaj.
  - Nechaj aspoň 10 minút postáť, potom znova premiešaj, posyp vňaťou a ochutnaj soľ a ocot.
tips:
  - V chladničke cestoviny nasajú dresing. Pred podávaním pridaj lyžicu octu a oleja.
