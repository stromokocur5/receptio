title: Cícerový wrap s „vajíčkovou“ nátierkou
description: Roztlačený cícer s majonézou, horčicou, kyslou uhorkou a čiernou soľou chutí ako vajíčkový šalát. Bez varenia za 10 minút a nátierka vydrží celý pracovný týždeň.
cuisine: americka
meals: [ranajky, obed, snack]
categories: [hlavne/plnene, omacky/dipy]
time: 10
active: 10
servings: 4
difficulty: 1
tags: [bez-varenia, rychle, do-krabicky, meal-prep, vela-bielkovin, tortilla-na-tyzden]
keeps: { fridge: 4 }
related: [wrap-so-sosovicou-a-kapustou, ranajkove-burrito-do-mraznicky]
ingredients:
  - cicer-sterilizovany: 2 ks
  - veganska-majoneza: 3 pl | alebo sójový jogurt
  - horcica: 2 čl
  - kurkuma: 1/4 čl
  - kala-namak: 1/2 čl | alebo bežná soľ
  - kysle-uhorky: 3 ks
  - jarna-cibulka: 2 ks
  - cierne-korenie: 1 štipka
  - salat: 60 g | pár listov
  - psenicne-tortilly: 4 ks
steps:
  - Cícer sceď, prepláchni a v mise ho roztlač vidličkou alebo pučidlom nahrubo – časť nech ostane v kúskoch.
  - Pridaj majonézu, horčicu, kurkumu, kala namak a korenie a premiešaj.
  - Uhorky a jarnú cibuľku nakrájaj nadrobno a vmiešaj. Ochutnaj – ak treba, pridaj lyžicu nálevu z uhoriek.
  - Na tortillu polož list šalátu, naň 3–4 lyžice nátierky, preklop boky a pevne zroluj.
tips:
  - Nátierku drž v krabičke v chladničke a wrap zabaľ až ráno, tortilla tak nezmäkne.
  - Hodí sa aj na chlieb alebo do pečeného zemiaka.
  - S jogurtom namiesto majonézy je ľahšia a má viac bielkovín.
