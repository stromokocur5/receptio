title: Zemiakové rösti so salsou z paradajok
description: Tenká zemiaková placka, ktorá je celá chrumkavá a zlatá, bez vajca aj múky – drží ju škrob zo samotného zemiaka. Navrch čerstvá salsa z odkvapkaných paradajok a cibuľky.
cuisine: slovenska
meals: [ranajky, obed, vecera]
categories: [hlavne/zelenina, ranajky/slane]
time: 35
active: 30
servings: 2
difficulty: 2
tags: [zlatica]
ingredients:
  - zemiaky: 4 ks | múčnaté (typ C)
  - sol: 1 čl | 1/2 do zemiakov, 1/2 do salsy
  - cierne-korenie: 1 štipka
  - olej: 3 pl
  - paradajky: 3 ks
  - cibula-cervena: 1/2 ks
  - cesnak: 1 ks
  - citron: 1/2 ks | šťava
  - olivovy-olej: 1 pl
  - udena-paprika: 1/2 čl
  - petrzlenova-vnat: 2 pl
steps:
  - Salsa najprv – paradajky nakrájaj na malé kocky, daj do sitka nad misku, posyp 1/2 ČL soli a nechaj odkvapkať. Bez toho by salsa rösti rozmočila.
  - Zemiaky ošúp a nastrúhaj na hrubom strúhadle. Zabaľ ich do čistej utierky a nad drezom ich vyžmýkaj čo najsilnejšie, kým nekvapká. Vo vytlačenej tekutine sa po minúte usadí na dne biely škrob – vodu opatrne zlej, škrob vráť k zemiakom. Ten drží placku pokope.
  - Zemiaky premiešaj s 1/2 ČL soli, korením a škrobom.
  - Na panvici s priemerom asi 24 cm rozohrej 2 PL oleja na strednom ohni. Zemiaky rozprestri na celé dno v tenkej vrstve a stlač ich lopatkou. Peč 8–10 minút bez hýbania, kým nie je spodok tmavozlatý a placka sa dá posunúť zatrasením panvice.
  - Rösti zošmykni na tanier, prikry ho panvicou a obráť späť do panvice. Pod okraj prilej 1 PL oleja a peč ďalších 7–8 minút.
  - Medzitým dokonči salsu – k paradajkám pridaj nadrobno nakrájanú cibuľu, prelisovaný cesnak, citrónovú šťavu, olivový olej, údenú papriku a vňať. Ochutnaj a dosoľ.
  - Rösti nakrájaj ako pizzu a navrch nalož salsu tesne pred jedlom.
tips:
  - Vyžmýkanie je celý trik. Mokré zemiaky sa na panvici dusia a placka sa rozpadne.
  - Ak sa rösti pri obracaní roztrhne, len ho stlač späť lopatkou, zrastie.
