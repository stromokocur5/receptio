title: Mapo tofu s hubami
description: Sečuánska klasika – jemné tofu v ohnivej omáčke z fermentovanej fazuľovej pasty so sečuánskym korením, ktoré brní na jazyku.
cuisine: cinska
meals: [obed, vecera]
time: 30
active: 25
servings: 3
difficulty: 2
tags: []
spicy: 3
keeps: { fridge: 3 }
leftovers: 'Daj na rezance a pridaj pár kvapiek sezamového oleja.'
ingredients:
  - ryza-jazminova: 250 g
  - tofu-natural: 400 g | na kocky 2 cm, ideálne mäkké
  - secuanske-korenie: 1 čl | opražené a pomleté
  - sampinony: 200 g | nadrobno nasekané
  - olej: 3 pl
  - doubanjiang: 2 pl
  - cesnak: 3 ks
  - zazvor: 1 pl
  - cili: 1 čl
  - sojova-omacka: 1 pl
  - zeleninovy-vyvar: 1 hrnček
  - kukuricny-skrob: 1 pl | rozmiešaný v 3 PL vody
  - jarna-cibulka: 3 ks
  - sezamovy-olej: 1 čl
steps:
  - Uvar ryžu. Sečuánske korenie opraž na suchej panvici 1 minútu a pomeľ.
  - Tofu vlož na 2 minúty do jemne vriacej osolenej vody – spevní sa a nerozpadne. Opatrne sceď.
  - Huby smaž na oleji 8 minút, kým nie sú hnedé a chrumkavé. Nahradia mleté mäso.
  - Pridaj doubanjiang a minútu praž, kým olej nesčervenie. Potom cesnak, zázvor a čili.
  - Vlej vývar a sójovú omáčku, pridaj tofu a 5 minút jemne var. Nemiešaj, len potras panvicou.
  - Na 2–3 razy vlej škrob a nechaj zhustnúť. Posyp sečuánskym korením a cibuľkou a pokvapkaj sezamovým olejom.
tips:
  - Doubanjiang a sečuánske korenie kúpiš v ázijských potravinách. Korenie nie je štipľavé, ale brní – tak to má byť.
