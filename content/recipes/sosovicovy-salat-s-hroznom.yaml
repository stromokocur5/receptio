title: Šošovicový šalát s hroznom, kelom a orechmi
description: Teplá hnedá šošovica v horčicovej zálievke, rozpolené hrozno, vymasírovaný kel a opražené vlašské orechy. Sýty šalát, ktorý v chladničke vydrží tri dni a chutí každým dňom lepšie.
cuisine: moderna
meals: [obed, vecera]
categories: [salaty/syte, hlavne/strukoviny]
time: 35
active: 15
servings: 3
difficulty: 1
tags: [lacne, meal-prep, do-krabicky, vela-bielkovin]
spicy: 0
keeps: { fridge: 3 }
ingredients:
  - sosovica-hneda: 200 g
  - voda: 800 ml
  - bobkovy-list: 1 ks
  - sol: 1 čl
  - kel: 100 g | bez hrubých stoniek
  - citron: 1/2 ks | šťava
  - cibula-cervena: 1/2 ks
  - ocot: 2 pl
  - horcica: 1 pl
  - javorovy-sirup: 1 čl
  - olivovy-olej: 4 pl
  - cierne-korenie: 1/4 čl
  - hrozno: 250 g | bezsemenné
  - vlasske-orechy: 50 g
  - petrzlenova-vnat: 3 pl
steps:
  - Šošovicu prepláchni, zalej 800 ml vody, pridaj bobkový list a var na miernom ohni 20–25 minút, kým nie je mäkká, ale drží tvar. Soľ pridaj až posledných 5 minút. Sceď a bobkový list vyhoď.
  - Medzitým kel natrhaj na malé kúsky, posyp štipkou soli, pokvapkaj citrónovou šťavou a 1–2 minúty ho miesi rukami, kým nezmäkne a nestmavne. Surový je tuhý a horký, takto je jemný.
  - Cibuľu nakrájaj nadrobno a zalej v miske octom. Pridaj horčicu, sirup, zvyšok soli a korenie a za miešania vlej olivový olej.
  - Orechy opraž na suchej panvici 3–4 minúty, kým nevoňajú, a nahrubo nasekaj. Hrozno rozpoľ.
  - Teplú šošovicu hneď premiešaj so zálievkou – teplá ju nasaje lepšie. Nechaj 5 minút a potom pridaj kel, hrozno, orechy a vňať. Ochutnaj a dosoľ.
tips:
  - Orechy do krabičky dávaj zvlášť, v šaláte zmäknú.
  - Namiesto kelu poslúži špenát alebo rukola, tie sa nemasírujú.
