title: Šošovicové fašírky so zemiakovou kašou
description: Chrumkavé fašírky z hnedej šošovice s majoránkou a cesnakom. Ako od mamy, len bez mäsa.
cuisine: slovenska
meals: [obed, vecera]
time: 50
active: 30
servings: 4
difficulty: 2
tags: [klasika, meal-prep]
ingredients:
  - sosovica-hneda: 200 g
  - voda: 3 hrnček
  - zemiaky: 8 ks | 2 do fašírok, zvyšok na kašu
  - lanove-semienko: 2 pl | + 6 PL vody
  - cibula: 1 ks | nadrobno
  - cesnak: 3 ks
  - majoranka: 1 pl
  - udena-paprika: 1 čl
  - struhanka: 1 hrnček | časť do zmesi, časť na obalenie
  - sol: 1 čl
  - cierne-korenie: podľa chuti
  - olej: 5 pl
  - sojove-mlieko: 1/2 hrnček | do kaše
steps:
  - Šošovicu var vo vode 25 minút do mäkka a dobre sceď. Zemiaky uvar v osolenej vode.
  - Ľanové semienko zmiešaj so 6 PL vody a nechaj 10 minút postáť.
  - Šošovicu a 2 zemiaky roztlač, pridaj ľanové vajce, na troche oleja speňenú cibuľu, cesnak, majoránku, papriku, 1/2 hrnčeka strúhanky, soľ a korenie.
  - Ak je zmes riedka, pridaj strúhanku. Vytvaruj 8 fašírok, obaľ v strúhanke a nechaj 10 minút v chladničke.
  - Vyprážaj na oleji 4 minúty z každej strany.
  - Zvyšné zemiaky roztlač s horúcim mliekom a soľou na kašu.
tips:
  - Fašírky sa dajú upiecť aj v rúre – potri olejom, 200 °C, 25 minút.
