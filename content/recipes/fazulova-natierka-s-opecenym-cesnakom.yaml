title: Fazuľová nátierka s opečeným cesnakom a údenou paprikou
description: Hladká krémová nátierka z bielej fazule, do ktorej ide olej, v ktorom sa opiekol cesnak. Namáča sa do nej chrumkavá zelenina. Desať minút a plná miska bielkovín.
cuisine: slovenska
meals: [snack, vecera]
categories: [omacky/dipy, snacky/slane]
time: 15
active: 15
servings: 3
difficulty: 1
tags: [zlatica, rychle, party]
keeps: { fridge: 4 }
ingredients:
  - cesnak: 4 ks
  - olivovy-olej: 3 pl
  - fazula-biela: 1 ks | plechovka, scedená a prepláchnutá
  - citron: 1 pl
  - sol: 1/2 čl
  - voda: 2 pl | studená
  - udena-paprika: 1/2 čl
  - redkovka: 10 ks | na namáčanie
  - uhorka: 1/2 ks | na namáčanie
  - paprika-cervena: 1 ks | na namáčanie
steps:
  - Cesnak nakrájaj na tenké plátky a daj ho do studenej malej panvice s olejom. Zohrievaj na miernom ohni 3–4 minúty, kým plátky nie sú svetlozlaté. Hneď odstav – tmavohnedý cesnak horkne. Olej teraz chutí po cesnaku, ale nepáli.
  - Fazuľu daj do vysokej nádoby, pridaj citrónovú šťavu, soľ, vodu a cesnakový olej aj s cesnakom (pár plátkov odlož navrch). Rozmixuj tyčovým mixérom dohladka, asi minútu. Bez mixéra ju roztlač vidličkou, bude hrubšia, ale rovnako chutná.
  - Ochutnaj. Ak je mdlá, pridaj štipku soli, ak ťažká, kvapku citróna. Ak je príliš hustá, vmiešaj ešte lyžicu vody.
  - Zeleninu nakrájaj na prúžky a reďkovky na polovice.
  - Nátierku rozotri do misky, lyžicou sprav vlnky, pokvapkaj kvapkou oleja, posyp údenou paprikou a odloženým cesnakom. Podávaj so zeleninou.
tips:
  - Studená voda spraví nátierku svetlejšou a nadýchanejšou.
  - Hodí sa aj ako krémová vrstva pod pečené zemiaky alebo opečenú cuketu.
