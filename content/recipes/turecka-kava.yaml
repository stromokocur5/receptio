title: Turecká káva z džezvy s kardamómom
description: Silná, hustá káva varená v džezve s jemne mletou kávou, cukrom podľa chuti a štipkou kardamómu – s penou navrchu. Na Balkáne a v Turecku aj „turek“ u nás.
cuisine: turecka
meals: [ranajky, snack]
categories: [napoje/teple]
time: 6
active: 6
servings: 2
difficulty: 1
tags: [rychle, klasika]
related: [cafe-de-olla, kava-latte]
ingredients:
  - voda: 150 ml | studená
  - kava: 2 pl | veľmi jemne mletá, ako múka
  - cukor: 2 čl | podľa chuti
  - kardamom: 1 štipka
steps:
  - Do džezvy (alebo najmenšieho hrnčeka) nalej studenú vodu, pridaj kávu, cukor a kardamóm a raz premiešaj.
  - Daj na mierny oheň a už nemiešaj. Po 2–3 minútach sa začne na povrchu dvíhať pena.
  - Keď pena vystúpi skoro k okraju, stiahni džezvu z ohňa skôr, ako začne vrieť. Lyžičkou rozdeľ penu do šálok.
  - Džezvu vráť na oheň, nechaj penu ešte raz vystúpiť a kávu opatrne nalej do šálok cez penu.
  - Nechaj minútu postáť, kým sa kal neusadí na dne. Kal nepi.
tips:
  - Nesmie zovrieť – pena zmizne a káva zhorkne.
  - K tureckej káve patrí pohár vody a kúsok lokum alebo datľa.
  - Nefiltrovaná káva (turecká aj z francúzskeho lisu) zvyšuje LDL cholesterol viac ako prekvapkávaná. Ak ho máš vysoký, pi ju len občas.
