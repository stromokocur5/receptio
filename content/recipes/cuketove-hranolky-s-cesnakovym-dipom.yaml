title: Chrumkavé cuketové hranolky s paradajkovým dipom
description: Cuketa nasolená a osušená, obalená v škrobe s údenou paprikou a upečená do chrumkava. K tomu hustý cesnakový dip z rozvarených čerstvých paradajok.
cuisine: moderna
meals: [snack, vecera]
categories: [snacky/slane, prilohy/prilohy]
time: 40
active: 20
servings: 2
difficulty: 1
tags: [zlatica, party]
ingredients:
  - cuketa: 2 ks
  - sol: 1 čl | 1/2 na cuketu, 1/2 do obalu a dipu
  - kukuricny-skrob: 6 pl | 2 na lepidlo, 4 na obal
  - voda: 3 pl | do škrobu
  - udena-paprika: 1 čl
  - cierne-korenie: 1/2 čl
  - olej: 2 pl
  - paradajky: 3 ks | zrelé
  - paradajkovy-pretlak: 1 pl
  - cukor: 1/2 čl
  - cesnak: 1 ks
  - citron: 1 pl
  - olivovy-olej: 1 pl
  - kopor: 1 pl
steps:
  - Rúru predhrej na 220 °C (air fryer na 200 °C). Cuketu nakrájaj na hranolky hrubé 1,5 cm, posyp 1/2 ČL soli a nechaj 10 minút na utierke. Potom ich dôkladne osuš. Cuketa je z 95 % voda – bez soli a sušenia by krusta odpadla a cuketa vnútri zvodnatela.
  - V jednej miske rozmiešaj škrob s 3 PL vody na riedke „lepidlo“. V druhej zmiešaj 4 PL škrobu, údenú papriku, korenie a 1/4 ČL soli.
  - Každý hranolček namoč v škrobe, nechaj odkvapkať a obaľ v suchom škrobe s paprikou. Oklep, čo nedrží – hrubé hrudky škrobu by ostali biele a múčnaté. Ukladaj na plech s papierom s medzerami, pokvapkaj olejom.
  - Peč 20–22 minút, v polovici otoč, kým nie sú zlaté a chrumkavé. V air fryeri 12–14 minút, v dvoch dávkach.
  - Medzitým dip – paradajky nastrúhaj na hrubom strúhadle (šupky vyhoď). V malom hrnci zohrej olivový olej, pridaj prelisovaný cesnak a pretlak, minútu miešaj, vlej paradajky, pridaj cukor a štipku soli a var na strednom ohni 12–15 minút, kým nie je dip hustý ako kečup. Odstav, vmiešaj citrón a kôpor.
  - Hranolky podávaj hneď, kým chrumkajú, s dipom.
tips:
  - Škrobový obal drží lepšie ako vajce a je bezlepkový.
