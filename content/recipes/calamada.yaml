title: Čalamáda
description: Sladkokyslý zeleninový šalát z kapusty, papriky, uhoriek a mrkvy na zimu. K zemiakom, fašírkam aj ako príloha k všetkému.
cuisine: slovenska
meals: [domace]
categories: [domace/zavarane, salaty/prilohove]
time: 90
active: 45
servings: 30
difficulty: 2
tags: [urob-si-sam, lacne, klasika]
ahead: Nakrájaná zelenina so soľou odstojí 2 hodiny.
yields: cca 8 pohárov po 0,7 l
keeps: { fridge: 14 }
howto: [nakladana-zelenina, zavaranie]
ingredients:
  - biela-kapusta: 1 kg | na tenké rezančeky
  - paprika-cervena: 6 ks | na pásiky
  - uhorky-nakladacie: 1 kg | na kolieska
  - mrkva: 4 ks | na kolieska alebo nastrúhať
  - cibula: 4 ks | na mesiačiky
  - sol: 2 pl
  - voda: ~1 l | nálev
  - ocot: ~250 ml | nálev, 8 %
  - cukor: 150 g
  - horcicne-semienko: 1 čl
  - cierne-korenie: 1/2 čl | celé
  - bobkovy-list: 4 ks
steps:
  - Všetku zeleninu nakrájaj do veľkej misy, premiešaj so soľou a nechaj 2 hodiny odstáť. Pustí šťavu.
  - Šťavu sceď a zeleninu rukami trochu vytlač.
  - Vodu, ocot, cukor, horčičné semienko, korenie a bobkový list prived do varu.
  - Zeleninu pevne natlač do vyparených pohárov a zalej horúcim nálevom tak, aby bola celá pod hladinou. Zavri.
  - Zaváraj 15–20 minút pri 80–85 °C a nechaj vychladnúť na utierke.
tips:
  - Chrumkavejšia je, keď ju pri zaváraní neprehreješ – drž teplotu, nevar.
  - Zo šalátových uhoriek je mäkšia, nakladačky držia tvar.
