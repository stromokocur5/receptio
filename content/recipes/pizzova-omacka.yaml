title: Pizzová omáčka do zásoby
description: Hustá paradajková omáčka s cesnakom a oreganom na pizzu, pizza-toasty a namáčanie. Zužitkuje otvorenú passatu a v mrazničke vydrží pol roka.
cuisine: talianska
meals: [domace]
categories: [omacky/omacky]
time: 25
active: 10
servings: 8
difficulty: 1
tags: [pizza, zvysky, lacne, meal-prep]
yields: cca 450 ml – na 4 veľké pizze
keeps: { fridge: 5, freezer: 6 }
related: [pizza-new-york, pizza-margherita-neapolska, chlebove-pizzky-z-rury, domaca-passata]
ingredients:
  - olivovy-olej: 2 pl
  - cesnak: 3 ks
  - passata: 2 hrnček
  - paradajkovy-pretlak: 1 pl
  - oregano: 1,5 čl
  - cukor: 1/2 čl
  - sol: 1/2 čl
  - cili: 1 štipka | nepovinné
steps:
  - V malom hrnci zohrej olej na miernom ohni a opeč v ňom prelisovaný cesnak 1 minútu, kým nezavonia. Nesmie zhnednúť, zhorkne.
  - Pridaj passatu, pretlak, oregano, cukor, soľ a čili a priveď do varu.
  - Var odokryté na miernom ohni 15–20 minút za občasného miešania, kým omáčka nezhustne tak, že po lyžici na tanieri neuteká voda.
  - Nechaj vychladnúť. Do chladničky ju daj v pohári, do mrazničky po lyžiciach v tvorítku na ľad – kocky potom prelož do vrecka.
tips:
  - Jedna kocka z tvorítka (asi 2 PL) stačí na jednu malú pizzu alebo dva pizza-toasty.
  - Na neapolskú pizzu sa omáčka nevarí – stačí rozdrviť paradajky so soľou a olejom. Pozri verziu nižšie.
howto: [pizzeria-doma]
variants:
  - name: Surová neapolská
    description: Nevarená – len rozdrvené paradajky, soľ a olivový olej. Sviežejšia, na pizzu pečenú v čo najteplejšej rúre.
    remove: [cesnak, paradajkovy-pretlak, cukor, cili]
    time: 5
    active: 5
    steps:
      - Passatu zmiešaj s olejom, oreganom a soľou. Hotovo – dopečie sa na pizzi.
