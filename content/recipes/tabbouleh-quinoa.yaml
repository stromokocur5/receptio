title: Tabbouleh s quinoou
description: Libanonský petržlenový šalát v bezlepkovej verzii – quinoa namiesto bulguru a cícer navyše pre bielkoviny.
cuisine: libanonska
meals: [obed, vecera]
categories: [salaty/syte]
time: 25
active: 15
servings: 4
difficulty: 1
tags: [do-krabicky, meal-prep]
keeps: { fridge: 3 }
ingredients:
  - quinoa: 120 g | prepláchnutá
  - voda: 1 hrnček
  - petrzlenova-vnat: 2 hrnček | nadrobno
  - bylinky-mata: 4 pl | nadrobno
  - paradajky: 3 ks | na drobné kocky
  - uhorka: 1/2 ks | na drobné kocky
  - jarna-cibulka: 3 ks
  - cicer-sterilizovany: 1 ks
  - citron: 2 ks
  - olivovy-olej: 4 pl
  - sol: 1 čl
steps:
  - Quinou uvar vo vode na miernom ohni 15 minút, rozprestri na tanier a nechaj vychladnúť.
  - Petržlen a mätu nasekaj ostrým nožom nadrobno – v tabbouleh je hlavnou zložkou petržlen, nie obilie.
  - Zmiešaj bylinky, zeleninu, cícer a vychladnutú quinou.
  - Polej citrónovou šťavou a olejom, osoľ a nechaj 10 minút odležať.
tips:
  - Paradajky osoľ až tesne pred podávaním, inak šalát pustí veľa vody.
