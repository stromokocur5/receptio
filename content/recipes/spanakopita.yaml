title: Spanakopita
description: Grécky koláč z chrumkavého filo cesta plnený špenátom, kôprom, jarnou cibuľkou a tofu „fetou“.
cuisine: grecka
meals: [obed, vecera, snack]
time: 75
active: 30
servings: 6
difficulty: 2
tags: [pecenie, party, meal-prep]
spicy: 0
keeps: { fridge: 3, freezer: 2 }
gf_swap: false
ingredients:
  - spenat: 700 g
  - olivovy-olej: 6 pl
  - cibula: 1 ks
  - jarna-cibulka: 5 ks
  - kopor: 4 pl
  - petrzlenova-vnat: 4 pl
  - tofu-natural: 300 g | rozdrobené
  - citron: 1 ks
  - vyzivne-drozdie: 2 pl
  - muskatovy-orech: 1/4 čl
  - sol: 1,5 čl
  - filo-cesto: 10 ks
steps:
  - Tofu roztlač so šťavou z citróna, droždím a 1 ČL soli – to je feta.
  - Na 2 PL oleja na strednom ohni speň cibuľu a cibuľku, pridaj špenát po hrstiach a duste, kým nezvädne. Nechaj vychladnúť a poriadne vytlač vodu.
  - Zmiešaj špenát s bylinkami, fetou, muškátom a zvyškom soli.
  - Formu vymasti a vylož 5 plátmi filo, každý potri olejom. Rozotri náplň a prikry zvyšnými plátmi, tiež potretými olejom.
  - Vrch narež na štvorce a peč na 190 °C 40 minút dozlatista.
