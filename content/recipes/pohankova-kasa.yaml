title: Pohánková kaša s jablkom a orechmi
description: Teplé raňajky z pohánky, ktorá je prirodzene bez lepku. So strúhaným jablkom, škoricou a opraženými orechmi.
cuisine: slovenska
meals: [ranajky]
categories: [ranajky/kase]
time: 20
active: 5
servings: 2
difficulty: 1
tags: [ranajky, rychle]
keeps: { fridge: 3 }
ingredients:
  - pohanka: 1/2 hrnček | prepláchnutá
  - voda: 1 hrnček
  - sojove-mlieko: 1/2 hrnček
  - jablko: 1 ks | nastrúhané
  - skorica: 1/2 čl
  - javorovy-sirup: 1 pl
  - vlasske-orechy: 3 pl | opražené, nasekané
  - sol: 1 štipka
steps:
  - Pohánku priveď do varu vo vode so štipkou soli a pod pokrievkou var na miernom ohni 12 minút, kým nevsiakne vodu.
  - Pridaj mlieko, jablko a škoricu a povar ešte 3 minúty, kým nie je krémová.
  - Osláď sirupom a posyp orechmi.
tips:
  - Nepražená (zelená) pohánka má jemnejšiu chuť, pražená výraznejšiu – vyskúšaj obe.
  - Uvar dvojnásobok, ráno ju len prehreješ s mliekom.
