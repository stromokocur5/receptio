# Databáza surovín. Hodnoty na 100 g, orientačne podľa USDA FoodData Central.
# n: kcal, p = bielkoviny g, c = sacharidy g, f = tuky g, fib = vláknina g, salt = soľ g,
#    fe = železo mg, ca = vápnik mg, zn = zinok mg, ala = omega-3 ALA g, b12 = µg
# units: gramy na jednotku (ks, pl, čl, hrnček); ml sa prepočíta cez density
# price: HRUBÝ ODHAD €/kg (v appke označený ako odhad), reálne ceny patria do prices.yaml
# gluten: free | risk (kontroluj etiketu / krížová kontaminácia) | contains
# group: zameniteľné suroviny pre špajzu (suchý vs. sterilizovaný cícer)
# howto: návody zo sekcie Základy (content/wiki), recept na ne odkáže automaticky

