  name: Kari korenie (zmes)
  howto: [korenie]
  category: koreniny
  n: { kcal: 325, p: 14, c: 55.8, f: 14, fib: 53, salt: 0.1, fe: 19.1, ca: 525, zn: 4.7 }
  units: { čl: 2, pl: 6 }
  price: 20
  color: '#d99a1b'
  substitutes:
    - { to: garam-masala, note: '+ kurkuma' }
  about: 'Anglická zmes pre „kari“ – kurkuma, koriander, kmín, čili.'
  uses:
    - 'Japonské kari, tekvicová polievka'
  storage: 'Pol roka.'
  homemade:
    steps:
      - 'Na suchej panvici opraž 2 PL celého koriandra, 1 PL kmínu, 1 ČL horčičného semienka, 1 ČL čierneho korenia a 3 klinčeky.'
      - 'Nechaj vychladnúť a pomel.'
      - 'Primiešaj 1 PL kurkumy, 1 ČL mletého zázvoru a ½–1 ČL mletého čili podľa pálivosti.'
    note: 'Ak zoženieš senovku grécku, pridaj ½ ČL – dáva kari tú typickú vôňu.'

