  gf_alternative: chlieb-bezlepkovy
  n: { kcal: 250, p: 8.5, c: 48, f: 1.5, fib: 4, salt: 1.3, fe: 2, ca: 30, zn: 0.9 }
  units: { ks: 40 }
  price: 4
  co2: 1.6
  color: '#b9844f'
  note: 1 ks = krajec
  substitutes:
    - { to: chlieb-bezlepkovy }
  about: 'Kváskový chlieb je zvyčajne vegánsky – múka, voda, soľ, kvások. Pri bežnom pozor na mlieko.'
  uses:
    - 'Toasty, nátierky, krutóny'
    - 'Starý chlieb na strúhanku'
  storage: 'V ľanovom vrecúšku 3 dni, nakrájaný zamrazený mesiace.'
  homemade:
    steps:
      - 'Zmiešaj 400 g chlebovej pšeničnej múky, 100 g ražnej múky, 350 ml vlažnej vody a 100 g aktívneho kvásku. Nechaj 30 minút stáť.'
      - 'Zapracuj 10 g soli a počas nasledujúcich 2 hodín cesto 3–4-krát preklop.'
      - 'Nechaj ho kysnúť, kým nezväčší objem asi o polovicu (4–6 hodín), vytvaruj bochník a daj ho cez noc do chladničky do ošatky.'
      - 'Peč v rozpálenom liatinovom hrnci s pokrievkou 20 minút pri 250 °C, potom bez pokrievky 20–25 minút pri 230 °C.'
    note: 'Kvások si založíš za 5–7 dní z ražnej múky a vody (denne ho prikrm rovnakým dielom oboch), alebo si ho vypýtaj od známych. Rýchlejšie to ide so 7 g sušeného droždia namiesto kvásku – cesto vykysne za 1–2 hodiny.'

