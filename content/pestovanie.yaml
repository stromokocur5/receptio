        petrzlenova-vnat: 3,
        bylinky-mata: 1
      }
    how: 'Z kameňov postav špirálu vysokú 80 cm. Hore na suchý vrchol rozmarín a tymian, v strede oregano a majoránku, dole pri zemi pažítku, petržlen a mätu.'
    why: 'Na malom mieste vznikne sucho aj vlhko, slnko aj tieň – každá bylinka nájde svoje. Kamene cez deň nasajú teplo.'

  # ── Balkón ──────────────────────────────────────────────────
  - id: balkonova-paradajka
    name: Balkónová paradajka s bazalkou
    where: [balkon]
    sun: [slnko]
    level: 1
    area: 0.5
    gear:
      - 'nádoba 20 l s dierami a podmiskou'
      - 'kvetináč 3 l na petržlen'
      - 'kolík 1,2 m'
    members: { paradajky: 1, bazalka: 2, petrzlenova-vnat: 2 }
    how: 'Cherry paradajku zasaď do 20 l nádoby ku kolíku, do toho istého kvetináča okolo nej bazalku. Petržlen do menšieho kvetináča vedľa.'
    why: 'Bazalka rastie v tieni paradajky a odpudzuje mušky. Jedna nádoba dá celé leto paradajky aj bylinky na pestovanie pesta.'
  - id: salatovy-truhlik
    name: Šalátový truhlík
    where: [balkon, parapet]
    sun: [polotien, slnko]
    level: 1
    area: 0.3
    gear:
      - 'truhlík 80 cm (asi 15 l) s dierami'
    members: { salat: 4, redkovka: 15, jarna-cibulka: 10 }
    how: 'Do 80 cm truhlíka zasaď 4 listové šaláty, medzi ne reďkovky a na kraj jarnú cibuľku. Každé 3 týždne dosej, čo si zjedol.'
    why: 'Rastie aj v polotieni a do 4 týždňov máš prvú úrodu. Cibuľka chráni šalát pred voškami.'
  - id: palivy-kut
    name: Pálivý kút
    where: [balkon]
    sun: [slnko]
    level: 2
    area: 0.5
    gear:
      - '3 nádoby 10 l'
      - 'truhlík na bazalku'
    members: { cili-papricka: 2, paprika-cervena: 1, bazalka: 2 }
    how: 'Každú papriku do vlastnej 10 l nádoby na najslnečnejšie miesto, bazalku do spoločného truhlíka pred ne.'
    why: 'Papriky milujú teplo, ktoré sála zo steny balkóna. Čili sa dá prezimovať v byte a na druhý rok plodí skôr.'
  - id: zemiaky-vo-vreci
    name: Zemiaky vo vreci
    where: [balkon]
    sun: [slnko]
    level: 1
    area: 0.3
    gear:
      - 'pestovacie vrece 40 l (alebo pevné vrece od zeminy s dierami)'
    members: { zemiaky: 3 }
    how: 'Do 40 l vreca daj 15 cm zeminy a 3 nakľúčené hľuzy. Keď vyrastú o 20 cm, prisyp zem a opakuj, kým nie je vrece plné. V júli vrece vysyp.'
    why: 'Na 0,3 m² balkóna dopestuješ 3–5 kg zemiakov. Mladé zemiaky z vreca sú zážitok aj pre deti.'
  - id: balkonove-bylinky
    name: Stredomorské bylinky
    where: [balkon, parapet]
    sun: [slnko]
    level: 1
    area: 0.3
    max: 1
    gear:
      - 'truhlík 60 cm'
      - 'kvetináč 5 l na rozmarín'
      - 'štrk na drenáž'
    members: { tymian: 1, oregano: 1, rozmarin: 1, pazitka: 1 }
    how: 'Do spoločného truhlíka so štrkom na dne zasaď tymian, oregano a pažítku, rozmarín do vlastného kvetináča (na zimu ho berieš dnu).'
    why: 'Všetky chcú slnko a málo vody, takže sa zalievajú spolu. Trvalky – kúpiš raz, strihaš roky.'
  - id: zimna-zelen-balkon
    name: Kel a mangold v nádobe
    where: [balkon]
    sun: [slnko, polotien]
    level: 1
    area: 0.5
    gear:
      - 'nádoba 30 l s dierami'
    members: { kel: 1, mangold: 2, pak-choi: 3 }
    how: 'Do 30 l nádoby zasaď v máji kel do stredu a mangold po stranách. Pak choi dosej v auguste, keď uvoľníš miesto.'
    why: 'Zelenina, ktorú oberáš po listoch od leta do zimy – kel vydrží aj mráz na balkóne.'
  - id: popinave-strukoviny
    name: Popínavá fazuľa a hrach na zábradlí
    where: [balkon]
    sun: [slnko]
    level: 1
    area: 0.3
    gear:
      - 'dlhý truhlík 100 cm'
      - 'mriežka alebo motúzy na zábradlie'
    members: { hrasok: 15, zelene-fazulky: 8 }
    how: 'Do dlhého truhlíka pri zábradlí zasaď v marci hrach. V máji, keď dokvitne, zasaď medzi neho popínavú fazuľu, ktorá ho vystrieda.'
    why: 'Využiješ výšku namiesto plochy a vznikne zelený tieň. Strukoviny si dusík zoberú zo vzduchu, netreba ich hnojiť.'

  # ── Byt ─────────────────────────────────────────────────────
  - id: klicky-mikrozelen
    name: Klíčky a mikrozelenina
    where: [parapet]
    sun: [tien, polotien]
    level: 1
    area: 0.1
    max: 1
    gear:
      - '2 poháre so sitkom na klíčky (alebo gázu s gumičkou)'
      - 'plytká miska na mikrozeleninu'
    members: { klicky: 1 }
    how: 'Dva poháre na klíčky (mungo, šošovica) a jedna miska s mikrozeleninou (reďkovka, hrach). Nový pohár nasaď každé 2 dni, nech ich máš stále čerstvé.'
    why: 'Funguje v každom byte, celý rok a aj bez slnka. Najlacnejšia čerstvá zelenina v zime.'
  - id: bylinky-okno
    name: Bylinky na okne
    where: [parapet]
    sun: [slnko, polotien]
    level: 1
    area: 0.2
    max: 1
    gear:
      - '4 kvetináče 15 cm s podmiskami'
    members: { bazalka: 1, petrzlenova-vnat: 1, pazitka: 1, bylinky-koriander: 1 }
    how: 'Každú bylinku do vlastného 15 cm kvetináča na čo najsvetlejšie okno (juh, západ). Bazalka potrebuje najviac slnka, koriander najmenej.'
    why: 'Čerstvé bylinky pri varení a kúpené v obchode vydržia týždeň – vlastné mesiace.'
  - id: zo-zvyskov
    name: Zo zvyškov z kuchyne
    where: [parapet]
    sun: [polotien, slnko]
    level: 2
    area: 0.2
    max: 1
    gear:
      - 'poháre na zakorenenie'
      - '2 kvetináče 20 cm a jedna široká misa'
    members: { jarna-cibulka: 5, citronova-trava: 3, zazvor: 1 }
    how: 'Spodky jarnej cibuľky a stonky citrónovej trávy daj do pohára s vodou, kým nevyženú korene. Potom do kvetináča. Zázvor s očkami zasaď do širokej misy.'
    why: 'Z toho, čo by skončilo v koši, vyrastú nové rastliny. Citrónová tráva a zázvor sú v obchode drahé.'
  - id: hliva-v-krabici
    name: Hliva v krabici
    where: [parapet]
    sun: [tien]
    level: 2
    area: 0.1
    max: 1
    gear:
      - 'hotový balík substrátu s podhubím'
      - 'rozprašovač'
    members: { hliva: 1 }
    how: 'Balík substrátu s podhubím daj do kúpeľne alebo na chodbu – do tepla (18–22 °C) a rozptýleného svetla. Keď narastú bielke, 2× denne rosi.'
    why: 'Bielkoviny z tmavého kúta bytu. Jeden balík dá 2–3 vlny húb, spolu asi kilogram.'
  - id: cili-okno
    name: Čili na okne
    where: [parapet]
    sun: [slnko]
    level: 2
    area: 0.1
    max: 1
    gear:
      - 'kvetináč 5 l s podmiskou'
      - 'štetec na opelenie'
    members: { cili-papricka: 1 }
    how: 'Jednu rastlinu do 5 l kvetináča na južné okno. Kvety opeľ štetcom – dnu nie je hmyz.'
    why: 'Okrasná a užitočná – jedna rastlina dá desiatky papričiek, ktoré sa dajú usušiť na celý rok.'

