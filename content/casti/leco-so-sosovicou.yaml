name: Lečo s červenou šošovicou
kind: hlavne
style: [domace]
servings: 3
ingredients:
  - olej: 2 pl
  - cibula: 2 ks
  - paprika-cervena: 4 ks | alebo mix s bielymi
  - cesnak: 3 ks
  - paradajky: 5 ks | zrelé, alebo 1 plechovka krájaných
  - paradajkovy-pretlak: 1 pl
  - sladka-paprika: 1 čl
  - udena-paprika: 1 čl
  - sosovica-cervena: 120 g
  - voda: 400 ml
  - sol: 1 čl
  - cukor: 1/2 čl
  - ocot: 1 čl
  - petrzlenova-vnat: 2 pl
  - cierne-korenie: 1 štipka
prep:
  - text: Cibuľu nakrájaj na pásiky a papriky na prúžky.
    min: 6
  - text: Paradajky nakrájaj na kocky a šošovicu prepláchni v site, kým voda nie je číra.
    min: 4
methods:
  - label: Na panvici
    steps:
      - text: Vo veľkej panvici rozohrej olej na strednom ohni a cibuľu restuj 5 minút, kým nezmäkne.
        min: 5
        on: platna
        free: true
      - text: Pridaj papriku, zvýš oheň a opekaj 8 minút bez pokrievky, len občas premiešaj. Na paprike sa majú objaviť hnedé škvrny – to je chuť.
        min: 8
        on: platna
      - text: Pridaj prelisovaný cesnak a pretlak a minútu miešaj. Odstav z ohňa a vmiešaj sladkú aj údenú papriku.
        min: 1
        on: platna
      - text: Pridaj paradajky, šošovicu, vodu, soľ a cukor. Priveď do varu a bez pokrievky var na miernom ohni 15 minút, občas premiešaj, kým sa šošovica nerozvarí a lečo nezhustne.
        min: 16
        on: platna
        free: true
      - text: Vmiešaj ocot, dosoľ a posyp vňaťou a korením.
        min: 1
