name: Chlieb
description: Krajce chleba na podávanie, čerstvé alebo nasucho opečené.
kind: pecivo
style: [domace, stredomorske, indicke]
servings: 2
ingredients:
  - chlieb: 2 ks | krajce
methods:
  - label: Nakrájaný
    steps:
      - text: Chlieb nakrájaj na krajce. Ak je starší, opeč ho nasucho na panvici alebo v hriankovači.
        min: 2
