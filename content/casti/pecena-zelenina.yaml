name: Pečená zelenina
kind: zelenina
style: [stredomorske, domace]
servings: 2
ingredients:
  - batat: 1 ks
  - cuketa: 1 ks
  - paprika-cervena: 1 ks
  - cibula-cervena: 1 ks
  - olivovy-olej: 2 pl
  - udena-paprika: 1/2 čl
  - sol: 1/4 čl
prep:
  - text: Batát ošúp a nakrájaj na kocky 2 cm, cuketu na hrubé polmesiačiky, papriku na pásiky a cibuľu na mesiačiky.
    min: 8
methods:
  - label: V rúre
    needs: [rura]
    steps:
      - text: Batát premiešaj s polovicou oleja, rozlož na plech s papierom na pečenie a peč v rúre na 220 °C 10 minút.
        min: 10
        on: rura
        temp: 220
        free: true
      - text: Pridaj cuketu, papriku a cibuľu premiešané so zvyšným olejom, paprikou a soľou a peč ešte 18 minút, kým zelenina nemá hnedé okraje.
        min: 18
        on: rura
        temp: 220
        free: true
  - label: V airfryeri
    needs: [airfryer]
    amounts:
      olivovy-olej: 1 pl
    steps:
      - text: Batát premiešaj s polovicou oleja a peč na 200 °C 8 minút.
        min: 8
        on: airfryer
        temp: 200
        free: true
      - text: Pridaj ostatnú zeleninu so zvyšným olejom, paprikou a soľou a peč ešte 12 minút, v polovici košom zatras.
        min: 12
        on: airfryer
        temp: 200
        free: true
  - label: Na panvici
    steps:
      - text: Na veľkej panvici rozohrej olej na strednom ohni a batát opekaj pod pokrievkou 8 minút, občas premiešaj.
        min: 8
        on: platna
        free: true
      - text: Pridaj ostatnú zeleninu, zvýš oheň a opekaj bez pokrievky 8 minút, kým nezmäkne a nechytí farbu. Posyp paprikou a soľou.
        min: 8
        on: platna
