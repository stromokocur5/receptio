name: Chrumkavá zelenina
kind: zelenina
style: [azijske, stredomorske, mexicke]
servings: 2
early: true
ingredients:
  - mrkva: 1 ks
  - uhorka: 1/2 ks
  - spenat: 40 g | baby listy
  - sezam: 1 čl
methods:
  - label: Surová
    steps:
      - text: Mrkvu nastrúhaj nahrubo alebo nakrájaj škrabkou na tenké pásiky, uhorku na plátky. Špenát umy a osuš.
        min: 5
