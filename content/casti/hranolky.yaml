name: Chrumkavé hranolky
kind: priloha
style: [domace]
servings: 2
ingredients:
  - zemiaky: 600 g | múčnaté (typ C)
  - sol: ~1 pl | do vody
  - ocot: ~1 pl | do vody
  - olej: 1 pl
  - kukuricny-skrob: 1 čl
  - sol: 1/4 čl | na hotové hranolky
  - sladka-paprika: 1/2 čl
prep:
  - text: Zemiaky ošúp a nakrájaj na hranolky hrubé asi 1 cm. Daj ich do hrnca so studenou vodou, pridaj 1 PL soli a 1 PL octu a priveď do varu.
    min: 8
    on: platna
  - text: Var ich 3–4 minúty od zovretia, kým nie sú mäkké na povrchu a vnútri ešte tvrdé. Soľ ich ochutí až dovnútra, ocot drží tvar.
    min: 4
    on: platna
    free: true
  - text: Opatrne ich sceď a rozlož na utierku v jednej vrstve.
    min: 2
  - text: Nechaj ich 5 minút vyparovať – musia byť suché a matné, mokré sa nikdy nezapečú dochrumkava.
    min: 5
    free: true
  - text: Premiešaj ich s olejom, potom posyp škrobom a premiešaj, kým nie je každý kúsok tenko obalený.
    min: 2
    pause: true
methods:
  - label: V airfryeri
    needs: [airfryer]
    steps:
      - text: Nasyp ich do koša najviac v dvoch vrstvách a peč na 200 °C 18–22 minút, každých 6 minút košom zatras.
        min: 22
        on: airfryer
        temp: 200
        free: true
      - text: Hneď ich osoľ a posyp paprikou.
        min: 1
  - label: V rúre
    needs: [rura]
    amounts:
      olej: 2 pl
    steps:
      - text: Rozlož ich na plech s papierom na pečenie v jednej vrstve s medzerami a peč v rúre na 220 °C 32 minút, v polovici ich otoč.
        min: 32
        on: rura
        temp: 220
        free: true
      - text: Hneď ich osoľ a posyp paprikou.
        min: 1
tips:
  - Preplnený kôš alebo plech je najčastejší dôvod mäkkých hranoliek. Vzduch musí prúdiť okolo každého kúsku.
