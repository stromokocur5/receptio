name: Tahini omáčka
description: Sezamová pasta vyšľahaná s citrónom a vodou do hladkej, mierne horkastej omáčky.
kind: omacka
style: [stredomorske]
servings: 2
early: true
ingredients:
  - tahini: 3 pl
  - citron: 1/2 ks
  - cesnak: 1/2 ks
  - sol: 1 štipka
  - voda: 4 pl | studená
methods:
  - label: V miske
    steps:
      - text: Tahini vyšľahaj s citrónovou šťavou, pretlačeným cesnakom a štipkou soli. Najprv zhustne – postupne prilievaj studenú vodu, kým nie je hladká ako smotana.
        min: 4
