name: Guacamole
kind: omacka
style: [mexicke]
servings: 2
ingredients:
  - avokado: 1 ks | zrelé, mäkké na dotyk
  - limetka: 1/2 ks
  - jarna-cibulka: 1 ks
  - bylinky-koriander: 1 pl
  - sol: 1/4 čl
methods:
  - label: V miske
    steps:
      - text: Avokádo rozpoľ, vyber kôstku a dužinu roztlač vidličkou nahrubo. Vmiešaj limetkovú šťavu, nasekanú cibuľku, koriander a soľ.
        min: 4
tips:
  - Robí sa až na konci – avokádo na vzduchu hnedne.
