# Skladačka zo surovín: z čoho a ako sa dá zložiť vlastný recept.
#
# sposoby – spôsoby prípravy. Kroky sa skladajú v src/lib/composer.ts.
# suroviny – pre každú surovinu: skupina, porcia (na osobu, chýba = podiel zo zeleniny),
#   krajanie, min (koľko minút trvá príprava), a pre každý spôsob čas v minútach
#   (wok, plech, hrniec, polievka) alebo false, keď sa naň nehodí. salat: true / iný text krájania.
#   ochutit: bielkovina, ktorá sa pred tepelnou úpravou nechá nasiaknuť v sójovke (tofu, tempeh).
# zaklady – základ chuti (omáčka, korenie, nálev, dresing) na porciu, pre ktoré spôsoby.
#   text – ako ho spomína krok, množstvá pre 2 porcie (wok, šalát: čo zmiešať; plech: s čím, 7. pád;
#   hrniec, polievka: čo sa prileje).
# navrch – čo sa dá posypať navrch.

sposoby:
  wok:
    name: Wok
    popis: Na veľkom ohni za pár minút, zelenina ostane chrumkavá.
  plech:
    name: Plech v rúre
    popis: Všetko na jeden plech, rúra spraví zvyšok. Hnedé okraje, minimum práce.
  hrniec:
    name: Hrniec
    popis: Kari, paprikáš, ragú – zelenina a strukoviny dusené v omáčke.
  polievka:
    name: Polievka
    popis: Zelenina uvarená vo vývare, čistá alebo rozmixovaná dohladka.
  salat:
    name: Šalát
    popis: Bez varenia, surová zelenina s dresingom. Sýty so strukovinami.

