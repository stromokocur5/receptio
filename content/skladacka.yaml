    sposoby: [hrniec]
    styl: [indicke]
    suroviny:
      olej: 1/2 pl
      kmin: 1/4 čl
      koriander-mlety: 1/2 čl
      garam-masala: 1/2 čl
      kurkuma: 1/4 čl
      paradajky-sterilizovane: 1/2 ks
      voda: 1/4 hrnček
      sol: 1/4 čl
  paradajkova:
