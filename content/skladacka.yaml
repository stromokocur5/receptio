    sposoby: [wok]
    styl: [azijske]
    suroviny:
      sojova-omacka: 1 pl
      javorovy-sirup: 1/2 pl
      ryzovy-ocot: 1/2 pl
      kukuricny-skrob: 1/2 čl
      voda: 1,5 pl
  sladko-pikantna:
