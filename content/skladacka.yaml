      kokosove-mlieko: 1/4 ks
      kari-korenie: 1/2 čl
      limetka: 1/4 ks
      sol: podľa chuti
  citronovy-dresing:
    name: Citrónovo-olivový dresing
    text: 2 PL olivového oleja, šťavu z polovice citróna, trochu horčice a štipku soli
    sposoby: [salat]
    styl: [stredomorske, domace]
    suroviny:
      olivovy-olej: 1 pl
      citron: 1/4 ks
      horcica: 1/4 čl
      sol: 1 štipka
  sezamovy-dresing:
