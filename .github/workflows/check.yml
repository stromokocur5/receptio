# Pri každom pushi a pull requeste: typy, unit testy, build a testy v prehliadači.
name: Kontrola

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typy a unit testy
        run: |
          pnpm check
          pnpm lint
          pnpm test

      - name: Build
        run: pnpm build

      - name: Lokálna databáza
        run: pnpm exec wrangler d1 migrations apply receptio --local

      - name: Prehliadač
        run: pnpm exec playwright install --with-deps chromium

      - name: Testy v prehliadači
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
