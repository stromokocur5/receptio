# Každé ráno stiahne ceny z cenyslovensko.sk (reťazce ich tam posielajú do 6:00),
# overí ich testami a buildom a commitne. Push na main spustí nasadenie cez Workers Builds.
name: Ceny

# Plánované spúšťanie je vypnuté: api.cenyslovensko.sk GitHub runnerom neodpovedá (connect
# timeout od 29. 9. 2026). Ceny každé ráno sťahuje domáci počítač, pozri scripts/systemd/README.md.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stiahnuť ceny
        run: pnpm prices:sync

      - name: Overiť
        run: |
          pnpm test
          pnpm build

      - name: Commitnúť
        run: |
          git add content/prices-cenyslovensko.yaml content/price-history.csv
          if git diff --cached --quiet; then
            echo "Žiadne zmeny."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update prices from cenyslovensko.sk ($(date -u +%F))"
          git push
